name: Refresh forecast data

# Once a month: the hourly OMNI2 solar wind and the forecast tails of the space telescope
# ephemerides (tools/refresh/monthly_refresh.py). The result goes to a pull request from
# the auto/refresh-data branch, and build.yml is dispatched on that branch to test it.
on:
  schedule:
    - cron: '17 5 3 * *'   # 05:17 UTC on the 3rd of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh OMNI2 and telescope forecasts
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: auto/refresh-data
    steps:
      - uses: actions/checkout@v7

      # Standard library only; ubuntu-latest's Python has tomllib.
      - name: Download and rebake
        run: python3 -I tools/refresh/monthly_refresh.py --body "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git diff --stat
          title="Refresh OMNI2 solar wind and telescope forecasts ($(date -u +%Y-%m))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -a -m "$title" -m 'Generated by tools/refresh/monthly_refresh.py (refresh-data workflow).'
          # An open pull request from last month is replaced with this month's data.
          git push --force origin "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          # Pushes made with GITHUB_TOKEN start no workflows, a dispatch does.
          gh workflow run build.yml --ref "$BRANCH"
