name: Build and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Use Visual Studio bundled CMake
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio 2026 was not found' }
          $cmakeBin = Join-Path $installation 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin'
          if (-not (Test-Path "$cmakeBin/cmake.exe")) { throw 'Visual Studio bundled CMake was not found' }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Link the CRT statically so the archive needs no VC++ redistributable.
      - name: Configure
        run: >-
          cmake --preset win-msvc -B build/ci
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: msbuild build/ci/ALL_BUILD.vcxproj /m /nr:false /p:Configuration=Release /p:Platform=x64

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'build/package/Astraxis-windows-x64'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'build/ci/Release/astraxis.exe' $package
          Copy-Item 'build/ci/Release/assets' $package -Recurse
          Copy-Item 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md' $package
          Compress-Archive -Path $package -DestinationPath 'build/Astraxis-windows-x64.zip'
          $hash = (Get-FileHash 'build/Astraxis-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Astraxis-windows-x64.zip" | Set-Content 'build/SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: Astraxis-windows-x64
          path: |
            build/Astraxis-windows-x64.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Astraxis-windows-x64
          path: dist

      - name: Verify archive
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Astraxis-windows-x64.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/Astraxis-windows-x64.zip dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
