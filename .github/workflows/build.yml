name: Build and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'
          msbuild-architecture: x64

      - name: Use Visual Studio bundled CMake
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -version '[18.0,19.0)' -requires Microsoft.Component.MSBuild -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio 2026 was not found' }
          $cmakeBin = Join-Path $installation 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin'
          if (-not (Test-Path "$cmakeBin/cmake.exe")) { throw 'Visual Studio bundled CMake was not found' }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # VC-LTL redirects the CRT to the Windows 10 system UCRT.
      - name: Configure
        run: >-
          cmake --preset win-msvc -B build/ci
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DASTRAXIS_USE_VC_LTL=ON

      - name: Build
        run: msbuild build/ci/ALL_BUILD.vcxproj /m /nr:false /p:Configuration=Release /p:Platform=x64

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'build/package/Astraxis-windows-x64'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'build/ci/Release/astraxis.exe', 'build/ci/Release/astraxis.scr', 'build/ci/Release/astraxis_wallpaper.exe' $package
          Copy-Item 'build/ci/Release/assets' $package -Recurse
          Copy-Item 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.md' $package
          Compress-Archive -Path $package -DestinationPath 'build/Astraxis-windows-x64.zip'
          $hash = (Get-FileHash 'build/Astraxis-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Astraxis-windows-x64.zip" | Set-Content 'build/Astraxis-windows-x64.sha256' -Encoding ascii

      - name: Upload windows package
        uses: actions/upload-artifact@v7
        with:
          path: build/Astraxis-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload windows checksum
        uses: actions/upload-artifact@v7
        with:
          path: build/Astraxis-windows-x64.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x64 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Headers SDL3 needs for its X11 and Wayland video backends (it loads the
      # libraries, and Vulkan, at run time). Audio and camera are disabled.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev             libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev             libdrm-dev libgbm-dev libegl-dev

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --test-dir build/linux -C Release --output-on-failure --no-tests=error

      - name: Package
        run: |
          set -euo pipefail
          package=build/package/Astraxis-linux-x64
          mkdir -p "$package"
          cp build/linux/Release/astraxis "$package/"
          cp -r build/linux/Release/assets "$package/"
          cp LICENSE THIRD_PARTY_NOTICES.md README.md "$package/"
          tar -C build/package -czf build/Astraxis-linux-x64.tar.gz Astraxis-linux-x64
          (cd build && sha256sum Astraxis-linux-x64.tar.gz > Astraxis-linux-x64.sha256)

      - name: Upload linux package
        uses: actions/upload-artifact@v7
        with:
          path: build/Astraxis-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload linux checksum
        uses: actions/upload-artifact@v7
        with:
          path: build/Astraxis-linux-x64.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tag release
    needs: [build, build-linux]
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Download the four raw files together; keep the platform archives intact.
      - uses: actions/download-artifact@v8
        with:
          pattern: Astraxis-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Verify archives and merge checksums
        working-directory: dist
        run: |
          set -euo pipefail
          cat Astraxis-windows-x64.sha256 Astraxis-linux-x64.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Astraxis-windows-x64.zip dist/Astraxis-linux-x64.tar.gz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/Astraxis-windows-x64.zip dist/Astraxis-linux-x64.tar.gz dist/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
