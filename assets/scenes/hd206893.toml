[[bodies]]
name = "Sun"
template = "bodies/sun.toml"
parent = "HD 206893 system"
trail = "none"
[bodies.orbit]                 # opposite direction of the system as seen from the Sun
type = "fixed"
ra_dec_distance_pc = [146.34126, 12.78335, 40.77]

# As astronomers show the sky: north up (east to the left when seen from Earth).
[[frames]]
name = "HD 206893, north up"
type = "inertial"
origin = "HD 206893"
up = "north"

[[frames]]
name = "HD 206893, disk level"
type = "inertial"
origin = "HD 206893"
up = "orbit_normal:HD 206893 B"

[[events]]
name = "A companion inside the belt"
time = "2015-10-05"            # [MI17]
focus = "HD 206893"
frame = "HD 206893, north up"
observer = "HD 206893 system"
observer_offset_km = [-485727827613.9, 323435074972.5, 132403158748.5]   # 4000 au toward Earth: lines of sight almost parallel
fov_deg = 6.0                  # 210 au above and below the star
warp = 15778800.0
# [MI17], [KA21]
caption = """\
    Its heat had given this dust belt away, but no image of its scattered light has \
    clearly shown it; what you see is a model. In 2015 the SPHERE instrument found a \
    faint companion inside it, about 10 au from the star. HD 206893 B is the reddest \
    substellar companion known, redder than its temperature can explain, as if veiled \
    by dust high in its air."""

[[events]]
name = "A gap in the belt"
time = "2018-09-26"            # [MA20]'s ALMA data
focus = "HD 206893"
frame = "HD 206893, north up"
observer = "HD 206893 system"
observer_offset_km = [-485727827613.9, 323435074972.5, 132403158748.5]   # 4000 au toward Earth: lines of sight almost parallel
fov_deg = 6.0
warp = 7889400.0
disk_millimeter = true
# [MA20]
caption = """\
    ALMA's view at 0.9 mm, in false color: large grains from 30 to 180 au, split by a \
    gap 27 au wide at 74 au. Nothing near that distance is known. If a planet cleared \
    it, it would be about one Jupiter mass. Several other belts of this age have gaps \
    near the same radius, which may be telling us something about how they formed."""

[[events]]
name = "Where the wobble pointed"
time = "2021-09-02"            # [HI23]'s first epoch of c
focus = "HD 206893"
frame = "HD 206893, disk level"
from_orbit_normal = "HD 206893 B"
distance_km = 3.5e9            # 23 au
warp = 2629800.0               # a month per second
# [HI23], [KR25]
caption = """\
    The star was tugged by something B could not account for: its velocity drifted, and \
    Gaia and Hipparcos disagreed about its motion across the sky. Pointed where that \
    predicted, the GRAVITY interferometer found c at 3.7 au, on an orbit of six years. \
    It lies within about two degrees of B's plane, and of the belt's."""

[[events]]
name = "On the edge of burning"
time = "2021-10-23"            # [HI23]'s third epoch of c
focus = "HD 206893 c"
frame = "HD 206893, disk level"
from_body = "Sun"
phase_deg = 60.0
distance_km = 1.2e6            # 1.2 million km
warp = 3600.0
# [HI23]
caption = """\
    At about 12 Jupiter masses, c sits at the line between a planet and a brown dwarf: \
    the mass where deuterium starts to fuse. For its age it shines too brightly to be \
    merely cooling, and only models with deuterium burning and clouds fit both it and \
    B. Here c is lit by the star alone; really it glows at 1,200 K with its own heat."""

[[events]]
name = "Nothing in the gap"
time = "2023-06-19"            # [BE26]'s MIRI data
focus = "HD 206893"
frame = "HD 206893, disk level"
from_orbit_normal = "HD 206893 B"
distance_km = 3.5e10           # 230 au
warp = 15778800.0
disk_millimeter = true
# [BE26], [MA20]
caption = """\
    JWST looked for the planet in the gap and found none, ruling out anything above \
    about 4 Jupiter masses there. A smaller one could still be hiding. B and c cannot \
    do the job from where they are: their secular resonance lies far inside the belt, \
    at 21 au. This view from above is a model; the belt's real shape is known only \
    as well as ALMA resolves it."""

[[events]]
name = "A moon?"
time = "2024-06-01"            # [KR25]'s run of 2024
focus = "HD 206893 B"
frame = "HD 206893, disk level"
from_body = "Sun"
phase_deg = 40.0
distance_km = 1.5e8            # 1 au
warp = 2629800.0               # a month per second
show = ["HD 206893 B I (candidate)"]
# [KR25]
caption = """\
    In 2024 GRAVITY watched B for months, measuring its position to tens of microarcseconds, \
    and something may be tugging it every nine months: possibly a moon of 0.4 Jupiter \
    masses at 0.22 au. It would be the first found this way, but the signal could still \
    be an instrumental effect. The orbit shown is one reading, its phase unknown."""
