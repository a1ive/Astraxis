sky_ra_dec_deg = [326.34126, -12.78335]

# Only in its event. [KR25]'s period and mass, and the orientation their fit peaks at;
# the phase is arbitrary. B does not wobble in this model; it should by 0.11 mas (tests).
[[bodies]]
name = "HD 206893 B I (candidate)"
parent = "HD 206893 B"
radii_km = [71492.0]           # 1 R_Jup, assumed
body_gm_km3_s2 = 5.06746128e7  # 0.4 M_Jup [KR25]
color = "#b8a898"              # artistic
orbit_color = "#c8c8d8"
trail = "orbit"
[bodies.orbit]
