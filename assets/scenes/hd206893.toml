t_peri_jd_tdb = 2460595.939    # MJD 59000 + 0.694 P
sky_ra_dec_deg = [326.34126, -12.78335]

[[bodies]]
name = "HD 206893 c"
parent = "HD 206893 A+c"
radii_km = [104378.0]          # 1.46 R_Jup [HI23]
body_gm_km3_s2 = 1.40622050e9  # 11.1 M_Jup [KR25]
color = "#c07a52"              # artistic
orbit_color = "#ffc08a"
[bodies.orbit]
scale = 0.991976353            # M_star / (M_star + M_c)
type = "visual_orbit"
gm_km3_s2 = 1.75259517e11
a_au = 3.74
e = 0.283
i_deg = 142.5
node_deg = 65.4
arg_peri_deg = 27.0
