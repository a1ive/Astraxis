# --- Artemis II ------------------------------------------------------------------

[[events]]
name = "Artemis II: on the way to the Moon (2026-04-02)"
time_tdb = "2026-04-02 02:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 7.0e5
warp = 3600.0
# [A2], [A2B], [A2PK]
caption = """\
    Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen are on their way, the \
    first crew bound for the Moon since Apollo 17 in 1972. The translunar injection burn \
    was the last big engine firing: on this free-return path, gravity alone will bring \
    Orion home. In this frame, which holds the Moon still, the flight traces a figure \
    eight."""

# Closest approach 2026-04-06 23:01:49 TDB, 6,543 km above the far side; farthest
# from the Earth 4 minutes later, 23:06:12 TDB, 406,765 km above its surface.
[[events]]
name = "Artemis II: behind the Moon, farthest humans (2026-04-06)"
time_tdb = "2026-04-06 21:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 4.0e4
warp = 300.0
# [A2B], [A2R]
caption = """\
    About 6,500 km above the far side, the crew lost touch with the Earth for 40 \
    minutes, watched it set behind the lunar horizon and rise again, and saw the Moon \
    eclipse the Sun for nearly an hour. Minutes later they were about 406,800 km from \
    the Earth, beyond Apollo 13's record of 1970: the farthest any humans have been."""

[[events]]
name = "Artemis II: home (2026-04-10)"
time_tdb = "2026-04-10 20:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 1.2e5
warp = 300.0
# [A2], [A2Q], [A2PK]
caption = """\
    Pulled back by the Earth's gravity, Orion returns at nearly 35 times the speed of \
    sound and splashes down in the Pacific off San Diego, nine days, one hour and 32 \
    minutes after launch: the first crewed flight of Orion is over."""

# --- Artemis I -------------------------------------------------------------------

[[events]]
name = "Artemis I: the whole flight (2022-11-16)"
time_tdb = "2022-11-16 08:47"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 8.0e5
warp = 7200.0
# [A1], [DRO]
caption = """\
    The first flight of NASA's new Moon rocket and an uncrewed Orion: a 25-day test of \
    rocket, spacecraft and ground systems before anyone flew. In this frame, which holds \
    the Moon still, watch Orion's path loop around the Moon against the Moon's own \
    motion: the distant retrograde orbit."""

[[events]]
name = "Artemis I: outbound flyby (2022-11-21, 131 km)"
time_tdb = "2022-11-21 11:58"
focus = "Moon"
distance_km = 2.0e4
warp = 60.0
# [A1B], [DRO]
caption = """\
    Orion skims about 130 km above the lunar surface. This is a powered flyby: the \
    Moon's gravity and a burn of Orion's service module together send it on toward the \
    distant retrograde orbit, far beyond the Moon."""

# Farthest from the Earth 2022-11-28 21:07:35 TDB, 432,207 km above its surface.
[[events]]
name = "Artemis I: distant retrograde orbit (2022-11-25)"
time_tdb = "2022-11-25 12:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
from_orbit_normal = "Moon"
distance_km = 2.5e5
warp = 3600.0
# [DRO], [A1], [A1B]
caption = """\
    A distant retrograde orbit: high above the Moon, going around it against the Moon's \
    motion around the Earth, and so stable that it takes little fuel to stay in. Half a \
    lap takes nearly a week. On 28 November Orion reached 432,000 km from the Earth, \
    farther than any spacecraft built to carry people."""

[[events]]
name = "Artemis I: return flyby (2022-12-05, 129 km)"
time_tdb = "2022-12-05 15:45"
focus = "Moon"
distance_km = 2.0e4
warp = 60.0
# [A1B], [A1]
caption = """\
    Leaving the distant retrograde orbit, Orion swings past the Moon again, about 130 km \
    up, and heads home. It splashed down off San Diego on 11 December, after 25 days in \
    space, clearing the way for a crew."""

# --- CAPSTONE ---------------------------------------------------------------------

[[events]]
name = "CAPSTONE: ballistic lunar transfer (2022-07)"
time_tdb = "2022-07-05 00:00"
focus = "Earth"
frame = "Earth-Moon rotating"
from_orbit_normal = "Moon"
distance_km = 3.5e6
warp = 86400.0
# [CAP1], [HZN]
caption = """\
    A CubeSat the size of a microwave oven takes the long way to the Moon: not three \
    days but four months on a low-energy path, which swings far out beyond the Moon's \
    orbit before falling back to meet it. The trip costs time instead of fuel."""

# First perilune in the halo orbit 2022-11-14 00:39:27 TDB, 3,486 km from the Moon's center.
[[events]]
name = "CAPSTONE: arrives in the halo orbit (2022-11-13)"
time_tdb = "2022-11-12 00:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 1.5e5
warp = 3600.0
# [CAP1], [HZN]
caption = """\
    The first spacecraft in a near-rectilinear halo orbit, the orbit planned for the \
    Gateway station. Every seven days it passes about 1,600 km over the Moon's north \
    pole and climbs some 70,000 km beyond the south pole. In this Moon-centered frame, \
    which turns with the Earth, the narrow loop stays put."""

# --- Chang'e 5-T1 -------------------------------------------------------------------

# Reconstructed ([L16], tools/ce5t1): farthest 540,976 km from the Earth's center on
# 2014-11-09; lunar swing-by 2014-11-23 15:11 UTC, 296 km up; perilune at brake 1
# 2015-01-10 19:04:37 UTC (Table 5: 19:04:33), 202 km up; after brake 3, 189 x 209 km.
[[events]]
name = "Chang'e 5-T1: a second mission (2014-11)"
time_tdb = "2014-11-01 00:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 1.8e6
warp = 86400.0
# [L16]
caption = """\
    Chang'e 5-T1 has just flown around the Moon and sent a capsule home through the \
    atmosphere, a rehearsal for the Chang'e 5 sample return. Its service module still \
    has propellant for about 1.4 km/s, so it flies on: out beyond the Moon's orbit, back \
    past the Earth, and on to meet the Moon three weeks later."""

[[events]]
name = "Chang'e 5-T1: swing-by into an L2 orbit (2014-11-23)"
time_tdb = "2014-11-23 06:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 1.5e5
warp = 1800.0
# [L16]
caption = """\
    The service module skims a few hundred km over the Moon and brakes at the lowest \
    point. The swing-by sends it on to L2, 65,000 km beyond the far side, where it \
    settles into an orbit around the empty point: the first spacecraft to get there by a \
    lunar swing-by, and the second ever to orbit an Earth-Moon libration point."""

[[events]]
name = "Chang'e 5-T1: around L2 (2014-12)"
time_tdb = "2014-11-28 09:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 2.5e5
warp = 21600.0
# [L16]
caption = """\
    For five weeks the module loops around L2, a point where nothing holds it: orbits \
    there are barely stable and easily lost. Three small burns, of 2 to 10 m/s, keep it \
    on track. On 4 January it fires its engine once more and falls back towards the \
    Moon."""

[[events]]
name = "Chang'e 5-T1: into lunar orbit (2015-01-10)"
time_tdb = "2015-01-10 17:00"
focus = "Moon"
frame = "Moon-centered"
distance_km = 2.0e4
warp = 600.0
# [L16]
caption = """\
    Its engine is too weak to brake into orbit at once, so the module brakes three times, \
    each at the same low point 200 km above the surface, a day apart. The orbit shrinks \
    from long ellipses to a circle about 200 km up, where it tests technology for the \
    rendezvous and docking in lunar orbit that Chang'e 5 would need."""

# --- LADEE -------------------------------------------------------------------------

[[events]]
name = "LADEE: phasing loops (2013-09)"
time_tdb = "2013-09-07 04:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 1.0e6
warp = 43200.0
# [LADEE], [HZN]
caption = """\
    Launched on 7 September 2013 from Wallops Island, Virginia, the first lunar mission \
    to leave from there, LADEE does not head straight for the Moon. It flies three ever \
    larger loops around the Earth, timed so that the last one meets the Moon a month \
    later."""

# Lunar orbit insertion: first perilune 2013-10-06 10:52:50 TDB, 572 km up; the
# first orbit takes 24 hours, out to 15,600 km.
[[events]]
name = "LADEE: captured by the Moon (2013-10-06)"
time_tdb = "2013-10-06 09:30"
focus = "Moon"
frame = "Moon-centered"
distance_km = 4.0e4
warp = 600.0
# [LADEE], [LADEEH]
caption = """\
    LADEE swings behind the Moon, out of sight of the Earth, re-emerges and fires its \
    engine for three minutes: captured, it settles into a day-long orbit. More burns \
    over the next weeks bring it down to about 20 by 60 km above the surface, around \
    the Moon's equator."""

# Perilunes 15-56 km above the mean radius over 2013-12 .. 2014-02, apolunes 68-148 km.
[[events]]
name = "LADEE: skimming the surface (2014-01)"
time_tdb = "2014-01-15 00:00"
focus = "Moon"
frame = "Moon-centered"
distance_km = 9000.0
warp = 120.0
# [LADEE], [LADEE2]
caption = """\
    Once every two hours LADEE circles the Moon, dipping to a few tens of kilometers. It \
    samples the Moon's wisp of an atmosphere, finding argon-40, and counts more than \
    11,000 hits of dust grains. Its laser link sent data home at a record-breaking 622 \
    megabits per second."""

# The data end 2014-04-18 04:33:07 TDB (04:32 UTC), 1-3 km above the mean radius,
# at 1.69 km/s relative to the Moon.
[[events]]
name = "LADEE: the last orbits (2014-04-18)"
time_tdb = "2014-04-17 21:00"
focus = "Moon"
frame = "Moon-centered"
distance_km = 9000.0
warp = 300.0
# [LADEE], [LADEE2], [LRO]
caption = """\
    In its final days LADEE flies lower and lower, at times only 300 m above the ground. \
    Early on 18 April, on the far side, it hits the eastern rim of the crater Sundman V \
    at 1.7 km/s. The Lunar Reconnaissance Orbiter later found the new crater: less than \
    3 m across."""

# --- ARTEMIS ------------------------------------------------------------------------

# Lunar flybys: P1 2010-02-13 09:56 TDB (3,291 km up), P2 2010-03-28 07:59 TDB (8,201 km);
# in between and after, loops out to ~1.5 million km from the Earth.
[[events]]
name = "ARTEMIS: the long way to the Moon (2010)"
time_tdb = "2010-02-01 00:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 3.5e6
warp = 172800.0
# [ART], [ARTB], [ARTH], [HZN]
caption = """\
    Two of the five THEMIS probes, which had studied substorms in the Earth's \
    magnetosphere since 2007, set off for the Moon as ARTEMIS-P1 and P2. About 150 \
    fuel-saving maneuvers and close passes by the Moon fling them out to 1.5 million km \
    and back, a transfer of about 18 months."""

[[events]]
name = "ARTEMIS: around the Lagrange points (2010-2011)"
time_tdb = "2010-11-01 00:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 2.5e5
warp = 21600.0
# [ART], [ARTB]
caption = """\
    On 25 August 2010 ARTEMIS-P1 became the first spacecraft to orbit an Earth-Moon \
    Lagrange point, L2, beyond the far side; P2 reached L1, on the Earth side, in \
    October, and in January P1 crossed over to L1 too. From both sides they study the \
    Moon's wake: the Moon soaks up the solar wind and leaves a cavity behind it."""

# First orbit of P1: 3,588 x 26,999 km from the Moon's center (perilune 2011-06-27 15:17
# TDB). P2's insertion burn: 2011-07-18 ~00:26 TDB.
[[events]]
name = "ARTEMIS: into lunar orbit (2011-06-27)"
time_tdb = "2011-06-26 00:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 1.2e5
warp = 7200.0
# [ART], [ARTB], [ARTH]
caption = """\
    Leaving its loops around L1, P1 drops into a stretched orbit around the Moon on 27 \
    June 2011, about 3,500 by 27,000 km from the Moon's center; P2 follows on 17 July. \
    Built for Earth orbit, they were never meant to go to the Moon. Both still circle \
    it today (this scene's data end in 2019)."""

# --- LCROSS -------------------------------------------------------------------------

# Lunar flyby 2009-06-23 10:29:22 TDB, 3,270 km up; then an Earth orbit of ~360,000 x
# ~580,000 km, crossing the Moon's orbit three times before the impact.
[[events]]
name = "LCROSS: flyby and a 37-day orbit (2009-06)"
time_tdb = "2009-06-19 00:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 1.8e6
warp = 86400.0
# [LCR], [HZN]
caption = """\
    Launched with the Lunar Reconnaissance Orbiter, LCROSS keeps its rocket's spent \
    upper stage, the Centaur, attached. A flyby of the Moon throws them into a long \
    polar orbit around the Earth, 37 days a lap, timed to come back and hit the Moon \
    near its south pole after almost four months."""

# Shepherding Spacecraft impact 11:35:36.1 UTC = 11:36:42 TDB, where the table ends.
[[events]]
name = "LCROSS: impact in Cabeus (2009-10-09)"
time_tdb = "2009-10-09 11:15"
focus = "LCROSS"
from_body = "Earth"
distance_km = 8000.0
warp = 30.0
# [LCR]
caption = """\
    The Centaur, released nearly ten hours earlier, slams into the crater Cabeus near \
    the south pole, blasting out a 27 m crater and some 350 t of debris. Four minutes \
    behind, LCROSS flies through the plume, collecting data, before hitting too. A \
    month later NASA reported evidence of water."""
