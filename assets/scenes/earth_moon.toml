# The Earth and the Moon with three missions: Artemis II's free-return flight
# around the Moon (2026), Artemis I's distant retrograde orbit (2022), and CAPSTONE
# in the near-rectilinear halo orbit planned for the Gateway (2022-2026).
#
# The default "Earth-Moon rotating" frame keeps the Moon still on the x axis:
# Artemis II traces a figure eight, Artemis I a loop around the Moon that runs
# against the Moon's own motion (retrograde). In the Moon-centered rotating frame
# CAPSTONE's orbit stays put, a narrow loop from ~1,600 km above the north pole
# to ~70,000 km beyond the south pole, repeating 9 times per 2 lunar months.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        Moon around the Earth 2021-12-25 .. 2031-09-27; Artemis I (NASA/JSC as flown,
#        after TLI) 2022-11-16 08:47 .. 2022-12-11 17:20 TDB; Artemis II (NASA/JSC
#        navigation, after ICPS separation) 2026-04-02 02:00 .. 2026-04-10 23:54 TDB;
#        CAPSTONE around the Moon (tracking to 2026-07-15, then predictions) from its
#        deployment 2022-07-04 17:16 to 2026-08-14 11:58 TDB. The Sun direction uses the
#        heliocentric Earth-Moon barycenter (as in jwst.toml).
# [GM]   JPL SSD astrodynamic parameters (DE440): GM Earth 398600.435507, Moon
#        4902.800118 km^3/s^2. Earth-Moon mass ratio for L1/L2:
#        4902.800118 / (398600.435507 + 4902.800118) = 0.0121505844.
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians.
# [SPHY] JPL SSD satellite physical parameters (Moon mean radius).
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [CAP]  Event captions (retrieved 2026-10-07):
#        [A2] NASA, www.nasa.gov/mission/artemis-ii/: crew Reid Wiseman, Victor Glover,
#          Christina Koch (NASA) and Jeremy Hansen (CSA); launch 2026-04-01, splashdown
#          04-10, 9 d 1 h 32 min.
#        [A2PK] NASA, Artemis II Press Kit: the translunar injection "is the last major engine
#          firing of the mission" and sets Orion on the free-return trajectory; Orion is
#          "pulled back naturally by Earth's gravity".
#        [A2R] NASA news release 2026-04-06, "NASA's Artemis II Crew Eclipses Record for
#          Farthest Human Spaceflight": past Apollo 13's 248,655 miles (1970); 252,756 miles
#          at the farthest. (NASA's distances match the heights above the Earth's surface
#          computed here, below.)
#        [A2B] NASA Artemis blog 2026-04-06, "Crew Wraps Historic Lunar Flyby": ~4,067 miles
#          above the surface, a 40-minute loss of signal behind the Moon, Earthset and
#          Earthrise, a "nearly hour-long solar eclipse", "humanity's first return to the Moon
#          since Apollo 17 in 1972".
#        [A2Q] NASA, "NASA Answers Your Most Pressing Artemis II Questions": reentry at nearly
#          35 times the speed of sound, splashdown in the Pacific off San Diego.
#        [A1] NASA, www.nasa.gov/mission/artemis-i/: "first flight test of rocket, spacecraft,
#          and supporting ground systems"; 268,563 miles from the Earth; splashdown off San
#          Diego 2022-12-11; 25 d 10 h 53 min.
#        [A1B] NASA Artemis blogs: outbound powered flyby ~81 miles above the surface
#          (2022-11-21); return flyby within ~80 miles (12-05); past Apollo 13's record for a
#          spacecraft designed to carry humans (11-26); "nearly a week to complete half an
#          orbit" (11-25).
#        [DRO] NASA, "Orion Will Go the Distance in Retrograde Orbit During Artemis I": DRO is
#          "highly stable", little fuel to stay; "retrograde" = opposite to the Moon's motion
#          around the Earth; the outbound flyby and a burn of the service module together
#          send Orion to it.
#        [CAP1] NASA, www.nasa.gov/smallspacecraft/capstone/: a microwave oven-sized CubeSat;
#          a four-month low-energy journey; insertion on 2022-11-13; the first spacecraft in a
#          near rectilinear halo orbit, the orbit planned for the Gateway; within 1,000 miles
#          of one pole and 43,500 miles from the other every seven days.
#        Shapes of the paths in the rotating frames: [HZN] (see above).
# Closest approaches (TDB at the spacecraft; altitude above the Moon's mean radius)
# and the largest distances from the Earth (above its equatorial radius): computed
# from the baked data. They agree with NASA's figures within a few km (checked in
# tests/mission_tests.cpp).

name = "Earth-Moon"

[view]
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 8.0e5
yaw_deg = -90.0                # looking along +y: the Moon to the right of the Earth
pitch_deg = 50.0
start = "2026-04-02 02:00"     # Artemis II, just after the ICPS separation
warp = 3600.0                  # 1 hour per second: the 9-day flight in 3.5 minutes

# Heliocentric Earth-Moon barycenter, for the Sun direction. [HZN]
[origin_heliocentric]
type = "ephemeris"
file = "ephem/emb.eph"
[origin_heliocentric.fallback]             # Standish Table 2a, EM Bary
type = "jpl_approx_planet"
a_au = [1.00000018, -0.00000003]
e = [0.01673163, -0.00003661]
i_deg = [-0.00054346, -0.01337178]
mean_longitude_deg = [100.46691572, 35999.37306329]
lon_peri_deg = [102.93005885, 0.31795260]
node_deg = [-5.11260389, -0.24123856]

[[bodies]]
name = "Earth"
radii_km = [6378.1366, 6356.7519]          # [PCK]
gm_km3_s2 = 403503.235625                  # Earth + Moon, for the Moon's relative orbit [GM]
body_gm_km3_s2 = 398600.435507             # [GM]
pole_ra_dec_deg = [0.0, 90.0]              # [PCK]
prime_meridian_deg = [190.147, 360.9856235]
color = "#5b86c9"
texture = "textures/earth.jpg"             # NASA Blue Marble NG (see textures/SOURCES.md)
texture_left_lon_deg = -180.0
[bodies.atmosphere]                        # [ATM]
height_km = 60.0
rayleigh_depth = 0.1085                    # 13.56e-6 m^-1 at 550 nm x 8 km
rayleigh_scale_height_km = 8.0
haze_depth = 0.005328
haze_scale_height_km = 1.2
haze_albedo = 0.9
haze_g = 0.8

[[bodies]]
name = "Moon"
parent = "Earth"
radii_km = [1737.4]                        # [SPHY]
gm_km3_s2 = 4902.800118                    # [GM]
body_gm_km3_s2 = 4902.800118               # [GM]
pole_ra_dec_deg = [269.9949, 66.5392]      # [PCK] (libration terms ignored)
prime_meridian_deg = [38.3213, 13.17635815]
color = "#a8a49c"
orbit_color = "#c8c4bc"
texture = "textures/moon.jpg"              # NASA SVS CGI Moon Kit
texture_left_lon_deg = -180.0
[bodies.orbit]                             # [HZN] 301
type = "ephemeris"
file = "ephem/moon_geo.eph"

[[bodies]]
name = "Artemis II"
parent = "Earth"
kind = "spacecraft"
radii_km = [0.005]                         # Orion with its solar arrays, ~19 m across
color = "#ffe08a"
orbit_color = "#ffc34d"
trail = "history"                          # the whole flight
trail_linger_days = 30.0                   # after splashdown, fading
[bodies.orbit]                             # [HZN] -1024
type = "ephemeris"
file = "ephem/artemis2.eph"

[[bodies]]
name = "Artemis I"
parent = "Earth"
kind = "spacecraft"
radii_km = [0.005]
color = "#ffb3a0"
orbit_color = "#ff8a6e"
trail = "history"
trail_linger_days = 30.0                   # after splashdown, fading
[bodies.orbit]                             # [HZN] -1023
type = "ephemeris"
file = "ephem/artemis1.eph"

[[bodies]]
name = "CAPSTONE"
parent = "Moon"
kind = "spacecraft"
radii_km = [0.001]                         # 12U CubeSat with solar arrays
color = "#a8f0c8"
orbit_color = "#6fdba0"
trail = "history"
trail_history_days = 40.0                  # about 6 halo orbits
trail_linger_days = 30.0                   # after the data end
[bodies.orbit]                             # [HZN] -1176, Moon-centered
type = "ephemeris"
file = "ephem/capstone_sel.eph"

[[frames]]
name = "Earth-Moon rotating"
type = "rotating"
primary = "Earth"
secondary = "Moon"
origin = "Earth"

[[frames]]
name = "Earth-Moon rotating, Moon-centered"
type = "rotating"
primary = "Earth"
secondary = "Moon"
origin = "Moon"

[[markers]]
name = "L1"
type = "lagrange"
point = 1
primary = "Earth"
secondary = "Moon"
mass_ratio = 0.0121505844

[[markers]]
name = "L2"
type = "lagrange"
point = 2
primary = "Earth"
secondary = "Moon"
mass_ratio = 0.0121505844

# --- Artemis II ------------------------------------------------------------------

[[events]]
name = "Artemis II: on the way to the Moon (2026-04-02)"
time_tdb = "2026-04-02 02:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 7.0e5
warp = 3600.0
# [A2], [A2B], [A2PK]
caption = """\
    Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen are on their way, the \
    first crew bound for the Moon since Apollo 17 in 1972. The translunar injection burn \
    was the last big engine firing: on this free-return path, gravity alone will bring \
    Orion home. In this frame, which holds the Moon still, the flight traces a figure \
    eight."""

# Closest approach 2026-04-06 23:01:49 TDB, 6,543 km above the far side; farthest
# from the Earth 4 minutes later, 23:06:12 TDB, 406,765 km above its surface.
[[events]]
name = "Artemis II: behind the Moon, farthest humans (2026-04-06)"
time_tdb = "2026-04-06 21:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 4.0e4
warp = 300.0
# [A2B], [A2R]
caption = """\
    About 6,500 km above the far side, the crew lost touch with the Earth for 40 \
    minutes, watched it set behind the lunar horizon and rise again, and saw the Moon \
    eclipse the Sun for nearly an hour. Minutes later they were about 406,800 km from \
    the Earth, beyond Apollo 13's record of 1970: the farthest any humans have been."""

[[events]]
name = "Artemis II: home (2026-04-10)"
time_tdb = "2026-04-10 20:00"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 1.2e5
warp = 300.0
# [A2], [A2Q], [A2PK]
caption = """\
    Pulled back by the Earth's gravity, Orion returns at nearly 35 times the speed of \
    sound and splashes down in the Pacific off San Diego, nine days, one hour and 32 \
    minutes after launch: the first crewed flight of Orion is over."""

# --- Artemis I -------------------------------------------------------------------

[[events]]
name = "Artemis I: the whole flight (2022-11-16)"
time_tdb = "2022-11-16 08:47"
focus = "Earth"
frame = "Earth-Moon rotating"
distance_km = 8.0e5
warp = 7200.0
# [A1], [DRO]
caption = """\
    The first flight of NASA's new Moon rocket and an uncrewed Orion: a 25-day test of \
    rocket, spacecraft and ground systems before anyone flew. In this frame, which holds \
    the Moon still, watch Orion's path loop around the Moon against the Moon's own \
    motion: the distant retrograde orbit."""

[[events]]
name = "Artemis I: outbound flyby (2022-11-21, 131 km)"
time_tdb = "2022-11-21 11:58"
focus = "Moon"
distance_km = 2.0e4
warp = 60.0
# [A1B], [DRO]
caption = """\
    Orion skims about 130 km above the lunar surface. This is a powered flyby: the \
    Moon's gravity and a burn of Orion's service module together send it on toward the \
    distant retrograde orbit, far beyond the Moon."""

# Farthest from the Earth 2022-11-28 21:07:35 TDB, 432,207 km above its surface.
[[events]]
name = "Artemis I: distant retrograde orbit (2022-11-25)"
time_tdb = "2022-11-25 12:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
from_orbit_normal = "Moon"
distance_km = 2.5e5
warp = 3600.0
# [DRO], [A1], [A1B]
caption = """\
    A distant retrograde orbit: high above the Moon, going around it against the Moon's \
    motion around the Earth, and so stable that it takes little fuel to stay in. Half a \
    lap takes nearly a week. On 28 November Orion reached 432,000 km from the Earth, \
    farther than any spacecraft built to carry people."""

[[events]]
name = "Artemis I: return flyby (2022-12-05, 129 km)"
time_tdb = "2022-12-05 15:45"
focus = "Moon"
distance_km = 2.0e4
warp = 60.0
# [A1B], [A1]
caption = """\
    Leaving the distant retrograde orbit, Orion swings past the Moon again, about 130 km \
    up, and heads home. It splashed down off San Diego on 11 December, after 25 days in \
    space, clearing the way for a crew."""

# --- CAPSTONE ---------------------------------------------------------------------

[[events]]
name = "CAPSTONE: ballistic lunar transfer (2022-07)"
time_tdb = "2022-07-05 00:00"
focus = "Earth"
frame = "Earth-Moon rotating"
from_orbit_normal = "Moon"
distance_km = 3.5e6
warp = 86400.0
# [CAP1], [HZN]
caption = """\
    A CubeSat the size of a microwave oven takes the long way to the Moon: not three \
    days but four months on a low-energy path, which swings far out beyond the Moon's \
    orbit before falling back to meet it. The trip costs time instead of fuel."""

# First perilune in the halo orbit 2022-11-14 00:39:27 TDB, 3,486 km from the Moon's center.
[[events]]
name = "CAPSTONE: arrives in the halo orbit (2022-11-13)"
time_tdb = "2022-11-12 00:00"
focus = "Moon"
frame = "Earth-Moon rotating, Moon-centered"
distance_km = 1.5e5
warp = 3600.0
# [CAP1], [HZN]
caption = """\
    The first spacecraft in a near-rectilinear halo orbit, the orbit planned for the \
    Gateway station. Every seven days it passes about 1,600 km over the Moon's north \
    pole and climbs some 70,000 km beyond the south pole. In this Moon-centered frame, \
    which turns with the Earth, the narrow loop stays put."""
