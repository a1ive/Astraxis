# Kepler-64 (PH1, KIC 4862625): a Neptune-sized planet around an eclipsing
# pair (an F star and a red dwarf, 20-day orbit), with a second pair of stars,
# Ba and Bb, about 1300 au away: the first planet known in a quadruple star
# system, found by Planet Hunters volunteers.
#
# The inner three bodies are integrated as a Newtonian three-body system
# (Yoshida 6th-order symplectic, src/ephem/nbody.cpp) from the joint
# photodynamical solution; Ba and Bb are on assumed fixed Keplerian orbits
# around them (their pull is negligible: Schwamb et al. Sect. 6).
#
# [SC13] Schwamb et al. 2013, ApJ 768, 127 (arXiv:1210.3612):
#        Table 7, joint solution at t0 = BJD 2454970: Jacobian osculating elements
#        (Sect. 7) -- binary: P_A = 20.000214 d, e cos w = -0.16773, e sin w = -0.1291,
#        primary eclipse t_A = BJD 2454967.81776, i_A = 87.360 deg, node 0 (fixed);
#        planet (around the barycentre of Aa + Ab): P_b = 138.506 d,
#        sqrt(e) cos w = 0.228, sqrt(e) sin w = -0.044 (e = 0.0539, as Table 8),
#        barycentric transit t_b = BJD 2455074.71, i_b = 90.022 deg, relative node
#        0.89 deg; M_Aa = 1.384 M_sun, M_Ab / M_Aa = 0.2794, density of Aa
#        0.2542 (solar units: it reproduces Table 8's R_Aa / a_A = 0.0469),
#        R_Ab / R_Aa = 0.240, R_b / R_Aa = 0.03222 (Table 8: R_b = 6.18 R_earth);
#        planet mass only below 169 M_earth (99.7%).
#        Convention: mid-eclipse / transit at omega + f = 90 deg (transit_u_deg);
#        the other choice moves the secondary eclipse from the observed phase
#        0.393 (Table 3) to 0.607.
#        Sect. 8: T_eff of Aa 6407 K (SME); Table 9: T_Ab / T_Aa = 0.5557.
#        Sect. 9.3: Ba and Bb ~0.99 and 0.51 M_sun ("approximately G2 and M2"),
#        "roughly 60 AU" apart.
# [GAIA] Gaia EDR3/DR3 via SIMBAD and VizieR (I/355): Aa+Ab at RA 19 52 51.6168025931,
#        Dec +39 57 18.371555959 (298.215070011, 39.955103210 deg), parallax
#        0.5245 +- 0.0841 mas (1907 pc; RUWE 7.3, so it is uncertain: [SC13] estimate
#        ~1500 pc photometrically); Gaia DR3 2073478823189950592, the unresolved
#        Ba + Bb, 0.7043" away at position angle 123.29 deg (J2016.0; [SC13] Sect. 4
#        found it 0.702" away), 1343 au in projection.
# [PM13] Pecaut & Mamajek 2013, ApJS 208, 9, and the online table
#        EEM_dwarf_UBVIJHK_colors_Teff.txt (version 2022.04.16): G2V 5770 K,
#        1.012 R_sun, log L = 0.01; M2V 3560 K, 0.446 R_sun, log L = -1.54.
# [CK17] Chen & Kipping 2017, ApJ 834, 17, Table 1: R = 1.008 M^0.279 below
#        2.04 M_earth, R proportional to M^0.589 above (continuous).
# Derived: R_Aa = (1.384 / 0.2542)^(1/3) = 1.759 R_sun, R_Ab = 0.422 R_sun;
#          T_Ab = 3560 K; L = R^2 (T_eff / 5772 K)^4 = 4.70 and 0.0258 L_sun;
#          planet mass 31.6 M_earth from [CK17] (assumed).
#
# [CAP]  Event captions: from [SC13], [GAIA] and the notes above.
# Assumed: the orientation of the inner orbits on the sky (binary node 0, as
# [SC13]); Ba + Bb on a circle of radius 1343 au (P = 27,000 yr), at its
# ascending node at J2016.0 (so Gaia's position angle is the node), inclined
# 60 deg; Ba and Bb 60 au apart on a circle (P = 379 yr), node 0, inclined
# 60 deg; their temperatures and radii those of G2V and M2V dwarfs [PM13].
# Colours of the planet are artistic.
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440); R_earth = 6371.0 km.
# Times are BJD_TDB; light-travel time across the system is ignored.
# Check (tests/stellar_system_tests.cpp): the measured eclipses ([SC13] Table 3) come within
# 0.6 min (primary) and 8 min (secondary, 1-sigma ~7 min), the planet transits
# (Table 2) within 13 min (1-sigma 6-9 min; the medians of Table 7 are not a
# single best-fit model).
# The background sky (catalog stars, Milky Way) is the one seen from Earth; from 1.9 kpc
# it would differ.

name = "Kepler-64"

[view]
focus = "Kepler-64 A"
distance_km = 2.5e8
start = "now"
warp = 172800.0                # 2 days per second: the planet orbits in 69 s
up = "orbit_normal:Kepler-64 Ab"

# The root is the barycentre of Aa, Ab and the planet; Ba and Bb orbit it.
[[bodies]]
name = "Kepler-64 A"
kind = "barycenter"

[[bodies]]
name = "Kepler-64 Aa"
parent = "Kepler-64 A"
kind = "star"
radii_km = [1223889.4]         # 1.759 R_sun
temperature_k = 6407.0
luminosity_solar = 4.70
orbit_color = "#ffe9b0"
trail = "history"
trail_history_days = 20.000214 # one binary orbit
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Kepler-64 Ab"
parent = "Kepler-64 A"
kind = "star"
radii_km = [293733.5]          # 0.422 R_sun
temperature_k = 3560.0
luminosity_solar = 0.0258
orbit_color = "#ff9a70"
trail = "history"
trail_history_days = 20.000214
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Kepler-64 b"
parent = "Kepler-64 A"
radii_km = [39372.8]           # 6.18 R_earth
color = "#a8c0d8"
orbit_color = "#90e0b0"
trail = "history"
trail_history_days = 138.5     # one orbit: its apsides advance visibly orbit to orbit
[bodies.orbit]
type = "nbody"

# Ba + Bb relative to the root (the A system), assumed circular [GAIA].
[[bodies]]
name = "Kepler-64 B"
parent = "Kepler-64 A"
kind = "barycenter"
orbit_color = "#a8b8d0"
[bodies.orbit]
type = "visual_orbit"
gm_km3_s2 = 4.340738029e11     # A (1.771) + B (1.50 M_sun)
a_mas = 704.3
distance_pc = 1906.58
e = 0.0
i_deg = 60.0                   # assumed
node_deg = 123.29              # the position angle at J2016.0
arg_peri_deg = 0.0
t_peri_year = 2016.0
sky_ra_dec_deg = [298.215070011, 39.955103210]

# Bb relative to Ba (assumed circular, 60 au [SC13]), split by the masses.
[[bodies]]
name = "Kepler-64 Ba"
parent = "Kepler-64 B"
kind = "star"
radii_km = [704048.4]          # G2V, 1.012 R_sun [PM13]
temperature_k = 5770.0
luminosity_solar = 1.023
orbit_color = "#ffe0a0"
[bodies.orbit]
scale = -0.34                  # -M_Bb / M_B
type = "visual_orbit"
gm_km3_s2 = 1.990686601e11     # 1.50 M_sun
a_au = 60.0
e = 0.0
i_deg = 60.0
node_deg = 0.0
arg_peri_deg = 0.0
t_peri_year = 2016.0
sky_ra_dec_deg = [298.215070011, 39.955103210]

[[bodies]]
name = "Kepler-64 Bb"
parent = "Kepler-64 B"
kind = "star"
radii_km = [310282.2]          # M2V, 0.446 R_sun [PM13]
temperature_k = 3560.0
luminosity_solar = 0.0288
orbit_color = "#ff9a70"
[bodies.orbit]
scale = 0.66                   # M_Ba / M_B
type = "visual_orbit"
gm_km3_s2 = 1.990686601e11
a_au = 60.0
e = 0.0
i_deg = 60.0
node_deg = 0.0
arg_peri_deg = 0.0
t_peri_year = 2016.0
sky_ra_dec_deg = [298.215070011, 39.955103210]

[[bodies]]
name = "Sun"
parent = "Kepler-64 A"
kind = "star"
radii_km = [695700.0]
body_gm_km3_s2 = 1.32712440041279419e11 # JPL DE440
temperature_k = 5772.0
luminosity_solar = 1.0
trail = "none"
[bodies.orbit]                 # opposite direction of Kepler-64 as seen from the Sun [GAIA]
type = "fixed"
ra_dec_distance_pc = [118.215070011, -39.955103210, 1906.58]

# [SC13] Table 7: Jacobian elements, the binary first; output relative to the
# A-system barycentre (the root).
[nbody]
epoch_jd_tdb = 2454970.0
span_years = [1990.0, 2060.0]
step_days = 0.1                # 200 steps per binary orbit (e = 0.21)
order = 6
knots_per_orbit = 24

[[nbody.members]]
body = "Kepler-64 Aa"
gm_km3_s2 = 1.836740170e11     # 1.384 M_sun

[[nbody.members]]
body = "Kepler-64 Ab"
gm_km3_s2 = 5.131852035e10     # 0.2794 M_Aa
relative_to = ["Kepler-64 Aa"]
[nbody.members.transit_orbit]  # primary eclipse: Ab in front of Aa
period_days = 20.000214
t_transit_bjd_tdb = 2454967.81776
e_cos_w = -0.16773
e_sin_w = -0.1291
i_deg = 87.360
node_deg = 0.0
transit_u_deg = 90.0
sky_ra_dec_deg = [298.215070011, 39.955103210]

[[nbody.members]]
body = "Kepler-64 b"
gm_km3_s2 = 1.260550767e7      # 31.6 M_earth [CK17], assumed
relative_to = ["Kepler-64 Aa", "Kepler-64 Ab"]
[nbody.members.transit_orbit]  # barycentric transit
period_days = 138.506
t_transit_bjd_tdb = 2455074.71
e = 0.05392                    # sqrt(e) cos w = 0.228, sqrt(e) sin w = -0.044
arg_peri_deg = -10.9228
i_deg = 90.022
node_deg = 0.89
transit_u_deg = 90.0
sky_ra_dec_deg = [298.215070011, 39.955103210]

[[frames]]
name = "Kepler-64 B-centered"
type = "inertial"
origin = "Kepler-64 B"

[[events]]
name = "The planet around the eclipsing pair, face-on"
time = "2026-01-01"
focus = "Kepler-64 A"
from_orbit_normal = "Kepler-64 b"
distance_km = 2.5e8
warp = 172800.0
# [SC13]
caption = """\
    Kepler-64 b, about six times the Earth's size, circles a pair of stars every 138.5 \
    days. Volunteers of the Planet Hunters project spotted its transits in Kepler's data \
    by eye: the first planet known in a system of four stars."""

[[events]]
name = "The pair: 20 days, e = 0.21"
time = "2026-01-01"
focus = "Kepler-64 A"
distance_km = 8.0e7
warp = 21600.0                 # 6 hours per second: one orbit in 80 s
# [SC13]
caption = """\
    The planet's two suns: an F star of 1.4 solar masses and a red dwarf of under 0.4, \
    on an eccentric 20-day orbit that brings them in and out again. Seen from the Earth \
    they eclipse each other on every lap."""

[[events]]
name = "Kepler-64 b under its two suns"
time = "2026-01-01"
focus = "Kepler-64 b"
from_body = "Kepler-64 Aa"
phase_deg = -150.0
distance_km = 2.0e5
warp = 3600.0
# [SC13]
caption = """\
    A world about six times the Earth's size, its mass known only to be below 169 Earth \
    masses, lit by two suns: an F star almost five times as luminous as the Sun and its \
    dim red companion. Its look here is an artist's guess."""

[[events]]
name = "Edge-on, as Kepler saw it (2011)"
time = "2011-01-01"
focus = "Kepler-64 A"
from_body = "Sun"
distance_km = 2.5e8
warp = 86400.0
# [SC13], [GAIA]
caption = """\
    The view from the Earth, very roughly 1,900 parsecs away. The orbits are nearly \
    edge-on, so the stars eclipse each other every 20 days and the planet passes in \
    front of them every 138.5 days."""

[[events]]
name = "Ba and Bb, 60 au apart"
time = "2026-01-01"
focus = "Kepler-64 B"
frame = "Kepler-64 B-centered"
distance_km = 3.0e10
warp = 315576000.0             # 10 years per second: one orbit in 38 s (Ba, Bb are Keplerian)
# [SC13]
caption = """\
    The second pair: a Sun-like star and a red dwarf, roughly 60 au apart, about 1,300 \
    au from the planet's stars. Their orbit has not been measured, so the circle drawn \
    here is an assumption."""

[[events]]
name = "All four stars: the two pairs 1300 au apart"
time = "2026-01-01"
focus = "Kepler-64 A"
distance_km = 6.0e11
warp = 2629800.0               # 1 month per second: the integration ends in 2060
# [SC13], [GAIA]
caption = """\
    The whole quadruple: the planet's eclipsing pair and the second pair, about 1,300 au \
    apart on the sky. On the assumed circular orbit drawn here, the two pairs would take \
    some 27,000 years to go around each other."""
