[bodies.orbit]                         # [HZN] -61
type = "ephemeris"
file = "ephem/juno_jup.eph"

# Events. Closest approaches (TDB at the spacecraft) and distances from the bake tool
# (tools/bake/ephem.toml encounters; altitudes above the moons' mean radii [SPHY]).
# Flybys start an hour before closest approach.

[[events]]
name = "Galileo arrives: Io flyby (1995-12-07, 898 km)"
time_tdb = "1995-12-07 16:47"
focus = "Io"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    Arrival day was crowded. Galileo flies past Io here, under 900 km up; the same day \
    its probe plunges into Jupiter at 170,000 km/h and radios back for 58 minutes, and \
    Galileo fires its engine to become the first spacecraft to orbit an outer planet."""

[[events]]
name = "Galileo's tour, 1995-2003"
time_tdb = "1995-12-07 12:00"
focus = "Jupiter"
from_orbit_normal = "Ganymede"
distance_km = 4.5e7
warp = 604800.0
# [GLL], [HZN]
caption = """\
    Eight years and 34 orbits. Every flyby of a moon reshapes the next orbit, so the \
    loops wander: watch them swing and stretch. Galileo did all this with its main \
    antenna stuck half-open, sending its discoveries home through a small antenna, \
    slowly."""

[[events]]
name = "Galileo at Ganymede (1996-09-06, 267 km)"
time_tdb = "1996-09-06 18:00"
focus = "Ganymede"
distance_km = 30000.0
warp = 60.0
# [GLL], [SPHY] (radii)
caption = """\
    Galileo's second pass of Ganymede, the largest moon in the solar system, under 300 \
    km up. In its first passes it found that Ganymede makes its own magnetic field: the \
    first moon known to have one."""

[[events]]
name = "Galileo at Europa (1997-12-16, 204 km)"
time_tdb = "1997-12-16 11:04"
focus = "Europa"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    About 200 km over Europa's cracked ice. Galileo's measurements made the case for a \
    salty ocean beneath the ice, and that ocean is why, at the end, Galileo was kept \
    from ever hitting Europa."""

[[events]]
name = "Galileo at Callisto (2001-05-25, 129 km)"
time_tdb = "2001-05-25 10:25"
focus = "Callisto"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    Callisto's dark, crater-covered face, about 130 km below. Even this ancient, \
    battered moon gave Galileo signs of a layer of salty liquid water deep beneath the \
    surface, as Europa and Ganymede did."""

[[events]]
name = "Galileo at Io (2002-01-17, 100 km)"
time_tdb = "2002-01-17 13:09"
focus = "Io"
distance_km = 30000.0
warp = 60.0
# [GLL], [PLM]
caption = """\
    Galileo's closest pass of Io, about 100 km above the most volcanic world known, with \
    perhaps a hundred times the volcanic activity of the Earth. The two plumes drawn \
    here, Pele and Tvashtar, rise about 300 km."""

[[events]]
name = "Galileo enters Jupiter (2003-09-21)"
time_tdb = "2003-09-21 17:58"
focus = "Jupiter"
distance_km = 4.0e5
warp = 60.0
# [GLL]
caption = """\
    Almost out of propellant, Galileo is steered into Jupiter on purpose: left in orbit, \
    it might one day have crashed on Europa and contaminated its ocean with life from \
    the Earth. Instead it burns up in Jupiter's atmosphere."""

[[events]]
name = "Juno arrives: orbit insertion (2016-07-05)"
time_tdb = "2016-07-04 20:48"
focus = "Jupiter"
distance_km = 6.0e5
warp = 600.0
# [JUNO]
caption = """\
    Juno fires its engine for its capture into a long polar orbit. "Engine burn complete \
    and orbit obtained," mission control announced, on the 4th of July in the US. Juno \
    runs on sunlight, the first spacecraft to do so this far from the Sun."""

[[events]]
name = "Juno's tour, 2016-2028"
time_tdb = "2016-07-05 00:00"
focus = "Jupiter"
distance_km = 2.5e7
warp = 604800.0
# [JUNO], [HZN]
caption = """\
    Juno's orbits run over the poles, unlike the moons', and dive to within about 3,500 \
    km of the cloud tops, slipping between Jupiter and its worst radiation. Over the \
    years the low point drifts north. Juno found that the cloud bands reach some 3,000 \
    km deep, and eight cyclones circling one at the north pole."""

[[events]]
name = "Juno at Ganymede (2021-06-07, 1,035 km)"
time_tdb = "2021-06-07 15:57"
focus = "Ganymede"
distance_km = 30000.0
warp = 60.0
# [JUNO]
caption = """\
