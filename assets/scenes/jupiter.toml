caption = """\
    Galileo on arrival day, 5.3 m tall, ten minutes before it passes Io. Its 4.8 m antenna \
    never opened fully, and the model shows it furled. The model also still carries the \
    probe at the bottom, which had left months before and enters Jupiter's atmosphere \
    today. The colors, the roll about the antenna's axis and the light on the shaded side \
