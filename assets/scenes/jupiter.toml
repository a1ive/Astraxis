# Jupiter and the four Galilean satellites (mean-element model).
#
# Sources
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        ephemeris JUP365, Laplace-plane frame, epoch 2000-01-01.5 TDB.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
# [PCK]  NAIF pck00011.tpc (IAU WGCCRE 2015 report): pole, prime meridian, radii.
#        Linear T terms and nutation/precession terms are ignored (< 0.01 deg over centuries).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Tables 2a/2b
#        (https://ssd.jpl.nasa.gov/planets/approx_pos.html), 3000 BC - 3000 AD.
#
# Precession signs: [ELEM] lists apsidal/nodal periods as magnitudes. Nodes regress.
# Io's and Europa's apsides are locked to the Laplace resonance and regress; Ganymede's
# and Callisto's advance. With these signs, d(node + arg_peri + M)/dt reproduces the
# synchronous rotation rates of [PCK] (203.4889538, 101.3747235, 50.3176081,
# 21.5710715 deg/day) to within 0.001 deg/day (checked in tests/sim_tests.cpp).
#
# Colors are sRGB and artistic (used when a texture is missing).
# Textures: see assets/textures/SOURCES.md. texture_left_lon_deg is the longitude of the
# map's left edge, increasing eastward across the map (texture_lon_direction = "east").
# The USGS maps are labeled "positive west" but are laid out with east to the right;
# the left edges were verified against Valhalla (Callisto), Pele and Loki (Io), and
# Galileo Regio (Ganymede).

name = "Jupiter"

# Heliocentric orbit of the scene origin, used for the sun direction. [APX]
# Each element is [value at J2000, rate per Julian century].
[origin_heliocentric]
type = "jpl_approx_planet"
a_au = [5.20248019, -0.00002864]
e = [0.04853590, 0.00018026]
i_deg = [1.29861416, -0.00322699]
mean_longitude_deg = [34.33479152, 3034.90371757]
lon_peri_deg = [14.27495244, 0.18199196]
node_deg = [100.29282654, 0.13024619]
b = -0.00012452
c = 0.06064060
s = -0.35635438
f = 38.35125000

[[bodies]]
name = "Jupiter"
radii_km = [71492.0, 66854.0]          # equatorial, polar [PCK]
pole_ra_dec_deg = [268.056595, 64.495303] # [PCK]
prime_meridian_deg = [284.95, 870.5360000] # W0, deg/day (System III) [PCK]
color = "#e0cdb0"
style = "gas_giant"
# Atmospheric features drift in longitude, so the map alignment is arbitrary.
texture = "textures/jupiter.jpg"
texture_left_lon_deg = -180.0

[[bodies]]
name = "Io"
parent = "Jupiter"
radii_km = [1821.49]                   # mean radius [SPHY]
pole_ra_dec_deg = [268.05, 64.50]      # [PCK]
prime_meridian_deg = [200.39, 203.4889538]
color = "#edd173"
orbit_color = "#f2cc66"
texture = "textures/io.jpg"
texture_left_lon_deg = -180.0

