# Comet Shoemaker-Levy 9 [SL9]. The parent comet is fragment K's path up to the breakup, without a
# coma: nobody saw it ([CY96]: not in a March 1992 exposure to magnitude 21.3). Each fragment shows from
# when it split off until the 100-mbar level. tools/sl9/sl9_bake.py prints these bodies.
# Sizes and brightness are per fragment, from [WEA]. dust_only: no gas was ever detected ([WEA]),
# and the dust tail, which moves around the Sun alone, would leave a comet that is orbiting Jupiter
# (limitations.md). dust_speed_km_s makes the fountain's turning distance 2000 km at 5.4 au
