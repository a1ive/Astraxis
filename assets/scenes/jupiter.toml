# Jupiter, its rings, the Galilean and the four inner satellites, the orbits of
# Galileo (1995-2003) and Juno (2016-), Cassini's flyby (2000-2001), and the fragments of comet
# Shoemaker-Levy 9 (1992-1994).
#
# Sources
# [GBS]  Moore et al. 2018, Nature 561, 76: the field's two hemispheres differ, with an intense
#        equatorial patch of inward field, the Great Blue Spot. Moore et al. 2019, Nature
#        Astronomy 3, 730, and Connerney et al. 2022, JGR Planets 127, e2021JE007055 (JRM33): it
#        drifts eastward by a few cm/s, carried by zonal winds at depth; the dynamo's top near
#        0.81 radii. The maps are JRM33 to degree 13; assets/geomag/SOURCES.md.
# [GMAG] Weber et al. 2022, GRL 49, e2022GL098633: Ganymede's dipole from Galileo and Juno,
#        here in Jupiter's field at the moon (72 to 117 nT in JRM33 + CON2020; bodies/ganymede.toml):
#        closed lines out to about 2 radii, the rest joining Jupiter's field.
# [SPOTS] Bonfond et al. 2008, GRL 35, L05107, and 2009, JGR 114, A07224: Io's footprint has
#        up to three spots: the main one, one from electrons beamed across from the other
#        hemisphere (ahead of the main spot in the north with Io at longitudes 0-100 deg, in
#        the south at 130-300; at most about 4 deg from it), and one from the wave reflected
#        at the torus' far edge (at most 12 deg behind). Bonfond et al. 2013, GRL 40, 4977: a
#        second spot at Ganymede's too. Europa's is drawn by the same rule, not observed.
#        geomag/SOURCES.md.
#        Kivelson et al. 2002, Icarus 157, 507: the only moon with such a field. Duling et al.
#        2022, GRL 49, e2022GL101688, and Greathouse et al. 2022: the aurora coincides with the
#        boundary of closed and open field lines.
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        ephemeris JUP365, Laplace-plane frame, epoch 2000-01-01.5 TDB.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of Jupiter alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table. Thebe, Adrastea and Metis are given no mass: their JUP365 GMs are
#        uncertain by 40-140% (and all imply a density of 0.90 g/cm^3).
# [PCK]  NAIF pck00011.tpc (IAU WGCCRE 2015 report): pole, prime meridian, radii.
#        Linear T terms and nutation/precession terms are ignored (< 0.01 deg over centuries
#        for the Galilean moons; < 1 deg for the inner moons).
# [MDLC] NASA/Brian E. Kumanchik, "Cassini-Huygens (A)" (without Huygens), NASA 3D Resources,
#        science.nasa.gov/3d-resources/cassini-huygens-a/, converted by
#        tools/shapes/make_spacecraft.py (assets/shapes/SOURCES.md).

# [MDLG] NASA/JPL/Solar System Simulator, "Galileo", NASA 3D Resources,
#        science.nasa.gov/3d-resources/galileo/, converted by tools/shapes/make_spacecraft.py
#        (assets/shapes/SOURCES.md).

# [MDLJ] "Juno (A)", NASA 3D Resources, science.nasa.gov/3d-resources/juno-a/ (the page names
#        no author), converted by tools/shapes/make_spacecraft.py (assets/shapes/SOURCES.md).

# [GLF]  NASA, "Galileo End of Mission" press kit (jpl.nasa.gov/news/press_kits/galileo-end.pdf,
#        retrieved 2026-11-07): 5.3 m from the top of the low-gain antenna to the bottom of the
#        probe; the 4.8 m high-gain antenna failed to open fully; an 11 m magnetometer boom;
#        the spinning section turns about 3 times a minute.
# [JNK]  NASA, "Juno Jupiter Orbit Insertion" press kit, spacecraft section
#        (jpl.nasa.gov/news/press_kits/juno/spacecraft/, retrieved 2026-11-07): a body 3.5 m
#        tall and wide; solar panels spanning more than 20 m; 2 turns a minute in science
#        operations.
# [HZN]  JPL Horizons state vectors relative to Jupiter's center, baked by
#        tools/bake/horizons_bake.py (tools/bake/ephem.toml, Kepler-relative AXEPH2 tables):
#        Galileo 1995-11-01 .. 2003-09-21 (navigation fits to 2002-08-12, then the
#        baseline prediction), Juno 2016-06-01 .. 2028-09-01 (reconstructed to 2026-08-24,
#        then predictions), Cassini 2000-10-01 .. 2001-04-01 (navigation team's
#        post-mission reconstruction), and the Galilean moons over the Galileo and Juno
#        spans, and over 1992-06-01 .. 1994-08-01 for comet Shoemaker-Levy 9. Outside them the
#        moons fade over one day into the mean-element model [ELEM], which drifts by degrees.
# [PLM]  Io's plumes (always erupting): sources and choices in bodies/io.toml.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [STKS] P. Stooke, Stooke Small Body Shape Models V2.0 (PDS SBN, small_bodies.stooke.shape-models;
#        EAR-A-5-DDR-STOOKE-SHAPE-MODELS-V2.0): Amalthea (Voyager; Stooke 1994, EMP 64, 87) and
#        Thebe (Galileo, preliminary), 5 deg grids; equal-volume radii 81.7 / 45.5 km vs
#        83.5 +- 3 / 49.3 +- 4 km in [SPHY]. See assets/shapes/SOURCES.md.
# [STKM] P. Stooke, Stooke Small Bodies Maps V3.0 (PDS SBN, small_bodies.stooke.maps;
#        MULTI-SA-MULTI-6-STOOKEMAPS-V3.0): Amalthea airbrushed shaded relief from Voyager
#        images, simple cylindrical, 0 deg at the center.
# [APX]  E. M. Standish, Approximate Positions of the Planets, Tables 2a/2b
#        (https://ssd.jpl.nasa.gov/planets/approx_pos.html), 3000 BC - 3000 AD.
# [IESS] Jupiter's J2 and J4 (Iess et al. 2018, Nature 555, 220): bodies/jupiter.toml.
# [SL9]  Comet Shoemaker-Levy 9, all in tools/sl9/sl9_bake.py:
#        [CY96] Chodas & Yeomans 1996, in "The Collision of Comet Shoemaker-Levy 9 and Jupiter"
#          (Cambridge), pp. 1-30: orbits (Horizons' records D/1993 F2-A .. -W are its solutions),
#          impact times and places (Table 5), speed and angle (Table 6), capture about 1929.
#        [SEK] Sekanina 1996, same book, pp. 55-80: perijove and breakup, 1992 July 7.860364 TDB and
#          2.5 h later (Sec. 4.2); Q2 from Q1 in April 1993 and P2 from Q in December 1992 (Sec. 4.3).
#        [WEA] Weaver et al. 1995, Science 267, 1282, Table 2: relative sizes and brightness.
#        [IAUC] IAU Circular 5725 (1993 March 26): discovery, m1 of 14, a train 47 arcsec long.
#        [HAM95] Hammel et al. 1995, Science 267, 1288, and [HAM96] Hammel 1996, same book, pp. 111-120: plumes,
#          sites, rings. [HD01] Harrington & Deming 2001, ApJ 561, 455: the ballistic plume. [BEE96] Beebe 1996,
#          same book, pp. 307-328, and [SL98] Sanchez-Lavega et al. 1998, Icarus 131, 341: how the debris spread.
#
# [CAP]  Event captions (retrieved 2026-10-07):
#        [GLL] NASA, science.nasa.gov/mission/galileo/: arrival on 1995-12-07 with flybys of
#          Europa and Io; the probe entered the atmosphere that day at 170,000 km/h and sent
#          data for 58 minutes; "the first spacecraft to orbit an outer planet", 34 orbits;
#          the high-gain antenna "failed to deploy fully" (1991); Ganymede "the first
#          satellite known to possess a magnetic field"; evidence for oceans under Europa's
#          ice and liquid-saltwater layers in Europa, Ganymede and Callisto; Io's volcanism
#          perhaps 100 times Earth's; out of propellant, steered into Jupiter on 2003-09-21 to
#          rule out an impact on Europa.
#        [JUNO] NASA, science.nasa.gov/mission/juno/: orbit insertion on 2016-07-04 (US
#          time), "Engine burn complete and orbit obtained"; solar powered, "the first ...
#          to operate at such a great distance from the Sun"; polar orbits of 53 days dipping
#          to within 2,200 miles of the cloud tops between the radiation belts and the planet;
#          eight cyclones around one at the north pole; Ganymede on 2021-06-07, the closest in
#          over 20 years.
#        [JOI] NASA/JPL news release 2016-07-04, "NASA's Juno Spacecraft in Orbit Around
#          Mighty Jupiter": the 645-newton main engine began on time at 8:18 p.m. PDT, a
#          35-minute burn, completion received on Earth at 8:53 p.m.; 542 m/s.
#        [JUNE] NASA/JPL, "NASA's Juno Shares First Image From Flyby of Jupiter's Moon
#          Europa": 2022-09-29, 352 km, the closest since Galileo on 2000-01-03; data on the
#          ice shell.
#        [JUNI] NASA/JPL, "NASA's Juno Mission Uncovers Heart of Jovian Moon's Volcanic Rage"
#          and "NASA's Juno to Get Close Look at Jupiter's Volcanic Moon Io on Dec. 30": about
#          1,500 km, the closest to Io in over 20 years; Loki Patera, a 200 km lava lake with
#          islands, so smooth it mirrored the Sun.
#        [CJUP] NASA Science, "Cassini Celebrates 10 Years Since Jupiter Encounter"
#          (2010-12-28): about six months at Jupiter, October 2000 to March 2001, slingshot
#          toward Saturn; closest approach 2000-12-30 10:05 UTC, about 9.7 million km from the
#          cloud tops; Galileo still in orbit, near-simultaneous measurements from two
#          spacecraft, the first two-point measurement of the boundary of Jupiter's magnetic
#          bubble, which was contracting under higher solar wind pressure; some 26,000 images.
#        [KUR02] Kurth et al. 2002, Nature 415, 991, "The dusk flank of Jupiter's
#          magnetosphere": on 2001-01-10 Cassini left the magnetosphere at 20:35 and Galileo
#          at 20:52 (spacecraft time), over 100 Rj apart in x. Galileo's crossing lies on
#          the "25%" magnetopause of [JOY02], Cassini's beyond the "10%" one: no steady
#          surface holds both, so the magnetosphere was shrinking under a rise in solar wind
#          pressure, which took about five hours from Galileo to Cassini. Cassini first met
#          the bow shock on 2000-12-28 04:19, 140.2 Rj out.
#        [JOY02] Joy et al. 2002, JGR 107, 1309: the magnetopause and bow shock as functions
#          of the wind's pressure (bodies/jupiter.toml, assets/geomag/SOURCES.md). The two
#          pressures of the event are those whose surfaces pass through the two crossings
#          (tests/appearance_tests.cpp). Its Table 2: the magnetopause is inside the surface
#          for 0.048 nPa 25% of the time and inside that for 0.030 nPa 10% of the time.
#        Orbits as drawn: [HZN].
# Precession signs: [ELEM] lists apsidal/nodal periods as magnitudes. Nodes regress.
# Io's and Europa's apsides are locked to the Laplace resonance and regress; Ganymede's
# and Callisto's advance. With these signs, d(node + arg_peri + M)/dt reproduces the
# synchronous rotation rates of [PCK] (203.4889538, 101.3747235, 50.3176081,
# 21.5710715 deg/day) to within 0.001 deg/day (checked in tests/planet_scene_tests.cpp).
#
# Colors are sRGB and artistic (used when a texture is missing).
# Textures: see assets/textures/SOURCES.md. texture_left_lon_deg is the longitude of the
# map's left edge, increasing eastward across the map (texture_lon_direction = "east").
# The USGS maps are labeled "positive west" but are laid out with east to the right;
# the left edges were verified against Valhalla (Callisto), Pele and Loki (Io), and
# Galileo Regio (Ganymede).

name = "Jupiter"

[[frames]]
name = "Jupiter equator"
type = "inertial"
origin = "Jupiter"
up = "Jupiter"

# Background sky, optional. Without [sky]: the catalog stars (assets/stars/hyg.csv)
