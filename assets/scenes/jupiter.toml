# Inner moons, inside Io's orbit [ELEM] [SPHY] [PCK]. Amalthea and Thebe are drawn with
# their shape models [STKS]; Metis and Adrastea, which have none, as the [PCK] triaxial
# ellipsoids (long axis toward Jupiter). The radii of all four are [PCK]'s (shadows,
# camera distances). As for the
# Galilean moons, the apsidal and nodal periods of [ELEM] are magnitudes: from
# Jupiter's oblateness, apsides advance and nodes regress, and with these signs
# d(node + arg_peri + M)/dt matches the synchronous rotation rates of [PCK].
# The match is only to 0.001-0.007 deg/day because [ELEM] rounds the periods
# (3 digits for the precession), which drifts by 8-70 deg by 2026 against
# Horizons. So period_days (of M) is derived instead from the 10-digit PCK rate:
# P = 360 / (W' - 360 / (365.25 apsis_period) - 360 / (365.25 node_period)),
# which keeps them within ~2.5 deg of Horizons in 2026 (checked in
# tests/planet_scene_tests.cpp). Colors are artistic (dark, reddish).

[[bodies]]
name = "Amalthea"
parent = "Jupiter"
shape = "shapes/amalthea.mesh"         # [STKS]
radii_km = [125.0, 73.0, 64.0]         # [PCK]
body_gm_km3_s2 = 0.16456               # [SPHY] (JUP365)
