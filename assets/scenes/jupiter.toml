# Spacecraft [HZN], visible while they are at Jupiter. The trails show a sliding
# window of each tour (the whole of it is a dense tangle): Galileo's orbits reshaped
# by moon flybys, Juno's polar orbits whose perijove drifts north (out of the
# equatorial plane, unlike the moons). Cassini only passes by, far outside the moons:
# its hyperbola lies within 4 deg of Jupiter's equator, and Jupiter turns it by 12 deg
# (velocity 2000-10-01 vs 2001-04-01 [HZN]).

[[bodies]]
name = "Galileo"
parent = "Jupiter"
kind = "spacecraft"
radii_km = [0.0035]                        # the bus, dish and generators; the boom goes on
shape = "shapes/galileo.mesh"              # [MDLG]
texture = "textures/galileo.png"
point_at = "Sun"                           # the antenna; the roll is illustrative
fill_light = 0.2                           # illustrative
color = "#ffd27f"
orbit_color = "#ffbf5c"
trail = "history"
trail_history_days = 365.0                # about 5 orbits

[bodies.orbit]                         # [HZN] -77
type = "ephemeris"
file = "ephem/galileo_jup.eph"

[[bodies]]
name = "Juno"
parent = "Jupiter"
kind = "spacecraft"
radii_km = [0.010]                         # about 20 m across the solar arrays
shape = "shapes/juno.mesh"                 # [MDLJ]
texture = "textures/juno.jpg"
point_at = "Sun"                           # the antenna; the roll is illustrative
fill_light = 0.2                           # illustrative
color = "#9fe7ff"
orbit_color = "#6fd3ff"
trail = "history"
trail_history_days = 200.0                # about 6 orbits (33 days each since 2023)

[bodies.orbit]                         # [HZN] -61
type = "ephemeris"
file = "ephem/juno_jup.eph"

[[bodies]]
name = "Cassini"
parent = "Jupiter"
kind = "spacecraft"
radii_km = [0.004]                         # the bus and dish; the boom and antennas go on
shape = "shapes/cassini.mesh"              # [MDLC]
texture = "textures/cassini.jpg"
