# Events. Closest approaches (TDB at the spacecraft) and distances from the bake tool
# (tools/bake/ephem.toml encounters; altitudes above the moons' mean radii [SPHY]).
# Flybys start an hour before closest approach.
# `flyby` names the body whose pass of the focus an event shows (searched for in the 300 s
# after the event's time, at its warp): the view is then across the pass, turned toward the
# sun (unless from_body or from_orbit_normal say otherwise), and the auto tour slows down to
# arrive 20 s before closest approach and stays until after it.

[[events]]
name = "Galileo arrives: Io flyby (1995-12-07, 898 km)"
time_tdb = "1995-12-07 16:47"
focus = "Io"
flyby = "Galileo"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    Galileo passes under 900 km above Io on arrival day. Its probe enters \
    Jupiter's atmosphere at 170,000 km/h and radios back for 58 minutes. That same \
    day, Galileo fires its engine and becomes the first spacecraft to orbit an \
    outer planet."""

[[events]]
name = "Galileo's tour, 1995-2003"
time_tdb = "1995-12-07 12:00"
focus = "Jupiter"
from_orbit_normal = "Ganymede"
distance_km = 4.5e7
warp = 604800.0
# [GLL], [HZN]
caption = """\
    Over eight years, Galileo completes 34 orbits. Each moon flyby changes the \
    shape of the next orbit. With its main antenna stuck half-open, the spacecraft \
    sends its data home slowly through a small antenna."""

[[events]]
name = "Galileo at Ganymede (1996-09-06, 267 km)"
time_tdb = "1996-09-06 18:00"
focus = "Ganymede"
flyby = "Galileo"
distance_km = 30000.0
warp = 60.0
# [GLL], [SPHY] (radii)
caption = """\
    Galileo's second pass of Ganymede, the largest moon in the solar system, under 300 \
    km up. In its first passes it found that Ganymede makes its own magnetic field: the \
    first moon known to have one."""

[[events]]
name = "Galileo at Europa (1997-12-16, 204 km)"
time_tdb = "1997-12-16 11:04"
focus = "Europa"
flyby = "Galileo"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    About 200 km over Europa's cracked ice. Galileo's measurements supported the \
    presence of a salty ocean beneath the ice. The mission's end was planned to \
    protect that ocean from a possible impact by the spacecraft."""

# Cassini's closest approach: 2000-12-30 10:05:24 TDB, 9,794,455 km from Jupiter's center.
[[events]]
name = "Galileo and Cassini, two spacecraft at Jupiter (2000-12-30)"
time_tdb = "2000-12-10 00:00"
focus = "Jupiter"
from_orbit_normal = "Ganymede"
distance_km = 7.0e7
warp = 86400.0
# [CJUP], [HZN]
caption = """\
    Galileo swings in on its orbit as Cassini, bound for Saturn, sweeps past about \
    9.7 million km out, redirected by Jupiter's gravity. With one craft inside \
    Jupiter's magnetic bubble and one outside, they caught its edge shrinking \
    under a gust of solar wind. Cassini took some 26,000 images in six months."""

# Both leave the magnetosphere eight and a half hours in. Seen from the north: the Sun to
# the left, dusk toward the bottom.
[[events]]
name = "Jupiter's magnetosphere caught shrinking (2001-01-10)"
magnetosphere = [{ body = "Jupiter", pressure_npa = 0.0452, tail_radii = 250.0 },
                 { body = "Jupiter", pressure_npa = 0.0097, tail_radii = 250.0, faint = true }]
trails = [{ body = "Cassini", trail_history_days = 30.0 }, { body = "Galileo", trail_history_days = 30.0 }]
focus_orbits_only = true
time_tdb = "2001-01-10 12:00"
focus = "Jupiter"
from_body = "Sun"
phase_deg = 90.0
elevation_deg = 89.0
distance_km = 7.5e7
warp = 1800.0
# [KUR02], [JOY02], [HZN]
caption = """\
    On this day Cassini and Galileo left Jupiter's magnetic bubble 17 minutes apart, though \
    over 100 Jupiter radii from each other. No steady edge fits both. The faint surface is \
    the large bubble that reaches Cassini, the bright one a smaller bubble through Galileo: \
    a gust of solar wind was pressing it in, sweeping from Galileo to Cassini in about five \
    hours. The orange surface is the bow shock. Average shapes from a model."""

[[events]]
name = "Galileo at Callisto (2001-05-25, 129 km)"
time_tdb = "2001-05-25 10:25"
focus = "Callisto"
flyby = "Galileo"
distance_km = 30000.0
warp = 60.0
# [GLL]
caption = """\
    Callisto's dark, crater-covered face, about 130 km below. Galileo found signs \
    of a layer of salty liquid water deep beneath this ancient surface, as it did \
    at Europa and Ganymede."""

[[events]]
name = "Galileo at Io (2002-01-17, 100 km)"
time_tdb = "2002-01-17 13:09"
focus = "Io"
flyby = "Galileo"
distance_km = 30000.0
warp = 60.0
# [GLL], [PLM]
caption = """\
    Galileo's closest pass of Io, about 100 km above the most volcanic world known, with \
    perhaps a hundred times the volcanic activity of the Earth. The two plumes drawn \
    here, Pele and Tvashtar, rise about 300 km."""

[[events]]
name = "Galileo enters Jupiter (2003-09-21)"
time_tdb = "2003-09-21 17:58"
focus = "Jupiter"
distance_km = 4.0e5
warp = 60.0
# [GLL]
caption = """\
    With Galileo almost out of propellant, mission controllers steer it into \
    Jupiter's atmosphere, where it burns up. The planned impact protects Europa's \
    ocean from contamination by life from the Earth if the spacecraft were to \
    crash there later."""

[[events]]
name = "Juno arrives: orbit insertion (2016-07-05)"
time_tdb = "2016-07-04 20:48"
focus = "Jupiter"
flyby = "Juno"
distance_km = 6.0e5
warp = 600.0
# [JUNO]
caption = """\
    Juno fires its engine for its capture into a long polar orbit. "Engine burn complete \
    and orbit obtained," mission control announced, on the 4th of July in the US. Juno \
    runs on sunlight, the first spacecraft to do so this far from the Sun."""
# The burn [JOI]: from 8:18 p.m. PDT Earth-received (03:18 UTC), 48.3 minutes after it
# happened ([HZN]: 869 million km), 35 minutes. Near Jupiter the oblateness pulls as hard
# as the engine (0.3-0.45 vs 0.26 m/s^2): the ghost and the delta-v coast in [IESS]'s
# J2 and J4. The table reads 543 m/s (542).
[events.ghost]
body = "Juno"
name = "Juno without the burn"
time_tdb = "2016-07-05 02:30:49"
burn_s = 2100.0
days = 1.0

[[events]]
name = "Juno's tour, 2016-2028"
time_tdb = "2016-07-05 00:00"
focus = "Jupiter"
distance_km = 2.5e7
warp = 604800.0
# [JUNO], [HZN]
caption = """\
    Juno follows polar orbits, while the moons orbit closer to the equatorial \
    plane. It passes within about 3,500 km of the cloud tops, between Jupiter and \
    its strongest radiation belts. Over the years the low point drifts north. Juno \
    found that the cloud bands reach some 3,000 km deep, and eight cyclones \
    circling one at the north pole."""

[[events]]
name = "Jupiter's Great Blue Spot (false color)"
magnetic_map = "surface"
hide_orbits = true                         # the moons' would run across the equator's spot
time_tdb = "2018-09-05 00:28"
focus = "Jupiter"
from_body = "Sun"
distance_km = 3.0e5
warp = 300.0
# [GBS]
caption = """\
    Juno mapped a field no spacecraft had seen: invisible, here in false color at the cloud \
    tops, red leaving the planet and blue entering it. Near the equator, where a simple \
    magnet would have almost nothing, one patch of about 13 gauss goes in, some 25 times \
    Earth's surface field. It is called the Great Blue Spot, and it is drifting slowly east."""

[[events]]
name = "Jupiter's field, deep down (false color)"
magnetic_map = "deep"
hide_orbits = true
time_tdb = "2018-09-05 10:22"
focus = "Jupiter"
from_body = "Sun"
distance_km = 3.0e5
warp = 300.0
# [GBS]
caption = """\
    The same field traced down to 81% of Jupiter's radius, near the top of the dynamo, and \
    drawn on the planet's face. The northern half breaks up into bands and patches while \
    the south stays simple, a split no one expected. The Great Blue Spot tightens to about \
    80 gauss. This is a model continued downward: no spacecraft has been there."""

[[events]]
name = "Juno at Ganymede (2021-06-07, 1,035 km)"
time_tdb = "2021-06-07 15:57"
focus = "Ganymede"
flyby = "Juno"
distance_km = 30000.0
warp = 60.0
# [JUNO]
caption = """\
    About 1,000 km above Ganymede, the closest any spacecraft had come in over twenty \
    years. Its extended mission takes Juno past the large moons, one by one: Ganymede \
    first, then Europa and Io."""

[[events]]
name = "Juno at Europa (2022-09-29, 347 km)"
time_tdb = "2022-09-29 08:38"
focus = "Europa"
flyby = "Juno"
distance_km = 30000.0
warp = 60.0
# [JUNE]
caption = """\
    About 350 km above Europa, the closest look since Galileo in January 2000. Juno's \
    images were the first sharp views in twenty years, and its microwave radiometer \
    probed how the ice shell varies beneath the surface."""

[[events]]
name = "Juno at Io (2023-12-30, 1,500 km)"
time_tdb = "2023-12-30 07:37"
focus = "Io"
flyby = "Juno"
distance_km = 30000.0
warp = 60.0
# [JUNI]
caption = """\
    About 1,500 km above Io, the closest in over twenty years. Juno caught Loki \
    Patera, a lava lake 200 km long dotted with islands, with a surface so smooth \
    that it reflected the Sun like glass."""

# [HEAD] Head et al. 2024, A&A 688 A205, Juno-UVS PJ1-54 statistical
# reference ovals (geomag/SOURCES.md). Dates set the lighting and rotation;
# these views illustrate the average morphology across the observing period.
# Footprints: JRM33 + CON2020 with Hue et al. 2023 empirical lead angles;
# sources, analytic approximation and display assumptions: geomag/SOURCES.md.
[[events]]
name = "Jupiter's northern aurora (UV overlay)"
time_tdb = "2023-01-22 12:00"
focus = "Jupiter"
frame = "Jupiter equator"
from_body = "Sun"
elevation_deg = 65.0
distance_km = 230000.0
warp = 120.0
aurora_ultraviolet = true
caption = """\
    Jupiter's northern aurora, shown in ultraviolet false color over the \
    visible-light clouds. The irregular oval follows the average measured \
    by Juno-UVS over its first 54 close passes. Moving spots mark the modeled \
    footprints of Io, Europa and Ganymede, each with a fainter companion made by \
    electrons beamed across from the other hemisphere; Io's has a third. Their \
    positions follow the moons and magnetic field; brightness and sizes are \
    illustrative."""

[[events]]
name = "Jupiter's southern aurora (UV overlay)"
time_tdb = "2023-01-22 17:00"
focus = "Jupiter"
frame = "Jupiter equator"
from_body = "Sun"
elevation_deg = -65.0
distance_km = 230000.0
warp = 120.0
aurora_ultraviolet = true
caption = """\
    The southern ultraviolet oval has its own shape and position. Both \
    outlines come from Juno-UVS observations, including the night side. \
    Io, Europa and Ganymede also leave moving spots here, with a different \
    magnetic mapping from the north. Blue represents ultraviolet emission; \
    this view models the geometry, not the aurora observed on this date."""

# [LEAD] Hue et al. 2023, doi:10.1029/2023JA031363, tables 1 and 2: lead angles 1.8-7.2,
#        2.2-10.4 and 5.3-20.0 deg, and travel times 3.9-15.4, 4.1-19.5 and 9.3-35.1 minutes,
#        for Io, Europa and Ganymede. geomag/SOURCES.md.
[[events]]
name = "The moons' lines to Jupiter (UV overlay)"
flux_tubes = true
focus_orbits_only = true
aurora_ultraviolet = true
time_tdb = "2023-01-23 03:00"
focus = "Jupiter"
frame = "Jupiter equator"
from_body = "Sun"
phase_deg = 50.0
elevation_deg = 18.0
distance_km = 3.2e6
warp = 120.0
# [LEAD]
caption = """\
    Each of these moons sits in Jupiter's magnetic field, drawn pale through each one, \
    stretched by the sheet of plasma around the planet. As the field sweeps past, a moon \
    disturbs it, and the disturbance runs down to Jupiter's aurora at each end. That takes \
    minutes, while the field keeps turning past the moon, so the waves, in orange, are \
    carried ahead of the line that runs through it."""

[[events]]
name = "Where the moons' waves land (UV overlay)"
flux_tubes = true
hide_orbits = true
aurora_ultraviolet = true
time_tdb = "2023-01-22 09:00"
focus = "Jupiter"
frame = "Jupiter equator"
from_body = "Sun"
elevation_deg = 62.0
distance_km = 2.3e5
warp = 60.0
# [LEAD]
caption = """\
    The pale lines land where each moon's field line ends at this moment. The auroral spots \
    sit ahead of them, where the orange waves arrive: 2 to 7 degrees of longitude ahead for \
    Io, up to 20 for Ganymede. The gap depends on how much dense plasma the wave has to \
    cross, so it opens and closes as Jupiter turns the plasma sheet past the moon."""

[[frames]]
name = "Ganymede equator"
type = "inertial"
origin = "Ganymede"
up = "Ganymede"

# [MARZOK] Marzok et al. 2022, doi:10.1029/2022JE007256, Figs. 5 and 6: the 1998-2017 HST
# maps with Ganymede above, inside and below Jupiter's current sheet (6 deg of magnetic
# latitude). At 02:00 it is above; at 12 minutes per second it is inside by 05:00, below by
# 07:00. Only the leading event runs this fast, to show the change.
[[events]]
name = "Ganymede's leading aurora (UV overlay)"
time_tdb = "2021-06-11 02:00"
focus = "Ganymede"
frame = "Ganymede equator"
from_body = "Jupiter"
phase_deg = -90.0
elevation_deg = 10.0
distance_km = 11000.0
warp = 720.0
aurora_ultraviolet = true
caption = """\
    Ganymede has aurora of its own. On its leading hemisphere, two broad \
    crescents reach low latitudes. Jupiter's tilted field carries its current \
    sheet past the moon every five hours: inside it, Hubble saw these crescents \
    brighten by about a fifth and move toward the equator. Blue shows oxygen \
    emission at 135.6 nm; color and exposure are illustrative."""

[[events]]
name = "Ganymede's trailing aurora (UV overlay)"
time_tdb = "2021-06-07 12:00"
focus = "Ganymede"
frame = "Ganymede equator"
from_body = "Jupiter"
phase_deg = 90.0
elevation_deg = -10.0
distance_km = 11000.0
warp = 30.0
aurora_ultraviolet = true
caption = """\
    Jupiter's corotating plasma overtakes Ganymede on this trailing side. \
    The ultraviolet crescents lie farther from the equator here, and dim a little \
    when the moon is inside Jupiter's current sheet. Hubble's map also records fainter \
    emission toward and away from Jupiter. The emitting layer is assumed to be 70 km thick."""

[[events]]
name = "Ganymede's own magnetic field (UV overlay)"
magnetic_lines = true
flux_tubes = true
focus_orbits_only = true
aurora_ultraviolet = true
time_tdb = "2021-06-07 18:00"
focus = "Ganymede"
frame = "Ganymede equator"
from_body = "Sun"
phase_deg = 40.0
distance_km = 16000.0
warp = 30.0
# [GMAG]
caption = """\
    The only moon known to make its own field holds a small magnetosphere inside Jupiter's. \
    Near the equator its lines close on the moon; from higher latitudes they leave along \
    Jupiter's field, whose line through the moon is drawn in orange. The aurora, in false \
    color, marks the edge between the two, which Jupiter's plasma pushes off the simple \
    shape drawn here."""

[[frames]]
name = "Europa equator"
type = "inertial"
origin = "Europa"
up = "Europa"

# de Kleer et al. 2023, Table 2; the brightness then follows the plasma sheet, Milby 2026.
# Europa is on the sheet's equator at the start and 1 RJ below it when the eclipse ends.
[[events]]
name = "Europa's oxygen aurora in eclipse"
aurora_visible = true
time_tdb = "2021-05-20 13:40"
focus = "Europa"
frame = "Europa equator"
from_body = "Jupiter"
phase_deg = 12.0
elevation_deg = 0.0
distance_km = 6500.0
warp = 120.0
caption = """\
    In Jupiter's shadow, Europa's thin oxygen atmosphere glows mostly red. Jupiter's tilted \
    field carries the plasma past: the glow fades by about a quarter as the moon leaves the \
    middle of the plasma sheet. The light gathers along the field line, on the afternoon \
    side and the side facing the sheet, as Hubble mapped in the ultraviolet. Line strengths \
    are from May 20, 2021, in enhanced exposure; the real aurora is patchier."""

[[frames]]
name = "Io equator"
type = "inertial"
origin = "Io"
up = "Io"

# Milby et al. 2025; Schmidt et al. 2023; de Pater et al. 2020. The scene's ingress is at
# 12:47:37: the whole shell is in the shadow from about 12:57 on, at 1 min/s the sodium is
# nearly gone by the end of the caption. geomag/SOURCES.md.
[[events]]
name = "Io's visible aurora in eclipse"
aurora_visible = true
time_tdb = "2023-08-09 12:57"
focus = "Io"
frame = "Io equator"
from_body = "Jupiter"
phase_deg = 0.0
elevation_deg = 0.0
distance_km = 7600.0
warp = 60.0
caption = """\
    Io has just entered Jupiter's shadow. Its yellow sodium glow fades within half an hour: \
    sunlight was feeding it, and sunlight has stopped. The red oxygen does not respond, \
    and the blue of sulfur dioxide weakens as the gas freezes out. Line strengths are \
    measured, from August 2023 and Cassini; the layer heights and smooth patches are assumed."""

[[frames]]
name = "Callisto equator"
type = "inertial"
origin = "Callisto"
up = "Callisto"

# Milby 2026 (Caltech thesis), Table 5.2 and Figure 5.5. At 14:00 Callisto is 2.5 RJ from
# the sheet's equator; at 2 min/s it reaches it about when the caption ends.
[[events]]
name = "Callisto's visible aurora in eclipse"
aurora_visible = true
time_tdb = "2021-07-04 14:00"
focus = "Callisto"
frame = "Callisto equator"
from_body = "Jupiter"
phase_deg = 0.0
elevation_deg = 0.0
distance_km = 10000.0
warp = 120.0
caption = """\
    Callisto's faint oxygen aurora brightens as Jupiter's plasma sheet comes over it: the \
    electrons are densest in the middle of the sheet, and Keck measured the red line rising \
    with them. Only the red doublet is used; the other lines are upper limits. The smooth \
    shell stands for an atmosphere nobody has resolved, in far more exposure than Io or Europa."""


# Comet Shoemaker-Levy 9 [SL9]. Times from the tables. Each flash, plume and scar: bodies/jupiter.toml.

[[events]]
name = "A comet comes apart at Jupiter (1992-07-07)"
time_tdb = "1992-07-07 17:30"
focus = "Jupiter"
flyby = "SL9 parent comet"
distance_km = 900000.0
warp = 600.0
# [CY96] [SEK]
caption = """\
    An unseen comet, on a two-year orbit of Jupiter, passes 94,000 km from the planet's center, \
    22,000 km above the clouds and inside the distance where tides can pull it apart. About 2.5 \
    hours after closest approach the pieces stop touching each other. The comet is now a line of \
    about a dozen bodies on nearly the same orbit, and some of them will go on splitting for months."""

[[events]]
name = "Discovered: a squashed comet (1993-03-24)"
time_tdb = "1993-03-24 08:32"
focus = "SL9 K"
from_orbit_normal = "SL9 K"
distance_km = 450000.0
warp = 86400.0
# [IAUC] [CY96]
caption = """\
    Eight months later, Carolyn and Eugene Shoemaker and David Levy find it on a film from Palomar: \
    a narrow bar, 47 arcseconds long. It is about 150,000 km long by now, and orbiting Jupiter, not \
    the Sun. Two months later the orbits say that it will probably hit the planet next July."""

[[events]]
name = "SL9's last orbit of Jupiter, 1992-1994"
time_tdb = "1992-07-08 12:00"
focus = "Jupiter"
from_orbit_normal = "SL9 K"
distance_km = 180000000.0
warp = 1728000.0
# [CY96]
caption = """\
    Its last orbit reaches 0.33 au from Jupiter, about 50 million km, and comes straight back. Jupiter \
    probably captured it around 1929, and it stayed for decades, on orbits too chaotic to trace in \
    detail. The train keeps pointing at Jupiter all the way round: the fragment that lags going \
    out reaches the top first and comes back first, like pebbles thrown upward."""

[[events]]
name = "The string of pearls (1994-05-17)"
time_tdb = "1994-05-17 00:00"
focus = "SL9 K"
observer = "SL9 K"
observer_offset_km = [1768085.7, 1199858.2, 523653.9]
aim_offset_km = [0.0, 0.0, 0.0]
warp = 21600.0
# [WEA] [SEK] From the Earth's direction on that day.
caption = """\
    Hubble's image of this day is the only one from 1994 of the whole train: 360 arcseconds, 1.15 million \
    km in projection. Each fragment sits in its own round cloud of dust, with a tail of pebbles and dust released in 1992. Their sizes are at most about \
    4 km across. Some keep breaking: Q had split in two in April 1993, and P2 \
    was double by March."""

[[events]]
name = "Six days of impacts (1994-07-16 to 22)"
time_tdb = "1994-07-16 18:30"
focus = "Jupiter"
from_orbit_normal = "SL9 K"
distance_km = 9000000.0
warp = 10800.0
# [CY96] [SEK]
caption = """\
    The train, 3.6 million km long, comes down one piece at a time at about 60 km/s, from the first \
    at 20:11 UT on July 16 to the last at 08:06 on July 22, as seen from the Earth. All 21 fall near \
    44 degrees south, just out of sight from the Earth. Jupiter turns under them, so they land \
    at different longitudes. Each flash here lasts far longer than the real one."""

[[events]]
name = "Fragment G, just out of sight (1994-07-18)"
hide_orbits = true
time_tdb = "1994-07-18 06:51:40"
focus = "Jupiter"
observer = "Jupiter"
observer_offset_km = [836868.9, 515947.5, 148738.5]
aim_offset_km = [20045.7, -18963.0, -67353.1]
fov_deg = 2.4
warp = 30.0
# [CY96] Table 5, Table 1; [HAM95] [HD01]. As seen from the Earth (tools/sl9/impact_views.py).
caption = """\
    From the Earth, G comes down 6.4 degrees behind Jupiter's limb. Its plume climbs over the edge within \
    a minute or so, then out of Jupiter's shadow into sunlight, 3,000 km up after about 8 minutes. Telescopes \
    around the world and Hubble watched it rise and collapse within 20 minutes, the same height for large \
    and small impacts, which surprised the modelers. The material was dark, reflecting under a tenth of the sunlight."""

[[events]]
name = "Fragment G, as Galileo saw it (1994-07-18)"
hide_orbits = true
time_tdb = "1994-07-18 06:52:20"
focus = "Jupiter"
observer = "Jupiter"
observer_offset_km = [1012442.9, -73349.6, -175395.7]
aim_offset_km = [19792.5, -18791.8, -67258.8]
fov_deg = 2.4
warp = 4.0
# [MAR95] Martin et al. 1995, Science 268, 1875 (PPR); [CHA95] Chapman et al. 1995, GRL 22, 1561 (SSI); [CAR95] Carlson et
# al. 1995, GRL 22, 1557 (NIMS). G's 5% is Martin's L, 6%, by their fluxes. In Galileo's direction, not its distance.
caption = """\
    Only the Galileo spacecraft, 1.6 au away, could see the impacts themselves, on Jupiter's night side. The light \
    rose within 2 seconds, hotter than 7,600 K, reached 5% of all of Jupiter's in the near infrared, and was gone in \
    under a minute, cooling as it spread. Galileo's camera saw nothing of the plume that followed, too dark and small. \
    This is its direction, enlarged, at four times the speed."""

[[events]]
name = "A bull's-eye on Jupiter (1994-07-18)"
hide_orbits = true
time_tdb = "1994-07-18 08:20"
focus = "Jupiter"
observer = "Jupiter"
observer_body_fixed = true
observer_offset_km = [649563.1, -318045.4, -787270.2]
aim_offset_km = [39518.3, -19349.3, -53315.2]
fov_deg = 3.4
warp = 90.0
# [HAM95] [HAM96]; rings 454 m/s, inner about 189 m/s; crescent's outer edge 13,000 km.
caption = """\
    Two hours later the site has turned into the Sun. Plume material fell back over 180 degrees, thrown 13,000 km \
    to the southeast into a thin dark crescent, with a streak at its center. Waves spread at 454 m/s through a \
    ring that Hubble could follow for a few hours, with a slower one inside it."""

[[events]]
name = "Dark sites on Jupiter (1994-07-23)"
time_tdb = "1994-07-23 05:04"
focus = "Jupiter"
from_body = "Sun"
elevation_deg = -30.0
distance_km = 320000.0
warp = 1800.0
# [HAM95] [BEE96]; half as bright: West 1996 Fig. 3, by tools/sl9/debris_optics.py
caption = """\
    After the last impact a string of dark sites runs round the southern hemisphere, like nothing seen \
    on Jupiter before, and darkest toward the limb: the debris lies high above the clouds, so that sunlight \
    crosses it twice. The largest, G, K and L, were about as wide as the Earth, and half as bright as the clouds around."""

[[events]]
name = "The debris spreads into a band (1994-08 to 1995)"
time_tdb = "1994-08-20"
focus = "Jupiter"
from_body = "Sun"
elevation_deg = -24.0
distance_km = 380000.0
warp = 432000.0
# [SL98] [BEE96]
caption = """\
    Jupiter's winds shear the sites out along their latitude, and by the end of August they have become one \
    band of dark haze. It stays visible until the end of the year, and tiny particles still linger over two \
    years later. Particles spread as far north as 20 degrees south within a year."""

[[events]]
