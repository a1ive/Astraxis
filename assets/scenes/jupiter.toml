#   [sky]
#   milky_way = "textures/milky_way.jpg"   # "" for none
#   milky_way_brightness = 0.25
# A nearby system sets viewer_ra_dec_distance_pc = [ra, dec, pc] (where it is, seen
# from the Sun, within the catalog's 30 pc) to see the catalog stars from there
# (alpha_centauri.toml); hide_hip = [Hipparcos numbers] leaves out catalog stars that
# are the scene's own but sit too far from the viewer to be left out by themselves
# (algol.toml: a different parallax). A farther one also sets milky_way and stars to the model sky
