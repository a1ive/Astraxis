# Jupiter, its rings, the Galilean and the four inner satellites, and the orbits
# of Galileo (1995-2003) and Juno (2016-).
#
# Sources
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        ephemeris JUP365, Laplace-plane frame, epoch 2000-01-01.5 TDB.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of Jupiter alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table. Thebe, Adrastea and Metis are given no mass: their JUP365 GMs are
#        uncertain by 40-140% (and all imply a density of 0.90 g/cm^3).
# [PCK]  NAIF pck00011.tpc (IAU WGCCRE 2015 report): pole, prime meridian, radii.
#        Linear T terms and nutation/precession terms are ignored (< 0.01 deg over centuries
#        for the Galilean moons; < 1 deg for the inner moons).
# [HZN]  JPL Horizons state vectors relative to Jupiter's center, baked by
#        tools/bake/horizons_bake.py (tools/bake/ephem.toml, Kepler-relative AXEPH2 tables):
#        Galileo 1995-11-01 .. 2003-09-21 (navigation fits to 2002-08-12, then the
#        baseline prediction), Juno 2016-06-01 .. 2028-09-01 (reconstructed to 2026-08-24,
#        then predictions), and the Galilean moons over both spans. Outside them the moons
#        fade over one day into the mean-element model [ELEM], which drifts by degrees.
# [PLM]  Plumes (always erupting): sources and choices in solar_system.toml.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [STKS] P. Stooke, Stooke Small Body Shape Models V2.0 (PDS SBN, small_bodies.stooke.shape-models;
#        EAR-A-5-DDR-STOOKE-SHAPE-MODELS-V2.0): Amalthea (Voyager; Stooke 1994, EMP 64, 87) and
#        Thebe (Galileo, preliminary), 5 deg grids; equal-volume radii 81.7 / 45.5 km vs
#        83.5 +- 3 / 49.3 +- 4 km in [SPHY]. See assets/shapes/SOURCES.md.
# [STKM] P. Stooke, Stooke Small Bodies Maps V3.0 (PDS SBN, small_bodies.stooke.maps;
#        MULTI-SA-MULTI-6-STOOKEMAPS-V3.0): Amalthea airbrushed shaded relief from Voyager
#        images, simple cylindrical, 0 deg at the center.
# [PDSR] PDS Ring-Moon Systems Node, "Vital Statistics for Jupiter's Rings and Inner
#        Satellites" (https://pds-rings.seti.org/jupiter/jupiter_tables.html), from Murray &
#        Dermott 1999 (Solar System Dynamics) and Burns et al. 1999 (Science 284, 1146).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Tables 2a/2b
#        (https://ssd.jpl.nasa.gov/planets/approx_pos.html), 3000 BC - 3000 AD.
#
# [CAP]  Event captions (retrieved 2026-10-07):
#        [GLL] NASA, science.nasa.gov/mission/galileo/: arrival on 1995-12-07 with flybys of
#          Europa and Io; the probe entered the atmosphere that day at 170,000 km/h and sent
#          data for 58 minutes; "the first spacecraft to orbit an outer planet", 34 orbits;
#          the high-gain antenna "failed to deploy fully" (1991); Ganymede "the first
#          satellite known to possess a magnetic field"; evidence for oceans under Europa's
#          ice and liquid-saltwater layers in Europa, Ganymede and Callisto; Io's volcanism
#          perhaps 100 times Earth's; out of propellant, steered into Jupiter on 2003-09-21 to
#          rule out an impact on Europa.
#        [JUNO] NASA, science.nasa.gov/mission/juno/: orbit insertion on 2016-07-04 (US
#          time), "Engine burn complete and orbit obtained"; solar powered, "the first ...
#          to operate at such a great distance from the Sun"; polar orbits of 53 days dipping
#          to within 2,200 miles of the cloud tops between the radiation belts and the planet;
#          eight cyclones around one at the north pole; Ganymede on 2021-06-07, the closest in
#          over 20 years.
#        [JUNE] NASA/JPL, "NASA's Juno Shares First Image From Flyby of Jupiter's Moon
#          Europa": 2022-09-29, 352 km, the closest since Galileo on 2000-01-03; data on the
#          ice shell.
#        [JUNI] NASA/JPL, "NASA's Juno Mission Uncovers Heart of Jovian Moon's Volcanic Rage"
#          and "NASA's Juno to Get Close Look at Jupiter's Volcanic Moon Io on Dec. 30": about
#          1,500 km, the closest to Io in over 20 years; Loki Patera, a 200 km lava lake with
#          islands, so smooth it mirrored the Sun.
#        Orbits as drawn: [HZN].
# Precession signs: [ELEM] lists apsidal/nodal periods as magnitudes. Nodes regress.
# Io's and Europa's apsides are locked to the Laplace resonance and regress; Ganymede's
# and Callisto's advance. With these signs, d(node + arg_peri + M)/dt reproduces the
# synchronous rotation rates of [PCK] (203.4889538, 101.3747235, 50.3176081,
# 21.5710715 deg/day) to within 0.001 deg/day (checked in tests/planet_scene_tests.cpp).
#
# Colors are sRGB and artistic (used when a texture is missing).
# Textures: see assets/textures/SOURCES.md. texture_left_lon_deg is the longitude of the
# map's left edge, increasing eastward across the map (texture_lon_direction = "east").
# The USGS maps are labeled "positive west" but are laid out with east to the right;
# the left edges were verified against Valhalla (Callisto), Pele and Loki (Io), and
# Galileo Regio (Ganymede).

name = "Jupiter"

# Background sky, optional. Without [sky]: the catalog stars (assets/stars/hyg.csv)
# and the Milky Way map as seen from Earth, i.e. these defaults:
#   [sky]
#   milky_way = "textures/milky_way.jpg"   # "" for none
#   milky_way_brightness = 0.25
# A nearby system sets viewer_ra_dec_distance_pc = [ra, dec, pc] (where it is, seen
# from the Sun, within the catalog's 15 pc) to see the catalog stars from there
# (alpha_centauri.toml); [sky.cluster] replaces them with a cluster (psr_b1620.toml).

