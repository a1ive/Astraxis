# TIC 168789840 (TYC 7037-89-1): six stars in three eclipsing binaries, the
# first known "sextuply eclipsing" sextuple. Binaries A (1.57 d) and C (1.31 d)
# orbit each other every ~3.7 years (an inner quadruple, ~4 au across), and
# binary B (8.22 d) orbits that quadruple ~250 au away. The three binaries are
# near "triplets": an F star with a K/M dwarf companion in each.
#
# Nested two-body (Keplerian) orbits around barycenters; the interactions
# between the pairs are ignored (the hierarchy is wide: 1.6 d inside 3.7 yr
# inside ~1600 yr).
#
# [PO21] Powell et al. 2021, AJ 161, 162 (arXiv:2101.03433):
#        Table 2, "Global Fitted Periods" (linear fit to four eclipse epochs)
#        1.570013, 8.217111, 1.305883 d and the TESS times of primary eclipse
#        (BJD - 2450000) 8412.3855, 8411.9008, 8413.6822;
#        Table 5, Lightcurvefactory column: inclinations 89.6, 88.5, 75.9 deg;
#        circular orbits (Sect. 6.1);
#        Table 7: masses, radii, T_eff and luminosities of the six stars, distance
#        584 +- 70 pc (its binary semimajor axes 6.9, 21.4, 6.1 R_sun agree with
#        Kepler's third law: 6.93, 21.45, 6.14);
#        Table 8: the AC orbit from eclipse timing, P = 3.7 +- 0.6 yr, e = 0.28,
#        omega = 166.0 deg (taken as A's, so C's is 346 deg), time of periastron
#        BJD 2457662, i ~ 42 deg ("inferred from the mass function and the
#        measured masses", Sect. 6.3, and matching the systemic RVs of A and C).
#        Its a sin i (0.516 + 0.510 au) would instead give i ~ 16 deg for
#        a = 3.68 au (Kepler's third law); 42 deg is used, as the paper adopts it.
#        Table 4: B relative to AC at JY 2020.8236 (SOAR speckle), position
#        angle 257.74 deg, separation 0.4230".
# [SIMB] SIMBAD (UCAC4): ICRS position at J2000, RA 04 14 04.839192,
#        Dec -31 55 22.43820 = 63.5201633, -31.9228995 deg.
#
# Assumed (not measured): the nodes of all orbits (0, except B's); B's orbit
# around AC is a circle of radius 0.4230" x 584 pc = 247 au (P = 1642 yr), on
# which B is at its ascending node at the speckle epoch (so the measured
# position angle is the node), inclined 60 deg. [PO21] estimate ~2000 yr.
# Primary eclipse: the cooler secondary in front of its primary.
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440).
# Check (tests/sim_tests.cpp): the binaries eclipse on the [PO21] ephemerides
# and B stands at the speckle position.
# The background sky is the one seen from Earth (BSC5); from 584 pc it would differ.

name = "TIC 168789840"

[view]
focus = "TIC 168789840 AC"
distance_km = 2.5e9
start = "now"
warp = 1209600.0               # 2 weeks per second: the quadruple turns in 97 s
up = "orbit_normal:TIC 168789840 C"

[[bodies]]
name = "TIC 168789840"
kind = "barycenter"

# The inner quadruple and the outer binary, around the system barycenter:
# B relative to AC, split by the masses.
[[bodies]]
name = "TIC 168789840 AC"
parent = "TIC 168789840"
kind = "barycenter"
orbit_color = "#7088a8"
[bodies.orbit]
scale = -0.350626118           # -M_B / M_total
type = "visual_orbit"
gm_km3_s2 = 7.418625398e11     # 5.59 M_sun
a_mas = 423.0
distance_pc = 584.0
e = 0.0
i_deg = 60.0                   # assumed
node_deg = 257.74              # the position angle measured at the speckle epoch
arg_peri_deg = 0.0
t_peri_year = 2020.8236
sky_ra_dec_deg = [63.5201633, -31.9228995]

