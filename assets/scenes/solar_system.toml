prime_meridian_deg = [302.695, 56.3625225]
color = "#d8b48c"
orbit_color = "#c8aa88"                    # its small loop around the barycenter
texture = "textures/pluto.jpg"
texture_left_lon_deg = 0.0
[bodies.atmosphere]                        # [ATM]
height_km = 250.0
haze_depth = 0.013
haze_angstrom = 2.0
haze_scale_height_km = 50.0
haze_albedo = 0.9
haze_g = 0.5
[bodies.orbit]                             # [HZN] 901 (Charon relative to Pluto), scaled by -q
