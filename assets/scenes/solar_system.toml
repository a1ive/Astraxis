# The Solar System: the Sun, the planets, the major moons, the dwarf planets and the
# largest asteroids (radius > 400 km, plus Phobos, Deimos, Vesta, Pallas, Enceladus,
# Mimas and Miranda, and Arrokoth), and the Pioneer, Voyager and New Horizons probes,
# 1972 onward.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        - planets: heliocentric system barycenters, 1972..2100; Voyager trajectories before
#          1981-01-01 (V1) / 1989-08-29 (V2) are patched-conic reconstructions of "rough
#          accuracy" (Horizons notes); e.g. the baked V2 Neptune closest approach is ~4,000
#          km farther than the historical value.
#        - Pioneer 10 (1972-03-03 .. 2050) and 11 (1973-04-06 .. 2050): JPL Navigation Team
#          trajectories, "suitable for general historical purposes" (Horizons notes).
#          New Horizons (2006-01-19 .. 2050): navigation reconstruction, then predictions.
#        - the geocentric Moon, Charon relative to Pluto, the Pluto system barycenter and the
#          small bodies, 1972..2100 (Kepler-relative tables). Outside that span the Pluto
#          system and the small bodies continue on the two-body orbit from the nearer end
#          (extrapolate = "kepler"): continuous there, and drifting no faster than
#          osculating elements of another epoch would.
#        - Jupiter's and Saturn's moons relative to the planet's center (copied from
#          jupiter.toml / saturn.toml; see the notes there), while the planets here are
#          system barycenters: offsets of a few hundred km.
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a (+2b), used for
#        Mercury, Venus and Mars, and outside the baked span for the others.
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        epoch 2000-01-01.5 TDB; ephemerides as noted at each moon.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of the planets alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table; the satellite ephemeris each value comes from is noted with it.
# [GMB]  NAIF gm_de440.tpc (2022-12-14, https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/
#        gm_de440.tpc): Ceres, Pallas, Vesta (SB441-N16 perturber masses); Eris, Haumea and
#        Quaoar (JPL IOM 392R-22-003, Brozovic 2022). No GM is given for Makemake,
#        Gonggong, Sedna or Arrokoth, so the info panel shows no mass for them.
# [SBDB] JPL Small-Body Database (https://ssd-api.jpl.nasa.gov/sbdb.api).
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians (T terms ignored
#        unless given).
# [ERIS] Sicardy et al. 2011, Nature 478, 493: R = 1163 +- 6 km (stellar occultation).
# [HAUM] Ortiz et al. 2017, Nature 550, 219 (arXiv:2006.03113): semi-axes 1161 x 852 x 513
#        km, ring pole RA 285.1, Dec -10.6 deg (J2000; solution 1), rotation 3.915341 h.
# [MAKE] Brown 2013, ApJL 767, L7 (arXiv:1304.1041): equatorial diameter 1434 +- 14 km.
# [GONG] Kiss et al. 2019, Icarus 334, 3 (arXiv:1903.05439): diameter 1230 +- 50 km.
# [QUAO] Margoti et al. 2026 (arXiv:2607.06450): oblate ellipsoid, a = b = 566.1 km,
#        c = 511.2 km, from 37 stellar occultations.
# [SEDN] Pal et al. 2012, A&A 541, L6 (arXiv:1204.0899): diameter 995 +- 80 km.
# [MARS] Marsset et al. 2020, Nature Astronomy 4, 569 (via [SBDB]): Pallas 568 x 532 x 448 km.
# [PALM] Pallas: MPCD shape model from the VLT/SPHERE large programme (Marsset et al. 2020;
#        Vernazza et al. 2021, A&A 654, A56), shared on Sketchfab by "marin" (@marin14) under
#        CC BY 4.0 (assets/shapes/SOURCES.md); equal-volume diameter 508.2 km vs 511 +- 4 km
#        (Vernazza et al. 2021, Table 1). It is in the body frame of the ADAM model of the
#        same work, DAMIT model 4395: lambda 42, beta -15 deg (J2000 ecliptic), P 7.81322 h,
#        phi0 = 0 at JD 2433827.77154. Converted to the IAU form here: pole RA 44.1136,
#        Dec 1.1250 deg; W0 41.608 deg at J2000 with DAMIT's IAU rate 1105.818241 deg/day
#        (DAMIT's own IAUspin file gives W0 41.7 for the pole rounded to RA 44, Dec 1).
# [VDTM] Vesta: DLR Dawn FC HAMO global DTM (93 m, radii) and mosaic (60 m), both release
#        2013-12-10, Claudia Double Prime longitudes (USGS Astrogeology); equal-volume
#        diameter 523.1 km vs 522.77 +- 0.1 km in [SBDB] (Park et al. 2025).
# [THOM] Phobos and Deimos: P. C. Thomas, shape models and Viking Orbiter image mosaics
#        (PDS SBN, Small Body Optical Shape Models, ast-sat.thomas.shape-models V1.0;
#        Thomas 1993, Icarus 105, 326); equal-volume radii 11.11 / 6.23 km vs
#        11.08 +- 0.04 / 6.2 +- 0.24 km in [SPHY].
# [ARRO] Arrokoth: shape model of Porter et al. 2024 (PDS SBN, doi:10.26007/97r3-1e19;
#        assets/shapes/SOURCES.md), 34.546 x 19.838 x 13.822 km (Table 2 of the paper);
#        pole and prime meridian from the New Horizons PCK nh_arrokoth_002.tpc, which
#        states that these values were used in that shape model.
# [BELT] JPL Small-Body Database Query API (https://ssd-api.jpl.nasa.gov/sbdb_query.api),
#        osculating elements moved to the common epoch JD 2461200.5 TDB (2026-06-09).
# [PDSR], [RSS]: Jupiter's and Saturn's rings, see jupiter.toml / saturn.toml.
# [PDSU] PDS Ring-Moon Systems Node, "Vital Statistics for Uranus's Rings and Inner
#        Satellites" (https://pds-rings.seti.org/uranus/uranus_tables.html), from French
#        et al. 1991 (in Uranus, Univ. of Arizona Press, 327-409).
# [FR24] French, Hedman, Nicholson, Longaretti & McGhee-French 2024, "The Uranus System
#        from Occultation Observations (1977-2006)" (arXiv:2401.04634), Table 5: keplerian
#        elements of the ring edges (IER, OER) and centerlines (COR), epoch TDB 1986 Jan 19
#        12:00. Longitudes from the ascending node of Uranus' equator on the J2000 equator,
#        about the pole of positive angular momentum (opposite to the IAU north pole).
# [PDSN] PDS Ring-Moon Systems Node, "Vital Statistics for Neptune's Rings and Inner
#        Satellites" (https://pds-rings.seti.org/neptune/neptune_tables.html).
# [ARCS] Adams ring arcs at 1989 Aug 18 12:00 UT (at Neptune), longitudes: Fraternite
#        247-257, Egalite 1 261-264, Egalite 2 265-266, Liberte 276-280, Courage
#        284.5-285.5 deg, as compiled in Wikipedia's "Rings of Neptune" from Porco 1991
#        (Science 253, 995) and Miner et al. 2007 (Planetary Ring Systems); the original
#        tables were not at hand. Fraternite's middle agrees with 251.88 deg (Porco et
#        al. 1995, quoted in [SOU22]); the extents with the ~10, 4, 4 and 1-2 deg of
#        arXiv:2006.10939 and the 9.6 deg of Fraternite in [NRV].
# [SOU22] Souami et al. 2022, A&A 657, A134 (arXiv:2110.12669), Sect. 3.2: the arcs'
#        mean motion, 820.11178 +- 0.00003 deg/day, from Fraternite at 251.88 deg in 1989
#        and 217.43 +- 0.30 deg on 2016 Aug 23 (light leaving Neptune 4.01 h before the
#        05:33:52 UT frame of Table 1). Longitudes in the ring plane from the J2000.0
#        ascending node of Neptune's equator.
# [NRV]  de Pater et al. 2018, "The rings of Neptune" (Planetary Ring Systems,
#        arXiv:1906.11728): Table 1, arcs 15 km wide with normal optical depth 0.1;
#        Sect. 2.1, Liberte and Courage had essentially disappeared by 2009.
# [QRNG] Pereira et al. 2023, A&A (arXiv:2304.09237), Table 2 and Sect. 5:
#        Quaoar's two rings and the Q1R pole, RA 17h19m16.8s, Dec +53 27' (ICRS).
#        Table 7: Q1R's dense part at egress (2022 Aug 9; CFHT, Gemini z', r'): radius
#        4123.69, 4123.11, 4122.85 km, width 6.1, 5.3, 5.1 km, tau 0.395, 0.417, 0.398.
# [ATM]  Atmospheres, single scattering (Rayleigh gas + Henyey-Greenstein haze; optical
#        depths vertical, at 550 nm, from the base of the shell). Colors (haze albedo),
#        phase functions and depths marked "illustrative" are chosen by eye.
#        Earth: E. Bruneton, Precomputed Atmospheric Scattering (2017 implementation,
#          atmosphere/demo/demo.cc): Rayleigh 1.24062e-6 lambda^-4 m^-1 (lambda in um),
#          scale height 8 km; aerosols with vertical extinction 5.328e-3 (Angstrom beta,
#          alpha = 0), scale height 1.2 km, single-scattering albedo 0.9, g = 0.8; top at
#          60 km. No ozone (it deepens the blue of twilight).
#        Venus: the opaque deck is the cloud top, 74 +- 1 km at low and middle latitudes
#          (Ignatiev et al. 2009, JGR 114, E00B43, Venus Express VIRTIS); upper haze above
#          it with an aerosol scale height of 3.3 +- 0.7 km (Luginin et al. 2016, Icarus
#          277, 154, SPICAV IR). Haze depth, color and g illustrative.
#        Mars: dust only (the CO2 Rayleigh depth is ~0.004). Dust scale height 11.9 km,
#          the model value adopted for Spirit (Lemmon et al. 2015, Icarus 251, 96, Sect.
#          2); vertical optical depth 0.5, between the clear aphelion season (~0.3) and
#          the dusty perihelion season (~0.9 and more) in the same record; g = 0.63
#          (Ockert-Bell et al. 1997, JGR 102, 9039, near infrared); albedo illustrative
#          (dust absorbs blue).
#        Titan: the haze model of Tomasko et al. 2008 (PSS 56, 669, Huygens DISR): above
#          80 km the aerosol density falls off with a scale height of 65 km and the
#          opacity varies as lambda^-2.34 (350-1600 nm). Below 80 km the haze is drawn
#          as an opaque deck; the depth above it, albedo and g are illustrative. The
#          shell reaches 530 km (the detached haze layer, not modelled separately).
#        Pluto: haze to above 200 km (Cheng et al. 2017, Icarus 290, 112,
#          arXiv:1702.07771), vertical optical depth ~0.013 (Gladstone et al. 2016,
#          Science 351, aad8866, as quoted by Cheng et al.), scale height 50 km (Cheng et
#          al., Sect. 5); g = 0.5 matches the ratio of the haze I/F at 167 deg and 20 deg
#          phase in their Table 4 (peak 15, at 45 km 37; Henyey-Greenstein gives 15 at
#          g = 0.44, 37 at 0.56). Albedo and the blue color (Angstrom exponent 2)
#          illustrative. N2 Rayleigh scattering is negligible.
#        Triton: thin haze as summarized by Ohno et al. 2021 (ApJ, doi:10.3847/1538-4357/
#          abee82, arXiv:2012.11932, Sect. 1 and Table 2), citing Voyager 2 results: seen
#          to ~30 km (Smith et al. 1989; the shell goes to 60 km, 5.5 scale heights); scale
#          height 11.0 +- 0.6 km (Rages & Pollack 1992); scattering optical depth ~0.003
#          (Pollack et al. 1990), 0.001-0.01 and nearly proportional to lambda^-2;
#          single-scattering albedo near unity (Hillier et al. 1990, 1991). g illustrative
#          (forward scattering, 0.17 um particles). The discrete clouds below 4 km and the
#          geyser plumes are not drawn.
# [PLM]  Plumes, always erupting (single scattering; optical depths, colors and phase
#        functions are illustrative, chosen to be visible; real plumes are faint).
#        Vent coordinates: IAU Gazetteer of Planetary Nomenclature (planetographic,
#        used as planetocentric; Io's and Enceladus' longitudes there are west-positive).
#        Io: Pele, eruptive center at 18.71 S 255.28 W; the plume was 300 km high and
#          1,200 km across (Voyager 1, Strom et al. 1979, Nature 280, 733). Tvashtar at
#          62.76 N 123.53 W (the former Tvashtar Catena); 330 km high in New Horizons'
#          2007 images (NASA PIA10101); canopy radius 2 H (the ballistic reach).
#        Enceladus: jets along the four tiger stripes. Stripe centers and lengths from
#          the Gazetteer (Alexandria 75.63 S 137.56 W, 111 km; Cairo 81.62 S 154.48 W,
#          165 km; Baghdad 86.91 S 230.54 W, 176 km; Damascus 80.59 S 285.87 W, 125 km);
#          the centers lie on a line (spacing 30-36 km) and the stripes are drawn
#          perpendicular to it, which matches the stripes in the Cassini mosaic. Porco
#          et al. 2014 (AJ 148, 45) located ~100 jets on the stripes; here 8 per stripe,
#          vertical, half-width 8 deg, density scale height 100 km (illustrative; the
#          plume's ice grains were measured from 50 to 300 km, Hedman et al. 2009, ApJ
#          693, 1749).
#        Triton: Hili (57 S 35 E) and Mahilani (50.5 S 359.5 E), dark columns rising to
#          ~8 km with radii of tens of meters to a kilometer, whose clouds drift downwind
#          over 100 km (Soderblom et al. 1990, Science 250, 410), toward the west: winds
#          above 8 km blow west (Hansen et al. 1990, Science 250, 421). The tail's
#          e-folding length is 50 km.
# [CAP]  Event captions (retrieved 2026-10-07):
#        [P10] NASA, science.nasa.gov/mission/pioneer-10/ ("first spacecraft to fly through
#          the main asteroid belt", "first spacecraft to fly past Jupiter", about 500
#          pictures, false commands triggered by Jupiter's radiation, escape trajectory);
#          NSSDCA 1972-012A (heading toward Aldebaran).
#        [P11] NASA, science.nasa.gov/mission/pioneer-11/ (closest approach to Jupiter
#          42,500 km; "swing back across the solar system" to Saturn; first at Saturn;
#          ring plane crossed beyond the outer ring; the F ring and a new satellite;
#          Titan -193 C).
#        [VPV] NASA, "Voyager: Planetary Voyage", science.nasa.gov/mission/voyager/
#          planetary-voyage/ (Voyager 2 launched first; the alignment "occurs about every
#          175 years"; Io's volcanoes "the first time active volcanoes had been seen on
#          another body"; Voyager 1's Titan pass "bent the spacecraft's path inexorably
#          northward out of the ecliptic plane"; 4,950 km above Neptune's north pole;
#          Voyager 2 "diving below the ecliptic plane").
#        [V1] NASA, science.nasa.gov/mission/voyager/voyager-1/ (Titan's haze hid the
#          surface; because of the Titan flyby not directed to Uranus and Neptune).
#        [V2] NASA, science.nasa.gov/mission/voyager/voyager-2/ (17,000 new pictures of
#          Jupiter; first to fly past Uranus; 10 new moons and two new rings there).
#        [PIA718] NASA/JPL PIA00718: Pele's deposits changed between Voyagers 1 and 2.
#        [UFS] NASA NSSDCA Uranus Fact Sheet: obliquity 97.77 deg.
#        [NH] NASA, science.nasa.gov/mission/new-horizons/ (launch at 58,536 km/h, the
#          highest launch velocity relative to Earth; Jupiter added about 14,000 km/h and
#          shortened the trip by three years; Sputnik Planitia, a heart-shaped nitrogen
#          glacier; a possible ocean; Arrokoth "the most distant target in history").
#        [IAU06] IAU 2006 General Assembly, Resolutions B5 and B6 (Pluto a dwarf planet,
#          24 August 2006).
#        [ST13] Stone et al. 2013, Science 341, 150: on 25 August 2012, at 122 au, the
#          low-energy ions Voyager 1 had seen for 6 years dropped away; cosmic rays rose.
#        [GU13] Gurnett et al. 2013, Science 341, 1489: from 9 April 2013, plasma
#          oscillations gave an electron density of ~0.08 cm^-3 (interstellar), against
#          ~0.002 expected in the outer heliosphere; Voyager 1's plasma instrument (PLS)
#          failed in 1980.
#        [ST19] Stone et al. 2019, Nature Astronomy 3, 1013: Voyager 2 crossed the
#          heliopause on 5 November 2018 at 119 au.
#        [RI19] Richardson et al. 2019, Nature Astronomy 3, 1019: Voyager 2's plasma
#          instrument saw the crossing; it took about a day.
#        [MK20] McKinnon et al. 2020, Science 367, eaay6620: Arrokoth is a contact binary
#          from a gentle, low-speed merger in the early solar system.
#        Heights of the plumes: [PLM]; Arrokoth's size: [ARRO].
# Flyby times/distances: computed from the baked data by the bake tool (TDB).
# Mission timeline events: Horizons spacecraft notes.
#
# Colors are sRGB and illustrative where no surface map is used.

name = "Solar System"

[view]
focus = "Sun"
distance_km = 2.5e10       # ~170 au: the Kuiper belt, the scattered disk and both Voyagers
start = "now"
warp = 2629800.0           # 1 month per second
up = "ecliptic"

[[bodies]]
name = "Sun"
kind = "star"
radii_km = [695700.0]                      # [PCK]
gm_km3_s2 = 1.32712440041279419e11         # [GM]
