# --- Earth and Moon ----------------------------------------------------------------
# Both orbit their barycenter: Earth at -mu r, the Moon at (1 - mu) r, with r the
# geocentric Moon and mu = 4902.800118 / (398600.435507 + 4902.800118) [GM].

[[bodies]]
name = "Earth-Moon barycenter"
parent = "Sun"
kind = "barycenter"
gm_km3_s2 = 403503.235625                  # Earth + Moon, for the Moon's relative orbit [GM]
orbit_color = "#7fa6e0"
[bodies.orbit]                             # [HZN] Earth-Moon barycenter
type = "ephemeris"
file = "ephem/emb.eph"
[bodies.orbit.fallback]                    # [APX] Table 2a, EM Bary
type = "jpl_approx_planet"
a_au = [1.00000018, -0.00000003]
e = [0.01673163, -0.00003661]
i_deg = [-0.00054346, -0.01337178]
mean_longitude_deg = [100.46691572, 35999.37306329]
lon_peri_deg = [102.93005885, 0.31795260]
node_deg = [-5.11260389, -0.24123856]

