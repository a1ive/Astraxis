# Faint dusty rings, single scattering (see shaders/ring.frag.hlsl). Radii, normal
# optical depths and thicknesses [PDSR]. The real rings are about a millionth as
# bright as Jupiter's disk, so `gain` is artistic; their relative brightness, the
# brightening toward edge-on, the forward scattering and Jupiter's shadow are not.
# Tint and phase asymmetry are illustrative (reddish dust, forward scattering).
