# Phobos and Deimos [ELEM] (MAR099, Laplace planes). [ELEM] rounds P to 4-5 digits,
# which loses the phase within decades (Phobos makes 146,000 orbits from 1972 to
# 2100). Both rotate synchronously, so the mean longitude advances at the PCK spin
# rate W' (with Phobos' tidal acceleration, the quadratic PM term), and
# period_days (of M) = 360 / (W' - apsis rate - node rate), with apsides advancing
# and nodes regressing (Mars' oblateness). Against Horizons over 1972-2100 the
# direction is within 2.0 deg rms (Phobos) and 0.3 deg (Deimos), with [ELEM]'s phases.

