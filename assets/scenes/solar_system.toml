# Phobos and Deimos [ELEM] (MAR099, Laplace planes). [ELEM] rounds P to 4-5 digits,
# which loses the phase within decades (Phobos makes 146,000 orbits from 1972 to
# 2100). Both rotate synchronously, so the mean longitude advances at the PCK spin
# rate W' (with Phobos' tidal acceleration, the quadratic PM term), and
# period_days (of M) = 360 / (W' - apsis rate - node rate), with apsides advancing
# and nodes regressing (Mars' oblateness). Against Horizons over 1972-2100 the
# direction is within 2.0 deg rms (Phobos) and 0.3 deg (Deimos), with [ELEM]'s phases.

[[bodies]]
name = "Phobos"
parent = "Mars"
radii_km = [13.0, 11.4, 9.1]               # [PCK], long axis toward Mars
body_gm_km3_s2 = 0.0007087                 # [SPHY] (MAR097)
pole_ra_dec_deg = [317.67071657, 52.88627266]  # [PCK]
prime_meridian_deg = [35.18774440, 1128.84475928]
pole_rate_deg_per_century = [-0.10844326, -0.06134706]
color = "#7d746b"
orbit_color = "#a0968c"
texture = "textures/phobos.jpg"            # assets/textures/SOURCES.md
texture_left_lon_deg = -180.0
[bodies.orbit]                             # [ELEM]
type = "mean_elements"
a_km = 9375.0
e = 0.015
arg_peri_deg = 216.3
mean_anomaly_deg = 189.7
i_deg = 1.1
node_deg = 169.2
period_days = 0.319042230                  # from the PCK spin rate; [ELEM] P = 0.3187
mean_anomaly_accel_deg_per_day2 = 9.536137031212154e-09   # [PCK] quadratic PM term
apsis_period_years = 1.1
node_period_years = -2.3
laplace_pole_ra_dec_deg = [317.7, 52.9]

[[bodies]]
