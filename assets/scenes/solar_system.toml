# Flybys start about a day before closest approach (closest-approach times from the
# bake tool, TDB; distances from the planet's system barycenter; Pluto and Arrokoth:
# from Horizons relative to the body's center, starting 6 h / 20 min before). The
# Voyager and Pioneer distances come from the heliocentric trajectories, which Horizons
# itself does not keep consistent with the planet-centered ones near the planets (see
