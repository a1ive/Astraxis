# Triton: retrograde (i > 90 deg) around its Laplace plane [ELEM] (NEP097, pole RA 299.8,
# Dec 43.1). [ELEM]'s phases and periods drift by tens of degrees against Horizons
# (its nodal period of 340 yr is about half the 676 yr found in the Horizons states).
# So the plane's precession, the inclination and the mean argument of latitude were
# fitted to Horizons states (every 10.3 days over 1972-2100): the orbit normal's
# node and inclination give the precession and i; the mean of |r x v| / r^2 gives the
# rate of M; then its phase. The circular orbit stays within 0.05 deg rms (worst 0.15)
# of Horizons over that span.

[[bodies]]
name = "Triton"
parent = "Neptune"
radii_km = [1352.6]                        # [PCK]
body_gm_km3_s2 = 1428.49546                # [SPHY] (NEP097)
