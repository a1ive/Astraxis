# --- Belts -------------------------------------------------------------------------
# [BELT] Points on two-body heliocentric orbits from the JPL Small-Body Database
# (tools/belts/make_belts.py; assets/belts/SOURCES.md): the main belt (classes MBA,
# IMB, OMB) down to H = 15, i.e. diameters of ~2-5 km and up (~64,000 objects; the
# Kirkwood gaps and the Hildas show), and all trans-Neptunian objects (~7,300: the
# Plutinos in the 3:2 resonance with Neptune, the classical belt, the scattered
# disk). Jupiter's Trojans are not included. Brightness and color are artistic;
# brighter (larger) objects get somewhat brighter points.

[[belts]]
name = "Main belt"
file = "belts/main_belt.bin"
color = "#b4a690"
brightness = 0.25
point_size_px = 1.5

[[belts]]
name = "Kuiper belt"
file = "belts/kuiper_belt.bin"
color = "#a88c7c"
brightness = 0.6
point_size_px = 1.8

# Planet-centered views show the flyby trajectories as hyperbolas.
[[frames]]
name = "Jupiter-centered"
type = "inertial"
origin = "Jupiter"

[[frames]]
name = "Saturn-centered"
type = "inertial"
origin = "Saturn"

[[frames]]
name = "Uranus-centered"
type = "inertial"
origin = "Uranus"

[[frames]]
name = "Neptune-centered"
type = "inertial"
origin = "Neptune"

# Around the Pluto-Charon barycenter rather than Pluto itself: Pluto circles it
# (2,100 km, 6.4 days), which would put a wiggle on New Horizons' straight path.
[[frames]]
name = "Pluto-Charon barycentric"
type = "inertial"
origin = "Pluto system"

# Flybys start about a day before closest approach (closest-approach times from the
# bake tool, TDB; distances from the planet's system barycenter; Pluto and Arrokoth:
# from Horizons relative to the body's center, starting 6 h / 20 min before). The
# Voyager and Pioneer distances come from the heliocentric trajectories, which Horizons
# itself does not keep consistent with the planet-centered ones near the planets (see
# assets/ephem/SOURCES.md): e.g. Voyager 2 passed 29,241 km from Neptune's center.
[[events]]
name = "Pioneer 10 launch (1972-03-03)"
time = "1972-03-04 00:00"
focus = "Earth"
distance_km = 6.0e7
warp = 86400.0
# [P10]
caption = """\
    Pioneer 10 sets out on a path no spacecraft had taken before. It will be the first \
    to cross the main asteroid belt, the first to fly past Jupiter, and the first sent \
    on a course out of the solar system. Watch its track pull away from the Earth's \
    orbit toward the outer planets."""

[[events]]
name = "Pioneer 10 at Jupiter (CA 1973-12-04 02:26, 202,870 km)"
time_tdb = "1973-12-03 02:26"
focus = "Jupiter"
frame = "Jupiter-centered"
distance_km = 6.0e6
warp = 1200.0
# [P10]
caption = """\
    The first close look at Jupiter. Pioneer 10 took about 500 pictures as it swept \
    past, but the radiation around the planet was fiercer than expected and set off \
    false commands on board. Jupiter's gravity bent its path onto an escape trajectory: \
    it is still coasting out of the solar system, roughly toward Aldebaran in Taurus."""

[[events]]
name = "Pioneer 11 at Jupiter (CA 1974-12-03 05:22, 113,553 km)"
time_tdb = "1974-12-02 05:22"
focus = "Jupiter"
frame = "Jupiter-centered"
distance_km = 3.0e6
warp = 1200.0
# [P11]
caption = """\
    A year after its twin, Pioneer 11 skimmed about 42,500 km above Jupiter's clouds. \
    The pass was aimed so that the planet's gravity would swing it back across the solar \
    system toward Saturn, nearly five years away. Follow the bend of its path around \
    Jupiter."""

[[events]]
name = "Voyager 2 launch (1977-08-20)"
time = "1977-08-21 00:00"
focus = "Earth"
distance_km = 6.0e7
warp = 86400.0
# [VPV]
caption = """\
    Voyager 2 actually left first; Voyager 1 followed on 5 September on a faster, \
    shorter path. Both rode an arrangement of Jupiter, Saturn, Uranus and Neptune that \
    comes around about every 175 years and lets one spacecraft swing from each planet on \
    to the next. Only Voyager 2 would take the whole tour."""

[[events]]
name = "Voyager 1 at Jupiter (CA 1979-03-05 12:05, 348,066 km)"
time_tdb = "1979-03-04 12:05"
focus = "Jupiter"
frame = "Jupiter-centered"
distance_km = 4.0e6
warp = 1200.0
# [VPV], [PLM] (Pele)
caption = """\
    Voyager 1's greatest surprise was the moon Io: active volcanoes, the first ever seen \
    on another world. The plume of one of them, Pele, rose about 300 km above the \
    surface. Focus on Io to see it drawn at that height (P shows or hides the plumes)."""

[[events]]
name = "Voyager 2 at Jupiter (CA 1979-07-09 22:30, 720,883 km)"
time_tdb = "1979-07-08 22:30"
focus = "Jupiter"
frame = "Jupiter-centered"
distance_km = 6.0e6
warp = 1200.0
# [V2], [PIA718], [VPV]
caption = """\
    Four months behind its twin, Voyager 2 sent back some 17,000 new pictures of Jupiter \
    and its moons, and saw how much Io had changed in that time: the deposits around \
    Pele had already been reshaped. Jupiter's gravity then sent it on toward Saturn, \
    keeping the grand tour open."""

[[events]]
name = "Pioneer 11 at Saturn (CA 1979-09-01 16:30, 80,008 km)"
time_tdb = "1979-08-31 16:30"
focus = "Saturn"
frame = "Saturn-centered"
distance_km = 2.5e6
warp = 1200.0
# [P11]
caption = """\
    The first visit to Saturn. Pioneer 11 crossed the plane of the rings just outside \
    them, finding a narrow new ring beyond the A ring, the F ring, and a small new moon. \
    A brief burst of data on Titan put its average temperature near -193 C."""

[[events]]
name = "Voyager 1 at Saturn (CA 1980-11-12 23:46, 183,555 km)"
time_tdb = "1980-11-11 23:46"
focus = "Saturn"
frame = "Saturn-centered"
distance_km = 2.5e6
warp = 1200.0
# [VPV], [V1]
caption = """\
    Voyager 1 was aimed close past the giant moon Titan and behind Saturn's rings, and \
    that pass bent its path northward, out of the plane of the planets. Titan's thick \
    haze hid its surface completely. The price of Titan: Voyager 1 would visit no more \
    planets. Its climb away from the ecliptic starts here."""

[[events]]
name = "Voyager 2 at Saturn (CA 1981-08-26 03:24, 159,764 km)"
time_tdb = "1981-08-25 03:24"
focus = "Saturn"
frame = "Saturn-centered"
distance_km = 2.5e6
warp = 1200.0
# [V1], [VPV]
caption = """\
    With Voyager 1 spent on Titan, the rest of the grand tour fell to Voyager 2. \
    Saturn's gravity turned it toward Uranus, which it would reach in January 1986, more \
    than four years later."""

[[events]]
name = "Voyager 2 at Uranus (CA 1986-01-24 17:58, 102,180 km)"
time_tdb = "1986-01-23 17:58"
focus = "Uranus"
frame = "Uranus-centered"
distance_km = 1.5e6
warp = 1200.0
# [V2], [UFS]
caption = """\
    Still the only visit to Uranus. The planet is tipped over by about 98 degrees, so it \
    rolls around the Sun on its side. Voyager 2 found ten new moons and two new rings \
    here."""

[[events]]
name = "Voyager 2 at Neptune (CA 1989-08-25 04:03, 33,661 km)"
time_tdb = "1989-08-24 16:03"
focus = "Neptune"
frame = "Neptune-centered"
distance_km = 6.0e5
warp = 600.0
# [VPV], [PLM] (Triton)
caption = """\
    The last planet of the tour, and the closest pass of the whole mission: about 4,950 \
    km above Neptune's north pole. Voyager 2 also passed Triton, and found dark plumes \
    rising some 8 km and drifting downwind, drawn here as Hili and Mahilani. Neptune's \
    gravity then sent it diving south of the planets' plane."""

[[events]]
name = "New Horizons launch (2006-01-19)"
time = "2006-01-20 00:00"
focus = "Earth"
distance_km = 6.0e7
warp = 86400.0
# [NH], [IAU06]
caption = """\
    New Horizons left the Earth faster than any spacecraft before it, at about 58,500 \
    km/h. Pluto was still a planet on launch day; seven months later it was a dwarf \
    planet. The flyby was nine and a half years away."""

[[events]]
name = "New Horizons at Jupiter (CA 2007-02-28 05:45, 2,304,686 km)"
time_tdb = "2007-02-27 05:45"
focus = "Jupiter"
frame = "Jupiter-centered"
distance_km = 2.5e7
warp = 3600.0
# [NH], [PLM] (Tvashtar)
caption = """\
    A gravity assist on the way to Pluto: Jupiter added about 14,000 km/h to New \
    Horizons' speed and cut three years off the trip. Passing at more than 2 million km, \
    it also watched Io erupt; the plume of Tvashtar, 330 km high in its images, is drawn \
    on Io here."""

[[events]]
name = "Voyager 1 crosses the heliopause (2012-08-25)"
time = "2012-08-25"
focus = "Voyager 1"
distance_km = 5.0e9
warp = 2629800.0
# [ST13], [GU13]
caption = """\
    Nothing on the screen marks this boundary, and nothing out here could be seen. On \
    this day, 122 au from the Sun, the particles from the Sun around Voyager 1 suddenly \
    fell away and cosmic rays from the Galaxy rose. Its plasma instrument had failed in \
    1980, so proof waited until April 2013, when plasma waves showed a density forty \
    times that expected inside: Voyager 1 was in interstellar space."""

[[events]]
name = "New Horizons at Pluto (CA 2015-07-14 11:50, 13,676 km)"
time_tdb = "2015-07-14 05:50"
focus = "Pluto"
frame = "Pluto-Charon barycentric"
distance_km = 1.5e5
warp = 120.0
# [NH]
caption = """\
    After nine and a half years, the first close look at Pluto and Charon. New Horizons \
    found a vast heart-shaped glacier of nitrogen ice, named Sputnik Planitia after the \
    first artificial satellite, and signs that Pluto may still hide an ocean of liquid \
    water beneath its ice. The maps on both bodies come from this flyby."""

[[events]]
name = "Voyager 2 crosses the heliopause (2018-11-05)"
time = "2018-11-05"                # [ST19]
focus = "Voyager 2"
distance_km = 5.0e9
warp = 2629800.0
# [ST19], [RI19], [GU13]
caption = """\
    Six years after its twin, Voyager 2 crossed into interstellar space, 119 au from the \
    Sun. Unlike Voyager 1, it still had a working plasma instrument, and could watch the \
    hot, thin wind from the Sun give way to the colder, denser interstellar plasma \
    directly. The crossing took about a day."""

[[events]]
name = "New Horizons at Arrokoth (CA 2019-01-01 05:35, 3,538 km)"
time_tdb = "2019-01-01 05:14"
focus = "Arrokoth"
distance_km = 3.0e4
warp = 30.0
# [NH], [ARRO], [MK20]
caption = """\
    The most distant world ever explored up close. Arrokoth turned out to be two \
    flattened lobes, about 35 km end to end, resting against each other: two bodies that \
    came together gently early in the history of the solar system, and have barely \
    changed since."""

# The view of the CA06 image sequence (Porter et al. 2024, Table 1: 05:26:54.6 UTC, 6,622 km,
# phase angle 32.6 deg), the best resolved image of the whole body.
[[events]]
name = "Arrokoth as New Horizons saw it (2019-01-01 05:27, 6,622 km)"
time = "2019-01-01 05:26:55"
focus = "Arrokoth"
from_body = "New Horizons"
distance_km = 90.0
warp = 1.0
# [ARRO]
caption = """\
    The view of New Horizons' sharpest image of the whole body, taken 6,600 km away \
    shortly before closest approach. The shape is the model built from all the flyby \
    images; the color is uniform, as no map of the surface is used."""
