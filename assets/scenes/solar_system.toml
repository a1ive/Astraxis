# Rings [QRNG]: Q1R at 4,057 km (its tenuous part, 80-100 km wide, tau ~0.003)
# and Q2R at 2,520 km (~10 km wide, tau ~0.004), both outside the Roche limit.
# Q1R's dense part (Table 7, mean of the three: 4123.2 km, 5.5 km wide, tau 0.40)
# was only seen in 2 of 19 chords, so it is an arc whose length, from those odds,
# lies between 18 and 72 deg with 70% chance (Sect. 5): drawn 45 deg long. Where
# it lies is not known (its phase here is arbitrary); it moves at the circular
# mean motion there, sqrt(GM / r^3) with Quaoar's GM. Assumed in Quaoar's
# equatorial plane (pole above). Tint and gain illustrative.
[bodies.rings]
color = "#8a7a70"
gain = 60.0
phase_g = 0.0
epoch = "2022-08-09 06:38"                 # [QRNG] the egress detection (phase arbitrary)

[[bodies.rings.bands]]
name = "Q2R"
inner_km = 2515.00
outer_km = 2525.00
optical_depth = 0.004

[[bodies.rings.bands]]
name = "Q1R"
inner_km = 4012.00
outer_km = 4102.00
optical_depth = 0.003                      # width 80-100 km

[[bodies.rings.bands]]
name = "Q1R dense arc"
inner_km = 4120.45
outer_km = 4125.95
optical_depth = 0.40
arc_center_deg = 0.0                       # arbitrary
arc_length_deg = 45.0
arc_rate_deg_per_day = 182.8166            # sqrt(GM / r^3) at 4123.2 km, GM 95.6022 [GMB]


