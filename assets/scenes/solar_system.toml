# --- Uranus ---------------------------------------------------------------------------
# Moons [ELEM] (URA182, "equatorial": the plane of Uranus' equator, referred to its
# positive (right-hand) pole, i.e. opposite to the IAU north pole of [PCK]). [ELEM]'s
# P is the period of the mean longitude (360 / P equals the PCK spin rates), so
# period_days (of M) = 360 / (360 / P - apsis rate - node rate), with apsides advancing
# and nodes regressing (oblateness). With [ELEM]'s phases, the direction is within
# 0.1-0.3 deg rms of Horizons over 1972-2100 (Miranda: 1.8 deg).
# Surface maps (assets/textures/SOURCES.md): Voyager 2 saw only the southern
# hemispheres, in 1986; the rest is filled with a plain surface. In the 2020s the
# Sun lights the northern hemispheres, so the maps show best in the 1980s-90s.

