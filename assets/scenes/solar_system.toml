# Ring [HAUM]: radius 2,287 km, width 70 km, apparent opacity 0.5 (seen at an
# opening angle of 13.8 deg), i.e. normal optical depth -ln(1 - 0.5) sin(13.8 deg)
# = 0.17 (ignoring diffraction, see the paper). In Haumea's equatorial plane. Tint
