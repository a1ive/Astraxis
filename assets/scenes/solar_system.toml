# Rings [PDSU]: middle radius, width and normal optical depth of the ten main
# rings. Eccentricities and inclinations are left out (the epsilon ring's radius
# varies by +-400 km); where a width or optical depth is a range, its middle is
# used, and bounds ("<= 0.4", ">= 0.3") as given. The two faint dusty rings found
# by Hubble (tau ~ 1e-5) are left out: next to the main rings they would be
# invisible, and they would spread the profile over 3 times the radius. The
# particles are very dark (albedo ~0.05); the gain is artistic, the backscattering
# phase function illustrative.
