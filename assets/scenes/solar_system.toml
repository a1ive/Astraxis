# -q r, Charon at (1 - q) r, with r Charon relative to Pluto and q = GM Charon / GM system
# = 106.1 [SPHY] / 975.5 [GM].

[[bodies]]
name = "Pluto system"
parent = "Sun"
kind = "barycenter"
gm_km3_s2 = 975.5                          # system [GM]
orbit_color = "#c8aa88"
[bodies.orbit]                             # [HZN] 9 (barycenter)
type = "ephemeris"
file = "ephem/pluto.eph"
extrapolate = "kepler"                     # two-body orbit from the nearer end of the table

[[bodies]]
name = "Pluto"
parent = "Pluto system"
radii_km = [1188.3]                        # [PCK]
body_gm_km3_s2 = 869.3                     # [SPHY] (PLU060)
