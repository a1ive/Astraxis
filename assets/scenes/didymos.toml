# --- Events ----------------------------------------------------------------------------------
# Times UTC unless time_tdb.

[[events]]
name = "Launch and cruise (2021-11 .. 2022-09)"
time = "2021-11-24 08:00"
focus = "Sun"
frame = "Heliocentric"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 6.0e8
warp = 864000.0            # 10 days per second: the ten months in half a minute
# [DALY], [HZN]
caption = """\
    DART leaves on a Falcon 9 from California and spends ten months catching up with \
    Didymos, a pair of near-Earth asteroids. It keeps close to the Earth's orbit, never \
    more than 30 million km from the Earth, and meets the asteroids 11 million km from \
    home."""

# [DALY]: images of Didymos every five hours from 30 days out; SMART Nav from 19:09:24 UTC.
[[events]]
name = "The Didymos system (2022-09-26)"
time = "2022-09-26 08:00"
focus = "Didymos"
frame = "Didymos-centered"
from_orbit_normal = "Dimorphos"
distance_km = 5.0
warp = 1800.0              # an orbit of Dimorphos in 24 s
# [DALY], [S547], [ROT]
caption = """\
    Didymos, nearly 800 m across, spins once every 2 hours 16 minutes. Its moon \
    Dimorphos, about 170 m wide, circles it 1.2 km away every 11 hours 55 minutes. \
    Seen from the Earth, the pair eclipse each other, so telescopes can time the \
    moon's orbit precisely: the perfect target to test whether a spacecraft can push \
    an asteroid."""

# The last 24 seconds, from 150 km at 6.1 km/s. SMART Nav's last maneuver 23:11:52 UTC.
[[events]]
name = "DART hits Dimorphos (2022-09-26)"
time = "2022-09-26 23:14:00"
focus = "Dimorphos"
frame = "Dimorphos-centered"
from_body = "DART"
phase_deg = 100.0                          # across DART's path
distance_km = 1.2
warp = 1.0
# [DALY], [HZN]
caption = """\
    Steering itself for the last four hours, DART spots Dimorphos only 73 minutes \
    before arrival. The 580 kg spacecraft hits it at 6.1 km/s, 25 m from its center, \
    with the impact energy of about two and a half tonnes of TNT. Its camera sends \
    the last full image 1.8 seconds before impact."""

# Closest approach 23:17:11.5 UTC, 57.7 km (Horizons notes; the table: 57.6 km).
[[events]]
name = "LICIACube flies past (2022-09-26)"
time = "2022-09-26 23:15:30"
focus = "Dimorphos"
flyby = "LICIACube"
frame = "Dimorphos-centered"
distance_km = 300.0
warp = 2.0
# [HZN], [DALY]
caption = """\
    LICIACube, an Italian cubesat that rode with DART and separated 15 days earlier, \
    flies past three minutes after the impact, 58 km from Dimorphos. Its two cameras \
    capture the plume of debris blasted from the moon and look for the far side DART \
    never saw."""

# The impact 23:15:33.365 TDB; the ghost coasts on from a minute before it, around
# Didymos' point mass and J2 ([GMS]), and the readout is the jump of Dimorphos' velocity in
# the table ([S547]: 2.630 mm/s along the path, 0.33 mm/s outward). Four orbits at this
# warp take 41 s; the ghost falls behind by about 33 minutes each.
[[events]]
name = "Dimorphos with and without DART (2022-09-26 .. 28)"
time_tdb = "2022-09-26 23:10"
focus = "Didymos"
frame = "Didymos-centered"
from_orbit_normal = "Dimorphos"
distance_km = 4.5
warp = 3600.0
# [S547], [THO], [CHE], [NASA]
caption = """\
    DART slowed Dimorphos by 2.6 mm/s, and it sank into a tighter orbit: 11 hours \
    23 minutes instead of 11 hours 55, while 73 seconds would have counted as \
    success. DART's push alone would have changed it by about 7 minutes. The rest came \
    from the recoil of the debris blasted off the surface. The ghost keeps the old orbit."""
[events.ghost]
body = "Dimorphos"
name = "Dimorphos without DART"
time_tdb = "2022-09-26 23:15:33.365"
burn_s = 1.0
days = 3.0
