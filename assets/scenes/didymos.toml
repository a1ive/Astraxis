# DART and the binary asteroid Didymos, 2021-2022.
#
# NASA's Double Asteroid Redirection Test flew for ten months to the near-Earth asteroid
# Didymos (about 800 m across, turning every 2.26 hours) and on 2022-09-26 ran into its moon
# Dimorphos (170 m, 1.2 km out, once around in 11.9 hours) at 6.1 km/s, three minutes
# ahead of the Italian cubesat LICIACube, which had ridden along and flew past to watch.
# The impact shortened Dimorphos' orbit by 33 minutes; the ghost of the last event keeps
# the orbit it had before (2.6 mm/s faster along its path, the push DART and its ejecta
# gave it). ESA's Hera, at Didymos since late 2026, comes later (CLAUDE.md, to do).
#
# Not drawn: the ejecta (a cone of debris and a tail lasting months), the change of
# Dimorphos' shape (Naidu et al. find it elongated by the impact) and its libration
# (limitations.md).
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        - the Didymos system barycenter (20065803; JPL orbit solution 240), 2021-11 .. 2023-03;
#        - DART (-135), heliocentric from 2021-11-24 07:18 TDB to a day before the impact;
#        - the Earth-Moon barycenter and the geocentric Moon (as in solar_system.toml).
#        tools/dart/approach_bake.py: DART's last three days and LICIACube (-210) from its
#        release (2022-09-11) to a day after the flyby, relative to the barycenter; DART's
#        path shifted by 1.9 km to meet Dimorphos at the impact time (see the tool).
#        Horizons notes for -135 and -210: launch 2021-11-24 06:21:02 UTC on a Falcon 9 from
#        Vandenberg; impact 2022-09-26 23:14:24.183 UTC (23:15:33.365 TDB); ~11 million km
#        from Earth (the tables: 11.3 million km; at most 29 million km, in May 2022);
#        LICIACube 57.7 km from Dimorphos at 23:17:11.5 UTC.
# [S547] Naidu et al. 2024, "Orbital and Physical Characterization of Asteroid Dimorphos
#        Following the DART Impact", PSJ 5, 74 (CC BY 4.0), solution JPL 547, and its SPK
#        (Naidu & Chesley 2023, figshare doi:10.6084/m9.figshare.24256069, CC BY 4.0),
#        baked by tools/dart/s547_bake.py: Didymos around the barycenter and Dimorphos
#        around Didymos. Table 1 and the SPK comments: Didymos J2 0.0899 at its
#        equatorial radius 0.394 km; the impulse dV_T = -2.630 mm/s, dV_R = +0.33 mm/s;
#        before the impact a circle of 1.18921 km in 11.921493 h (n0 = 1.46401902e-4
#        rad/s); after it 11.377 h, settling at 11.3674 h (-33.25 min in all); e 0.0274.
# [GMS]  The system's GM: n0^2 a^3 / (1 + 3/2 J2 (R/a)^2) from [S547]'s circle, 3.5521e-8
#        km^3/s^2, so that a coast around Didymos' point mass and J2 keeps the orbit before
#        the impact (the event's ghost); [S547] gives 3.544e-8 +- 0.153e-8 (Dimorphos' own
#        figure, which the coast leaves out, is part of the 0.2% difference). Dimorphos
#        3.0268e-10 (Horizons notes for 120065803), Didymos the rest.
# [ROT]  Horizons notes for 920065803 and 120065803: Didymos' pole (69.32686, -72.72455)
#        deg and W = 3823.008849557522 deg/d (2.2600 h) with W0 = 0; Dimorphos' pole
#        (69.70029, -72.69527) deg, before the impact W = 73.389 deg + 724.7244051 deg/d
#        (synchronous), after it a frame with x toward Didymos: drawn synchronous throughout.
# [SHP]  DART Shapemodel Archive Bundle (Daly, Barnouin, Ernst et al., PDS SBN,
#        urn:nasa:pds:dart_shapemodel::1.0, doi:10.26007/96fn-p578): Didymos v003 (9.3 m
#        version), Dimorphos v004 (1.9 m version, from DRACO images before the impact;
#        assets/shapes/SOURCES.md). Radii: half the models' extents.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK]  NAIF pck00011.tpc (IAU 2015).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a (Mars).
# [ATM]  Atmospheres: sources and choices in solar_system.toml.
# [NIGHT] The Earth's night lights and aurora: sources and choices in solar_system.toml.
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (the Moon, outside its table).
# [CAP]  Event captions (retrieved 2026-10-22):
#        [DALY] Daly et al. 2023, "Successful kinetic impact into an asteroid for planetary
#          defence", Nature 616, 443 (arXiv:2303.02248), text and Table 1: launch
#          2021-11-24; SMART Nav took over 4 h 5 min before the impact, first saw Dimorphos
#          73 min before it and steered for it from 50 min; the last full image 1.818 s
#          before the impact; 579.4 kg at 6.1449 km/s, 25 m from the center of figure;
#          Dimorphos 177 x 174 x 116 m (151 m volume-equivalent), an oblate spheroid;
#          Didymos 761 m volume-equivalent; system 5.6e11 kg.
#        [THO] Thomas et al. 2023, "Orbital period change of Dimorphos due to the DART
#          kinetic impact", Nature 616, 448 (arXiv:2303.02077): about 7 minutes expected
#          for a plain inelastic collision; -33.0 +- 1.0 min measured.
#        [CHE] Cheng et al. 2023, "Momentum transfer from the DART mission kinetic impact on
#          asteroid Dimorphos", Nature 616, 457 (arXiv:2303.03464): -2.70 +- 0.10 mm/s along
#          track; beta = 3.61 for equal densities: "significantly more momentum was
#          transferred to Dimorphos from the escaping impact ejecta than was incident with
#          DART".
#        [NASA] NASA, "NASA Confirms DART Mission Impact Changed Asteroid's Motion in Space"
#          (2022-10-11): from 11 h 55 min to 11 h 23 min; the minimum for success had been
#          73 seconds; the recoil of the debris "substantially enhanced DART's push".

name = "DART & Didymos"

[view]
focus = "Didymos"
frame = "Didymos-centered"
distance_km = 6.0
pitch_deg = 40.0
start = "2022-09-26 18:00"
warp = 600.0               # Dimorphos' orbit in 70 s

