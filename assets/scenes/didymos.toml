# --- The Didymos system -------------------------------------------------------------------
# The barycenter around the Sun, Didymos around the barycenter (a ~10 m circle) and
# Dimorphos around Didymos.

[[bodies]]
name = "Didymos system"
parent = "Sun"
kind = "barycenter"
gm_km3_s2 = 3.5521178e-8                   # [GMS]
orbit_color = "#b8b0a0"
trail = "history"                          # not the whole orbit: it cuts through the close views
trail_history_days = 310.0
[bodies.orbit]                             # [HZN] 20065803, 2021-11 .. 2023-03
type = "ephemeris"
file = "ephem/didymos.eph"

[[bodies]]
name = "Didymos"
parent = "Didymos system"
shape = "shapes/didymos.mesh"              # [SHP]
radii_km = [0.409, 0.401, 0.302]           # half the model's extent
# Dimorphos' drawn orbit and the info panel use n^2 a^3 of its circle before the impact
# ([S547]): J2 speeds the orbit up, and around the system's GM itself the osculating orbit
# would read e = 0.015 and 12.3 h. The ghost coasts around the GMs below and J2.
gm_km3_s2 = 3.6047138e-8
body_gm_km3_s2 = 3.5218498e-8              # [GMS]: the system less Dimorphos
zonal_harmonics = [[2, 0.0899440]]         # [S547]
gravity_radius_km = 0.393967
pole_ra_dec_deg = [69.32686, -72.72455]    # [ROT]
prime_meridian_deg = [0.0, 3823.008849557522]
