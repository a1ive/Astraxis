# Kepler-47: three planets around an eclipsing pair of stars, a Sun-like star
# and a red dwarf 0.08 au apart (7.45-day orbit). The outer planet, c, orbits
# in the habitable zone. All five orbits are nearly coplanar and seen edge-on:
# the stars eclipse each other and every planet has been seen to transit.
#
# Integrated as a Newtonian five-body system (Yoshida 6th-order symplectic,
# src/ephem/nbody.cpp) from the best-fit initial conditions of the
# photodynamical fit:
#
# [OR19] Orosz et al. 2019, AJ 157, 174 (arXiv:1904.07255):
#        Table 7, initial Cartesian barycentric conditions (masses in M_sun, au,
#        au/day) at T_ref = BJD 2454965.000, from the best-fitting model of Table 5.
#        Sect. 5.1: their code (ELC) works "relative to the system's barycenter"
#        with G = k^2 (k = 0.01720209895); the eclipses and transits are where the
#        bodies line up on the sky, so z is the line of sight. Its sign follows
#        from the ephemerides: at T_ref the secondary has moved ~85 deg past the
#        primary eclipse (Table 5 T_conj) and is heading to -z, so it eclipsed
#        the primary from the +z side: +z points at the observer.
#        Table 6: radii R_A = 0.936, R_B = 0.338 R_sun; planets 3.05 (b, inner),
#        7.04 (d, middle), 4.65 (c, outer) R_earth. Sect. 5.3: T_A = 5636 K (fixed,
#        Orosz et al. 2012); Table 5: T_B / T_A = 0.613, i.e. T_B = 3455 K.
#        The planet masses (2.07, 19.0, 3.17 M_earth) are only loosely constrained.
# [GAIA] Gaia EDR3 via SIMBAD: ICRS position at J2000 (RA 19 41 11.4983203032,
#        Dec +46 55 13.707336288 = 295.297909668, 46.920474260 deg),
#        parallax 0.954 +- 0.021 mas (1048 pc).
# Derived: L = R^2 (T_eff / 5772 K)^4 = 0.796 and 0.0147 L_sun; the red dwarf
#          adds ~2% to the planets' light, from at most 4.8 deg (from c) to
#          16 deg (from b) beside the primary: a second, orange-tinted terminator.
#
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440; k^2 differs by 2e-10).
# R_earth = 6371.0 km (mean, JPL SSD). Times are BJD_TDB (as seen from the
# solar-system barycentre); light-travel time across the system is ignored.
# Assumed: the orientation of the orbits on the sky (Table 7's x axis points
# north; transits do not constrain it). Planet colours are artistic.
# Check (tests/sim_tests.cpp): in 2009-2013 the planets transit within 6 min of
# the [OR19] model (Table 2; ELC also corrects for light-travel time, worth
# 2-8 min); the model's 2019-2026 predictions (Table 10) fall within 0.21
# transit durations (c runs ~0.2 stellar radii ahead of ELC, cause unknown).
# The primary eclipses drift from the linear ephemeris by 0.6 s per orbit
# (8 min by 2025), most likely the GR terms that ELC includes and we do not.
# The background sky is the one seen from Earth (BSC5); from 1 kpc it would differ.

name = "Kepler-47"

[view]
focus = "Kepler-47"
distance_km = 4.0e8
start = "now"
warp = 345600.0                # 4 days per second: c orbits in 76 s, b in 12 s
up = "orbit_normal:Kepler-47 B"

[[bodies]]
name = "Kepler-47"
kind = "barycenter"

[[bodies]]
name = "Kepler-47 A"
parent = "Kepler-47"
kind = "star"
radii_km = [651175.2]          # 0.936 R_sun [OR19]
temperature_k = 5636.0
luminosity_solar = 0.796
orbit_color = "#ffe9b0"
trail = "history"
trail_history_days = 7.4483648 # one binary orbit

[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Kepler-47 B"
parent = "Kepler-47"
kind = "star"
