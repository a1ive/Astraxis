temperature_k = 5772.0
luminosity_solar = 1.0
trail = "none"
[bodies.orbit]                 # opposite direction of Kepler-47 as seen from the Sun [GAIA]
type = "fixed"
ra_dec_distance_pc = [115.297909668, -46.920474260, 1048.0]

# [OR19] Table 7, barycentric; the output stays relative to the barycentre.
[nbody]
