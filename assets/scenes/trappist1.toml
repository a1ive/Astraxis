[[bodies]]
name = "Sun"
parent = "TRAPPIST-1"
kind = "star"
radii_km = [695700.0]
body_gm_km3_s2 = 1.32712440041279419e11 # JPL DE440
temperature_k = 5772.0
luminosity_solar = 1.0
trail = "none"
[bodies.orbit]                 # opposite direction of TRAPPIST-1 as seen from the Sun [GAIA]
type = "fixed"
ra_dec_distance_pc = [166.622368729, 5.041399251, 12.466916]

# Each planet starts on its Jacobi orbit: around the barycentre of the star and
# all planets inside it ([AG21] init_nbody.jl).
[nbody]
epoch_jd_tdb = 2457257.93115525
span_years = [2000.0, 2050.0]
step_days = 0.02               # 75 steps per orbit of b; transit times drift by ~1 min
order = 6                      # in 4 years (4th order at this step: ~1 hour)
knots_per_orbit = 24
origin = ["TRAPPIST-1"]

[[nbody.members]]
body = "TRAPPIST-1"

[[nbody.members]]
body = "TRAPPIST-1 b"
gm_km3_s2 = 5.477318e5         # mu = 4.596e-5
relative_to = ["TRAPPIST-1"]
[nbody.members.transit_orbit]
period_days = 1.510826
t_transit_bjd_tdb = 2457257.55044
e_cos_w = -0.00215
e_sin_w = 0.00217
i_deg = 89.728
transit_u_deg = 270.0
sky_ra_dec_deg = [346.622368729, -5.041399251]

[[nbody.members]]
body = "TRAPPIST-1 c"
gm_km3_s2 = 5.212748e5         # mu = 4.374e-5
