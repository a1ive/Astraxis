# TRAPPIST-1: an ultracool M8 dwarf and seven Earth-sized planets in a resonant
# chain (period ratios close to 8:5:3:2:4/3:1, neighbouring triples in
# three-body Laplace resonances), all within 0.062 au of the star.
#
# Integrated as a Newtonian eight-body system (Yoshida 6th-order symplectic,
# src/ephem/nbody.cpp) from the initial conditions of the transit-timing fit:
#
# [AG21] Agol et al. 2021, PSJ 2, 1 (arXiv:2010.01074):
#        Table 2: osculating Jacobi elements at BJD_TDB 2457257.93115525 (P, t0,
#        e cos w, e sin w) and planet/star mass ratios mu (in units of 1e-5).
#        Table 5: inclinations I (photodynamic model, impact parameter b0 > 0).
#        Table 6: planet radii (1e8 cm = 1000 km).
#        Table 7: M = 0.0898 M_sun (Mann et al. 2019), R = 0.1192 R_sun,
#        L = 0.000553 L_sun (Ducrot et al. 2020), T_eff = 2566 K.
#        Element convention from their NbodyGradient code (kepler_init.jl, init_nbody.jl,
#        github.com/ericagol/TRAPPIST1_Spitzer): Jacobi hierarchy, sky plane x-y, z away
#        from the observer, mid-transit at w + f = 270 deg; the TTV fit holds Omega = 0.
# [GAIA] Gaia EDR3 via SIMBAD: ICRS position at J2000 (RA 23 06 29.3684948589,
#        Dec -05 02 29.037301866 = 346.622368729, -5.041399251 deg),
#        parallax 80.2123 mas (12.466916 pc).
#
# [CAP]  Event captions (retrieved 2026-10-07), besides [AG21] above:
#        [GI17] Gillon et al. 2017, Nature 542, 456: at least seven Earth-sized planets around
#          an ultracool dwarf with "a mass just eight per cent that of the Sun" and a
#          "Jupiter-like size", 12 pc away; the VLT/HAWK-I light curve of 2015-12-10/11,
#          analysed after the three-planet discovery paper was submitted, revealed a triple
#          transit of c, e and f, which "motivated us to intensify our photometric follow-up".
#        [DW16] de Wit et al. 2016, Nature 537, 69 (abstract): HST's spectrum of the
#          simultaneous transit of b and c on 2016-05-04 rules out cloud-free
#          hydrogen-dominated atmospheres; denser atmospheres remain possible.
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440); a planet's
# GM = mu * 0.0898 GM_sun (the transit times fix only the mass ratios).
# Times are BJD_TDB, i.e. when the light reaches the solar-system barycentre:
# transits happen in the scene when they are seen from Earth.
# The node on the sky is not measured; 0 is used for all planets (as in the fit).
# Planet colours are artistic; the star colour comes from T_eff.
# Check (tests/stellar_system_tests.cpp): the integration reproduces the transit times that
# AG21's posterior predicts over 2015-2019 and their impact parameters.

name = "TRAPPIST-1"

[view]
focus = "TRAPPIST-1"
distance_km = 2.5e7
start = "now"
warp = 7200.0                  # 2 hours per second: b orbits in 18 s, h in 3.8 min
up = "orbit_normal:TRAPPIST-1 b"

[[bodies]]
name = "TRAPPIST-1"
kind = "star"
radii_km = [82927.4]           # 0.1192 R_sun [AG21]
gm_km3_s2 = 1.191757712e10     # 0.0898 GM_sun [AG21]
temperature_k = 2566.0
luminosity_solar = 0.000553

[[bodies]]
name = "TRAPPIST-1 b"
parent = "TRAPPIST-1"
radii_km = [7119.0]
color = "#8c7b70"
orbit_color = "#ff9f80"
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "TRAPPIST-1 c"
parent = "TRAPPIST-1"
radii_km = [6995.0]
color = "#a39282"
orbit_color = "#ffc080"
