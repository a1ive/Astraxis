# Mid-transit times from the posterior of [AG21] (times_obs_and_posterior.txt in
# their repository): c 2457367.57035, f .57732, e .59675 (VLT/HAWK-I, [GI17]); b 2457512.88677
# and c .88055 (HST, de Wit et al. 2016). Events start 1.5 h earlier.
[[events]]
name = "Triple transit of c, f and e (VLT, 2015-12-11)"
time_tdb = "2015-12-11 00:11:18"
focus = "TRAPPIST-1"
from_body = "Sun"
distance_km = 2.0e7
warp = 300.0
# [GI17]
caption = """\
    On this night the Very Large Telescope saw TRAPPIST-1 dim three times over: planets \
    c, e and f crossing its face together. Spotted only after three planets had been \
    announced, this light curve set off the follow-up campaign that found seven."""

[[events]]
name = "Double transit of b and c (HST, 2016-05-04)"
time_tdb = "2016-05-04 07:37:59"
focus = "TRAPPIST-1"
from_body = "Sun"
distance_km = 2.0e7
warp = 300.0
# [DW16]
caption = """\
    Planets b and c cross the star together, and the Hubble Space Telescope took the \
    light of both at once. Their combined spectrum was featureless: neither is wrapped \
    in a thick, puffy hydrogen envelope, though denser atmospheres were not ruled out."""

[[events]]
name = "The resonant chain, face-on"
time = "2026-01-01"
focus = "TRAPPIST-1"
from_orbit_normal = "TRAPPIST-1 e"
distance_km = 2.5e7
warp = 21600.0
# [GI17], [AG21]
caption = """\
    Seven Earth-sized planets, all closer to their star than Mercury is to the Sun: a \
    star with 9% of the Sun's mass and about Jupiter's size, 12 parsecs away. Their \
    periods are in ratios close to small whole numbers, a chain of resonances, like \
    Kepler-223's."""
