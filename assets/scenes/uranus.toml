# Uranus tipped on its side, its rings and moons, its lopsided magnetic field and infrared H3+,
# and Voyager 2's flyby of 1986.
#
# Sources
# Properties of the planet and the moons, with their sources: bodies/uranus.toml, miranda.toml,
# ariel.toml, umbriel.toml, titania.toml, oberon.toml.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        epoch 2000-01-01.5 TDB (URA182, "equatorial": the plane of Uranus' equator, referred
#        to its positive (right-hand) pole, i.e. opposite to the IAU north pole). Its P is the
#        period of the mean longitude (360 / P equals the PCK spin rates), so period_days (of
#        M) = 360 / (360 / P - apsis rate - node rate), with apsides advancing and nodes
#        regressing (oblateness). With its phases, the direction is within 0.1-0.3 deg rms of
#        Horizons over 1972-2100 (Miranda: 1.8 deg). The same as in solar_system.toml.
# [URA184], [URA117] JPL SPK orbits for the inner moons and Caliban and Sycorax from 1972
#        to 2100. See assets/ephem/SOURCES.md for the bake. Inner moon radii are from NASA NSSDCA,
#        https://nssdc.gsfc.nasa.gov/planetary/factsheet/uraniansatfact.html.
# [FT17] Farkas-Takacs et al. 2017, AJ 154, 119 (https://arxiv.org/abs/1706.06837),
#        thermal diameters of Caliban and Sycorax.
# [APX]  E. M. Standish, Approximate Positions of the Planets, Tables 2a + 2b.
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        Uranus system barycenter around the Sun, 1972-2100 (the Sun's direction); Voyager 2
#        relative to Uranus's center, 1986-01-04 .. 02-13. This is the planet-centered
#        trajectory, 107,154 km at closest approach, where the real pass was 107,000 km; the
#        heliocentric table of solar_system.toml (assets/ephem/SOURCES.md) passes 102,180 km.
# [MDL]  NASA 3D Resources, github.com/nasa/NASA-3D-Resources ("Voyager Probe (B)"), converted by
#        tools/shapes/make_spacecraft.py (assets/shapes/SOURCES.md).
# [LAM25]  Lamy et al. 2025, Nature Astronomy 9, doi:10.1038/s41550-025-02492-z: rotation
#        period 17.247864 +/- 0.000010 h.
# [MEL25]  Melin et al. 2025, GRL 52, e2025GL118301: the H3+ map from JWST, January 2023.
# [TIR26]  Tiranti et al. 2026, GRL 53, e2025GL119304: its vertical profiles from JWST, January 2025.
# [MOO19]  Moore et al. 2019, as quoted in assets/geomag/SOURCES.md: the sunlit H3+ lasts about
#        an hour, so it follows the sunlight.
# [HER09]  Herbert 2009, JGR 114, A11206: the field model AH5.
# [JAS24]  Jasinski et al. 2024, Nature Astronomy 9, 66, doi:10.1038/s41550-024-02389-3 (CC BY 4.0):
#        Voyager 2 saw Uranus's magnetosphere in a compressed state. The solar wind's dynamic
#        pressure rose about 20 times in the days before; the subsolar magnetopause went from
#        about 28 radii (day 16) to 17.3 (0.0184 nPa, day 24), where it is less than 5% of the
#        time; mean 22.2 radii. Magnetopause crossing 10:07 UT at (15.784, 8.684, -0.632) radii
#        of 25,559 km in sun-orbit axes. Model and checks: bodies/uranus.toml,
#        assets/geomag/SOURCES.md, tests/appearance_tests.cpp.
# [TJ08]  Treumann & Jaroschek 2008, "Planetary Bow Shocks", arXiv:0808.1701: inbound shock
#        crossing 07:28 spacecraft time, 23.5 radii out.
# [V2]   NASA, science.nasa.gov/mission/voyager/voyager-2/ (first to fly past Uranus; 10 new
#        moons and two new rings there).
# [UFS]  NASA NSSDCA Uranus Fact Sheet: obliquity 97.77 deg; orbital period 84 years.
#
# Colors are sRGB and illustrative where no surface map is used.

name = "Uranus"

[view]
focus = "Uranus"
distance_km = 1.5e6
pitch_deg = 18.0
start = "now"
warp = 3600.0                  # 1 hour per second: Uranus turns in 17 seconds

# Heliocentric orbit of the scene origin, used for the Sun direction.
[origin_heliocentric]                             # [HZN] Uranus barycenter
type = "ephemeris"
file = "ephem/uranus.eph"
[origin_heliocentric.fallback]                    # [APX] Tables 2a + 2b
type = "jpl_approx_planet"
a_au = [19.18797948, -0.00020455]
e = [0.04685740, -0.00001550]
i_deg = [0.77298127, -0.00180155]
mean_longitude_deg = [314.20276625, 428.49512595]
lon_peri_deg = [172.43404441, 0.09266985]
node_deg = [73.96250215, 0.05739699]
b = 0.00058331
c = -0.97731848
s = 0.17689245
f = 7.67025000

[[bodies]]
name = "Uranus"
template = "bodies/uranus.toml"
gm_km3_s2 = 5794556.4                      # system [GM]

