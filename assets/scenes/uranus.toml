# --- Events -------------------------------------------------------------------------

[[events]]
name = "Voyager 2 at Uranus (CA 1986-01-24 18:00, 107,154 km)"
time_tdb = "1986-01-24 12:00"
focus = "Uranus"
flyby = "Voyager 2"
distance_km = 5.0e5
warp = 600.0
# [V2], [UFS]
caption = """\
    Nobody has been back. Voyager 2 flew in almost along the planet's axis, because in 1986 \
    that axis pointed nearly at the Sun: Uranus is tipped over by 98 degrees and rolls round \
    its 84-year orbit on its side. It found ten new moons and two new rings in a few days."""

[[events]]
name = "Uranus's lopsided magnetic field (1986-01-24)"
magnetic_lines = true
focus_orbits_only = true
trails = [{ body = "Voyager 2", trail_history_days = 10.0 }]
time_tdb = "1986-01-24 18:00"
focus = "Uranus"
from_body = "Sun"
phase_deg = 40.0
distance_km = 6.0e5
warp = 1800.0
# [HER09], [JAS24], [LAM25]
caption = """\
    Voyager 2 found a field tilted 59 degrees from the spin axis, with its center a third \
    of a radius off the planet's. Each 17.2-hour turn swings the lines from side to side. \
    Drawn from a model of what the planet itself makes, without the solar wind that shapes \
    them farther out. Voyager arrived while a gust had squeezed the whole magnetosphere."""

# Seen from the side, the Sun below (the pole, up here, points away from it). Voyager 2 meets the bow shock at 07:28 and the
# magnetopause at 10:07, on the squeezed surface, well inside the mean one.
[[events]]
name = "A squeezed magnetosphere (1986-01-24)"
magnetosphere = [{ body = "Uranus", standoff_radii = 17.3, tail_radii = 35.0 },
                 { body = "Uranus", faint = true, tail_radii = 35.0 }]
focus_orbits_only = true
trails = [{ body = "Voyager 2", trail_history_days = 10.0 }]
time_tdb = "1986-01-24 05:30"
focus = "Uranus"
from_body = "Sun"
phase_deg = 80.0
elevation_deg = 12.0
distance_km = 4.2e6
warp = 1800.0
# [JAS24], [TJ08]
caption = """\
    The solar wind stops Uranus's field at the blue surface; the orange one is the shock \
    ahead of it. Voyager 2 crossed them 23.5 and 18 radii out. But the wind had grown some \
    twenty times stronger in the days before: the edge is this close less than 5 percent of \
    the time. The fainter surface is where it stands on average. Shapes from simple models."""

# Seen across the equator: the sunlit hemisphere above, the night below.
[[events]]
name = "A polar night in the infrared (false color, model of 1986)"
aurora_infrared = true
hide_orbits = true
time_tdb = "1986-01-26 00:00"
focus = "Uranus"
frame = "Uranus equator"
from_body = "Sun"
elevation_deg = 0.0
distance_km = 150000.0
warp = 900.0
# [MEL25], [MOO19]; assets/geomag/SOURCES.md
caption = """\
    The H3+ glow in false color, with the Sun over one pole. Sunlight makes these ions and \
    they last about an hour, so the other hemisphere, deep in its 42-year night, should go \
    dark except for its aurorae. No one has seen this: it is Webb's map of 2023 under the \
    sunlight of 1986."""

[[events]]
name = "The equinox in the infrared (false color, model of 2007)"
aurora_infrared = true
hide_orbits = true
time_tdb = "2007-12-08 00:00"
focus = "Uranus"
frame = "Uranus equator"
from_body = "Sun"
phase_deg = 35.0
elevation_deg = 0.0
distance_km = 150000.0
warp = 900.0
# [MEL25], [UFS]; assets/geomag/SOURCES.md
caption = """\
    Twice in each 84-year orbit the Sun stands over the equator, and day and night come \
    round everywhere, as they do on the Earth. In this model of the H3+ glow the two \
    hemispheres shine about alike. The map below 25 degrees south is extrapolated, since \
    Webb could see only the northern side."""

# The clock is the observation time less the light time (tests/appearance_tests.cpp); the
# camera is where the Earth is at that moment, seen from Uranus: the scene has no Earth.
[[events]]
name = "Uranus's infrared ionosphere (false color, 2023)"
aurora_infrared = true
time_tdb = "2023-01-08 12:51"
focus = "Uranus"
observer = "Uranus"
observer_offset_km = [-106598.0, -97190.1, -41121.2]
aim_offset_km = [0.0, 0.0, 0.0]
warp = 900.0
# [MEL25], [TIR26], [LAM25]
caption = """\
    The whole sunlit disk glows in the infrared lines of the ion H3+, shown here in \
    false color. Uranus's magnetic field is tilted 59 degrees, so its aurorae lie at low \
    and middle latitudes, not the poles. Webb found both, up to twice as radiant as their \
    surroundings but hardly warmer, and a dark chevron across the pole."""

# The strongest field is on the side the off-center dipole sits nearest, in the hemisphere
# that faces the Sun in the 2020s. The numbers are geomag/uranus_br.fieldmap, the AH5 model
# [HER09] at the surface; its dipole alone would give 0.46 gauss at most.
[[events]]
name = "Uranus's lopsided field at its surface (false color)"
magnetic_map = "surface"
hide_orbits = true
time_tdb = "2025-01-19 02:32"
focus = "Uranus"
frame = "Uranus equator"
from_body = "Sun"
elevation_deg = 12.0
distance_km = 1.3e5
warp = 400.0
# [HER09], [LAM25]
caption = """\
    The field at the cloud tops, in false color, red leaving the planet and blue entering \
    it. A centered magnet would give two even halves. Here the blue north reaches about 1.5 \
    gauss, three times what the dipole alone would give, because the field's center sits a \
    third of a radius off toward it. The red side stays under half that. All from one pass."""
