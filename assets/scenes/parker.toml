# Parker Solar Probe: seven Venus gravity assists, each one taking away orbital
# energy, step the perihelion down from 35.7 to 9.86 solar radii.
#
# The default "Sun-Venus rotating" frame holds Venus still on the x axis: every flyby
# happens at the same point, and the shrinking orbits since launch fan out into
# petals around the Sun. In the Sun-centered (ICRF) frame they nest inside each other.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        heliocentric ICRF. Parker Solar Probe 2018-08-12 08:17 .. 2029-12-31 TDB (fit to
#        tracking data through 2026-09-01, then the reference planning trajectory);
#        Venus 2018-08-01 .. 2030-01-01; Earth-Moon barycenter 1972..2100.
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a, for Mercury and
#        Mars, and for Venus and the Earth outside the baked span.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians (T terms ignored).
# [CAP]  Event captions (retrieved 2026-10-07):
#        [PSP] NASA, science.nasa.gov/mission/parker-solar-probe/: to "touch the Sun"; a
#          carbon-composite heat shield; 24 orbits over seven years.
#        [PSP10] NASA, "10 Things to Know About Parker Solar Probe": a Delta IV Heavy; reaching
#          the Sun takes "55 times more energy than it takes to go to Mars", shedding the
#          Earth's 67,000 mph sideways speed; Venus slows it so it can swing closer, seven
#          times; the shield's front at 2,500 F, the instruments behind it at 85 F; the
#          corona at "upwards of 2 million degrees Fahrenheit", the surface at 10,000 F; the
#          origin of the slow solar wind.
#        [PSPR] NASA, "Parker Solar Probe Breaks Record, Becomes Closest Spacecraft to Sun":
#          past Helios 2's 1976 records for distance and speed on 2018-10-29; the first
#          perihelion "just 15 million miles from our star's surface".
#        [WISPR] NASA, "Parker Solar Probe Captures its First Images of Venus' Surface in
#          Visible Light, Confirmed": the third (July 2020) and fourth (February 2021)
#          flybys; the night side's surface glows, "the first time from space" in visible
#          light; highlands ~85 F cooler show up dark.
#        [PSPC] NASA, "NASA's Parker Solar Probe Touches The Sun For The First Time": on
#          2021-04-28, during the eighth perihelion, it crossed the Alfven critical surface at
#          18.8 solar radii, into and out of the corona several times; the boundary has
#          "spikes and valleys".
#        [PSPV7] NASA, "Final Venus Flyby for NASA's Parker Solar Probe Queues Closest Sun
#          Pass": 2024-11-06, 233 miles (376 km) above Venus; then within 3.86 million miles
#          of the solar surface on 2024-12-24.
#        [PSPCP] NASA, "NASA's Parker Solar Probe Makes History With Closest Pass to Sun":
#          3.8 million miles from the surface at about 430,000 mph, the fastest any human-made
#          object has traveled; a beacon tone late on December 26 confirmed it was safe.
#        The petals, the perihelia (35.7 to 9.86 R_sun) and the 88-day orbit: [HZN], below.
# Flyby and perihelion times/distances: computed from the baked data by the bake tool
# (TDB; flyby distances from the center of Venus, perihelion distances from the center
# of the Sun, R_sun = 695,700 km [PCK]). Event dates in the names are calendar dates.

name = "Parker Solar Probe"

# White-light K corona: assets/corona/SOURCES.md.
[corona]
display_gain = 8.0e5
display_gamma = 0.65

[view]
focus = "Sun"
frame = "Sun-Venus rotating"
distance_km = 3.4e8        # the widest (first) orbits fit in the view
pitch_deg = 60.0           # camera elevation above Venus's orbital plane
start = "now"
warp = 86400.0             # 1 day per second: an 88-day orbit in ~1.5 minutes
up = "ecliptic"            # for the Sun-centered frame

[[bodies]]
name = "Sun"
template = "bodies/sun.toml"
gm_km3_s2 = 1.32712440041279419e11         # [GM]
pole_ra_dec_deg = [286.13, 63.87]          # [PCK]
prime_meridian_deg = [84.176, 14.1844]
color = "#fff4e0"

[[bodies]]
name = "Mercury"
template = "bodies/mercury.toml"
parent = "Sun"
orbit_color = "#8f8a85"
[bodies.orbit]                             # [APX] Table 2a
type = "jpl_approx_planet"
a_au = [0.38709843, 0.00000000]
e = [0.20563661, 0.00002123]
i_deg = [7.00559432, -0.00590158]
mean_longitude_deg = [252.25166724, 149472.67486623]
lon_peri_deg = [77.45771895, 0.15940013]
node_deg = [48.33961819, -0.12214182]

[[bodies]]
name = "Venus"
template = "bodies/venus.toml"
parent = "Sun"
orbit_color = "#d9c79f"
[bodies.orbit]                             # [HZN] 299 (Venus has no moon: body center)
type = "ephemeris"
file = "ephem/venus.eph"
[bodies.orbit.fallback]                    # [APX] Table 2a
type = "jpl_approx_planet"
a_au = [0.72332102, -0.00000026]
e = [0.00676399, -0.00005107]
i_deg = [3.39777545, 0.00043494]
mean_longitude_deg = [181.97970850, 58517.81560260]
lon_peri_deg = [131.76755713, 0.05679648]
node_deg = [76.67261496, -0.27274174]

[[bodies]]
name = "Earth"
template = "bodies/earth.toml"
parent = "Sun"
orbit_color = "#7fa6e0"
[bodies.orbit]                             # [HZN] Earth-Moon barycenter
type = "ephemeris"
file = "ephem/emb.eph"
[bodies.orbit.fallback]                    # [APX] Table 2a, EM Bary
type = "jpl_approx_planet"
a_au = [1.00000018, -0.00000003]
e = [0.01673163, -0.00003661]
i_deg = [-0.00054346, -0.01337178]
mean_longitude_deg = [100.46691572, 35999.37306329]
lon_peri_deg = [102.93005885, 0.31795260]
node_deg = [-5.11260389, -0.24123856]

[[bodies]]
name = "Mars"
template = "bodies/mars.toml"
parent = "Sun"
orbit_color = "#c98a6e"
[bodies.orbit]                             # [APX] Table 2a
type = "jpl_approx_planet"
a_au = [1.52371243, 0.00000097]
e = [0.09336511, 0.00009149]
i_deg = [1.85181869, -0.00724757]
mean_longitude_deg = [-4.56813164, 19140.29934243]
lon_peri_deg = [-23.91744784, 0.45223625]
node_deg = [49.71320984, -0.26852431]

[[bodies]]
name = "Parker Solar Probe"
parent = "Sun"
kind = "spacecraft"
radii_km = [0.00115]                       # ~2.3 m heat shield
color = "#ffe9a8"
orbit_color = "#ffb347"
trail = "history"                          # since launch
[bodies.orbit]                             # [HZN] -96
type = "ephemeris"
file = "ephem/parker.eph"

[[frames]]
name = "Sun-Venus rotating"
type = "rotating"
primary = "Sun"
secondary = "Venus"
origin = "Sun"

[[frames]]
name = "Venus-centered"
type = "inertial"
origin = "Venus"

[[events]]
name = "Launch (2018-08-12)"
time_tdb = "2018-08-12 08:17"
focus = "Earth"
distance_km = 4.0e7
warp = 21600.0
# [PSP], [PSP10]
caption = """\
    Parker launches on a Delta IV Heavy toward the Sun. To fall inward, it must \
    shed most of the Earth's sideways speed of 30 km/s, which takes 55 times the \
    energy of a trip to Mars. Seven passes of Venus will do much of the braking."""

[[events]]
name = "The petals grow (Sun-Venus rotating)"
time_tdb = "2018-08-12 08:17"
focus = "Sun"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 2.4e8
warp = 604800.0
# [PSP10], [HZN]
caption = """\
    In this frame Venus stays put, so all seven flybys happen at one point, and each \
    orbit since launch draws a petal around the Sun. Every flyby takes away some orbital \
    energy: the petals shrink, and the closest approach steps down from 35.7 to 9.86 \
    solar radii."""

# Venus flybys start two hours before closest approach. Their trails show the last 30
# days only (until the frame is changed): in the Venus-centered frame the paths of all
# the earlier flybys would cross Venus.
[[events]]
name = "Venus flyby 1 (2018-10-03, 2,428 km altitude)"
time_tdb = "2018-10-03 06:45"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10], [PSPR]
caption = """\
    The first of seven Venus flybys, seven weeks after launch. Venus slows Parker down \
    so that it can swing closer to the Sun; a month from now it will pass closer than \
    any spacecraft before it."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

# Perihelion 1 (2018-11-06 03:29 TDB, 24,818,592 km). Starts a day before.
[[events]]
name = "Perihelion 1 (2018-11-06, 35.7 R_sun)"
time_tdb = "2018-11-05 03:29"
focus = "Sun"
flyby = "Parker Solar Probe"
from_orbit_normal = "Parker Solar Probe"
distance_km = 7.0e7
warp = 1800.0
# [PSPR]
caption = """\
    A week ago, on 29 October, Parker broke the records Helios 2 had held since 1976: \
    the closest spacecraft to the Sun, and the fastest. Now it swings by about 24 \
    million km from the solar surface. Six more Venus flybys will take it much closer."""

[[events]]
name = "Venus flyby 2 (2019-12-26, 3,001 km altitude)"
time_tdb = "2019-12-26 16:16"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [HZN]
caption = """\
    The second Venus flyby lowers the perihelion again. The probe returns to the \
    same spot in this frame because its orbits are timed to meet Venus. Each pass \
    brings the next solar approach closer."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 3 (2020-07-11, 830 km altitude)"
time_tdb = "2020-07-11 01:25"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [WISPR]
caption = """\
    On this pass Parker's WISPR camera, built to watch the solar wind, looked at \
    Venus' night side and saw the surface itself glowing through the clouds, with \
    the glow of hot iron: the first view of it from space in visible light. Cooler \
    highlands show up as dark patches."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 4 (2021-02-20, 2,386 km altitude)"
time_tdb = "2021-02-20 18:07"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSPC]
caption = """\
    Two months after this flyby, on 28 April 2021, Parker crossed into the Sun's \
    corona, 18.8 solar radii out: the first spacecraft to enter the solar \
    atmosphere. The edge of the corona turned out to be wrinkled, with spikes and \
    valleys, and Parker passed in and out of it several times."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 5 (2021-10-16, 3,807 km altitude)"
time_tdb = "2021-10-16 07:32"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10], [PSP]
caption = """\
    Each step inward means more heat. At the closest passes the front of Parker's \
    carbon-composite heat shield reaches about 1,400 C, while the instruments in \
    its shadow stay near 30 C."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 6 (2023-08-21, 4,004 km altitude)"
time_tdb = "2023-08-21 10:04"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10]
caption = """\
    Parker studies why the corona, at millions of degrees, is so much hotter than \
    the Sun's 5,500 C surface, and where the slow solar wind originates. Each \
    closer orbit samples these regions more deeply."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 7 (2024-11-06, 372 km altitude)"
time_tdb = "2024-11-06 16:45"
focus = "Venus"
flyby = "Parker Solar Probe"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSPV7], [HZN]
caption = """\
    The seventh and last Venus flyby, and the closest, under 400 km above the surface. \
    It sets up the final orbit: 88 days around the Sun, coming within 6.2 million km of \
    the solar surface at each perihelion."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

# Perihelion 22 (2024-12-24 11:42 TDB, 6,862,559 km): the first of the closest passes,
# at ~190 km/s. Starts 12 hours before.
[[events]]
name = "Perihelion 22 (2024-12-24, 9.86 R_sun)"
time_tdb = "2024-12-23 23:42"
focus = "Sun"
flyby = "Parker Solar Probe"
from_orbit_normal = "Parker Solar Probe"
distance_km = 3.0e7
warp = 900.0
# [PSPCP]
caption = """\
    The closest any spacecraft has come to the Sun: about 6.1 million km from its \
    surface, at roughly 690,000 km/h, the fastest any human-made object has traveled. \
    Out of contact during the pass, Parker sent a beacon tone late on 26 December: it \
    had come through."""


[[events]]
name = "Inside the corona (enhanced white light)"
time_tdb = "2024-12-24 11:42"
focus = "Sun"
observer = "Parker Solar Probe"
fov_deg = 55.0
corona_enhanced = true
warp = 300.0
caption = """Looking toward the Sun from Parker at its closest approach, inside the modeled corona. Electrons scatter sunlight along the view into streamers that change with the viewing angle as the spacecraft moves. The structure is illustrative and the white light is enhanced. WISPR looks away from the solar disk; this view is not a reconstruction of its images. Dust-scattered light and coronal mass ejections are not included."""
