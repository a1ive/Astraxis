[[bodies]]
name = "Parker Solar Probe"
parent = "Sun"
kind = "spacecraft"
radii_km = [0.00115]                       # ~2.3 m heat shield
color = "#ffe9a8"
orbit_color = "#ffb347"
trail = "history"                          # since launch
[bodies.orbit]                             # [HZN] -96
type = "ephemeris"
file = "ephem/parker.eph"

[[frames]]
name = "Sun-Venus rotating"
type = "rotating"
primary = "Sun"
secondary = "Venus"
origin = "Sun"

[[frames]]
name = "Venus-centered"
type = "inertial"
origin = "Venus"

[[events]]
name = "Launch (2018-08-12)"
time_tdb = "2018-08-12 08:17"
focus = "Earth"
distance_km = 4.0e7
warp = 21600.0
# [PSP], [PSP10]
caption = """\
    Parker leaves on a Delta IV Heavy to touch the Sun. Falling inward is the hard part: \
    it must shed most of the Earth's sideways speed of 30 km/s, which takes 55 times the \
    energy of a trip to Mars. Seven passes of Venus will do much of the braking."""

[[events]]
name = "The petals grow (Sun-Venus rotating)"
time_tdb = "2018-08-12 08:17"
focus = "Sun"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 2.4e8
warp = 604800.0
# [PSP10], [HZN]
caption = """\
    In this frame Venus stays put, so all seven flybys happen at one point, and each \
    orbit since launch draws a petal around the Sun. Every flyby takes away some orbital \
    energy: the petals shrink, and the closest approach steps down from 35.7 to 9.86 \
    solar radii."""

# Venus flybys start two hours before closest approach. Their trails show the last 30
# days only (until the frame is changed): in the Venus-centered frame the paths of all
# the earlier flybys would cross Venus.
[[events]]
name = "Venus flyby 1 (2018-10-03, 2,428 km altitude)"
time_tdb = "2018-10-03 06:45"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10], [PSPR]
caption = """\
    The first of seven Venus flybys, seven weeks after launch. Venus slows Parker down \
    so that it can swing closer to the Sun; a month from now it will pass closer than \
    any spacecraft before it."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

# Perihelion 1 (2018-11-06 03:29 TDB, 24,818,592 km). Starts a day before.
[[events]]
name = "Perihelion 1 (2018-11-06, 35.7 R_sun)"
time_tdb = "2018-11-05 03:29"
focus = "Sun"
from_orbit_normal = "Parker Solar Probe"
distance_km = 7.0e7
warp = 1800.0
# [PSPR]
caption = """\
    A week ago, on 29 October, Parker broke the records Helios 2 had held since 1976: \
    the closest spacecraft to the Sun, and the fastest. Now it swings by about 24 \
    million km from the solar surface. Six more Venus flybys will take it much closer."""

[[events]]
name = "Venus flyby 2 (2019-12-26, 3,001 km altitude)"
time_tdb = "2019-12-26 16:16"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [HZN]
caption = """\
    The second Venus flyby lowers the perihelion again. Watch how the probe comes back \
    to the same spot in this frame: its orbits are timed so that Venus is waiting there, \
    and each pass takes it one step farther in."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 3 (2020-07-11, 830 km altitude)"
time_tdb = "2020-07-11 01:25"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [WISPR]
caption = """\
    On this pass Parker's WISPR camera, built to watch the solar wind, looked at Venus' \
    night side and saw the surface itself glowing through the clouds, as hot as iron \
    from a forge: the first view of it from space in visible light. Cooler highlands \
    show up as dark patches."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 4 (2021-02-20, 2,386 km altitude)"
time_tdb = "2021-02-20 18:07"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSPC]
caption = """\
    Two months after this flyby, on 28 April 2021, Parker crossed into the Sun's corona, \
    18.8 solar radii out: the first spacecraft to touch the Sun. The edge of the corona \
    turned out to be wrinkled, with spikes and valleys, and Parker passed in and out of \
    it several times."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 5 (2021-10-16, 3,807 km altitude)"
time_tdb = "2021-10-16 07:32"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10], [PSP]
caption = """\
    Each step inward means more heat. At the closest passes the front of Parker's \
    carbon-composite heat shield reaches about 1,400 C, while the instruments in its \
    shadow stay near 30 C. It is the shield that lets the probe keep going lower."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 6 (2023-08-21, 4,004 km altitude)"
time_tdb = "2023-08-21 10:04"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSP10]
caption = """\
    What Parker is after: why the corona, at millions of degrees, is so much hotter than \
    the Sun's 5,500 C surface, and where the slow solar wind comes from. Each lower \
    orbit takes it deeper into the region where those answers are made."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

[[events]]
name = "Venus flyby 7 (2024-11-06, 372 km altitude)"
time_tdb = "2024-11-06 16:45"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.2e5
warp = 120.0
# [PSPV7], [HZN]
caption = """\
    The seventh and last Venus flyby, and the closest, under 400 km above the surface. \
    It sets up the final orbit: 88 days around the Sun, coming within 6.2 million km of \
    the solar surface at each perihelion."""
[[events.trails]]
body = "Parker Solar Probe"
trail_history_days = 30.0

# Perihelion 22 (2024-12-24 11:42 TDB, 6,862,559 km): the first of the closest passes,
# at ~190 km/s. Starts 12 hours before.
[[events]]
name = "Perihelion 22 (2024-12-24, 9.86 R_sun)"
time_tdb = "2024-12-23 23:42"
focus = "Sun"
from_orbit_normal = "Parker Solar Probe"
distance_km = 3.0e7
warp = 900.0
# [PSPCP]
caption = """\
    The closest any spacecraft has come to the Sun: about 6.1 million km from its \
    surface, at roughly 690,000 km/h, the fastest any human-made object has traveled. \
    Out of contact during the pass, Parker sent a beacon tone late on 26 December: it \
    had come through."""
