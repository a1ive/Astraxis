# Parker Solar Probe: seven Venus gravity assists, each one taking away orbital
# energy, step the perihelion down from 35.7 to 9.86 solar radii.
#
# The default "Sun-Venus rotating" frame holds Venus still on the x axis: every flyby
# happens at the same point, and the shrinking orbits since launch fan out into
# petals around the Sun. In the Sun-centered (ICRF) frame they nest inside each other.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        heliocentric ICRF. Parker Solar Probe 2018-08-12 08:17 .. 2029-12-31 TDB (fit to
#        tracking data through 2026-09-01, then the reference planning trajectory);
#        Venus 2018-08-01 .. 2030-01-01; Earth-Moon barycenter 1972..2100.
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a, for Mercury and
#        Mars, and for Venus and the Earth outside the baked span.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/),
#        "Planet and Pluto GM Values" table: the GM of Mars alone.
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians (T terms ignored).
# [CAP]  Event captions (retrieved 2026-10-07):
#        [PSP] NASA, science.nasa.gov/mission/parker-solar-probe/: to "touch the Sun"; a
#          carbon-composite heat shield; 24 orbits over seven years.
#        [PSP10] NASA, "10 Things to Know About Parker Solar Probe": a Delta IV Heavy; reaching
#          the Sun takes "55 times more energy than it takes to go to Mars", shedding the
#          Earth's 67,000 mph sideways speed; Venus slows it so it can swing closer, seven
#          times; the shield's front at 2,500 F, the instruments behind it at 85 F; the
#          corona at "upwards of 2 million degrees Fahrenheit", the surface at 10,000 F; the
#          origin of the slow solar wind.
#        [PSPR] NASA, "Parker Solar Probe Breaks Record, Becomes Closest Spacecraft to Sun":
#          past Helios 2's 1976 records for distance and speed on 2018-10-29; the first
#          perihelion "just 15 million miles from our star's surface".
#        [WISPR] NASA, "Parker Solar Probe Captures its First Images of Venus' Surface in
#          Visible Light, Confirmed": the third (July 2020) and fourth (February 2021)
#          flybys; the night side's surface glows, "the first time from space" in visible
#          light; highlands ~85 F cooler show up dark.
#        [PSPC] NASA, "NASA's Parker Solar Probe Touches The Sun For The First Time": on
#          2021-04-28, during the eighth perihelion, it crossed the Alfven critical surface at
#          18.8 solar radii, into and out of the corona several times; the boundary has
#          "spikes and valleys".
#        [PSPV7] NASA, "Final Venus Flyby for NASA's Parker Solar Probe Queues Closest Sun
#          Pass": 2024-11-06, 233 miles (376 km) above Venus; then within 3.86 million miles
#          of the solar surface on 2024-12-24.
#        [PSPCP] NASA, "NASA's Parker Solar Probe Makes History With Closest Pass to Sun":
#          3.8 million miles from the surface at about 430,000 mph, the fastest any human-made
#          object has traveled; a beacon tone late on December 26 confirmed it was safe.
#        The petals, the perihelia (35.7 to 9.86 R_sun) and the 88-day orbit: [HZN], below.
# Flyby and perihelion times/distances: computed from the baked data by the bake tool
# (TDB; flyby distances from the center of Venus, perihelion distances from the center
# of the Sun, R_sun = 695,700 km [PCK]). Event dates in the names are calendar dates.

name = "Parker Solar Probe"

[view]
focus = "Sun"
frame = "Sun-Venus rotating"
distance_km = 3.4e8        # the widest (first) orbits fit in the view
pitch_deg = 60.0           # camera elevation above Venus's orbital plane
start = "now"
warp = 86400.0             # 1 day per second: an 88-day orbit in ~1.5 minutes
up = "ecliptic"            # for the Sun-centered frame

[[bodies]]
name = "Sun"
kind = "star"
radii_km = [695700.0]                      # [PCK]
gm_km3_s2 = 1.32712440041279419e11         # [GM]
pole_ra_dec_deg = [286.13, 63.87]          # [PCK]
prime_meridian_deg = [84.176, 14.1844]
color = "#fff4e0"

[[bodies]]
name = "Mercury"
parent = "Sun"
radii_km = [2440.53, 2438.26]              # [PCK]
body_gm_km3_s2 = 22031.868551              # [GM]
pole_ra_dec_deg = [281.0103, 61.4155]
prime_meridian_deg = [329.5988, 6.1385108]
color = "#9c958e"
orbit_color = "#8f8a85"
texture = "textures/mercury.jpg"           # assets/textures/SOURCES.md
texture_left_lon_deg = -180.0
[bodies.orbit]                             # [APX] Table 2a
type = "jpl_approx_planet"
