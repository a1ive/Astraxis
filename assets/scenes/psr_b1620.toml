# PSR B1620-26 in the globular cluster M4: an 11-millisecond pulsar and a young
# helium white dwarf on a 191-day orbit, and a planet of a few Jupiter masses
# circling both every ~60 years -- one of the oldest planets known, about 0.4 pc
# from the cluster's centre, under a sky of ten thousand giants and dwarfs.
#
# Nested two-body (Keplerian) orbits; the planet's pull on the binary (its
# Kozai cycle) and all cluster tides are ignored.
#
# [TH99] Thorsett et al. 1999, ApJ 523, 763 (arXiv:astro-ph/9903227):
#        Table 1, timing of the inner binary: x = a_p sin i = 64.809460 lt-s,
#        P_b = 191.44281 d, e = 0.02531545, periastron JD 2448728.76242,
#        omega (the pulsar's) = 117.1291 deg, mass function 7.9748e-3 M_sun;
#        spin period 11.0757509142025 ms; position RA 16 23 38.2218, Dec -26 31 53.769
#        (245.9092575, -26.5316025 deg).
#        Table 2, the outer orbit taken circular: x = 6.4 lt-s, P = 61.8 yr,
#        ascending node of the inner binary JD 2449104 (1993 April).
# [SI03] Sigurdsson et al. 2003, Science 301, 193: white dwarf 0.34 M_sun, pulsar
#        1.35 M_sun assumed; planet 2.5 +- 1 M_Jup, a ~ 23 au (the circular solution
#        used here has 18.6 au); Table 1: white dwarf F555W = 24.093, F814W = 23.379,
#        extinctions 1.31 and 0.82, true distance modulus 11.18; pulsar 46" (~1 core
#        radius) from the cluster centre.
# [ST05] Sigurdsson & Thorsett 2005 (arXiv:astro-ph/0404538): the two orbits are
#        "significantly non-coplanar (relative inclination of about 40)".
# [PM13] Pecaut & Mamajek 2013, ApJS 208, 9 (online table, version 2022.04.16):
#        V - Ic = 0.197 / 0.242 at 7910 / 7760 K, BC_V 0.005 / 0.010.
# [GMJ]  JPL SSD astrodynamic parameters: GM_Jupiter = 1.26686534e8 km^3/s^2.
# Derived:
#   inner binary: sin i = (f (m_p + m_wd)^2)^(1/3) / m_wd = 0.8337, i = 56.48 deg
#     ([SI03]: 55 +8/-14); then a_p = x c / sin i = 0.15578 au, as Kepler's
#     third law gives for 1.69 M_sun (0.7743 au relative).
#   planet: 2.5 M_Jup = 2.3865e-3 M_sun; a = 18.63 au; the binary's orbit around
#     the triple barycentre is 0.02627 au, so sin i = x c / 0.02627 au = 0.4883,
#     i = 29.23 deg; the node difference 45.73 deg makes the relative inclination 40 deg.
#   white dwarf: (V - I)_0 = 0.224 -> T_eff ~ 7820 K [PM13, dwarf colours; for a
#     white dwarf only approximate]; M_V = 11.60, L = 1.8e-3 L_sun (M_bol,sun = 4.74),
#     R = 0.023 R_sun.
# Assumed: the nodes on the sky (inner 0, so the planet's is 45.73 deg); the
# pulsar's spin axis along the inner orbit's normal (recycling by accretion
# aligns them), its magnetic axis 45 deg from it, beams 10 deg wide; the neutron
# star 12 km in radius with a 1e5 K surface (L = 2.7e-5 L_sun); the planet one
# Jupiter radius; the system in the plane of the sky through the cluster
# centre (its depth in M4 is unknown). The beams are radio and invisible; they
# are drawn bluish and turn once every 2 s of real time (the true 11 ms cannot
# be shown), stopping when the clock is paused.
# The sky: M4's members from Gaia DR3 as seen from the pulsar (assets/stars/m4.csv,
# tools/stars/make_m4.py; ESA/Gaia/DPAC, CC BY-NC 3.0 IGO; depths along the line
# of sight are statistical). The
# Earth's sky (BSC5) is not shown; the Milky Way and field stars are missing.
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440).
# Check (tests/stellar_system_tests.cpp): the pulsar's Roemer delay and the inner orbit,
# the binary's 6.4 lt-s outer motion with its 1993 node, the 40 deg tilt, the sky.

name = "PSR B1620-26"

[view]
focus = "PSR B1620-26 AB"
distance_km = 6.0e8
start = "now"
warp = 345600.0                # 4 days per second: the binary turns in 48 s
up = "orbit_normal:PSR B1620-26 B"

[sky.cluster]
file = "stars/m4.csv"
center_ra_dec_deg = [245.896744, -26.525749] # Baumgardt & Vasiliev 2021, as the file
distance_pc = 1850.0
viewer_ra_dec_deg = [245.9092575, -26.5316025] # the pulsar [TH99]
viewer_depth_pc = 0.0          # assumed

[[bodies]]
name = "PSR B1620-26"
kind = "barycenter"

# The inner binary and the planet around the triple's barycentre: the planet
# relative to the binary [TH99 Table 2], split by the masses.
[[bodies]]
name = "PSR B1620-26 AB"
parent = "PSR B1620-26"
kind = "barycenter"
orbit_color = "#8090b0"
[bodies.orbit]
scale = -0.001410130416        # -m_b / M
type = "visual_orbit"
gm_km3_s2 = 2.246007400e11     # 1.35 + 0.34 M_sun + 2.5 M_Jup
period_days = 22572.45         # 61.8 Julian years
e = 0.0
i_deg = 29.23
node_deg = 45.73               # assumed: 40 deg from the inner orbit [ST05]
arg_peri_deg = 0.0
t_peri_jd_tdb = 2437817.775    # planet at its ascending node: P/2 before the binary's [TH99]
sky_ra_dec_deg = [245.9092575, -26.5316025]

[[bodies]]
name = "PSR B1620-26 b"
parent = "PSR B1620-26"
radii_km = [71492.0]           # one Jupiter radius (assumed)
color = "#c8b8a0"
style = "gas_giant"
orbit_color = "#90e0b0"
[bodies.orbit]
scale = 0.998589869584         # M_AB / M
type = "visual_orbit"
gm_km3_s2 = 2.246007400e11
period_days = 22572.45
e = 0.0
i_deg = 29.23
node_deg = 45.73
arg_peri_deg = 0.0
t_peri_jd_tdb = 2437817.775
sky_ra_dec_deg = [245.9092575, -26.5316025]

# The pulsar and the white dwarf: the white dwarf relative to the pulsar
# [TH99 Table 1], whose omega is the pulsar's + 180 deg.
[[bodies]]
name = "PSR B1620-26 A"
parent = "PSR B1620-26 AB"
kind = "star"
radii_km = [12.0]              # assumed
temperature_k = 100000.0       # assumed
luminosity_solar = 2.7e-5
orbit_color = "#a0b8ff"
[bodies.pulsar]
spin_axis_orbit_normal = "PSR B1620-26 B"
magnetic_inclination_deg = 45.0
beam_half_angle_deg = 10.0
display_period_s = 2.0
beam_color = "#b8c8ff"
[bodies.orbit]
scale = -0.201183431953        # -m_wd / (m_p + m_wd)
type = "visual_orbit"
gm_km3_s2 = 2.242840237e11     # 1.69 M_sun
period_days = 191.44281
e = 0.02531545
i_deg = 56.4825
node_deg = 0.0                 # assumed
arg_peri_deg = 297.1291        # the white dwarf's
t_peri_jd_tdb = 2448728.76242
sky_ra_dec_deg = [245.9092575, -26.5316025]

[[bodies]]
name = "PSR B1620-26 B"
parent = "PSR B1620-26 AB"
kind = "star"
radii_km = [16012.6]           # 0.023 R_sun (derived)
temperature_k = 7820.0
luminosity_solar = 1.8e-3
orbit_color = "#fff0d0"
[bodies.orbit]
scale = 0.798816568047         # m_p / (m_p + m_wd)
type = "visual_orbit"
gm_km3_s2 = 2.242840237e11
period_days = 191.44281
e = 0.02531545
i_deg = 56.4825
node_deg = 0.0
arg_peri_deg = 297.1291
t_peri_jd_tdb = 2448728.76242
sky_ra_dec_deg = [245.9092575, -26.5316025]

# Where the cluster's centre lies as seen from the pulsar (0.408 pc away),
# for the event that looks at it.
[[bodies]]
name = "M4 centre"
parent = "PSR B1620-26"
kind = "barycenter"
trail = "none"
[bodies.orbit]
type = "fixed"
ra_dec_distance_pc = [169.0409165, 24.4933109, 0.40793]

[[bodies]]
name = "Sun"
parent = "PSR B1620-26"
kind = "star"
radii_km = [695700.0]
body_gm_km3_s2 = 1.32712440041279419e11 # JPL DE440
temperature_k = 5772.0
luminosity_solar = 1.0
trail = "none"
[bodies.orbit]                 # opposite direction of the pulsar as seen from the Sun
type = "fixed"
ra_dec_distance_pc = [65.9092575, 26.5316025, 1850.0]

[[events]]
name = "The pulsar and its white dwarf: 191 days, 0.77 au"
time = "2026-01-01"
focus = "PSR B1620-26 AB"
distance_km = 6.0e8
warp = 345600.0

[[events]]
name = "Pulsar beams sweeping (drawn slowed down: really 90 turns a second)"
time = "2026-01-01"
focus = "PSR B1620-26 A"
distance_km = 2.0e6
warp = 600.0

[[events]]
name = "The planet's 62-year orbit, tilted 40 deg to the binary's"
time = "2026-01-01"
focus = "PSR B1620-26"
from_orbit_normal = "PSR B1620-26 b"
distance_km = 8.0e9
warp = 31557600.0              # 1 year per second

[[events]]
name = "PSR B1620-26 b, 19 au from its two dead stars"
time = "2026-01-01"
focus = "PSR B1620-26 b"
from_body = "PSR B1620-26 AB"
phase_deg = -150.0
distance_km = 3.5e5
warp = 3600.0

[[events]]
name = "Toward the core of M4, 0.4 pc away"
time = "2026-01-01"
focus = "PSR B1620-26 AB"
from_body = "M4 centre"
phase_deg = 180.0
distance_km = 6.0e8
warp = 345600.0
