t_transit_bjd_tdb = 2455700.146170501596430
e = 0.172729064427036
arg_peri_deg = 85.015828120049491
i_deg = 90.301811036839879
node_deg = 0.0
transit_u_deg = 90.0
sky_ra_dec_deg = [298.318417682, 47.279530121]

[[nbody.members]]
