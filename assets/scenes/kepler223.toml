[[events]]
name = "The 3:4:6:8 chain, face-on"
time = "2026-01-01"
focus = "Kepler-223"
from_orbit_normal = "Kepler-223 c"
distance_km = 6.0e7
warp = 43200.0
# [MI16]
caption = """\
    Four planets a little smaller than Neptune, locked in step: for every three laps of \
    the outermost, the others make four, six and eight. Such a chain forms when young \
    planets drift inward through the gas disk around their star, and this one survives \
    as a relic of that time."""

[[events]]
name = "Edge-on, as Kepler saw it (2011-05)"
time_tdb = "2011-05-18 12:00:00"
focus = "Kepler-223"
from_body = "Sun"
distance_km = 1.2e8
warp = 21600.0
# [MI16], [GAIA]
caption = """\
    From the Earth, 2,000 parsecs away, the orbits are seen almost edge-on, so the \
    planets cross the face of their star. The Kepler telescope timed those transits; the \
    small shifts in their timing, as the planets tug at one another, revealed the \
    resonant chain and the planets' masses."""
