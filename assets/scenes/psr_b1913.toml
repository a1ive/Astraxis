# PSR B1913+16, the Hulse-Taylor binary pulsar: two neutron stars on a 7.75-hour
# orbit whose periastron advances by 4.2 deg a year - 35,000 times Mercury's rate -
# and whose period shrinks as gravitational waves carry energy away (the 1993 Nobel
# Prize in Physics). Only one of the two is seen as a pulsar.
#
# Relativity vs Newton: the two stars move on the orbit of the relativistic timing
# model (orbit type "post_keplerian", src/ephem/post_keplerian.hpp: the periastron
# turns as omega = omega0 + k A_e, the period changes by Pb_dot). The two hollow
# "(Newton)" markers and their grey ellipses are what Newtonian gravity predicts from
# the orbit as it was on the day of discovery: a fixed ellipse, the same forever.
# Since 1974 the real one has turned some 220 deg away from it. The period decay
# shifts the stars along the orbit by only about two minutes over those decades.
#
# [WH16] Weisberg & Huang 2016, ApJ 829, 55 (arXiv:1606.02744), DD timing model:
#        Table 1: position RA 19h15m27.99942s, Dec +16d06'27.3868" (J2000).
#        Table 2: T0 = MJD 52144.90097849, x = a_p sin i = 2.341776 lt-s,
#        e = 0.6171340, Pb = 0.322997448918 d, omega0 (the pulsar's) = 292.54450 deg,
#        <omega_dot> = 4.226585 deg/yr, Pb_dot(obs) = -2.423e-12.
#        Sec. 6.1 (from omega_dot and gamma, assuming GR): pulsar 1.438 M_sun,
#        companion 1.390 M_sun, sin i = 0.7327 +- 0.0004.
#        Sec. 7: Pb_dot(GR) = -2.40263e-12, against an intrinsic (galaxy-corrected)
#        -2.398e-12. The pulsar's spin frequency f = 16.9405 Hz (59 ms).
#        Sec. 2: geodetic precession of the pulsar's spin axis changes its pulse
#        profile, more and more as our line of sight nears the edge of the beam.
#        Sec. 4.4: the published fits of the spin geometry are inconsistent (too
#        much so to correct the timing for aberration).
# [WT02] Weisberg & Taylor 2002, ApJ 576, 942 (https://arxiv.org/abs/astro-ph/0205280):
#        Table 1 solution 1: i = 47.2 deg, lambda = 21.1 deg, alpha = 157.5 deg,
#        T0 = 1981.0. Eqs. 2 and 5 define the spin and its angle to Earth.
#        The beam fit is an hourglass with axial ratio R = 1.59; not modeled here.
# [BO75] Barker & O'Connell 1975, Phys. Rev. D 12, 329, doi:10.1103/PhysRevD.12.329:
#        orbit-averaged geodetic rate from the [WH16] masses: 1.214665 deg/yr
#        (WT02 quotes 1.213 deg/yr using earlier masses).
# [KR98] Kramer 1998, ApJ 509, 856 (https://arxiv.org/abs/astro-ph/9808127):
#        disappearance after 2025 is a model prediction, not a confirmed observation here.
# [DA15] Damour 2015, Class. Quantum Grav. 32, 124009 (arXiv:1411.3930): discovered
#        at Arecibo on 1974 July 2 (the binary nature found that September).
# [CAP]  Event captions (retrieved 2026-10-07), besides the sources above:
#        [NOB93] nobelprize.org, The Nobel Prize in Physics 1993 (press release): to Hulse and
#          Taylor "for the discovery of a new type of pulsar, a discovery that has opened up
#          new possibilities for the study of gravitation"; the binary pulsar could be used
#          to demonstrate gravitational radiation, confirmed by Taylor in 1978.
# Derived (GM = mass * GM_sun, 1.32712440041279419e11 km^3/s^2, JPL DE440):
#   a = 1.949e6 km (2.8 R_sun) from Kepler's third law for 2.828 M_sun; the stars are
#   746,000 km apart at periastron and 3.15e6 km at apastron, 902 km/s relative speed
#   at periastron (~450 km/s each).
#   sin i = x c / (a m_c / M) = 0.73284, i = 47.125 deg (within 1 sigma of [WH16]).
#   The GR (1PN) periastron advance for these masses is 4.2262 deg/yr, 0.0037 deg
#   per orbit; 1974-07 to 2026-10 adds up to ~221 deg.
# The sky node is assumed to be 0. WT02 defines i from orbital angular momentum
# to observer-to-pulsar K; visual_orbit's north/east/depth basis gives h dot K = -cos(i).
# Thus visual i = 132.8746 deg represents WT02 i = 47.1254 deg (the WH16 timing value).
# Spin precession uses WT02 solution 1 and a constant BO75 rate. T0 is a Julian epoch.
# Neutron stars are assumed 12 km in radius at 1e5 K (L = 2.7e-5 L_sun).
# The two radio beams are invisible in reality, drawn bluish here. Their circular
# half-angle 15.15 deg is chosen to leave Earth's sightline near 2025 with this
# geometry; it is not a measured width. Flash intensity tapers to zero across the
# outer 20% of this cone. WT02's hourglass and radio pulse profiles are not modeled.
# Beams turn once every 2 s of real time (true spin: 59 ms), stopping on pause.
# Precession follows simulated time, including jumps and reverse playback.
# Times are those of the timing model, i.e. as seen from the solar system barycentre
# (light travel time not removed).
# [DE18] Deller et al. 2018 (arXiv:1806.10265), abstract: from the VLBI parallax, a distance
#        of 4.1 +2.0 -0.7 kpc (the dispersion measure suggests 9.8 +- 3.1 kpc).
# The sky is a model of the Milky Way as seen from here (tools/sky/make_galaxy_sky.py,
# assets/sky/SOURCES.md): its stars and dust clouds are statistical, not real ones.
# Check (tests/relativity_tests.cpp): the Roemer delay and velocity amplitude, the periastron
# advance and period decay against GR, the 1974 Newtonian orbit, WT02 spin geometry
# and the illustrative beam exit. Event tests check the fixed Earth sightline.

name = "PSR B1913+16 (Hulse-Taylor)"

[sky]
viewer_ra_dec_distance_pc = [288.86666425, 16.10760744, 4100.0]   # [WH16] position, [DE18] distance
milky_way = "sky/psr_b1913.jpg"
stars = "sky/psr_b1913_stars.csv"

[view]
focus = "PSR B1913+16 system"
distance_km = 8.0e6
start = "now"
warp = 1800.0                  # one orbit in 15 s
up = "orbit_normal:B1913+16 companion"

[[bodies]]
name = "PSR B1913+16 system"
kind = "barycenter"
body_gm_km3_s2 = 3.7531078044e11 # 1.438 + 1.390 M_sun [WH16]

# Both stars from the companion's orbit relative to the pulsar [WH16 Table 2], split
# by the masses; its omega is the pulsar's + 180 deg.
[[bodies]]
name = "PSR B1913+16"
parent = "PSR B1913+16 system"
kind = "star"
radii_km = [12.0]              # assumed
temperature_k = 100000.0       # assumed
luminosity_solar = 2.7e-5
orbit_color = "#a0b8ff"
[bodies.pulsar]
spin_axis_orbit_normal = "B1913+16 companion"
magnetic_inclination_deg = 157.5 # [WT02] Table 1, solution 1
beam_half_angle_deg = 15.15      # illustrative circular edge: exits near 2025, not a fitted beam
beam_cutoff = true
display_period_s = 2.0
beam_color = "#b8c8ff"
[bodies.pulsar.geodetic_precession]
misalignment_deg = 21.1         # [WT02] Table 1, solution 1 (lambda, also called delta)
epoch_year = 1981.0             # [WT02] T0; interpreted as a Julian epoch
[bodies.orbit]
scale = -0.491513437058        # -m_c / (m_p + m_c)
type = "post_keplerian"
gm_km3_s2 = 3.7531078044e11
period_days = 0.322997448918
e = 0.6171340
i_deg = 132.8746               # visual_orbit i = 180 - WT02 i; h dot K = cos(47.1254 deg)
node_deg = 0.0                 # assumed
arg_peri_deg = 112.54450       # the companion's at T0
t_peri_jd_tdb = 2452145.40097849 # T0 = MJD 52144.90097849
omega_dot_deg_per_year = 4.226585
pb_dot = -2.423e-12
sky_ra_dec_deg = [288.86666425, 16.10760744]

[[bodies]]
name = "B1913+16 companion"
parent = "PSR B1913+16 system"
kind = "star"
radii_km = [12.0]              # assumed
temperature_k = 100000.0       # assumed
luminosity_solar = 2.7e-5
orbit_color = "#ffc890"
[bodies.orbit]
scale = 0.508486562942         # m_p / (m_p + m_c)
type = "post_keplerian"
gm_km3_s2 = 3.7531078044e11
period_days = 0.322997448918
e = 0.6171340
i_deg = 132.8746               # visual_orbit i = 180 - WT02 i; h dot K = cos(47.1254 deg)
node_deg = 0.0
arg_peri_deg = 112.54450
t_peri_jd_tdb = 2452145.40097849
omega_dot_deg_per_year = 4.226585
pb_dot = -2.423e-12
sky_ra_dec_deg = [288.86666425, 16.10760744]

# The Newtonian prediction from the day of discovery [DA15].
[[bodies]]
name = "PSR B1913+16 (Newton)"
parent = "PSR B1913+16 system"
kind = "ghost"
orbit_color = "#687086"
[bodies.orbit]
scale = -0.491513437058
type = "post_keplerian"
newtonian_from = "1974-07-02"
gm_km3_s2 = 3.7531078044e11
period_days = 0.322997448918
e = 0.6171340
i_deg = 132.8746               # visual_orbit i = 180 - WT02 i; h dot K = cos(47.1254 deg)
node_deg = 0.0
arg_peri_deg = 112.54450
t_peri_jd_tdb = 2452145.40097849
omega_dot_deg_per_year = 4.226585
pb_dot = -2.423e-12
sky_ra_dec_deg = [288.86666425, 16.10760744]

[[bodies]]
name = "Companion (Newton)"
parent = "PSR B1913+16 system"
kind = "ghost"
orbit_color = "#86786a"
[bodies.orbit]
scale = 0.508486562942
type = "post_keplerian"
newtonian_from = "1974-07-02"
gm_km3_s2 = 3.7531078044e11
period_days = 0.322997448918
e = 0.6171340
i_deg = 132.8746               # visual_orbit i = 180 - WT02 i; h dot K = cos(47.1254 deg)
node_deg = 0.0
arg_peri_deg = 112.54450
t_peri_jd_tdb = 2452145.40097849
omega_dot_deg_per_year = 4.226585
pb_dot = -2.423e-12
sky_ra_dec_deg = [288.86666425, 16.10760744]

[[events]]
name = "Two neutron stars, 7.75 hours per orbit (grey: Newton's orbit from 1974)"
time = "2026-01-01"
focus = "PSR B1913+16 system"
from_orbit_normal = "B1913+16 companion"
distance_km = 8.0e6
warp = 1800.0
# [WH16], [DA15], [NOB93]
caption = """\
    Two neutron stars, each about 1.4 times the Sun's mass, orbit each other every \
    7.75 hours. Found at Arecibo in 1974, the first binary pulsar provided a test \
    of Einstein's gravity and won Hulse and Taylor the 1993 Nobel Prize. The grey \
    ellipse shows the Newtonian orbit."""

[[events]]
name = "1974 to today: the periastron turns 220 deg, Newton's orbit stays put"
time = "1974-07-02"
focus = "PSR B1913+16 system"
from_orbit_normal = "B1913+16 companion"
distance_km = 8.0e6
warp = 15778800.0              # half a year per second: 4.2 deg in 2 s
# [WH16]
caption = """\
    Starting in 1974, the relativistic orbit's long axis turns 4.2 degrees a year, \
    35,000 times faster than Mercury's, while Newton's ellipse stays fixed. By \
    today the two have parted by some 220 degrees."""

[[events]]
name = "Periastron: 746,000 km apart, 450 km/s each"
time_tdb = "2026-01-01 12:41"  # 20 min before periastron [WH16]
focus = "PSR B1913+16 system"
distance_km = 2.5e6
warp = 60.0
# [WH16]
caption = """\
    At closest approach the stars are 746,000 km apart, about twice the distance \
    to the Moon, and each moves at 450 km/s. Relativistic delays in the pulsar's \
    signals at this part of the orbit allowed astronomers to determine both stars' \
    masses."""

[[events]]
name = "Pulsar beams (drawn slowed down: really 17 turns a second)"
time = "2026-01-01"
focus = "PSR B1913+16"
distance_km = 3.0e5
warp = 30.0
# [WH16]
caption = """\
    The pulsar spins 17 times a second; its radio beams are drawn here, slowed down. Its \
    spin axis also slowly precesses, another effect of relativity, so the pulses we \
    receive change shape over the years."""

[[events]]
name = "A full turn every 85 years (3 years per second): back on Newton's ellipse in 2059"
time = "2026-01-01"
focus = "PSR B1913+16 system"
from_orbit_normal = "B1913+16 companion"
distance_km = 8.0e6
warp = 1.0e8
# [WH16], [NOB93]
caption = """\
    At three years per second the orbit swings all the way round in under half a \
    minute: a full turn takes 85 years. Gravitational waves also carry energy \
    away, shrinking the orbit too slowly to see here. This matches the prediction \
    of general relativity and provided the first evidence for gravitational waves."""

[[events]]
name = "Seen from Earth: the beams precess out of view (prediction)"
time = "1974-07-02"
focus = "PSR B1913+16"
from_earth = true
distance_km = 3.0e5
warp = 94672800.0              # three Julian years per second; reaches 2025 in 17 s
# [WT02] spin geometry, [KR98] disappearance prediction; circular beam is illustrative.
caption = """\
    Seen from Earth's direction, the pulsar flashes as a radio beam sweeps past. \
    Relativity turns its spin axis about 1.215 degrees a year. At three years per \
    second, the pulses fade as the beam turns away. Disappearance around 2025 was \
    a prediction; the circular beam drawn here is illustrative, and its width \
    sets the date. The spin is slowed down."""
