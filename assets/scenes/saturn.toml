# Saturn, its rings, the seven major moons, and Cassini's tour (2004-2017) with
# the Huygens probe's descent to Titan.
#
# Sources
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        ephemeris SAT441, Laplace-plane frame, epoch 2000-01-01.5 TDB.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
# [PCK]  NAIF pck00011.tpc (IAU 2015): poles, prime meridians, radii, the linear pole
#        drift and the periodic terms (Saturn's angles S1..S6, 2 S1, 2 S2): e.g. Mimas'
#        prime meridian term of 44.85 deg follows its 71-year libration, and paired RA/W
#        terms (Mimas 13.5, Tethys 9.6, Rhea 3.1 deg) move the pole.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [APX]  E. M. Standish, Approximate Positions of the Planets, Tables 2a + 2b.
# [HZN]  JPL Horizons state vectors relative to Saturn's center, baked by
#        tools/bake/horizons_bake.py (tools/bake/ephem.toml, Kepler-relative AXEPH2):
#        Cassini 2004-06-01 .. its entry into Saturn on 2017-09-15 (navigation team's
#        post-mission reconstruction), Huygens 2004-12-25 .. 2005-01-14 (landing), and the
#        moons 2004-06-01 .. 2017-09-16. Outside that span the moons fade over one day
#        into the mean elements [ELEM]. Saturn's heliocentric orbit (Sun direction): the
#        Saturn system barycenter, 1977-2100 [HZN], else [APX].
# [RSS]  Rings: normal optical depth from the Cassini Radio Science occultation of
#        2005-05-03 (Rev 7 egress, X band), PDS volume CORSS_8001 (Marouf et al.),
#        averaged to 8.8 km bins by tools/rings/make_saturn_rings.py; see
#        assets/rings/SOURCES.md. Opaque parts of the B ring are clipped at the
#        detection threshold (tau ~ 5).
#
# Mean elements: [ELEM]'s phase angles for Saturn's moons do not match SAT441 at
# their epoch: at J2000 the mean longitudes are off by 6-157 deg (for Jupiter's
# JUP365 table they match to 0.3 deg). The node, argument of periapsis and mean
# anomaly at the epoch are therefore fitted to the Horizons tables over 2004-2017
# by tools/bake/fit_moon_phase.py, keeping [ELEM]'s a, e, i, pole and rates
# (rms angle: Iapetus 0.06, Titan 0.22, Dione 0.26, Enceladus 0.41, Rhea 0.46,
# Tethys 0.68 deg). Mimas stays off by 14 deg rms (up to ~40 deg): its mean
# longitude librates by +-44 deg over 70 years in the resonance with Tethys,
# which a precessing ellipse cannot follow.
#
# [ELEM]'s period P for Saturn's moons is that of the mean longitude
# (360 / P equals the PCK spin rate to 1e-4 deg/day), while the model here advances
# the mean anomaly. So period_days = 360 / (W' - omega' - node'), with W' the PCK spin
# rate (all seven are synchronous), omega' = +360 / (365.25 apsis_period) and
# node' = -360 / (365.25 node_period): Saturn's oblateness advances the apsides and
# regresses the nodes (for Mimas the two periods are in the 1:2 ratio that implies),
# and Enceladus' apsidal period (2.916 yr) is that of its forced precession,
# 2 n_Dione - n_Enceladus, which is prograde. Tethys' listed apsidal period
# (0.005 yr, with e = 0.001) is left out: it would run the mean anomaly backward.
#
# Moon maps: USGS Cassini ISS mosaics (see assets/textures/SOURCES.md); colors are
# used where a map is missing. Colors are sRGB; the planet's banding is procedural ("saturn" style: pale bands and
# the north polar hexagon at ~78 deg N, illustrative). Ring tint and phase function are
# illustrative too (backscattering ice particles); their brightness otherwise follows
# from the optical depth, the lighting and the viewing geometry.

name = "Saturn"

[view]
focus = "Saturn"
distance_km = 1.2e6
pitch_deg = 18.0
start = "now"
warp = 3600.0                  # 1 hour per second: Saturn turns in 10.5 seconds

# Heliocentric orbit of the scene origin, used for the Sun direction.
[origin_heliocentric]                      # [HZN] Saturn barycenter
type = "ephemeris"
file = "ephem/saturn.eph"
[origin_heliocentric.fallback]             # [APX] Tables 2a + 2b
type = "jpl_approx_planet"
a_au = [9.54149883, -0.00003065]
e = [0.05550825, -0.00032044]
i_deg = [2.49424102, 0.00451969]
mean_longitude_deg = [50.07571329, 1222.11494724]
lon_peri_deg = [92.86136063, 0.54179478]
node_deg = [113.63998702, -0.25015002]
b = 0.00025899
c = -0.13434469
s = 0.87320147
f = 38.35125000

[[bodies]]
name = "Saturn"
radii_km = [60268.0, 54364.0]              # equatorial, polar [PCK]
gm_km3_s2 = 37940584.8418                  # system [GM]
pole_ra_dec_deg = [40.589, 83.537]         # [PCK]
prime_meridian_deg = [38.90, 810.7939024]  # System III [PCK]
pole_rate_deg_per_century = [-0.036, -0.004]
nut_prec_angles = [[353.32, 75706.7], [28.72, 75706.7], [177.40, -36505.5], [300.00, -7225.9],
                   [316.45, 506.2], [345.20, -1016.3], [706.64, 151413.4], [57.44, 151413.4]]  # [PCK] BODY6
color = "#e3d3a3"
style = "saturn"

[bodies.rings]                             # [RSS]
profile = "rings/saturn_rss.ring"
color = "#d6c3a0"
gain = 1.0
phase_g = -0.3

