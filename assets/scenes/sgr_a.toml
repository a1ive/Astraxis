# Sagittarius A*: the Galactic Centre black hole and the star S2, whose orbit
# shows the Schwarzschild precession (~12 arcmin per orbit) measured by GRAVITY.
#
# Orbits are integrated as timelike geodesics of the Kerr metric
# (src/ephem/kerr_geodesic.cpp, ported from the reference project) - not
# Keplerian ellipses.
#
# [GR20] GRAVITY Collaboration 2020, A&A 636, L5 (arXiv:2004.07187), Table E.1:
#        M = 4.261e6 M_sun, R0 = 8246.7 pc; S2: a = 125.058 mas, e = 0.884649,
#        i = 134.567 deg, omega = 66.263 deg, Omega = 228.171 deg, P = 16.0455 yr,
#        t_peri = 2018.37900 (Julian year). The elements are osculating at the epoch
#        of the last apocentre (2010), so the integration starts there.
# [RB04] Reid & Brunthaler 2004, ApJ 616, 872: Sgr A* at RA 17h45m40.0400s,
#        Dec -29d00m28.138s (ICRS) - orients the orbit on the sky.
# [HA17] Habibi et al. 2017, ApJ 847, 120: S-stars incl. S2 have T_eff 21,000-28,500 K
#        (B0-B3 V). We use 25,000 K; the radius (6 R_sun) is an assumption typical of
#        such stars, and L = R^2 (T / 5772 K)^4 follows from it.
#
# [CAP]  Event captions (retrieved 2026-10-07), besides the sources above:
#        [GR18] GRAVITY Collaboration 2018, A&A 615, L15: at pericentre (May 2018, 120 au) S2
#          moves at ~7,650 km/s; the gravitational redshift and transverse Doppler effect
#          detected.
#        [NOB20] nobelprize.org, The Nobel Prize in Physics 2020: half to Genzel and Ghez "for
#          the discovery of a supermassive compact object at the centre of our galaxy".
#        [EHT22] Event Horizon Telescope Collaboration 2022, ApJL 930, L12: the first image of
#          Sgr A* (published 2022-05-12, from 2017 data), a ring 51.8 microarcseconds across
#          around a dark shadow.
# Rendering: the hole is ray traced (src/ephem/kerr_null.cpp, shaders/black_hole.frag.hlsl):
# shadow, lensed starfield and an ILLUSTRATIVE thin accretion disk (temperature profile
# T ~ r^-3/4 (1 - sqrt(r_in/r))^1/4 from the ISCO, Doppler beaming and gravitational
# redshift). Sgr A*'s real accretion flow is hot, thick and radiatively inefficient; the
# disk axis (here the north Galactic pole) is likewise an artistic choice.
#
# Model choices: the hole is taken as non-spinning (Schwarzschild). Its spin is not
# measured; S2's orbit is not in any assumed equatorial plane, and spin effects at
# S2's distance are tiny compared with the Schwarzschild precession.
# The "Death Star" is NOT a real object (nor a real-sized one): a test particle on an
# orbit with pericentre 40 M (~1.7 au), where the periapsis advances by ~18 deg per
# orbit. The line of apsides is drawn at each periapsis, so the lines fan out as
# the orbit precesses. Its radius is exaggerated ~30,000x (the fictional DS-I is
# ~160 km across) so it shows as a sphere in the orbit view; this does not affect
# its motion. It is lit by the accretion disk.
# Relativity vs Newton: the hollow "(Newton)" markers and their grey ellipses follow
# the Keplerian orbits of the same elements - where each star would go without
# relativity. S2's leaves its ghost from the 2010 apocentre, where its elements are
# osculating (the ellipses part by ~12 arcmin per orbit); the Death Star's from
# wherever its rolling integration last (re)started from the elements (~18 deg per orbit).
# [GI17] Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), Table 3: the orbits of
#        the other S-stars (see the note before the events).
# The sky is a model of the Galaxy as seen from Sgr A* (tools/sky/make_galaxy_sky.py,
# assets/sky/SOURCES.md): the nuclear star cluster all around, the nuclear stellar disk
# and the bulge, dimmed by the nuclear molecular disk and the circumnuclear disk. Its
# stars and dust clouds are statistical, not real ones; stars closer than 0.2 pc are
# left out of it (they would shift as the camera moves) - only the S-stars are there.

name = "Sgr A*"

[sky]
viewer_ra_dec_distance_pc = [266.41683333, -29.00781611, 8246.7]   # Sgr A* [RB04] at [GR20]'s R0
milky_way = "sky/sgr_a.jpg"
stars = "sky/sgr_a_stars.csv"

[view]
focus = "Sgr A*"
distance_km = 6.0e11           # ~4000 au: the whole S2 orbit
start = "now"
warp = 2629800.0               # 1 month per second: an S2 orbit in ~3 minutes
up = "Sgr A*"                  # the disk axis

[[bodies]]
name = "Sgr A*"
kind = "black_hole"
gm_km3_s2 = 5.65487707e17      # 4.261e6 GM_sun [GR20]
spin = 0.0
pole_ra_dec_deg = [192.85948, 27.12825]   # disk axis: north Galactic pole (illustrative)
disk_outer_m = 25.0
disk_temperature_k = 6500.0
disk_brightness = 0.6

[[bodies]]
name = "S2"
parent = "Sgr A*"
kind = "star"
radii_km = [4174200.0]         # 6 R_sun (assumed)
temperature_k = 25000.0        # [HA17]
luminosity_solar = 12669.0
orbit_color = "#a9c8ff"
trail_history_days = 5860.0    # one orbit (16.0455 yr)
[bodies.orbit]
type = "kerr_geodesic"
elements_epoch = "previous_apocentre"
span_years = [1850.0, 2200.0]
step_eta = 0.003
[bodies.orbit.elements]        # [GR20] Table E.1
a_mas = 125.058
distance_pc = 8246.7
e = 0.884649
i_deg = 134.567
node_deg = 228.171
arg_peri_deg = 66.263
t_peri_year = 2018.37900
sky_ra_dec_deg = [266.41683333, -29.00781611]   # [RB04]

[[bodies]]
name = "Death Star"
parent = "Sgr A*"
kind = "planet"
style = "death_star"
radii_km = [5.0e6]             # EXAGGERATED for visibility (see the header)
color = "#a7abb0"
prime_meridian_deg = [0.0, 720.0]   # one turn every 12 h (arbitrary)
orbit_color = "#ffd27f"
trail_history_days = 8.0       # ~3.5 orbits: the rosette
mark_periapsides = true
[bodies.orbit]
type = "kerr_geodesic"
rolling_window_days = 30.0     # integrated around the current time
step_eta = 0.004
[bodies.orbit.elements]        # hypothetical: r_p = 40 M = 2.52e8 km, e = 0.7
a_au = 5.607833
e = 0.7
i_deg = 134.567
node_deg = 300.0
arg_peri_deg = 0.0
t_peri_year = 2026.0
sky_ra_dec_deg = [266.41683333, -29.00781611]

# Without relativity: the same elements as Keplerian ellipses (see the header).
[[bodies]]
name = "S2 (Newton)"
parent = "Sgr A*"
kind = "ghost"
orbit_color = "#687086"
[bodies.orbit]
type = "visual_orbit"
gm_km3_s2 = 5.65487707e17
a_mas = 125.058
distance_pc = 8246.7
e = 0.884649
i_deg = 134.567
node_deg = 228.171
arg_peri_deg = 66.263
t_peri_year = 2018.37900
sky_ra_dec_deg = [266.41683333, -29.00781611]

[[bodies]]
name = "Death Star (Newton)"
parent = "Sgr A*"
kind = "ghost"
orbit_color = "#86826a"
[bodies.orbit]
type = "visual_orbit"
gm_km3_s2 = 5.65487707e17
a_au = 5.607833
e = 0.7
i_deg = 134.567
node_deg = 300.0
arg_peri_deg = 0.0
t_peri_year = 2026.0
sky_ra_dec_deg = [266.41683333, -29.00781611]

