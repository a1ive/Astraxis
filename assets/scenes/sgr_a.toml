# Sagittarius A*: the Galactic Centre black hole, S2 and S301. S2 precesses by
# about 12 arcmin per orbit. S301's tighter orbit precesses by about 2 degrees.
#
# S2, S301 and the Death Star follow timelike geodesics (src/ephem/kerr_orbit.cpp).
#
# [GR20] GRAVITY Collaboration 2020, A&A 636, L5 (arXiv:2004.07187), Table E.1:
#        M = 4.261e6 M_sun, R0 = 8246.7 pc; S2: a = 125.058 mas, e = 0.884649,
#        i = 134.567 deg, omega = 66.263 deg, Omega = 228.171 deg, P = 16.0455 yr,
#        t_peri = 2018.37900 (Julian year). The elements are osculating at the epoch
#        of the last apocentre (2010), so the integration starts there.
# [GR26] Abd El Dayem et al. 2026 (arXiv:2607.12664), Extended Data Table 2, first
#        solution. Astrometry admits two 3D orientations pending radial velocities.
#        As for S2, initialize the geodesic at the preceding apocentre using this
#        scene's mass and distance. The paper fits a 1PN orbit with light-time delay.
# [RB04] Reid & Brunthaler 2004, ApJ 616, 872: Sgr A* at RA 17h45m40.0400s,
#        Dec -29d00m28.138s (ICRS) - orients the orbit on the sky.
# [HA17] Habibi et al. 2017, ApJ 847, 120: S-stars incl. S2 have T_eff 21,000-28,500 K
#        (B0-B3 V). We use 25,000 K; the radius (6 R_sun) is an assumption typical of
#        such stars, and L = R^2 (T / 5772 K)^4 follows from it.
#
# [CAP]  Event captions (retrieved 2026-10-07), besides the sources above:
#        [GR18] GRAVITY Collaboration 2018, A&A 615, L15: at pericentre (May 2018, 120 au) S2
#          moves at ~7,650 km/s; the gravitational redshift and transverse Doppler effect
#          detected.
#        [NOB20] nobelprize.org, The Nobel Prize in Physics 2020: half to Genzel and Ghez "for
#          the discovery of a supermassive compact object at the centre of our galaxy".
#        [EHT22] Event Horizon Telescope Collaboration 2022, ApJL 930, L12: the first image of
#          Sgr A* (published 2022-05-12, from 2017 data), a ring 51.8 microarcseconds across
#          around a dark shadow.
# Spin and accretion flow:
# [EHT22V] Event Horizon Telescope Collaboration 2022, ApJL 930, L16 (arXiv:2311.09478):
#        the models passing all constraints have prograde spin a = 0.5 or 0.94 and
#        inclination <= 50 deg.
# [EHT24VIII] Event Horizon Telescope Collaboration 2024, ApJL 964, L26: with an external
#        Faraday screen the one model passing every total-intensity and polarimetric
#        constraint has a = 0.94 and i = 150 deg (clockwise on the sky, as [GR18F]).
# [JA25] Janssen et al. 2025, A&A 698, A62 (arXiv:2506.13877), sec. 4: the projected
#        accretion-flow angular momentum at position angle ~106-137 deg east of north. We
#        take 121 deg; the spin's direction on the sky is not measured otherwise.
# [GR18F] GRAVITY Collaboration 2018, A&A 618, L10: near-infrared flares orbit clockwise
#        on the sky, near face-on, at ~6-10 gravitational radii; sec. 3.1: the 2018-07-22
#        flare at R ~ 7 (NERO) - 8 (GYOTO) R_g, P = 40 +- 8 min, flares lasting 30-90 min.
# [GR23] GRAVITY Collaboration 2023, A&A 677, L10 (arXiv:2307.11821): polarimetric and
#        astrometric flares fit R ~ 9 R_g, i ~ 155 deg, P ~ 60 min; introduction: flares of
#        ten times the quiescent flux once or twice per day.
# [WI22A] Wielgus et al. 2022, A&A 665, L6 (arXiv:2209.09926): ALMA polarimetric loops on
#        2017-04-11 from 09:20 UT, ~2 h, after an X-ray flare peaking at 08:48 UT; r_orb ~ 11
#        r_g, period 74 +- 6 min, Gaussian hot spot ~6 r_g across, clockwise; sec. 3.1: the
#        hot spot's flux I_hotspot <~ 0.3 Jy.
# The flares between these are RANDOM (src/scene/flares.cpp): 1.5 a day, 30-90 min, at
# 7-11 r_g, drawn from the time alone - a statistical illustration, not observed events.
# [BR09] Broderick et al. 2009, ApJ 697, 45 (arXiv:0809.4490), sec. II.1, eqs. 1, 2, 4:
#        the RIAF - n_e ~ (r/r_S)^-1.1 exp(-z^2/2 rho^2), T_e ~ (r/r_S)^-0.84, toroidal
#        field at beta = 10, Keplerian outside the ISCO and plunging inside.
# [EM21] Emami et al. 2021, ApJ 923, 272 (arXiv:2101.05327), sec. V.2.1: T_e0 = 1.5e11 K.
# [LGN11] Leung, Gammie & Noble 2011, ApJ 737, 21, eq. 72: thermal synchrotron emissivity.
# [WI22] Wielgus et al. 2022, ApJL 930, L19 (arXiv:2207.06829), Table 1: 2.44 +- 0.23 Jy
#        at 228-230 GHz (ALMA + SMA, April 2017) - the density n_e0 is set to give it.
#
# Rendering: the hole is ray traced (src/ephem/kerr_null.cpp, shaders/black_hole.hlsli):
# shadow and lensed starfield, and the RIAF integrated along each ray at 230 GHz
# (src/ephem/riaf.cpp) with its Doppler and gravitational shifts. Its brightness
# temperature is drawn in FALSE COLOR and illustrative brightness; the gas is
# transparent to visible light, so it hides nothing behind it. At 230 GHz its ring is
# ~37 microarcseconds across (blurred to EHT's resolution) against the 51.8 measured:
# the plunging gas inside the photon ring outshines it.
#
# Model choices: a = 0.94 around the axis above. S2, S301 and the Death Star are
# integrated in 3D about that axis (spin_axis = "hole", src/ephem/kerr_orbit.cpp); their
# planes lie 74.5, 37.9 and 53.0 deg from the hole's equator. Spin effects at S2's
# distance are tiny compared with the Schwarzschild precession.
# The "Death Star" is NOT a real object (nor a real-sized one): a test particle on an
# orbit with pericentre ~40 M (~1.7 au), where the periapsis advances by ~15 deg per
# orbit (~18 from the mass alone, less ~2.5 from the spin) and frame dragging turns the orbit's node about the spin axis by ~1.2 deg per
# orbit (Lense-Thirring). The line of apsides is drawn at each periapsis, so the lines
# fan out as the orbit precesses. Its radius is exaggerated ~30,000x (the fictional DS-I is
# ~160 km across) so it shows as a sphere in the orbit view; this does not affect
# its motion. It is lit by the hot flow, illustratively.
# Relativity vs Newton: the hollow "(Newton)" markers and their grey ellipses follow
# the Keplerian orbits of the same elements - where each star would go without
# relativity. S2's leaves its ghost from the 2010 apocentre, where its elements are
# osculating (the ellipses part by ~12 arcmin per orbit); the Death Star's from
# wherever its rolling integration last (re)started from the elements (~15 deg per orbit).
# [GI17] Gillessen et al. 2017, ApJ 837, 30 (arXiv:1611.09144), Table 3: the orbits of
#        the other S-stars (see the note before the events).
# The sky is a model of the Galaxy as seen from Sgr A* (tools/sky/make_galaxy_sky.py,
# assets/sky/SOURCES.md): the nuclear star cluster all around, the nuclear stellar disk
# and the bulge, dimmed by the nuclear molecular disk and the circumnuclear disk. Its
# stars and dust clouds are statistical, not real ones; stars closer than 0.2 pc are
# left out of it (they would shift as the camera moves) - only the S-stars are there.

name = "Sgr A*"

[sky]
viewer_ra_dec_distance_pc = [266.41683333, -29.00781611, 8246.7]   # Sgr A* [RB04] at [GR20]'s R0
milky_way = "sky/sgr_a.jpg"
stars = "sky/sgr_a_stars.csv"

[view]
focus = "Sgr A*"
distance_km = 6.0e11           # ~4000 au: the whole S2 orbit
start = "now"
warp = 2629800.0               # 1 month per second: an S2 orbit in ~3 minutes
up = "Sgr A*"                  # the spin axis

[[bodies]]
name = "Sgr A*"
kind = "black_hole"
gm_km3_s2 = 5.65487707e17      # 4.261e6 GM_sun [GR20]
spin = 0.94                    # [EHT22V], [EHT24VIII]
[bodies.spin_sky]              # the flow's angular momentum: [EHT24VIII] i, [JA25] position angle
ra_dec_deg = [266.41683333, -29.00781611]   # [RB04]
i_deg = 150.0                  # pointing 30 deg from straight away from us: clockwise on the sky
node_deg = 31.0                # the projected axis at position angle 121 deg E of N (illustrative)
[bodies.hot_flow]              # [BR09] RIAF
model = "riaf"
n_e0_cm3 = 6.59e6              # calibrated: 2.44 Jy at 230 GHz [WI22] (relativity_tests.cpp)
t_e0_k = 1.5e11                # [EM21]
beta = 10.0                    # [BR09]
outer_m = 50.0
display_gain = 1.0
# Flares: a hot spot circling in the equatorial plane [GR18F], [GR23], [WI22A].
random_flares_per_day = 1.5    # "ten times the quiescent flux ... once or twice per day" [GR23]
flare_tau0 = 0.1               # optically thin: the spot adds light, hides nothing
flare_diameter_m = 6.0         # [WI22A] sec. 3.3: Gaussian hot spot ~6 r_g across
flare_display_gain = 5.0       # drawn spots only: brighter than at 230 GHz, as in the infrared (illustrative)
flare_t_s_k = 7.30e10          # calibrated: <~0.3 Jy at 230 GHz [WI22A] sec. 3.1 (relativity_tests.cpp)
[[bodies.hot_flow.flares]]     # [GR18F]: astrometric loop on 2018-07-22 (MJD 58321.9954)
time = "2018-07-22 23:53"
duration_min = 60.0            # "flares lasted for 30 to 90 minutes"
radius_m = 7.5                 # 7 (NERO) - 8.0 (GYOTO) R_g; period 40 +- 8 min
phase_deg = 0.0                # not constrained here (illustrative)
[[bodies.hot_flow.flares]]     # [WI22A]: ALMA loops from T0 = 09:20 UT, ~2 h, after an X-ray flare
time = "2017-04-11 10:20"
duration_min = 120.0
radius_m = 11.0                # fiducial r_orb = 11 r_g; period 74 +- 6 min
phase_deg = 0.0                # illustrative

[[bodies]]
name = "S2"
parent = "Sgr A*"
kind = "star"
radii_km = [4174200.0]         # 6 R_sun (assumed)
temperature_k = 25000.0        # [HA17]
luminosity_solar = 12669.0
orbit_color = "#a9c8ff"
trail_history_days = 5860.0    # one orbit (16.0455 yr)
[bodies.orbit]
type = "kerr_geodesic"
elements_epoch = "previous_apocentre"
span_years = [1850.0, 2200.0]
step_eta = 0.003
spin_axis = "hole"             # the hole's spin and axis: the plane turns by frame dragging
[bodies.orbit.elements]        # [GR20] Table E.1
a_mas = 125.058
distance_pc = 8246.7
e = 0.884649
i_deg = 134.567
node_deg = 228.171
arg_peri_deg = 66.263
t_peri_year = 2018.37900
sky_ra_dec_deg = [266.41683333, -29.00781611]   # [RB04]

[[bodies]]
name = "S301"
parent = "Sgr A*"
kind = "star"
radii_km = [1043550.0]         # 1.5 R_sun, midpoint of [GR26]'s estimated range
temperature_k = 7200.0        # inferred from the adopted radius and luminosity
luminosity_solar = 5.5         # [GR26] photometric estimate
orbit_color = "#81e1b9"
trail_history_days = 3200.0    # one orbit (~8.7 yr)
[bodies.orbit]
type = "kerr_geodesic"
elements_epoch = "previous_apocentre"
span_years = [1850.0, 2200.0]
step_eta = 0.0015
spin_axis = "hole"             # the hole's spin and axis: the plane turns by frame dragging
[bodies.orbit.elements]        # [GR26] first orientation, with the scene's R0
a_mas = 83.0
distance_pc = 8246.7
e = 0.9832
i_deg = 124.09
node_deg = 73.8
arg_peri_deg = 293.4
t_peri_year = 2023.126
sky_ra_dec_deg = [266.41683333, -29.00781611]   # [RB04]

[[bodies]]
name = "Death Star"
parent = "Sgr A*"
kind = "planet"
style = "death_star"
radii_km = [5.0e6]             # EXAGGERATED for visibility (see the header)
color = "#a7abb0"
prime_meridian_deg = [0.0, 720.0]   # one turn every 12 h (arbitrary)
orbit_color = "#ffd27f"
trail_history_days = 8.0       # ~3.5 orbits: the rosette
mark_periapsides = true
[bodies.orbit]
type = "kerr_geodesic"
rolling_window_days = 30.0     # integrated around the current time
step_eta = 0.004
spin_axis = "hole"             # the hole's spin and axis: the plane turns by frame dragging
[bodies.orbit.elements]        # hypothetical: r_p = 40 M = 2.52e8 km, e = 0.7
a_au = 5.607833
e = 0.7
i_deg = 134.567
node_deg = 300.0
arg_peri_deg = 0.0
t_peri_year = 2026.0
sky_ra_dec_deg = [266.41683333, -29.00781611]

# Without relativity: the same elements as Keplerian ellipses (see the header).
[[bodies]]
name = "S2 (Newton)"
parent = "Sgr A*"
kind = "ghost"
orbit_color = "#687086"
[bodies.orbit]
type = "visual_orbit"
gm_km3_s2 = 5.65487707e17
a_mas = 125.058
distance_pc = 8246.7
e = 0.884649
i_deg = 134.567
node_deg = 228.171
arg_peri_deg = 66.263
t_peri_year = 2018.37900
sky_ra_dec_deg = [266.41683333, -29.00781611]

[[bodies]]
name = "Death Star (Newton)"
parent = "Sgr A*"
kind = "ghost"
orbit_color = "#86826a"
[bodies.orbit]
type = "visual_orbit"
gm_km3_s2 = 5.65487707e17
a_au = 5.607833
e = 0.7
i_deg = 134.567
node_deg = 300.0
arg_peri_deg = 0.0
t_peri_year = 2026.0
sky_ra_dec_deg = [266.41683333, -29.00781611]

# The other S-stars [GI17] Table 3: the early-type stars whose period is known to
# 15% or better (late-type giants, stars without a type, poorly fixed orbits and
# the hyperbolic S111 are left out). Keplerian orbits with GI17's period, epoch
# and orientation (their convention matches [GR20]'s for S2); the size follows
# from the period and this scene's mass. Like S2 they are taken as 25,000 K;
# luminosities scale with S2's by their K magnitudes (same temperature, so the same
# bolometric correction and extinction), radii as sqrt(L). No labels: a crowd. Nor
# are they on the H-R diagram: one assumed temperature would line them up in a column,
