[[events]]
name = "The black hole: shadow, lensed sky and hot gas"
time = "2026-10-01"
focus = "Sgr A*"
distance_km = 3.8e8            # ~60 M
warp = 60.0
# [GR20], [EHT22], [EHT24VIII], [BR09]
caption = """\
    This black hole at the center of our Galaxy has the mass of four million suns \
    and lies 27,000 light years away. Its gravity bends light into a dark shadow. A \
    faint, hot, thick flow of gas spirals in, shown in false color as radio telescopes \
    see it at 1.3 mm. In 2022 the Event Horizon Telescope imaged its glowing ring. The \
    occasional flares circling the hole are simulated at their observed rate."""

[[events]]
name = "S2 pericentre (2018-05-19, 120 au, 7,700 km/s)"
time = "2018-04-01"
focus = "S2"
distance_km = 6.0e10
warp = 86400.0
# [GR18], [NOB20]
caption = """\
    The star S2 swings 120 au from the black hole at 7,700 km/s, 2.6% of the speed of \
    light. On this pass the GRAVITY team saw its light reddened by relativity. Decades \
    of following stars like S2 earned Genzel and Ghez the 2020 Nobel Prize."""

[[events]]
name = "Next S2 pericentre (2034-06)"
time = "2034-04-15"
focus = "S2"
distance_km = 6.0e10
warp = 86400.0
# [GR20]
caption = """\
    S2's next close pass. Each 16-year orbit turns by about 12 arcminutes, the \
    Schwarzschild precession GRAVITY measured in 2020. The relativistic orbit \
    gradually diverges from the grey Newtonian ellipse."""

[[events]]
name = "Death Star: apsidal advance (top-down)"
time = "2026-10-01"
focus = "Sgr A*"
distance_km = 4.5e9            # the apoapsis (~230 M) fits vertically
warp = 7200.0                  # one orbit (~2.35 d) in ~28 s
from_orbit_normal = "Death Star"
# (Death Star notes above)
caption = """\
    This imaginary body follows a tight orbit, 40 gravitational radii from the \
    hole at its closest, where relativity is strong. Its orbit turns about 15 \
    degrees each lap. Lines marking successive closest approaches show how the \
    orbit rotates."""

[[events]]
name = "Death Star at periapsis (40 M, 0.2 c)"
time = "2025-12-31 22:00"      # periapsis at t_peri_year = 2026.0
focus = "Death Star"
distance_km = 3.0e7
warp = 60.0
# (Death Star notes above)
caption = """\
    At closest approach the imaginary body moves at a fifth of the speed of light, \
    lit only by the hot gas around the hole. Its path soon diverges from the grey \
    Newtonian ellipse. Its size is exaggerated thirty-thousand-fold so that it can be seen."""

[[events]]
name = "S301 orbit and precession"
time = "2025-08-06"
focus = "Sgr A*"
distance_km = 5.3e11
warp = 2629800.0
from_orbit_normal = "S301"
# [GR26]
caption = """\
    S301 takes 8.7 years to orbit Sgr A*. In this face-on view, successive laps of \
    the green track fan apart by about two degrees because of Schwarzschild precession. \
    S2's orbit turns by about 12 arcminutes per lap."""
[[events.trails]]
body = "S301"
trail_history_days = 8000.0

[[events]]
name = "S301 pericentre (2023-02-16, 11.4 au)"
time = "2023-02-16 13:00"      # about six hours before closest approach
focus = "S301"
distance_km = 5.8e9
warp = 3600.0
from_orbit_normal = "S301"
focus_orbits_only = true
# [GR26]
caption = """\
    S301 sweeps within about 11.5 au of the black hole at 25,500 km/s. This close pass \
    makes its orbit sensitive to frame dragging, the twisting of space by the \
    hole's spin, but most of the precession shown still comes from the hole's mass."""
[[events.trails]]
body = "S301"
trail_history_days = 1.5
[[events.trails]]
body = "Death Star"
trail = "none"
trail_history_days = 1.0       # less than one orbit, so there are no apsis lines

[[events]]
name = "GRAVITY flare (2018-07-22): a hot spot near the ISCO"
time = "2018-07-22 23:33"      # 20 min before the flare's peak
focus = "Sgr A*"
distance_km = 3.8e8            # ~60 M, along our line of sight
from_earth = true
warp = 60.0                    # one orbit (~45 min at 7.5 r_g) in ~45 s
# [GR18F]
caption = """\
    In July 2018 the GRAVITY instrument followed a flare of infrared light looping \
    clockwise around the black hole in about 40 minutes, only seven or eight times its \
    gravitational radius out. Here it is drawn as a hot spot in the gas, seen from the Earth."""

[[events]]
name = "ALMA hot spot (2017-04-11) after an X-ray flare"
time = "2017-04-11 10:00"      # 20 min before the spot's peak
focus = "Sgr A*"
distance_km = 3.8e8
from_earth = true
warp = 60.0                    # one orbit (~80 min at 11 r_g) in ~80 s
# [WI22A]
caption = """\
    On 11 April 2017, half an hour after an X-ray flare, ALMA saw the polarization of \
    Sgr A* swing in loops for about two hours: a hot spot orbiting about 11 gravitational \
    radii out once every 70 minutes or so, clockwise as seen from the Earth."""
