time = "2014-11-12 07:30"
focus = "67P"
frame = "67P-centered"
from_body = "Sun"
phase_deg = 60.0
distance_km = 80.0
warp = 300.0

# 2015-02-14 12:41 UTC, 6 km above the surface.
[[events]]
