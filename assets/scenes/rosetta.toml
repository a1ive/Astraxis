# --- 67P ----------------------------------------------------------------------------------
# Coma, ion tail and dust tail as for the comets of isee3.toml: magnitudes from Horizons;
# the tail sizes are illustrative.

[[bodies]]
name = "67P"
parent = "Sun"
shape = "shapes/67p.mesh"                  # [SH67]
radii_km = [2.40, 1.55, 1.20]              # [CHP]
body_gm_km3_s2 = 6.622e-7                  # [HZP]
pole_ra_dec_deg = [69.54, 64.11]           # [CHP]
prime_meridian_deg = [114.69, 696.543884683]
color = "#5e5a56"                          # dark (illustrative tone; albedo ~6%)
orbit_color = "#b8c8e8"
trail = "history"
trail_history_days = 400.0
[bodies.comet]
magnitude_m1_k1 = [12.9, 7.5]              # [HZP]
ion_tail_diameter_km = 2.0e4               # illustrative
ion_tail_length_km = 1.0e6                 # illustrative
solar_wind_km_s = 400.0
[bodies.orbit]                             # [HZN] 1000012 (ESA), 2014-01-02 .. 2016-10-05
type = "ephemeris"
file = "ephem/c67p.eph"
fallback_blend_days = 2.0
[bodies.orbit.fallback]                    # [HZN] JPL K284/1, 2004 .. 2017
type = "ephemeris"
file = "ephem/c67p_jpl.eph"

# --- Rosetta ------------------------------------------------------------------------------
# A child of the Sun: heliocentric to 2014-05-01, then a table relative to 67P (relative_to).

[[bodies]]
name = "Rosetta"
parent = "Sun"
kind = "spacecraft"
radii_km = [0.016]                         # 32 m across its solar arrays (drawn as a marker)
color = "#ffd27f"
orbit_color = "#ffb347"
trail = "history"
trail_history_days = 4700.0                # the whole mission (frames cut it shorter)
trail_linger_days = 365.0
[bodies.orbit]                             # [HZN] -226, heliocentric
type = "ephemeris"
