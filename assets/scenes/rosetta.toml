# --- Events --------------------------------------------------------------------------------
# Times UTC. Flybys start an hour or two before closest approach.

[[events]]
name = "Launch (2004-03-02)"
time = "2004-03-02 09:30"
focus = "Earth"
frame = "Earth-centered"
distance_km = 1.0e5
warp = 1800.0

[[events]]
name = "Cruise: Earth, Mars, Earth, Earth (2004-2014)"
time = "2004-03-02 09:30"
focus = "Sun"
frame = "Heliocentric"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 1.3e9
warp = 2592000.0           # 30 days per second

# Closest approach 2005-03-04 22:10 UTC, 8,340 km from the Earth's center (Horizons notes).
[[events]]
name = "Earth flyby 1 (2005-03-04)"
time = "2005-03-04 20:10"
focus = "Earth"
frame = "Earth-centered"
distance_km = 6.0e4
warp = 120.0

# 2007-02-25 ~01:45 UTC; in these data (an ESA prediction of 2005) ~180 km above Mars, the
# flight itself passed at 250 km (Horizons notes).
[[events]]
name = "Mars flyby (2007-02-25)"
time = "2007-02-25 00:45"
focus = "Mars"
frame = "Mars-centered"
distance_km = 3.0e4
warp = 60.0

# Closest approach 2007-11-13 20:57 UTC, 11,678 km from the Earth's center.
[[events]]
name = "Earth flyby 2 (2007-11-13)"
time = "2007-11-13 18:57"
focus = "Earth"
frame = "Earth-centered"
distance_km = 6.0e4
warp = 120.0

# 2008-09-05 18:37 UTC, 800 km at 8.6 km/s (Horizons notes); these data (an ESA prediction
# of 2007) pass at ~560 km.
[[events]]
name = "Asteroid 2867 Steins (2008-09-05)"
time = "2008-09-05 18:30"
focus = "Steins"
frame = "Steins-centered"
from_body = "Sun"
phase_deg = 50.0
distance_km = 800.0
warp = 5.0

[[events]]
name = "Earth flyby 3 (2009-11-13)"
time = "2009-11-13 05:45"
focus = "Earth"
frame = "Earth-centered"
distance_km = 6.0e4
warp = 120.0

# 2010-07-10 15:44:45 UTC, 3,235 km at 15 km/s (Horizons notes).
[[events]]
name = "Asteroid 21 Lutetia (2010-07-10)"
time = "2010-07-10 15:38"
focus = "Lutetia"
frame = "Lutetia-centered"
from_body = "Sun"
phase_deg = 50.0
distance_km = 4000.0
warp = 10.0

[[events]]
name = "Arrival at 67P (2014-07 .. 08)"
time = "2014-07-01 00:00"
focus = "67P"
frame = "67P, Sun fixed"
distance_km = 2.0e4
warp = 86400.0

[[events]]
name = "Triangles at 100 km and 50 km (2014-08 .. 09)"
time = "2014-08-03 00:00"
focus = "67P"
frame = "67P, Sun fixed"
distance_km = 600.0
warp = 21600.0

# Philae separated at 08:35 UTC from ~22.5 km and touched down at 15:34 UTC (Agilkia), then
# bounced; it is not in Horizons, so only Rosetta is drawn.
[[events]]
