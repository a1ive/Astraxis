# Venus: ESA's Venus Express (2006-2014) on its day-long polar orbit, Japan's Akatsuki,
# which missed Venus in 2010, went five years around the Sun and was captured on its second
# try in 2015, and Zoozve, the asteroid that circles Venus once a Venus year without being
# bound to it.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml,
#        Kepler-relative AXEPH2):
#        - Venus (299) relative to the Sun 2004-07-01 .. 2030-01-01 (as in parker.toml); [APX]
#          outside it. Earth-Moon barycenter 1972 .. 2100 (as in parker.toml).
#        - Venus Express (-248) relative to Venus, 2006-04-08 .. 2014-11-28: ESA's trajectory,
#          reconstructed from tracking to 2014-11-28, when contact was lost (Horizons'
#          prediction afterwards is left out).
#        - Akatsuki (-5), ISAS/JAXA/JPL navigation: relative to the Sun from 2010-05-21 to
#          2015-12-04, then relative to Venus to 2024-04-26, the end of the final
#          reconstruction (contact was lost late in April 2024).
#        - 524522 Zoozve (2002 VE68), JPL solution 86, relative to the Sun, 1900 .. 2099.
#        Horizons notes: Venus Express, launched 2005-11-09, "500 days in 24-hour elliptical,
#        quasi-polar Venus orbit" planned, "extended to eight years"; propellant "thought ...
#        exhausted ... about halfway through a set of maneuvers Nov 23-28 intended to raise
#        periapse". Akatsuki: launched 2010-05-20 21:58 UTC, a box of 1.04 x 1.45 x 1.4 m with
#        two solar array paddles; "The equatorial elongated orbit with westward revolution
#        suits the movement and temporal variation of the Venusian atmosphere, which rotates
#        westward"; a nominal mission of 4.5 years; "Contact was lost in April 2024 due to
#        attitude control issues. JAXA declared mission end on September 18, 2025."
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a (Mercury; Venus and the
#        Earth outside the baked spans).
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians.
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [SBDB] JPL Small-Body Database, 524522 Zoozve (2026-10-09): H = 20.54 (MPO701386), rotation
#        period 13.5 h (LCDB); close approaches (SBDB Close Approach Data, orbit 86): the Earth
#        every 8 years, 1994-11-11 0.0323 au .. 2026-11-02 19:10 TDB 0.0402 au, 8.72 km/s.
# [MIK]  S. Mikkola, R. Brasser, P. Wiegert, K. Innanen 2004, "Asteroid 2002 VE68, a
#        quasi-satellite of Venus", MNRAS 351, L63: "the first object of this dynamical class to
#        be discovered", "the first known co-orbital companion to Venus"; "in its present
#        orbital state for about seven millennia and will stay there for five more centuries";
#        then a Venus Trojan around L5; in the frame rotating with Venus "a retrograde elongated
#        orbit around the planet" (Fig. 1); never closer to Venus than ~0.2 au (Fig. 3);
#        "may have been a near-Earth asteroid, which, some 7000 yr ago, was injected into its
#        present orbit by the action of the Earth". Table 1: elements at JD 2452900.5 (checked
#        in tests/mission_tests.cpp).
#
# [CAP]  Event captions (retrieved 2026-10-09):
#        [VOI] ESA, sci.esa.int/web/venus-express/-/38947-orbit-insertion: on 2006-04-11 the
#          main engine burned 07:10:29 to 08:00:42 UTC (spacecraft time), about 1251 m/s, into
#          "a highly elliptical polar orbit with a pericentre of 400 km, an apocentre of 350 000
#          km and a period of 9 days"; apocentre lowering and trims 2006-04-15 .. 05-06.
#        [VEXE] ESA, "Venus Express goes gently into the night" (2014-12-16): eight years in
#          orbit; a 24-hour orbit out to 66,000 km over the south pole and within 200 km over
#          the north pole; dipping lower in mid-2014, to about 130-135 km, the main campaign
#          18 June to 11 July; then 15 small burns raised the low point to about 460 km by 26
#          July, the period to just over 22 hours; raising burns 23-30 November, "full contact
#          ... was lost on 28 November", likely out of propellant halfway through. Findings:
#          lava flows "no more than 2.5 million years" old and varying sulphur dioxide, "the
#          most convincing argument to date of active volcanism"; hydrogen and deuterium
#          suggesting much more water once, possibly oceans; twice as many hydrogen as oxygen
#          atoms escaping (water broken apart); cloud-top winds from about 300 to 400 km/h over
#          six years; the super-rotating atmosphere about four days around against 243 days for
#          the planet; the rotation 6.5 minutes slower than Magellan measured.
#        [VEXF] ESA, "Venus Express factsheet": a 1.5 x 1.8 x 1.4 m box plus two solar arrays,
#          about eight metres across with the arrays extended.
#        [VCO] Akatsuki mission catalog (PDS, VCO SPICE archive mission.cat): VOI-1 on
#          2010-12-06 23:49:00 UTC, the engine stopped after 158 of 718 s (135 of 748 m/s);
#          "entered in heliocentric orbit with the period of 203 days", perihelion 0.61 au,
#          aphelion 0.74 au; VOI-R1 2015-12-06 23:51:29 to 12-07 00:11:57 UTC, 1228 s, 134.8
#          m/s; "apoapsis altitude was ~440,000 km with an inclination of 3 degrees and orbital
#          period of 13 days and 14 h"; by early 2016 ~360,000 km and 10.5 days, periapsis
#          1,000-8,000 km; PC1 on 2016-04-04 (2.2 m/s, to avoid long eclipses): ~370,000 km,
#          periapsis 1,000-10,000 km, 10.8 days.
#        [AK15] JAXA press release (2015-12-09): about 440,000 x 400 km, 13 days 14 hours, about
#          3 deg to Venus' orbital plane, "flying in the same direction as that of Venus's
#          rotation". Space.com, "Success! Japanese Spacecraft Arrives at Venus 5 Years After
#          1st Try" (2015-12-09): its small attitude-control thrusters fired for 20 minutes.
#        [AKW] Sky & Telescope, "Japan's Akatsuki Spies Massive Wave on Venus" (2017-01-17;
#          Fukuhara et al. 2017, Nature Geoscience): in late December 2015 and early January 2016
#          a bow-shaped structure "more than 6,200 miles (10,000 km) long" across both
#          hemispheres, fixed over "the western slope of the Aphrodite Terra highlands" while
#          the cloud tops move at about 100 m/s: air flowing over the mountains makes a
#          gravity wave that reaches the clouds.
#        [AKE] Universe Today, "Japan's Akatsuki Venus Orbiter Completes its Mission" (2025-09):
#          communication lost near the end of April 2024, in a low-precision attitude mode;
#          recovery failed; termination from 09:00 JST on 2025-09-18, far beyond its design
#          life.
#        [ZNAM] The Planetary Society, "Venus has a quasi-moon, and now it has a name" (K.
#          Howells, 2024-02-12): a solar system poster with "ZOOZVE" next to Venus, the artist
#          Alex Foster having misread "2002VE" in his notes; Radiolab's Latif Nasser asked the
#          discoverer Brian Skiff to propose the name; announced by the IAU on 2024-02-05.
#          Zoozve "appears to orbit Venus, but is not gravitationally bound to it".
#        Orbits as drawn: [HZN].
#
# Colors are sRGB and illustrative where no map is used.

name = "Venus"

[view]
focus = "Venus"
frame = "Sun-Venus rotating"
distance_km = 3.0e8        # Zoozve's loop around Venus, and the Earth's orbit
pitch_deg = 60.0
start = "now"
warp = 172800.0            # 2 days per second: Zoozve's loop in under 2 minutes
up = "ecliptic"

[[bodies]]
