# --- Events --------------------------------------------------------------------------
# Times and distances (TDB) computed from the baked data; altitudes above the mean radius.

# Flybys start one to two hours (the lowest: under an hour) before closest approach and are
# seen along the spacecraft's orbit normal, so the turn of the path shows.
# Galileo's closest approach 1990-02-10 05:59:45 TDB, 22,175 km from the center (16,123 km up).
[[events]]
name = "Galileo swings by Venus (1990-02-10, 16,000 km)"
time_tdb = "1990-02-10 04:00"
focus = "Venus"
flyby = "Galileo"
frame = "Venus-centered"
from_orbit_normal = "Galileo"
distance_km = 1.5e5
warp = 120.0
# [GLLV], [GLLM]
caption = """\
    Bound for Jupiter, Galileo first falls inward to Venus, the first of three \
    gravity assists needed to reach Jupiter. It passes 16,000 km above the clouds \
    and gains almost 8,000 km/h. Its instruments record on tape, to be played back \
    nine months later, and its plasma wave instrument picks up signs of lightning."""

# Cassini's closest approaches: 1998-04-26 13:45:44 TDB, 284 km up; 1999-06-24 20:30:59
# TDB, 602 km up [HZN].
[[events]]
name = "Cassini skims Venus (1998-04-26, 284 km)"
time_tdb = "1998-04-26 13:05"
focus = "Venus"
flyby = "Cassini"
frame = "Venus-centered"
from_orbit_normal = "Cassini"
distance_km = 6.0e4
warp = 30.0
# [CAS1]
caption = """\
    Cassini, carrying the Huygens probe to Saturn, comes to Venus first: 284 km above the \
    surface, a boost of about 7 km/s. It is the first of four flybys, two of Venus, one of \
    the Earth and one of Jupiter. Its radar bounces a test signal off Venus, and its \
    instruments listen for lightning."""

[[events]]
name = "Cassini's second pass (1999-06-24, 603 km)"
time_tdb = "1999-06-24 19:50"
focus = "Venus"
flyby = "Cassini"
frame = "Venus-centered"
from_orbit_normal = "Cassini"
distance_km = 6.0e4
warp = 30.0
# [CAS2], [CASL]
caption = """\
    Fourteen months later Cassini is back, 603 km up. It detected no radio signals \
    from lightning on either pass; passing the Earth two months later, the same \
    instrument caught up to 70 flashes a second. Lightning on Venus, if there is \
    any, must be very rare or very different from ours."""

# Venus Express' first periapsis 2006-04-11 07:37:39 TDB, 390 km up, in the middle of the
# capture burn (07:10 to 08:01 UTC [VOI]); then 9.1 days around, out to 332,000 km. The burns
# of 2006-04-20 and 04-23 bring the apoapsis down to 70,000 km, and from 2006-05-07 the orbit
# is 24.0 hours, ~250 x 66,500 km, its periapsis at 79 deg N [HZN].
[[events]]
name = "Venus Express arrives (2006-04-11)"
time_tdb = "2006-04-11 06:40"
focus = "Venus"
flyby = "Venus Express"
frame = "Venus-centered"
from_body = "Sun"                          # its day side
phase_deg = 60.0
distance_km = 6.0e4
warp = 120.0
# [VOI], [HZN] (Horizons notes)
caption = """\
    ESA's first mission to Venus fires its main engine for 50 minutes, slowing by \
    1.25 km/s to enter an elongated polar orbit lasting nine days and reaching out \
    some 330,000 km. Its mission is to study Venus' atmosphere and the surrounding \
    space."""

[[events]]
name = "Venus Express: from nine days to one (2006-04 .. 05)"
time_tdb = "2006-04-12 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 9.0e5
warp = 43200.0
# [VOI], [HZN]
caption = """\
    Seven burns over three weeks pull the far end of the orbit in from 330,000 to 66,000 \
    km. By 7 May Venus Express goes around once a day, passing low over the north pole \
    and high over the south."""
[[events.trails]]
body = "Venus Express"
trail_history_days = 26.0

[[events]]
name = "Venus Express: one day per orbit (2006-2014)"
time_tdb = "2007-06-01 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 1.6e5
warp = 1200.0
# [VEXE]
caption = """\
    Over eight years and more than 3,000 orbits, Venus Express found lava flows no \
    more than 2.5 million years old and changes in sulphur dioxide above the \
    clouds, the best sign yet of active volcanoes. Hydrogen and deuterium hint \
    that Venus once had far more water, perhaps oceans, and it still loses \
    hydrogen and oxygen to space, two to one."""

# MESSENGER's closest approach 2007-06-05 23:09:23 TDB, 338 km up, over the night side; its
# orbital energy around the Sun drops by 6.6 km/s of speed at Venus' distance. Venus Express
# is near the far end of its orbit, 66,000 km out [HZN].
[[events]]
name = "MESSENGER skims Venus (2007-06-05, 338 km)"
time_tdb = "2007-06-05 22:30"
focus = "Venus"
flyby = "MESSENGER"
frame = "Venus-centered"
from_orbit_normal = "MESSENGER"
distance_km = 6.0e4
warp = 30.0
# [MESF], [MESS]
caption = """\
    On its way to Mercury, MESSENGER skims 338 km over the night side of Venus. \
    The pass bends its path more than any other of the trip and pulls its orbit in \
    toward Mercury's. All seven instruments work together for the first time, \
    while Venus Express, in orbit, measures the solar wind upstream."""

# Akatsuki's closest approach 2010-12-07 00:01:16 TDB, 549 km up; then 0.611 x 0.742 au
# around the Sun, 203 days [HZN].
[[events]]
name = "Akatsuki misses Venus (2010-12-07)"
time_tdb = "2010-12-06 23:20"
focus = "Venus"
flyby = "Akatsuki"
frame = "Venus-centered"
distance_km = 6.0e4
warp = 60.0
# [VCO], [HZN]
caption = """\
    Japan's Akatsuki fires its main engine for a 12-minute burn into orbit. The \
    engine stops after 158 seconds. Akatsuki passes 550 km above the clouds and \
    continues into a 203-day orbit around the Sun."""

# Akatsuki's orbit around the Sun lies inside Venus': it pulls ahead and laps around the far
# side of the Sun, up to 1.33 au from Venus (mid-2013). Its period changes from 203 to 199
# days in November 2011 [HZN].
[[events]]
name = "Akatsuki: five years around the Sun (2010-2015)"
time_tdb = "2010-12-08 00:00"
focus = "Venus"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 4.0e8
warp = 2592000.0
# [VCO], [HZN]
caption = """\
    In this frame Venus stands still. On a slightly faster orbit inside Venus', Akatsuki \
    pulls ahead, around the far side of the Sun, and slowly catches up again. Burns in \
    late 2011 set up a second meeting with Venus, five years after the first."""
[[events.trails]]
body = "Akatsuki"
trail_history_days = 1900.0
[[events.trails]]
body = "Zoozve"
trail = "none"

# Aerobraking: 30 periapses below 140 km from 2014-06-14 to 07-12, the lowest 129.7 km;
# 456 km on 2014-07-27, 22.4 hours around [HZN].
[[events]]
name = "Venus Express dips into the air (2014-06 .. 07)"
time_tdb = "2014-06-10 00:00"
focus = "Venus"
frame = "Venus-centered"
from_body = "Sun"                          # the orbit lies near the terminator: face-on and lit
phase_deg = 20.0
distance_km = 4.0e4
warp = 3600.0
# [VEXE]
caption = """\
    Running low on propellant, Venus Express dives deeper at every pass, from 18 \
    June to 11 July to about 130 km above the surface. The spacecraft survives \
    these passes. Fifteen small burns then raise its low point to 460 km, and its \
    day-long orbit shortens to 22 hours."""
[[events.trails]]
body = "Venus Express"
trail_history_days = 30.0

# Periapsis raising 2014-11-23 .. 27, from 202 to 310 km [HZN].
[[events]]
name = "Venus Express falls silent (2014-11-28)"
time_tdb = "2014-11-22 12:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 1.6e5
warp = 1200.0
# [VEXE]
caption = """\
    Burns to lift the orbit for one more year run the tanks dry, and contact is lost on \
    28 November. Venus Express had seen the cloud-top winds speed up from about 300 to \
    400 km/h in six years, and found Venus turning 6.5 minutes slower than Magellan had \
    measured."""

# Akatsuki's periapsis 2015-12-07 00:02:39 TDB, 541 km up; then 387 x 443,700 km, 13.9 days,
# 5 deg from Venus' orbital plane and retrograde: the way Venus spins [HZN].
[[events]]
name = "Akatsuki's second try (2015-12-07)"
time_tdb = "2015-12-06 23:20"
focus = "Venus"
flyby = "Akatsuki"
frame = "Venus-centered"
distance_km = 6.0e4
warp = 60.0
# [VCO], [AK15]
caption = """\
    Five years after the miss, Akatsuki is back. This time it fires its small \
    attitude-control thrusters for 20 minutes and enters an elongated orbit \
    reaching 440,000 km and lasting almost 14 days, near the equator and in the \
    direction of Venus' rotation."""

# From April 2016: 250-12,000 x ~370,000 km, 10.9 days [HZN].
[[events]]
name = "Akatsuki watches the clouds (2016-2024)"
time_tdb = "2016-06-01 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Akatsuki"
distance_km = 1.0e6
warp = 21600.0
# [VCO], [AKW]
caption = """\
    Every 10.8 days Akatsuki swings out to 370,000 km and back, moving with the winds of \
    the cloud tops. Just after it arrived, its cameras saw a bow-shaped wave 10,000 km \
    long standing still over the Aphrodite Terra highlands while the clouds raced past at \
    100 m/s: air flowing over the mountains, rippling up to the clouds."""

# Solar Orbiter's closest approach 2021-08-09 04:42:17 TDB, 14,047 km from the center (7,995
# km up); BepiColombo's 2021-08-10 13:53:02 TDB, 552 km up, 33.2 hours later. The two paths
# lie almost in one plane (orbit normals 166 deg apart), the spacecraft no closer to each other
# than 575,000 km (2021-08-06) [HZN].
[[events]]
name = "Solar Orbiter swings by Venus (2021-08-09, 8,000 km)"
time_tdb = "2021-08-09 03:10"
focus = "Venus"
flyby = "Solar Orbiter"
frame = "Venus-centered"
from_orbit_normal = "Solar Orbiter"
distance_km = 1.2e5
warp = 120.0
# [DVF]
caption = """\
    Solar Orbiter passes 8,000 km from Venus. Each of its Venus flybys takes away a little \
    orbital energy, letting it fall closer to the Sun, and tilts its orbit a little more \
    out of the plane of the planets, toward the first views of the Sun's poles. Always \
    facing the Sun, its cameras cannot turn to Venus."""

[[events]]
name = "Two spacecraft, 33 hours apart (2021-08-09 .. 10)"
time_tdb = "2021-08-08 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Solar Orbiter"
distance_km = 3.0e6
warp = 3600.0
# [DVF], [PER]
caption = """\
    Solar Orbiter and BepiColombo pass Venus 33 hours apart, never closer to each \
    other than 575,000 km. Solar Orbiter, upstream, watches a steady solar wind, \
    while BepiColombo travels along Venus' long wake and emerges on the sunward \
    side. The region where the solar wind stalls extends to 1,900 km above the \
    surface, farther than expected. It steadily shields Venus' atmosphere, despite \
    the planet having no magnetic field of its own."""

[[events]]
name = "BepiColombo skims Venus (2021-08-10, 552 km)"
time_tdb = "2021-08-10 13:10"
focus = "Venus"
flyby = "BepiColombo"
frame = "Venus-centered"
from_orbit_normal = "BepiColombo"
distance_km = 6.0e4
warp = 30.0
# [DVF], [BCV2]
caption = """\
    A day and a half later BepiColombo, bound for Mercury, comes in from the night \
    side, 552 km above the clouds, its second and last pass of Venus. Its science \
    cameras are obscured by the spacecraft stack; three small monitoring cameras \
    take 89 black-and-white snapshots, Venus filling the frame two seconds after \
    the closest point."""

[[events]]
name = "Akatsuki falls silent (2024-04)"
time_tdb = "2024-04-08 00:00"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.0e6
warp = 21600.0
# [AKE], [HZN] (Horizons notes)
caption = """\
    Late in April 2024 contact with Akatsuki is lost. Built for four and a half years, it \
    had watched the weather of Venus for more than eight. JAXA ended the mission in \
    September 2025."""

# Zoozve in the Sun-Venus rotating frame, 2004-2030: one retrograde loop around Venus per
# Venus year, never closer than 0.28 au (42 million km) [HZN].
[[events]]
name = "Zoozve, Venus' quasi-moon"
time_tdb = "2025-06-01 00:00"
focus = "Venus"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 3.0e8
warp = 172800.0
# [MIK], [ZNAM]
caption = """\
    Zoozve orbits the Sun once a Venus year, but on a stretched, tilted orbit that \
    reaches in past Mercury's and out to the Earth's. Seen from Venus, it seems to \
    circle the planet backward once a year, never closer than 30 million km. \
    Discovered in 2002, it was the first known quasi-satellite. It has followed \
    this path for some 7,000 years and will do so for another 500."""

# Juice's closest approach 2025-08-31 05:30:00 TDB, 11,140 km from the center (5,088 km up)
# [HZN].
[[events]]
name = "Juice swings by Venus (2025-08-31, 5,100 km)"
time_tdb = "2025-08-31 03:30"
focus = "Venus"
flyby = "Juice"
frame = "Venus-centered"
from_orbit_normal = "Juice"
distance_km = 1.2e5
warp = 120.0
# [JUV], [HZN] (Horizons notes)
caption = """\
    ESA's Juice needs 11 km/s to reach Jupiter; its Ariane 5 gave it 2.5. Venus is \
    the second of four gravity assists: the Moon and the Earth in 2024, Venus now, \
    the Earth in 2026 and 2029. So close to the Sun, Juice turns its big antenna \
    into a sunshade and takes no pictures. Six weeks earlier, a timing bug had \
    interrupted contact for 20 hours."""

# Zoozve's closest approaches to the Earth-Moon barycenter, every 8 years: 1978-11-12 at
# 4.70 million km .. 2026-11-02 18:52 TDB at 6.02 million km .. 2058-10-29 at 7.44 [HZN].
[[events]]
name = "Zoozve passes the Earth (2026-11-02, 6 million km)"
time_tdb = "2026-10-22 00:00"
focus = "Earth"
frame = "Earth-centered"
from_orbit_normal = "Earth"
distance_km = 4.0e7
warp = 21600.0
# [SBDB], [MIK], [ZNAM]
caption = """\
    Every eight years Zoozve passes the Earth, this time 6 million km away. A pass \
    like this some 7,000 years ago may have set it on its path with Venus. Its \
    name began as a misreading: an artist copying \"2002 VE\" onto a poster saw \
    \"Zoozve\", and in 2024 the IAU adopted that name."""
[[events.trails]]
body = "Zoozve"
trail_history_days = 30.0
