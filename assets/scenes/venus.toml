type = "rotating"
primary = "Sun"
secondary = "Venus"                        # centered on Venus

# --- Events --------------------------------------------------------------------------
# Times and distances (TDB) computed from the baked data; altitudes above the mean radius.

# Venus Express' first periapsis 2006-04-11 07:37:39 TDB, 390 km up, in the middle of the
# capture burn (07:10 to 08:01 UTC [VOI]); then 9.1 days around, out to 332,000 km. The burns
# of 2006-04-20 and 04-23 bring the apoapsis down to 70,000 km, and from 2006-05-07 the orbit
# is 24.0 hours, ~250 x 66,500 km, its periapsis at 79 deg N [HZN].
[[events]]
name = "Venus Express arrives (2006-04-11)"
time_tdb = "2006-04-11 06:40"
focus = "Venus"
frame = "Venus-centered"
from_body = "Sun"                          # its day side
phase_deg = 60.0
distance_km = 6.0e4
warp = 120.0
# [VOI], [HZN] (Horizons notes)
caption = """\
    ESA's first mission to Venus fires its main engine for 50 minutes, shedding 1.25 km/s, \
    and is captured into a long polar orbit: nine days around, swinging out some 330,000 \
    km. It came for a global look at the atmosphere of Venus and the space around it."""

[[events]]
name = "Venus Express: from nine days to one (2006-04 .. 05)"
time_tdb = "2006-04-12 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 9.0e5
warp = 43200.0
# [VOI], [HZN]
caption = """\
    Seven burns over three weeks pull the far end of the orbit in from 330,000 to 66,000 \
    km. By 7 May Venus Express goes around once a day, passing low over the north pole \
    and high over the south."""
[[events.trails]]
body = "Venus Express"
trail_history_days = 26.0

[[events]]
name = "Venus Express: one day per orbit (2006-2014)"
time_tdb = "2007-06-01 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 1.6e5
warp = 1200.0
# [VEXE]
caption = """\
    For eight years, more than 3,000 orbits. Venus Express found lava flows no more than \
    2.5 million years old and swings in the sulphur dioxide over the clouds, the best sign \
    yet of active volcanoes. Hydrogen and deuterium hint that Venus once had far more \
    water, perhaps oceans, and it still loses hydrogen and oxygen to space, two to one."""

# Akatsuki's closest approach 2010-12-07 00:01:16 TDB, 549 km up; then 0.611 x 0.742 au
# around the Sun, 203 days [HZN].
[[events]]
name = "Akatsuki misses Venus (2010-12-07)"
time_tdb = "2010-12-06 23:20"
focus = "Venus"
frame = "Venus-centered"
distance_km = 6.0e4
warp = 60.0
# [VCO], [HZN]
caption = """\
    Japan's Akatsuki fires its main engine for a 12-minute burn into orbit. After 158 \
    seconds the engine quits. Instead of staying, Akatsuki skims 550 km over the clouds \
    and sails on, into an orbit around the Sun 203 days long."""

# Akatsuki's orbit around the Sun lies inside Venus': it pulls ahead and laps around the far
# side of the Sun, up to 1.33 au from Venus (mid-2013). Its period changes from 203 to 199
# days in November 2011 [HZN].
[[events]]
name = "Akatsuki: five years around the Sun (2010-2015)"
time_tdb = "2010-12-08 00:00"
focus = "Venus"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 4.0e8
warp = 2592000.0
# [VCO], [HZN]
caption = """\
    In this frame Venus stands still. On a slightly faster orbit inside Venus', Akatsuki \
    pulls ahead, around the far side of the Sun, and slowly catches up again. Burns in \
    late 2011 set up a second meeting with Venus, five years after the first."""
[[events.trails]]
body = "Akatsuki"
trail_history_days = 1900.0
[[events.trails]]
body = "Zoozve"
trail = "none"

# Aerobraking: 30 periapses below 140 km from 2014-06-14 to 07-12, the lowest 129.7 km;
# 456 km on 2014-07-27, 22.4 hours around [HZN].
[[events]]
name = "Venus Express dips into the air (2014-06 .. 07)"
time_tdb = "2014-06-10 00:00"
focus = "Venus"
frame = "Venus-centered"
from_body = "Sun"                          # the orbit lies near the terminator: face-on and lit
phase_deg = 20.0
distance_km = 4.0e4
warp = 3600.0
# [VEXE]
caption = """\
    Running low on propellant, Venus Express dives deeper at every pass, from 18 June to \
    11 July to about 130 km above the surface. It comes through; fifteen small burns then \
    raise its low point to 460 km, and its day-long orbit shortens to 22 hours."""
[[events.trails]]
body = "Venus Express"
trail_history_days = 30.0

# Periapsis raising 2014-11-23 .. 27, from 202 to 310 km [HZN].
[[events]]
name = "Venus Express falls silent (2014-11-28)"
time_tdb = "2014-11-22 12:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Venus Express"         # the polar orbit face-on
distance_km = 1.6e5
warp = 1200.0
# [VEXE]
caption = """\
    Burns to lift the orbit for one more year run the tanks dry, and contact is lost on \
    28 November. Venus Express had seen the cloud-top winds speed up from about 300 to \
    400 km/h in six years, and found Venus turning 6.5 minutes slower than Magellan had \
    measured."""

# Akatsuki's periapsis 2015-12-07 00:02:39 TDB, 541 km up; then 387 x 443,700 km, 13.9 days,
# 5 deg from Venus' orbital plane and retrograde: the way Venus spins [HZN].
[[events]]
name = "Akatsuki's second try (2015-12-07)"
time_tdb = "2015-12-06 23:20"
focus = "Venus"
frame = "Venus-centered"
distance_km = 6.0e4
warp = 60.0
# [VCO], [AK15]
caption = """\
    Five years after the miss, Akatsuki is back. This time it fires its small \
    attitude-control thrusters for 20 minutes, and Venus keeps it: a loose \
    orbit out to 440,000 km and almost 14 days around, near the equator and in the \
    direction the planet turns."""

# From April 2016: 250-12,000 x ~370,000 km, 10.9 days [HZN].
[[events]]
name = "Akatsuki watches the clouds (2016-2024)"
time_tdb = "2016-06-01 00:00"
focus = "Venus"
frame = "Venus-centered"
from_orbit_normal = "Akatsuki"
distance_km = 1.0e6
warp = 21600.0
# [VCO], [AKW]
caption = """\
    Every 10.8 days Akatsuki swings out to 370,000 km and back, moving with the winds of \
    the cloud tops. Just after it arrived, its cameras saw a bow-shaped wave 10,000 km \
    long standing still over the Aphrodite Terra highlands while the clouds raced past at \
    100 m/s: air flowing over the mountains, rippling up to the clouds."""

[[events]]
name = "Akatsuki falls silent (2024-04)"
time_tdb = "2024-04-08 00:00"
focus = "Venus"
frame = "Venus-centered"
distance_km = 1.0e6
warp = 21600.0
# [AKE], [HZN] (Horizons notes)
caption = """\
    Late in April 2024 contact with Akatsuki is lost. Built for four and a half years, it \
    had watched the weather of Venus for more than eight. JAXA ended the mission in \
    September 2025."""

# Zoozve in the Sun-Venus rotating frame, 2004-2030: one retrograde loop around Venus per
# Venus year, never closer than 0.28 au (42 million km) [HZN].
[[events]]
name = "Zoozve, Venus' quasi-moon"
time_tdb = "2025-06-01 00:00"
focus = "Venus"
frame = "Sun-Venus rotating"
from_orbit_normal = "Venus"
distance_km = 3.0e8
warp = 172800.0
# [MIK], [ZNAM]
caption = """\
    Zoozve orbits the Sun once a Venus year, but on a stretched, tilted orbit that reaches \
    in past Mercury's and out to the Earth's. Seen from Venus, it seems to circle the \
    planet backward once a year, never closer than 30 million km. Found in 2002, it was \
    the first quasi-satellite known: one for some 7,000 years, and for 500 more."""

# Zoozve's closest approaches to the Earth-Moon barycenter, every 8 years: 1978-11-12 at
# 4.70 million km .. 2026-11-02 18:52 TDB at 6.02 million km .. 2058-10-29 at 7.44 [HZN].
[[events]]
name = "Zoozve passes the Earth (2026-11-02, 6 million km)"
time_tdb = "2026-10-22 00:00"
focus = "Earth"
frame = "Earth-centered"
from_orbit_normal = "Earth"
distance_km = 4.0e7
warp = 21600.0
# [SBDB], [MIK], [ZNAM]
caption = """\
    Every eight years Zoozve passes the Earth, this time 6 million km away. A pass like \
    this some 7,000 years ago may have set it on its path with Venus. Its name began as a \
    misreading: an artist copying "2002 VE" onto a poster saw "Zoozve", and in 2024 the \
    IAU made the mistake official."""
[[events.trails]]
body = "Zoozve"
trail_history_days = 30.0
