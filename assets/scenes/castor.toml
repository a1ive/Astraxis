# Castor (alpha Geminorum), six stars 15 parsecs away: two A-type stars, each with
# a close red-dwarf companion, orbit each other every 459 years; a third pair of
# red dwarfs, the eclipsing binary YY Geminorum (Castor C), orbits the four from
# more than 1,000 au away.
#
# Nested two-body (Keplerian) orbits around barycenters; the interactions between
# the pairs are ignored (2.9 and 9.2 d inside 459 yr inside ~14,500 yr). Times of
# the inner orbits are at the barycenter of the quadruple [TO22], as here: the
# scene draws no light-time effect.
#
# [TO22] Torres et al. 2022, ApJ 941, 8 (arXiv:2210.16322), "The Orbits and
#        Dynamical Masses of the Castor System":
#        Table 5, the global solution. AB: P = 459.1 yr, e = 0.3382, i = 115.107 deg,
#        omega_B = 251.84 deg, Omega = 41.304 deg, T = 1959.59. A: P = 9.2127496 d,
#        a = 8.002 mas, e = 0.48769, i = 35.00 deg, omega_Aa = 264.968 deg (the
#        primary's: Ab's is 84.968), Omega = 95.100 deg, T = HJD 2455817.7868.
#        B: P = 2.92835083 d, a = 3.4442 mas, circular, i = 110.50 deg, Omega =
#        106.47 deg, T = HJD 2456705.4942, the maximum velocity of Ba (so Bb is at
#        argument of latitude 180 deg then).
#        Table 6: distance 15.0703 pc; masses Aa 2.371, Ab 0.3859, Ba 1.789,
#        Bb 0.3865 M_sun; mutual inclinations A-B 76.12, A-AB 92.34, B-AB 59.68 deg.
#        Sect. 4.1: radii of Aa 2.089 and Ba 1.648 R_sun. Sect. 2.1: Ab and Bb
#        assumed 0.23 mas across (PARSEC models for their masses): 0.3727 R_sun.
#        Sect. 2.2: templates 9750 K (A) and 8250 K (B), the best match to the
#        spectra. Sect. 5: Ab and Bb of type M2 or M3.
#        Sect. 1: Pound 1718, Bradley 1719, Herschel 1803, Belopolsky 1897.
#        Appendix: H. D. Curtis found Castor A's period at Lick in 1904.
#        Sect. 4.2: C relative to AB moves -26.21 mas/yr in RA and +2.88 in Dec, and
#        its period is roughly 14,500 yr. Sect. 4.3: its orbit is very poorly known.
#        Table 2: the CHARA positions and light-time corrections (tests).
# [TR02] Torres & Ribas 2002, ApJ 567, 1140 (arXiv:astro-ph/0111167), YY Gem:
#        Sect. 5: i = 86.29 deg, masses 0.5975 and 0.6009 M_sun, mean radius
#        0.6191 R_sun, T_eff = 3820 K for both. Sect. 4.1.2: circular orbit; about
#        78% of each star's light blocked at minimum. Sect. 1: Adams & Joy found it double in
#        1916, van Gent the eclipses in 1926.
#        Table 4: starspot solutions for two light curves, latitude +45 deg and
#        T_spot / T_phot = 0.90 fixed (Hatzes' Doppler imaging, Sect. 4.1.1).
#        LS78 (Leung & Schneider 1978, Kitt Peak, January 1971): spot 1 meridian
#        at phase 0.733, radius 20.1 deg, on the primary; spot 2 at 0.587, 21.0 deg,
#        secondary; spot 3 at 0.250, 9.0 deg, primary. Kron 1952 (Lick, February
#        to April 1948): spot 1 at 0.516, 25.5 deg, spot 2 at 0.836, 35.0 deg, both
#        on the secondary; its wave approaches 0.1 mag (Sect. 4.2). The primary is
#        the star eclipsed at phase 0 (Ca), the secondary the more massive (Cb).
#        Longitude here, from the star's axis toward its companion, in the sense
#        of the rotation: -360 phase on Ca, 180 - 360 phase on Cb.
#        Sect. 5, table 5: both turn with the orbit (v sin i 37 km/s, 38.5 expected).
# [TESS] Primary minima in the TESS light curves (sectors 20, 46, 60, 72; 2019-2023),
#        measured by tools/castor/yy_gem_ephemeris.py: BJD_TDB 2459690.57515,
#        P = 0.81428247 d, rms 0.7 min over 93 minima. [TR02]'s linear ephemeris
#        (from 1994) is 10.5 minutes off by 2022.
# [PM13] Pecaut & Mamajek 2013, ApJS 208, 9, and E. Mamajek's online table
#        (EEM_dwarf_UBVIJHK_colors_Teff.txt): M2.5V, 3470 K.
# [BU15] Butler et al. 2015, MNRAS 446, 4205 (arXiv:1501.03930): YY Gem, flare stars.
# [SIMB] SIMBAD: ICRS position of alpha Gem at J2000, 113.64947164, 31.88828222 deg.
#
# [CAP]  Event captions: from the sources above.
# Assumed (not measured): Castor C's orbit (see tools/castor/scene_numbers.py): the
# one with its measured place (SIMBAD, 70.8" from AB's barycenter at J2000), its
# measured motion on the sky [TO22], no radial velocity relative to AB ([TO22]:
# "just 0.5 km/s, if not less"), behind AB and at the depth that gives [TO22]'s
# period; YY Gem's node (0); the temperatures of Ab and Bb.
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440).
# Luminosity = R^2 (T / 5772 K)^4.
# Checks (tests/stellar_system_tests.cpp): the [TO22] positions, light-time
# corrections and mutual inclinations, the [TESS] minima, C's place and motion.

name = "Castor"

[sky]
viewer_ra_dec_distance_pc = [113.64947164, 31.88828222, 15.0703]   # [SIMB], [TO22]
# The catalog has the system at Hipparcos distances 0.5 to 0.7 pc from here,
# B and C without Hipparcos numbers: three stars as bright as -4 mag otherwise.
own_system_pc = 1.0

[view]
focus = "Castor AB"
distance_km = 4.0e10
start = "now"
warp = 31557600.0              # 1 year per second
up = "orbit_normal:Castor B"

# YY Gem's light as seen from Earth; A and B are not eclipsing and far brighter.
[light_curve]
observer = "Sun"
stars = ["Castor Ca", "Castor Cb"]
shown_under = "Castor C"
band = "V"
wavelength_nm = 550.0
limb_darkening = 0.6           # as the star disks are drawn (shaders/sun.frag.hlsl)
