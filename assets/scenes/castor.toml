[[events]]
name = "1778-1803: Herschel sees the line turn"
focus_orbits_only = true
time = "1778-06-01"
focus = "Castor AB"
frame = "Castor AB, north up"
from_earth = true
distance_km = 3.0e10
warp = 31557600.0              # 1 year per second
# [TO22 Sect. 1]
caption = """\
    James Pound and James Bradley measured these two stars as a double in 1718 \
    and 1719. William Herschel followed them from 1778, and in 1803 reported that \
    the line joining them had turned. Castor was the first pair recognized as \
    truly bound, which some have taken as the first evidence that Newton's \
    gravity works beyond the solar system."""

[[events]]
name = "1897: Castor B is itself a pair"
focus_orbits_only = true
time = "1897-03-01"
focus = "Castor B"
frame = "Castor B-centered"
from_orbit_normal = "Castor Bb"
distance_km = 3.0e7
warp = 7200.0                  # 2 hours per second: one orbit in 35 s
# [TO22]
caption = """\
    In 1897 Aristarkh Belopolsky found that the fainter star shifts in velocity \
    every 2.9 days. Its unseen companion is a red dwarf of 0.39 solar masses, on \
    a circular orbit 0.05 au from an A-type star of 1.79 solar masses. It was not \
    seen directly until interferometers at the CHARA Array resolved the pair."""

[[events]]
name = "Periastron, 1959: 67 au apart"
focus_orbits_only = true
time = "1900-01-01"
focus = "Castor AB"
frame = "Castor AB, wide orbit up"
from_orbit_normal = "Castor B"
distance_km = 5.0e10
warp = 157788000.0             # 5 years per second
# [TO22 Tables 5, 6]
caption = """\
    Since the first measurement the two have not yet gone once around each other: \
    the orbit takes 459 years. They came closest in 1959, at 67 au, and will be \
    farthest in 2189, at 136 au. The pair has been followed for more than three \
    centuries, and the orbit is known to a fraction of a percent."""

[[events]]
name = "1904: Castor A, a 9.2-day eccentric pair"
focus_orbits_only = true
time = "1904-03-01"
focus = "Castor A"
frame = "Castor A-centered"
from_orbit_normal = "Castor Ab"
distance_km = 6.0e7
warp = 21600.0                 # 6 hours per second: one orbit in 37 s
# [TO22]
caption = """\
    The brighter star followed in 1904, when Heber Curtis found its 9.2-day \
    period at Lick Observatory. Here a red dwarf swings between 0.06 and 0.18 au \
    from an A-type star of 2.37 solar masses. This orbit is markedly eccentric, \
    while that of the tighter pair in Castor B is circular."""

[[events]]
name = "1948: dark regions on YY Geminorum"
focus_orbits_only = true
time = "1948-03-01"
focus = "Castor C"
frame = "Castor C-centered"
from_body = "Sun"
distance_km = 1.1e7
warp = 1800.0                  # 30 minutes per second: one orbit in 39 s
# [TR02 Table 4, Sect. 4.2]
caption = """\
    Gerald Kron measured this light curve at Lick Observatory in 1948, and it \
    wanders between the eclipses by almost 0.1 magnitude. As the stars turn, dark \
    regions cross the side facing us. The fit shown places two large spots on one \
    star, 400 K cooler than the surface. Other arrangements would fit as well."""

[[events]]
name = "1971: the spots have moved"
focus_orbits_only = true
time = "1971-01-15"
focus = "Castor C"
frame = "Castor C-centered"
from_body = "Sun"
distance_km = 1.1e7
warp = 1800.0
# [TR02 Sect. 2, 4.1.1, Table 4]
caption = """\
    Twenty-three years later the light curve from Kitt Peak has a smaller wave at \
    different phases. The fit needs three smaller spots, on both stars. Two of \
    them lie close to where flares were seen in the same months. No fit is \
    unique: the light alone cannot say which star a spot is on."""

[[events]]
name = "Castor A from above the wide orbit: 92 degrees"
focus_orbits_only = true
time = "2026-11-10"
focus = "Castor A"
frame = "Castor A-centered"
from_orbit_normal = "Castor A"
distance_km = 6.0e7
warp = 21600.0
# [TO22 Table 6]
caption = """\
    The camera now looks straight down on the 459-year orbit, and Castor A's \
    own orbit is seen almost edge-on. The two planes are 92.3 degrees apart, \
    measured to better than half a degree: nearly at right angles, and formally \
    the small orbit runs backward against the large one."""

[[events]]
name = "Castor B from the same direction: 60 degrees"
focus_orbits_only = true
time = "2026-11-14"
focus = "Castor B"
frame = "Castor B-centered"
from_orbit_normal = "Castor A"
distance_km = 3.0e7
warp = 7200.0
# [TO22 Table 6]
caption = """\
    From the same direction Castor B's orbit is a flattened circle: its plane is \
    tilted 59.7 degrees from the wide orbit. The planes of the two small orbits \
    are 76.1 degrees from each other. Whatever made these stars, it did not \
    leave their orbits in one plane."""

[[events]]
name = "Three orbits, none in the same plane"
focus_orbits_only = true
time = "2026-11-16"
focus = "Castor AB"
frame = "Castor AB, wide orbit up"
from_body = "Sun"
elevation_deg = 25.0
distance_km = 4.5e10
warp = 86400.0
show = ["Orbit of A, x200", "Orbit of B, x200"]
trails = [{ body = "Orbit of A, x200", trail = "orbit" }, { body = "Orbit of B, x200", trail = "orbit" }]
# [TO22 Table 6]
caption = """\
    Here the two small orbits are drawn 200 times larger than they are, each \
    around its own pair, so they can be seen against the large one. At true \
    size they would be barely a pixel across. Castor A's orbit stands almost \
    upright on the plane of the wide orbit."""

[[events]]
name = "YY Geminorum: an eclipse every 9.8 hours"
focus_orbits_only = true
time_tdb = "2026-11-17 17:37"  # 1.5 hours before primary minimum [TESS]
focus = "Castor C"
frame = "Castor C-centered"
from_body = "Sun"
distance_km = 8.0e6
warp = 300.0                   # 5 minutes per second: the eclipse in 23 s
# [TR02], [TESS]
caption = """\
    Castor C, or YY Geminorum, is two nearly identical red dwarfs circling in \
    19.5 hours. Seen almost edge-on, each covers about 78 percent of the other's \
    light in turn. Walter Adams and Alfred Joy found it double in 1916, and \
    Hendrik van Gent found the eclipses in 1926."""

[[events]]
name = "YY Geminorum from above: 0.018 au apart"
focus_orbits_only = true
time = "2026-11-19"
focus = "Castor C"
frame = "Castor C-centered"
from_orbit_normal = "Castor Cb"
distance_km = 1.2e7
warp = 1800.0                  # 30 minutes per second: one orbit in 39 s
# [TR02], [BU15]
caption = """\
    Each star has 0.60 solar masses and a radius of 0.62 Suns, and they sit only \
    6 radii apart. The eclipses let their sizes be measured to one percent. Both \
    are active flare stars. The spots are the 1971 pattern, kept for lack of a later fit."""

[[events]]
name = "All six: C on its ~14,500-year orbit"
time = "2026-11-21"
focus = "Castor"
distance_km = 4.5e11
warp = 3155760000.0            # 100 years per second
# [TO22 Sect. 4.2, 4.3]
caption = """\
    Castor C lies 71 arcseconds from the bright pair, more than 1,000 au. In two \
    centuries it has moved only 4 degrees around them, too small an arc to find \
    the orbit. The period is roughly 14,500 years. The orbit drawn here fits the \
    measured motion, but it is one of many that would."""
