# The alpha Centauri triple system: A and B on their 80-year orbit, Proxima
# ~13,000 au away, and the Sun as a bright star in the sky.
#
# Integrated as a Newtonian three-body system (Yoshida 4th-order symplectic,
# src/ephem/nbody.cpp) from initial conditions at J1991.25:
#
# [AK21] Akeson et al. 2021, AJ 162, 14 (arXiv:2104.10086), Table 8 "present work":
#        orbit of B relative to A (Campbell elements on the sky), parallax 750.81 mas,
#        masses m_A = 1.0788, m_B = 0.9092 M_sun, radii R_A = 1.2175, R_B = 0.8591 R_sun,
#        luminosities L_A = 1.5059, L_B = 0.4981 L_sun; barycentre position (Table 9,
#        J2019.5): RA 14:39:26.1413 = 219.85892215 deg, Dec -60:49:53.875 = -60.83163195 deg.
#        Check (tests/ephem_tests.cpp): the elements reproduce their ALMA relative astrometry.
# [KE17] Kervella, Thevenin & Lovis 2017, A&A 598, L7 (arXiv:1611.03495):
#        Table B.1, Proxima - alpha Cen position and velocity in Galactic axes (Hipparcos
#        epoch 1991.25); Table 1, m_Prox = 0.1221 M_sun, R_Prox = 0.1542 R_sun (Mann et al.).
# [BO12] Boyajian et al. 2012, ApJ 757, 112: Proxima T_eff = 3050 K.
# Derived: T_eff of A and B = 5772 K * (L / R^2)^(1/4) = 5795 K and 5232 K;
#          L_Prox = R^2 (T / 5772 K)^4 = 0.00185 L_sun (bolometric).
# GM = mass * GM_sun (1.32712440041279419e11 km^3/s^2, JPL DE440).
#
# Positions are relative to the A+B barycentre. The depth sign of the AB orbit
# (toward/away from us) follows the visual-binary convention; see visual_orbit.hpp.
#
# Proxima's planets are fixed circular Keplerian orbits around Proxima (their
# periods are far below the N-body step, and their pull on the stars is negligible):
# [SM25] Suarez Mascareno et al. 2025, A&A 700, A11 (arXiv:2507.21751), Table 3
#        (adopted model, circular): b and d, time of inferior conjunction T0,
#        P, a, m sin i; footnote: masses for orbits coplanar with the stellar spin
#        axis, tilted 47 +- 7 deg (Klein et al. 2021). Sect. 5.3: no significant
#        detection of c (K = 58 +- 28 cm/s, < 1.4 m/s at 99.7%).
# [DA20] Damasso et al. 2020, Sci. Adv. 6, eaax7467, Table 1: the candidate c,
#        P = 1900 d, T_conj = BJD 2455892, e = 0 (fixed), a = 1.48 au,
#        m sin i = 5.8 M_earth. It remains unconfirmed: Artigau et al. 2022 found
#        no evidence of it in HARPS data (as summarised in SM25 Sect. 3).
#        Cross-check: DA20's b conjunction (BJD 2457897.9) falls 236.994 SM25
#        periods before SM25's, so both papers use the same conjunction convention.
# [GDR3] Gaia DR3 via SIMBAD: Proxima at RA 217.42894222, Dec -62.67949019 deg.
# [CK17] Chen & Kipping 2017, ApJ 834, 17 (arXiv:1603.08614), Table 1:
#        R = 1.008 M^0.2790 below 2.04 M_earth, R proportional to M^0.589 above
#        (Earth units, continuous at the transition).
# Radial velocities fix neither i nor the node. All three orbits are taken as
# coplanar with i = 47 deg (as SM25's footnote) and Omega = 0; both are assumptions.
# (Kervella et al. 2020 derived i and Omega for c from the Gaia DR2 proper-motion
# anomaly, but the mean RV they derive over the Gaia window (-0.94 m/s) implies
# the opposite phase to DA20's inferior conjunction; not used.)
# Masses at i = 47 deg: d 0.356, b 1.443, c 7.93 M_earth; [CK17] radii
# 0.755, 1.116, 2.736 R_earth (R_earth = 6371.0 km, JPL SSD). None transits:
# radii and colours are estimates / artistic.
# The orbits' reference plane is the sky plane at Proxima: its pole points away
# from us, so the plane's x axis (node on the ICRF equator) is east and the
# mean_elements node is Omega - 90 deg. At inferior conjunction the planet is in
# front of the star, i.e. argument of latitude 270 deg (omega = 0, M = 270 deg).
# Check (tests/stellar_system_tests.cpp): Proxima's reflex velocity is -K sin(2 pi (t - T0) / P).

name = "Alpha Centauri"

[view]
focus = "Alpha Centauri AB"
distance_km = 1.0e10          # ~70 au
start = "now"
warp = 31557600.0             # 1 year per second: one AB orbit in 80 s
up = "orbit_normal:Alpha Centauri B"

[[bodies]]
name = "Alpha Centauri AB"
kind = "barycenter"

[[bodies]]
name = "Alpha Centauri A"
parent = "Alpha Centauri AB"
kind = "star"
radii_km = [847045.0]          # 1.2175 R_sun [AK21]
temperature_k = 5795.0
luminosity_solar = 1.5059
orbit_color = "#ffe9b0"
trail_history_days = 29133.0   # one orbital period (79.762 yr)
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Alpha Centauri B"
parent = "Alpha Centauri AB"
kind = "star"
radii_km = [597676.0]          # 0.8591 R_sun [AK21]
temperature_k = 5232.0
luminosity_solar = 0.4981
orbit_color = "#ffc888"
trail_history_days = 29133.0
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Proxima Centauri"
parent = "Alpha Centauri AB"
kind = "star"
radii_km = [107277.0]          # 0.1542 R_sun [KE17]
temperature_k = 3050.0         # [BO12]
luminosity_solar = 0.00185
orbit_color = "#ff8a6a"
trail_history_days = 365250.0  # a thousand years: Proxima's orbit takes ~550,000
[bodies.orbit]
type = "nbody"

[[bodies]]
name = "Proxima Centauri d"
parent = "Proxima Centauri"
radii_km = [4812.0]            # 0.755 R_earth [CK17], assuming i = 47 deg
body_gm_km3_s2 = 141901.755    # 0.356 M_earth, assuming i = 47 deg
color = "#b3a08a"
orbit_color = "#ffd08a"
[bodies.orbit]                 # [SM25], oriented on the sky at [GDR3]
type = "mean_elements"
epoch_jd_tdb = 2460557.55      # inferior conjunction (BJD_TDB)
a_km = 4309915.0               # 0.02881 au
e = 0.0
arg_peri_deg = 0.0
mean_anomaly_deg = 270.0
i_deg = 47.0                   # assumed (coplanar with the stellar spin)
node_deg = -90.0               # Omega = 0 (assumed) - 90 deg
period_days = 5.12338
laplace_pole_ra_dec_deg = [217.42894222, -62.67949019]

[[bodies]]
name = "Proxima Centauri b"
parent = "Proxima Centauri"
radii_km = [7113.0]            # 1.116 R_earth [CK17], assuming i = 47 deg
body_gm_km3_s2 = 575180.4284   # 1.443 M_earth, assuming i = 47 deg
color = "#a08e7c"
orbit_color = "#ffb08a"
[bodies.orbit]                 # [SM25], oriented on the sky at [GDR3]
type = "mean_elements"
epoch_jd_tdb = 2460548.59      # inferior conjunction (BJD_TDB)
a_km = 7252505.0               # 0.04848 au
e = 0.0
arg_peri_deg = 0.0
mean_anomaly_deg = 270.0
i_deg = 47.0                   # assumed (coplanar with the stellar spin)
node_deg = -90.0               # Omega = 0 (assumed) - 90 deg
period_days = 11.18465
laplace_pole_ra_dec_deg = [217.42894222, -62.67949019]

[[bodies]]
name = "Proxima Centauri c (unconfirmed)"
parent = "Proxima Centauri"
radii_km = [17433.0]           # 2.736 R_earth [CK17], assuming i = 47 deg
body_gm_km3_s2 = 3160901.454   # 7.93 M_earth, assuming i = 47 deg
color = "#9fb4c8"
style = "gas_giant"
orbit_color = "#a0b8d8"
[bodies.orbit]                 # [DA20], oriented on the sky at [GDR3]
type = "mean_elements"
epoch_jd_tdb = 2455892.0       # inferior conjunction (BJD_TDB)
a_km = 221404849.0             # 1.48 au
e = 0.0
arg_peri_deg = 0.0
mean_anomaly_deg = 270.0
i_deg = 47.0                   # assumed (coplanar with the stellar spin)
node_deg = -90.0               # Omega = 0 (assumed) - 90 deg
period_days = 1900.0
laplace_pole_ra_dec_deg = [217.42894222, -62.67949019]

[[bodies]]
name = "Sun"
parent = "Alpha Centauri AB"
kind = "star"
radii_km = [695700.0]
body_gm_km3_s2 = 1.32712440041279419e11 # JPL DE440
temperature_k = 5772.0
luminosity_solar = 1.0
trail = "none"
[bodies.orbit]                 # opposite direction of alpha Cen as seen from the Sun
type = "fixed"
ra_dec_distance_pc = [39.85892215, 60.83163195, 1.33189489]   # 1000 / 750.81 mas

[nbody]
epoch_year = 1991.25
span_years = [1000.0, 3000.0]
step_days = 20.0
origin = ["Alpha Centauri A", "Alpha Centauri B"]

[[nbody.members]]
body = "Alpha Centauri A"
gm_km3_s2 = 1.43170182e11      # 1.0788 GM_sun

[[nbody.members]]
body = "Alpha Centauri B"
gm_km3_s2 = 1.20662151e11      # 0.9092 GM_sun
relative_to = ["Alpha Centauri A"]
[nbody.members.visual_orbit]   # [AK21] Table 8
a_arcsec = 17.4930
parallax_mas = 750.81
e = 0.51947
i_deg = 79.2430
node_deg = 205.073
arg_peri_deg = 231.519
t_peri_year = 1955.564
sky_ra_dec_deg = [219.85892215, -60.83163195]

[[nbody.members]]
body = "Proxima Centauri"
gm_km3_s2 = 1.62041889e10      # 0.1221 GM_sun
relative_to = ["Alpha Centauri A", "Alpha Centauri B"]
[nbody.members.galactic_state] # [KE17] Table B.1, Proxima - alpha Cen
position_pc = [-0.05622, -0.00198, -0.02785]
velocity_km_s = [-0.099, 0.173, 0.187]

[[frames]]
name = "Alpha Centauri A-centered"
type = "inertial"
origin = "Alpha Centauri A"

[[frames]]
name = "Proxima Centauri-centered"
type = "inertial"
origin = "Proxima Centauri"

[[events]]
name = "Apastron (1995-06)"
time = "1995-06-12"
focus = "Alpha Centauri AB"
distance_km = 1.0e10
warp = 3155760.0

[[events]]
name = "Next periastron (2035-04, 11.2 au apart)"
