# --- The integration ---------------------------------------------------------------------
# Yoshida's 4th-order scheme, 20-day steps (217 per orbit of Jupiter). Positions are kept
# relative to the Sun. Eccentric orbits keep more knots so that the perihelion passages
# stay smooth.

[nbody]
epoch_jd_tdb = 2461041.5
span_years = [-8000.0, 52000.0]
step_days = 20.0
knots_per_orbit = 32
origin = ["Sun"]

[[nbody.members]]
body = "Sun"
gm_km3_s2 = 132713233263.351411            # [GM] the Sun with Mercury, Venus, Earth-Moon and Mars

