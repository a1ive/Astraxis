    { body = "2001 QR322", trail = "none" },
    { body = "2008 LC18", trail = "none" },
    { body = "1995 DA2", trail = "none" },
    { body = "Pluto system", trail = "none" },
    { body = "Haumea", trail = "none" },
    { body = "2026 ED138", trail = "none" },
    { body = "Orcus", trail = "none" },
    { body = "1996 TR66", trail = "none" },
    { body = "2000 JG81", trail = "none" },
    { body = "1999 DE9", trail = "none" },
    { body = "Gonggong", trail = "none" },
    { body = "Eris", trail = "none" },
    { body = "Sedna", trail = "none" },
    { body = "2012 VP113", trail = "none" },
]
# [DES], [GL08], [INT]
belts = ["Classical belt", "Scattered disk"]
caption = """\
    Between the 3:2 and 2:1 resonances lies the classical belt. Its "cold" members, \
    like Arrokoth, which New Horizons visited, keep nearly circular orbits close to \
    the plane of the planets. "Hot" members such as Makemake are tilted by up to 30 \
    degrees."""

[[events]]
name = "Scattered and detached"
time = "2026-01-01"
focus = "Sun"
distance_km = 3.0e11
elevation_deg = 35.0
warp = 3155760000.0            # 100 years per second
# [BR04], [TS14], [GL08], [INT]
belts = []                     # too small at this distance, and smeared at this warp
caption = """\
    Eris's perihelion is close enough for Neptune to keep tugging on it. Sedna and \
    2012 VP113 never come within 75 au of the Sun, far beyond Neptune's reach. How \
    they got there, perhaps from a passing star in the Sun's birth cluster, is \
    still debated."""
