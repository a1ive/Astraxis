# Beyond Neptune: the kinds of trans-Neptunian objects, and the mean-motion resonances that
# keep many of them away from Neptune. Neptune's Trojans (1:1), 1995 DA2 (4:3), Pluto and
# Orcus (3:2), 1996 TR66 and 2000 JG81 (2:1), 1999 DE9 (5:2), Gonggong (10:3), and Haumea
# and 2026 ED138 at the edge of the 12:7; the classical belt (Arrokoth, Quaoar, Makemake);
# the scattered disk (Eris); and the detached objects Sedna and 2012 VP113. Pluto with its
# five moons, Haumea with its two. Every orbit is integrated here with the four giant planets
# from the Julian year -8000 to 52,000, so that the slow swings of the resonances can be followed.
#
# Sources
# [HZN]  JPL Horizons geometric states (ICRF, TDB, km and km/s) relative to the Sun's center
#        at 2026-01-01 00:00 TDB (JD 2461041.5), fetched by tools/bake/tno_states.py: the
#        giant planets' system barycenters and the Pluto system barycenter from DE441; the
#        small bodies from the JPL orbit solution noted at each member.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html:
#        the Sun 132712440041.279419, Mercury 22031.868551, Venus 324858.592, Earth-Moon
#        403503.235625, Mars system 42828.375816; Jupiter, Saturn, Uranus and Neptune systems
#        as given at each body (km^3/s^2).
# [DES]  Deep Ecliptic Survey classifications (Elliot et al. 2005, AJ 129, 1117), from the
#        nominal orbit and two clones 3 sigma away, all agreeing ("secure"), at
#        www.boulder.swri.edu/~buie/kbo/astrom/<number>.html (retrieved 2026-11-13):
#        Orcus 3:2, 1995 DA2 4:3, 1996 TR66 and 2000 JG81 2:1, 1999 DE9 5:2, Gonggong 10:3,
#        2001 QR322 1:1, Arrokoth and Quaoar classical.
# [BELT] The known objects as points: JPL SBDB Query API, classes TNO and CEN, osculating
#        J2000 ecliptic elements moved to JD 2461200.5 TDB; secure resonances from the [DES]
#        class list (desclass.html, generated 2026-11-12), the rest by element cuts;
#        tools/belts/make_tno_classes.py, assets/belts/SOURCES.md.
# [CH03] Chiang et al. 2003, AJ 126, 430 (arXiv:astro-ph/0301458): 2001 QR322, the first
#        Neptune Trojan, librates about L4 with an amplitude of 24 deg, stable for at least
#        1 Gyr in their integrations; 1995 DA2 in the 4:3 and 1996 TR66 in the 2:1 (with
#        Nesvorny & Roig 2001); the 2:1 objects they list mostly librate about phi = 70-90
#        deg (asymmetric), while 2000 JG81 librates about 180 deg with an amplitude of
#        ~160 deg (symmetric); 1999 DE9 among the 5:2 objects (Table 2).
# [HL10] Horner & Lykawka 2010, MNRAS 405, 49 (arXiv:1002.4699): with a better orbit, most
#        clones of 2001 QR322 leave the Trojan cloud within a few hundred million years.
# [ST10] Sheppard & Trujillo 2010, Science 329, 1304: 2008 LC18, the first Trojan found at
#        Neptune's trailing (L5) point.
# [CO65] Cohen & Hubbard 1965, AJ 70, 10: Pluto's 3:2 resonance with Neptune keeps the two
#        apart although Pluto's orbit crosses Neptune's.
# [MA93] Malhotra 1993, Nature 365, 819: Neptune's outward migration can have captured
#        Pluto into the resonance and raised its eccentricity.
# [GL08] Gladman, Marsden & VanLaerhoven 2008, in The Solar System Beyond Neptune, 43:
#        nomenclature (resonant, classical, scattering, detached).
# [BR04] Brown, Trujillo & Rabinowitz 2004, ApJ 617, 645: Sedna, perihelion 76 au.
# [TS14] Trujillo & Sheppard 2014, Nature 507, 471: 2012 VP113, perihelion 80 au.
# [FO13] Fornasier et al. 2013, A&A 555, A15 (arXiv:1305.0449): Orcus 917 +- 25 km across
#        (Vanth 276 km).
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/,
#        retrieved 2026-11-13), PLU060, epoch 2000-01-01.5 TDB, in Pluto's equator: Charon,
#        Styx, Nix, Kerberos, Hydra (Brozovic & Jacobson 2024, AJ 167, 256). Node periods
#        listed as positive are regressions (as for the Moon's 18.6 years).
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/,
#        retrieved 2026-11-13): mean radii of Nix 18.0, Hydra 18.5, Kerberos 6.0, Styx 5.2
#        km; GM of Nix 0.0015 and Hydra 0.0020 km^3/s^2 (PLU060).
# [PR24] Proudfoot et al. 2024, PSJ 5, 69 (arXiv:2403.12782), Table 2: non-Keplerian fit
#        to the orbits of Hi'iaka and Namaka (HST only), J2000 ecliptic elements at
#        Haumea-centric JD 2454615.0; masses of Haumea and both moons.
# [RB09] Ragozzine & Brown 2009, AJ 137, 4766 (arXiv:0903.4213): radii of Hi'iaka and
#        Namaka about 160 and 80 km for the density of water ice; no Keplerian orbit fits
#        Namaka over long times.
# [BR07] Brown et al. 2007, Nature 446, 294, as cited by Ragozzine & Brown 2007 (AJ 134,
#        2160, arXiv:0709.0328): Haumea has diffused in the fifth-order 12:7 resonance
#        from where its collisional family began. DES classifies it as scattered-near.
#        From this scene's initial states, an offline check with REBOUND (WHFast, the same
#        five masses, barycentric elements) finds Haumea's three 12:7 arguments circulating
#        for the first ~650,000 years and librating after that: at the edge, as captioned.
# [HO26] Holman et al. 2026, submitted to AJ (arXiv:2610.38693): 2026 ED138, found in early
#        Rubin Observatory data; H_V = 3.19, 612-1530 km across for albedos 0.25-0.04;
#        barycentric a = 43.09 au, e = 0.139, i = 24.4 deg; at the edge of the 12:7
#        resonance, phi = 12 lambda - 7 lambda_N - 3 varpi - 2 Omega librating about 180
#        deg with amplitude 95-115 deg in 46% of the clones over 10 Myr (a resonant
#        candidate); g - r = 0.63, too red for Haumea's family.
# [SBDB] JPL Small-Body Database (https://ssd-api.jpl.nasa.gov/sbdb.api, retrieved
#        2026-11-13): absolute magnitudes H, for the bodies without a measured size.
# [INT]  This scene's own integration (tests/trans_neptunian_tests.cpp): the libration
#        centers, amplitudes and periods, and closest approaches quoted in the captions. At
#        perihelion the resonant angle p lambda - q lambda_N - (p - q) varpi is q times the
#        perihelion's longitude from Neptune, so Pluto's +-80 deg libration about 180 deg
#        moves its perihelia +-40 deg about 90 deg from Neptune.
#
# The model: the Sun (carrying the masses of the four inner planets) and the giant
# planets' system barycenters pull on each other; the trans-Neptunian objects are test
# particles. Over tens of thousands of years this shows what the resonances do, not where
# each body will really be: the planets' phases drift from the real ones within centuries,
# and the small bodies' orbits are known only to their observational uncertainties.
# Colors of the orbits: resonant objects orange (Trojans green), classical blue,
# scattered violet, detached red. Sizes without a measurement come from H with an assumed
# geometric albedo of 0.10, D = 1329 km / sqrt(0.10) * 10^(-H / 5): illustrative.
# Body sizes, rotations and rings of the dwarf planets come from bodies/*.toml.

name = "Trans-Neptunian Objects"

[view]
focus = "Sun"
distance_km = 1.6e10       # ~110 au
start = "now"
warp = 31557600.0          # 1 year per second
up = "ecliptic"

[[bodies]]
name = "Sun"
template = "bodies/sun.toml"
gm_km3_s2 = 1.32712440041279419e11         # [GM]
pole_ra_dec_deg = [286.13, 63.87]          # NAIF pck00011.tpc
prime_meridian_deg = [84.176, 14.1844]
color = "#fff4e0"

