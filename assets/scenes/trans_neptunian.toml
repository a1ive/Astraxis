# --- Frames --------------------------------------------------------------------------------
# Turning with Neptune (x toward Neptune, z along its orbit normal), resonant orbits close
# into fixed patterns.

[[frames]]
name = "Turning with Neptune"
type = "rotating"
primary = "Sun"
secondary = "Neptune"
origin = "Sun"

# --- Events ---------------------------------------------------------------------------------
# Patterns: a p:q resonance repeats after p orbits of Neptune (164.8 years each), so each
# resonant trail is that long: 2:1 120,380 days, 3:2 180,570, 4:3 240,760, 5:2 300,950,
# 10:3 601,900, 12:7 722,280. The Trojans' trails are one swing about their point, 9,500 years [INT].

[[events]]
name = "Beyond Neptune"
time = "2026-01-01"
focus = "Sun"
distance_km = 1.9e10
elevation_deg = 55.0
warp = 31557600.0              # 1 year per second
# [GL08], [DES]
caption = """\
    Past Neptune lie thousands of known icy bodies, each point here one of them. Their \
    orbits sort them into families: the classical belt of near-circular orbits (blue), \
    objects whose periods are locked to Neptune's (orange, Trojans green), the \
    scattered disk stirred by Neptune (violet), and detached objects beyond its reach \
    (red). Gray points have orbits still too poorly known to sort."""

[[events]]
name = "What the surveys see"
time = "2026-01-01"
focus = "Sun"
distance_km = 1.9e10
elevation_deg = 90.0
warp = 2629800.0               # 1 month per second
hide_orbits = true
# [BELT], [HO26], [INT]
caption = """\
    These are the objects found so far, not the belt as it is. Few are known toward \
    Taurus and Gemini, where the Milky Way crosses the ecliptic and stars crowd the \
    images, and 2026 ED138 hid against the Milky Way until this year. Nearly every \
    known scattered or detached object is now nearer the Sun than its semi-major \
    axis: the far, faint ones are missed."""

[[events]]
name = "Every known plutino"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 1.6e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 315576000.0             # 10 years per second
belts = ["Plutinos"]
trails = [
    { body = "Pluto system", trail = "none" },
    { body = "Orcus", trail = "none" },
]
# [DES], [BELT], [INT]
caption = """\
    The 443 objects known to share Pluto's 3:2 resonance, turning with Neptune. The \
    272 now inside 36 au, near perihelion, all lie more than 20 degrees from Neptune's \
    direction; those in line with it are far beyond, near aphelion. None is within \
    12 au of Neptune, and the swarm keeps its shape as the frame turns."""

[[events]]
name = "Pluto and Orcus: three to two"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 2.0e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 315576000.0             # 10 years per second
trails = [
    { body = "Pluto system", trail = "history", trail_history_days = 180570.0 },
    { body = "Orcus", trail = "history", trail_history_days = 180570.0 },
]
# [CO65], [DES], [INT]
belts = ["Plutinos"]
caption = """\
    Here the view turns with Neptune, which stays at the top. Pluto goes around \
    the Sun twice while Neptune goes three times, so its path closes into a fixed \
    pattern. Pluto's orbit dips inside Neptune's, but its perihelia fall about a \
    quarter turn away from Neptune, and the two never come closer than 17 au. \
    Orcus follows the same pattern, half a cycle behind."""

[[events]]
name = "Neptune's Trojans: one to one"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 1.3e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 315576000.0             # 10 years per second: the points stay near their orbits
trails = [
    { body = "2001 QR322", trail = "history", trail_history_days = 3469875.0 },
    { body = "2008 LC18", trail = "history", trail_history_days = 3469875.0 },
]
# [CH03], [ST10], [HL10], [INT]
belts = ["Neptune Trojans"]
caption = """\
    Trojans share Neptune's orbit, 60 degrees ahead or behind. 2001 QR322, the first \
    found, swings around the leading point and 2008 LC18 around the trailing one, each \
    in about 9,500 years. Of the 33 Trojans known, 28 lead Neptune: in the 2000s and \
    2010s the trailing cloud lay in front of the crowded center of the Milky Way."""

[[events]]
name = "Lobes: 4:3 and 5:2"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 2.4e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 315576000.0             # 10 years per second
trails = [
    { body = "1995 DA2", trail = "history", trail_history_days = 240760.0 },
    { body = "1999 DE9", trail = "history", trail_history_days = 300950.0 },
]
# [DES], [CH03], [INT]
belts = []                     # the two trails alone
caption = """\
    In a p:q resonance the object makes q orbits while Neptune makes p, so its path \
    has q perihelion loops and winds p - q times around the Sun. 1995 DA2 (4:3) \
    has three loops, and 1999 DE9 (5:2) two, wound three times around. Like Pluto, \
    each passes perihelion far from Neptune."""

[[events]]
name = "Gonggong: ten to three"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 3.6e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 315576000.0             # 10 years per second
trails = [
    { body = "Gonggong", trail = "history", trail_history_days = 601900.0 },
]
# [DES], [INT]
belts = []                     # the trail alone
caption = """\
    Gonggong, a dwarf planet about 1,230 km across, goes around the Sun three times \
    for every ten of Neptune's, which takes 1,650 years. Its path winds seven times \
    around the Sun between its three perihelion loops, which stay clear of \
    Neptune."""

[[events]]
name = "Pluto and its five moons"
time = "2026-01-01"
focus = "Pluto system"
distance_km = 2.6e5
elevation_deg = 60.0
warp = 172800.0                # 2 days per second
focus_orbits_only = true
# [ELEM], [SPHY]
belts = []                     # a close-up: the points would only cross it
caption = """\
    Pluto and Charon circle a point between them every 6.4 days, always facing \
    each other. Four small moons, Styx, Nix, Kerberos and Hydra, orbit the pair \
    farther out, in periods close to 3, 4, 5 and 6 times Charon's. Nix and Hydra \
    are about 37 km across, Kerberos and Styx about 11."""

[[events]]
name = "Haumea and its moons"
time = "2026-01-01"
focus = "Haumea"
distance_km = 1.4e5
from_body = "Sun"              # the lit side
phase_deg = 20.0
elevation_deg = 30.0
warp = 345600.0                # 4 days per second
focus_orbits_only = true
# [PR24], [RB09], [INT]
belts = []                     # a close-up: the points would only cross it
caption = """\
    Haumea spins once every 3.9 hours, which has stretched it into an elongated \
    shape. Hi'iaka, about 320 km across, orbits it in 49 days, nearly in the plane \
    of its ring, and Namaka, half as large, in 18 days on a tilted, eccentric orbit. \
    Both are thought to be pieces knocked off in an ancient collision."""

[[events]]
name = "Haumea and 2026 ED138: twelve to seven"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 2.4e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 1577880000.0            # 50 years per second
trails = [
    { body = "Haumea", trail = "history", trail_history_days = 722280.0 },
    { body = "2026 ED138", trail = "history", trail_history_days = 722280.0 },
]
# [BR07], [HO26], [INT]
belts = []                     # the two trails alone
caption = """\
    Haumea and 2026 ED138, found by the Rubin Observatory in 2026, sit at the edge \
    of the 12:7 resonance: seven orbits for every twelve of Neptune's, about 1,980 \
    years. 2026 ED138 swings within it here, but only about half of the orbits that \
    fit its data stay in for ten million years. Haumea slips in and out."""

[[events]]
name = "Two ways to keep 2:1"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 2.6e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 15778800000.0           # 500 years per second
trails = [
    { body = "1996 TR66", trail = "history", trail_history_days = 120380.0 },
    { body = "2000 JG81", trail = "history", trail_history_days = 120380.0 },
]
# [CH03], [DES], [INT]
belts = []                     # the points would smear at this warp (two-body orbits)
caption = """\
    Objects in the 2:1 resonance have a single perihelion lobe, so it need not lie \
    opposite Neptune. 1996 TR66's lobe stays ahead of Neptune, rocking gently over \
    thousands of years. 2000 JG81's lobe swings from one side of Neptune to the \
    other and back. Here every second is 500 years."""

[[events]]
name = "Pluto's slow swing"
time = "2026-01-01"
focus = "Sun"
frame = "Turning with Neptune"
distance_km = 2.0e10
from_body = "Neptune"
phase_deg = 180.0
elevation_deg = 90.0
warp = 15778800000.0           # 500 years per second
trails = [
    { body = "Pluto system", trail = "history", trail_history_days = 180570.0 },
]
# [CO65], [MA93], [INT]
belts = []                     # the points would smear at this warp (two-body orbits)
caption = """\
    The pattern is not fixed. Over about 20,000 years, Pluto's perihelia swing up \
    to 40 degrees toward Neptune and back, like a pendulum, never reaching it. \
    Neptune is thought to have captured Pluto in this resonance as it migrated \
    outward early on, raising Pluto's eccentricity."""

[[events]]
name = "The classical belt, edge-on"
time = "2026-01-01"
focus = "Sun"
distance_km = 1.5e10
elevation_deg = 4.0
warp = 31557600.0              # 1 year per second
