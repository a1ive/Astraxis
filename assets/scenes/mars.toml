# Mars, Phobos and Deimos, eight orbiters: Mars Odyssey (2001-), Mars Express (2003-), the
# Mars Reconnaissance Orbiter (2006-), MAVEN (2014-2025), India's Mars Orbiter Mission
# (2014-2022), ESA's Trace Gas Orbiter (2016-), Hope (2021-) and China's Tianwen-1
# (2021-), and comet Siding Spring's pass of Mars on 2014-10-19. The gravity-assist flybys of
# Europa Clipper and Hera (2025), bound for Jupiter and the asteroid Didymos. The interstellar
# comet 3I/ATLAS, which Tianwen-1 photographed as it passed Mars in October 2025.
#
# Sources
# [HZN]  JPL Horizons state vectors relative to Mars' center, baked by
#        tools/bake/horizons_bake.py (tools/bake/ephem.toml, Kepler-relative AXEPH2):
#        - Mars Express (-41): ESA trajectory, 2003-12-20 .. 2029-01-01, reconstructed from
#          tracking through 2026-09-23, then ESA's prediction.
#        - MAVEN (-202): JPL navigation, 2014-09-18 .. 2025-12-04, the end of the tracking
#          data (contact was lost on 2025-12-06).
#        - MRO (-74): JPL MRO navigation, three windows only (a low orbit takes many knots):
#          2006-03-07 .. 2006-10-01 (arrival and aerobraking), 2014-10-05 .. 11-05 (the
#          comet) and 2024-10-01 .. 2026-10-27 12:08 (a planning prediction after
#          2026-09-27). MRO is not shown in between.
#        - Hope (-62): 2021-02-05 .. 2027-03-04, fit to tracking data through 2026-09-03,
#          then a prediction: a chain of arcs fitted to tracking ("tag-up fit"). The arc
#          through the orbit insertion burn holds the planned burn (to 1,081 x 50,073 km
#          above the mean radius, 41.6 h [EMMF]); the next, from 2021-02-10 00:04:59 TDB, the
#          orbit reached (1,079 x 42,447 km, 33.7 h [EMMO]), 2,397 km and 126 m/s off it.
#          tools/bake/rejoin_burn.py takes the later arc back to the burn and fits the burn
#          to it: 985 m/s instead of 958.
#        - Odyssey (-53): JPL Odyssey navigation, windows as for MRO: 2001-10-20 .. 2002-02-20
#          (arrival and aerobraking), 2014-10-05 .. 11-05 (the comet) and 2024-10-01 ..
#          2026-12-28 (a prediction after 2026-09-23).
#        - TGO (-143): ESA, two windows: 2016-10-15 .. 2018-05-01 (arrival and aerobraking)
#          and 2023-06-21 .. 2026-12-31: fit to tracking data until 2025-06-21 16:14, then
#          ESA's long-term predicts (with a 30 km step where they join).
#        - MOM (-3): DSN/JPL tag-up fits, 2014-09-20 .. 2022-04-30 (contact was lost in April
#          2022).
#        - Phobos (401) and Deimos (402): only within a day of Mars Express' (Phobos), Hope's
#          and Hera's (Deimos) passes closer than 1,500 km; elsewhere the mean elements
#          [ELEM], faded in over one day.
#        - Europa Clipper (-159, JPL navigation, reconstructed: the flyby is in
#          cruise006-final-OD055) and Hera (-91, ESA, "Post-launch tracking-data based
#          trajectory") relative to Mars, five days either side of each flyby. Notes:
#          Clipper "Mars gravity assist : 2025-Mar-01", "Earth gravity assist: 2026-Dec-03",
#          arrival at Jupiter 2030-Apr-11, to "assess habitability" of Europa; 30.5 m across
#          with its arrays out. Hera: "2025-Mar : Mars flyby (~6000 km from Mars, ~1000 km
#          from Deimos)", Didymos in late 2026, to assess the crater DART left on Dimorphos;
#          a 1.6 m box with two 5 m solar panel arms.
#        - Comet C/2013 A1 (Siding Spring): JPL solution c2013a1_s105_merged (Horizons
#          1003228), 2014-08-01 .. 2014-12-31, relative to Mars (the [APX] Mars would
#          misplace a heliocentric comet by thousands of km).
#        - 3I/ATLAS (C/2025 N1): JPL solution 54 (Horizons 90004937, non-gravitational
#          accelerations for CO2), 2025-05-15 .. 2025-12-31, relative to Mars. Closest
#          2025-10-03 04:38 TDB, 28.97 million km (0.1937 au), 86.1 km/s.
#        Horizons notes: Mars Express "Inclination: 86.3 deg, pericentre = 258 km, Period:
#        6h 43m, apocentre = 11 560 km"; MAVEN "took 5 weeks" from capture to its science
#        orbit, "150 x 6200 km having a 75 degree inclination"; MRO "aerobraked for 6 months
#        from the post-insertion 35 hour orbit", then "a 112 minute, near circular polar
#        orbit"; Hope (EMM) "an elliptical, roughly 22000 x 44000 km orbit with a period of
#        55 hours, 25 degree inclination", arrival 2021-02-09 15:54:46 UTC, built by the
#        United Arab Emirates, to "create a global picture of how the martian atmosphere
#        varies throughout the day and year"; Odyssey arrived 2001-10-24 02:30 UTC, found "vast
#        amounts of water ice in the polar regions burried just beneath the surface", relayed
#        "95% of the data from the Mars rovers"; TGO (ExoMars 2016) to search for methane and
#        other trace gases, aerobraking during 2017 to a "circular ~400-km altitude, 74 degree
#        inclination orbit", its lander Schiaparelli "destroyed on impact"; MOM "India's
#        first interplanetary mission", arrival 2014-09-24, "366 x 80000 km Mars orbit with
#        inclination 150 degrees" (the plan), 6-8 months of planned work, contact lost in
#        April 2022 "7.5 years into a 6 month mission", formally ended 2022-10-02.
# [TW1]  Tianwen-1, tools/tianwen1/ (assets/ephem/SOURCES.md), Mars-centered:
#        - 2021-02-08 .. 2021-11-16: the state vectors in the orbiter's telemetry (decoded by
#          D. Estevez from amateur stations such as AMSAT-DL's 20 m dish at Bochum;
#          github.com/daniestevez/jupyter_notebooks), propagated and joined at the
#          maneuvers: orbit insertion as Estevez modeled it; the burns into the parking
#          orbit (02-23) and the relay orbit (05-17), which no vectors bracket closely,
#          fitted to the next vectors (02-21 .. 05-14 and 05-14 .. 06-03 have none).
#        - 2021-11-16 .. 2025-12-17: the orbiter's positions in the calibrated data of its
#          magnetometer, MOMAG (USTC, http://space.ustc.edu.cn/dreams/tw1_momag/; Wang et
#          al. 2023, Earth Planet. Phys. 7, 1; Zou et al. 2023, Sci. China Tech. Sci. 66,
#          2396; Wang et al. 2024, JGR Space Physics 129, e2023JA031757). Data gaps of more
#          than 2 hours (e.g. 2022-11 .. 2023-04) are gaps here: the orbiter is not shown.
#        [AMSAT] D. Estevez, M. Lorenz and P. Gulzow, "Deep space reception of Tianwen-1 by
#          AMSAT-DL using GNU Radio", Proc. GNU Radio Conference 6(1), 2021 (2022): the
#          maneuvers from the telemetry: Mars orbit injection on 2021-02-10 into a 390 x
#          182,000 km, 11 deg orbit (660 m/s); a plane change to 87 deg at the first
#          apoapsis (128 m/s); 02-20 apoapsis lowering to 280 x 84,600 km to phase with the
#          landing site (53 m/s); 02-23 a 2 Mars sidereal day orbit over the landing site
#          (41 m/s); 05-14 a deorbit burn (21 m/s), the release of the lander, a collision
#          avoidance burn back to a 2-sol orbit (61 m/s); 05-17 a 1/3-sol relay orbit.
#        Horizons notes for Tianwen-1 (record -9901491, cruise only): science objectives
#          "Map the morphology and geological structure", among others.
# [SBDB] JPL Small-Body Database, C/2013 A1 total magnitude M1 = 8.5 (+-2), K1 = 9 (solution
#        105; M1 + 5 log delta + K1 log r). The coma color and ion tail are illustrative
#        (its gas tail is not measured here), as are the dust tail's grain speeds and sizes
#        (src/scene/comet.hpp defaults). 3I/ATLAS: M1 = 12.5 (+-0.9), K1 = 4.5 (solution 54,
#        a fit to 733 observations); it was 3 magnitudes brighter than that from Mars [REN],
#        whose photometry gives M1 here.
# [REN]  X. Ren, W. Yan, R. Zhao et al., "Interstellar Object 3I/ATLAS Observed from Mars by
#        China's Tianwen-1 Spacecraft", ApJ Letters (accepted 2026-04-21), arXiv:2603.10350v3:
#        discovered 2025-07-01; eccentricity 6.14, inclination 175 deg, so that it stays close
#        to the ecliptic and every view from the Earth or near it is close to its orbital
#        plane; closest to Mars 2025-10-03 04:38 UT at 0.194 au (~30 million km), ~86 km/s
#        relative velocity; solar conjunction (from the Earth) around 10-21, perihelion 1.36
#        au on 10-30. Tianwen-1 imaged it with the CMOS camera of its High-Resolution Imaging
#        Camera (HiRIC): 3 epochs from 09-30 to 10-03 (Table 1: 09-30 16:00, 10-01 16:00 and
#        10-03 05:47 UTC), 19 exposures of 1.34 s in 30 s each; China's first deep-space
#        observation of an astronomical object, and the first images of 3I from well out of
#        its orbital plane (36-44 deg south). The coma is dominated by large grains (beta
#        ~1e-3 to 1e-2, a few 100 um), sunward ejection at 3-10 m/s; Finson-Probstein
#        synchrones from 300 to 50 days before; dust mass loss ~10^3 kg/s. Nucleus radius
#        1.3 +- 0.2 km (Hui et al. 2026, as quoted there).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a (Mars).
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (https://ssd.jpl.nasa.gov/sats/elem/),
#        MAR099, epoch 2000-01-01.5 TDB; how the periods are derived: solar_system.toml.
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/),
#        also the GM of Mars alone ("Planet and Pluto GM Values").
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians.
# [THOM] Phobos and Deimos shape models and Viking mosaics (P. C. Thomas): solar_system.toml.
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [MOI]  Orbit insertion burns, for the arrival events' ghosts (retrieved 2026-10-19). Times
#        given as received on the Earth are moved back by the one-way light time to the
#        Earth's center from Horizons (observer quantity 21) at the burn. Every 1-minute
#        Horizons sample through each burn is a knot of its table (ephem.toml keep_all).
#        [ODYK] NASA/JPL, "2001 Mars Odyssey Arrival" press kit (October 2001): the burn
#          from 2:26 to 2:45 UT on 2001-10-24, Earth-received ("a few seconds after 7:26
#          p.m." PDT, expected to end at 7:46), "for 19.7 minutes", "about 20 minutes";
#          one-way light time 8 min 30 s (Horizons: 8.46 min); 5.422 km/s before, 4.374
#          after, "Change in velocity due to burn: 1,427 meters per second".
#        [MEXN] T. Morley, F. Budnik, R. Mackenzie, M. Faehling, "Mars Express Navigation
#          for Beagle 2 Separation and Mars Orbit Insertion", ISSFD 2004: the burn "to begin
#          about 22 minutes before pericentre passage"; "expected to last 33 min. 42 s with
#          an integrated V of 806.762 m/s"; the acceleration was a little low and the
#          accelerometers extended it by 28 s. ESA, "Merry Christmas from Mars"
#          (2003-12-25): the main engine fired "at 03:47 CET for a 37-minute burn". The
#          table's burn runs from 02:47:40 to 03:19:17 UTC, 31.6 minutes.
#        [MROK] NASA/JPL, "Mars Reconnaissance Orbiter Arrival" press kit (March 2006): "Start
#          of orbit-insertion burn by main thrusters" 1:24 p.m. PST on 2006-03-10, end 1:51
#          p.m. (Earth-received times), "about 27 minutes", "about 1,000 meters per second";
#          light time 12 minutes (Horizons: 11.97 min).
#        [MAVM] Spaceflight Now, "MAVEN enters Mars orbit" (2014-09-22): "programmed to ignite
#          its rocket thrusters at 9:37 p.m. EDT (0137 GMT)"; the burn "lasted 34 minutes and
#          26 seconds", "about 11 seconds longer than the nominal"; "about 2,750 mph"
#          (1,229 m/s).
#        [MOMI] (as below): the 440 N engine and eight thrusters fired 1,388.67 s from
#          07:17:32 IST (01:47:32 UTC) on 2014-09-24, 1,099 m/s (also AmericaSpace,
#          2014-09-24).
#        [TGOM] ESA, "ExoMars TGO reaches Mars orbit while EDM situation under assessment"
#          (2016-10-19): "the long 139-minute burn", "from 13:05 to 15:24 GMT", "reducing
#          the spacecraft's speed and direction by more than 1.5 km/s". ESA's press kit
#          timeline (Earth-received times, as copied by E. Lakdawalla, Planetary Society,
#          2016-10-14): "TGO orbit insertion begins (maximum 147-minute burn)" 13:14 UTC;
#          light time 9.78 min (Horizons), so 13:04:13 at the spacecraft. The table's burn
#          runs from 13:04:40 UTC to 15:24:51, where the next of ESA's files starts 99 km and
#          50 m/s off it.
#        [EMMF] MBRSC, "Mars Orbital Insertion Factsheet" (January 2021): "The burn ... will
#          commence at 19:30GST and end at 19:57 GST" (spacecraft time; Gulf Standard Time,
#          UTC+4) on 2021-02-09, "27 minutes' duration", six thrusters, "some 650 Newtons";
#          confirmation "eleven minutes later"; the capture orbit 1,000 x 49,380 km above
#          the surface. No delta-v given.
#        [EMMO] UAE Government Media Office, "Emirates Mars Mission Hope Probe Ready for
#          Science Data Gathering" (2021-03-09): the capture orbit reaches "as close to Mars'
#          planetary surface as 1,063 kilometres" and "as far away as 42,461 kilometres".
#
# [CAP]  Event captions (retrieved 2026-10-08):
#        [MEX] ESA, Mars Express mission page (esa.int/Science_Exploration/Space_Science/
#          Mars_Express): launched 2003-06-02, at Mars in December 2003; "the most complete
#          map of the chemical composition of the atmosphere", the history of water, views
#          of Mars "in three dimensions"; two decades of operation.
#        [B2] ESA, "Beagle-2 lander found on Mars" (2015-01-16): released from Mars Express on
#          2003-12-19, due to land on Christmas Day 2003; found in images from HiRISE on
#          NASA's Mars Reconnaissance Orbiter, "partially deployed on the surface" with only
#          one to three of its four solar panels open.
#        [MEXP] ESA, "Mars Express heading towards daring flyby of Phobos" (2013-12-23): 45 km
#          above the surface on 2013-12-29, the closest yet (67 km in March 2010); too close
#          and fast for images; Phobos' pull on the spacecraft, tracked by radio, gives its
#          mass and inner structure; earlier flybys suggest it "could be between a quarter
#          and a third empty space", a rubble pile.
#        [MRO] NASA, science.nasa.gov/mission/mars-reconnaissance-orbiter/: launched
#          2005-08-12, orbit insertion 2006-03-10, six months of aerobraking; a camera that
#          "can spot something as small as a dinner table"; a relay for landers.
#        [MROS] NASA/JPL, "NASA Mars Reconnaissance Orbiter Reaches Science Orbit" (2006-09-13):
#          426 passes through the upper atmosphere from early April to 2006-08-30, lowering
#          the high point from 45,000 to 486 km, the low point 98-105 km above the surface;
#          35 hours per orbit to under two, "saved us roughly 600 kilograms of fuel"; science
#          orbit 250 x 316 km set on 2006-09-11.
#        [MAV] NASA, science.nasa.gov/mission/maven/: in orbit 2014-09-21 22:24 EDT (09-22
#          UTC), "the first mission devoted to understanding the Martian upper atmosphere";
#          last heard from on 2025-12-06 after passing behind Mars; not recoverable, end of
#          mission declared 2026-06-03; more than 11 years at Mars.
#        [MAVS] NASA, "NASA Mission Reveals Speed of Solar Wind Stripping Martian Atmosphere"
#          (2015-11-05): about 100 grams of gas a second, more during solar storms (March
#          2015); loss to space likely a major cause of Mars' change in climate.
#        [HOPE] Spaceflight Now, "Emirati orbiter captures up-close view of Martian moon Deimos"
#          (2023-04-25), from the team's EGU results: about 100 km from Deimos on 2023-03-10,
#          one of a series of passes after an orbit change; the first detailed images of the
#          side facing away from Mars, which spacecraft closer in (MRO) never see; a surface
#          like dark volcanic rock similar to Mars, no strong carbon signatures: both moons
#          "may have formed from debris left over from an impact on Mars".
#        [CSS] NASA/JPL, "NASA's Mars spacecraft maneuvers to prepare for close comet flyby"
#          (2014-07): the comet "has never before entered the inner solar system"; dust at
#          about 56 km/s; the greatest risk from 90 minutes after the closest approach, for
#          about 20 minutes. "All Three NASA Mars Orbiters Healthy After Comet Flyby"
#          (2014-10-19): Odyssey, MRO and MAVEN "took shelter behind Mars"; much closer than
#          any other known comet flyby of Mars or Earth. "Mars Orbiter Image Shows Comet
#          Nucleus is Small" (2014-10-20): HiRISE, 138 m per pixel from 138,000 km, a nucleus
#          less than half the 1 km estimated from telescopes; a comet from the Oort Cloud.
#        [MAVC] LASP/NASA, "Mars spacecraft reveal comet flyby effects on Martian atmosphere"
#          (2014-11-07): dust vaporized high in the atmosphere, "likely an impressive meteor
#          shower"; magnesium and iron ions dominated Mars' ultraviolet spectrum for hours;
#          "Not even the most intense meteor storms on Earth have produced as strong a
#          response"; the first direct measurements of the dust of an Oort Cloud comet; MRO's
#          and Mars Express' radars saw a new, very strong layer of ions.
#        [ODY] NASA/JPL, "NASA Moves Longest-Serving Mars Spacecraft for New Observations"
#          (2014-02-12): "the longest-working spacecraft ever sent to Mars"; discoveries of
#          "how widely water ice" is distributed; a relay for the rovers. "Mars Odyssey Mission
#          Status" (2001-11-13): periapsis lowered to 110 km, the period "currently 15 hours",
#          aerobraking to end in late January 2002.
#        [SCH] ESA, "Schiaparelli landing investigation completed" (2017-05-24): a brief
#          saturation of the inertial measurement unit made the computer conclude it was
#          below ground; "early release of the parachute and back-shell", "free-fall from an
#          altitude of about 3.7 km", "an estimated impact speed of 540 km/h"; TGO "was
#          entering orbit around the Red Planet at the same time".
#        [TGOA] ESA, "Aerobraking completed" (2018-02-21): aerobraking since the arrival in
#          October 2016, now complete; "a near-circular two-hour orbit, about 400 km above the
#          planet, by the end of April"; to "take a detailed inventory of the atmosphere,
#          sniffing out gases like methane". ESA, "Surfing complete" (2018-02-20, as quoted in
#          search results; the page refused automated access): from "a highly elliptical
#          four-day orbit of about 98 000 x 200 km".
#        [MOMI] ISRO, "Mars Orbiter Spacecraft Successfully Inserted into Mars Orbit"
#          (2014-09-24, as relayed by SpaceRef): 421.7 x 76,993.6 km, inclination 150 deg,
#          72 h 51 min 51 s.
#        [ECM] NASA/JPL, "NASA's Europa Clipper Uses Mars to Go the Distance" (2025-02-25):
#          closest at 12:57 p.m. EST on 1 March, 884 km above the surface; arriving at 24.5
#          km/s relative to the Sun, leaving at 22.5 km/s; the thermal imager calibrated on
#          Mars, the radar tested near closest approach, the first time all its parts work
#          together; the Earth in December 2026 for a boost, Jupiter in April 2030.
#        [HERA] ESA, "Watch live: Images from Hera's Mars flyby" (2025-03-10): on 12 March
#          "within 5000 km of the surface" of Mars and "300 km of Mars's more distant and
#          enigmatic moon Deimos", imaging it from at least 1000 km; the Asteroid Framing
#          Camera, the Hyperscout H hyperspectral imager (25 bands, minerals) and JAXA's
#          Thermal Infrared Imager; to help plan JAXA's Martian Moons eXploration (MMX),
#          which will sample Phobos; at Didymos in December 2026. ESA simulation: closest to
#          Deimos at 12:10 GMT, to Mars at 12:50. DLR (2025-03-13): Deimos "seen crossing the
#          face of Mars" in the framing camera's images.
#        Orbits as drawn: [HZN].
#
# Colors are sRGB and illustrative where no map is used.

name = "Mars"

[view]
focus = "Mars"
distance_km = 7.0e4         # out to Deimos
pitch_deg = 20.0
start = "now"
warp = 600.0                # 10 minutes per second: Phobos goes round in 46 seconds

# Heliocentric orbit of the scene origin, used for the Sun direction. [APX]
[origin_heliocentric]
type = "jpl_approx_planet"
a_au = [1.52371243, 0.00000097]
e = [0.09336511, 0.00009149]
i_deg = [1.85181869, -0.00724757]
mean_longitude_deg = [-4.56813164, 19140.29934243]
lon_peri_deg = [-23.91744784, 0.45223625]
node_deg = [49.71320984, -0.26852431]

[[bodies]]
name = "Mars"
radii_km = [3396.19, 3376.20]              # [PCK]
gm_km3_s2 = 42828.375816                   # system [GM]; osculating orbits of the moons and spacecraft
body_gm_km3_s2 = 42828.37362               # [SPHY] (MAR097)
pole_ra_dec_deg = [317.269202, 54.432516]  # [PCK]
prime_meridian_deg = [176.049863, 350.891982443297]
pole_rate_deg_per_century = [-0.10927547, -0.05827105]
# pck00011's long-period terms (about 71,000 years; at J2000 the pole is 317.681, 52.886):
# its ~0.0002 deg terms (under 15 m at the surface) are left out, so these angles are not
# BODY4_NUT_PREC_ANGLES.
nut_prec_angles = [[79.398797, 0.5042615], [166.325722, 0.5042615], [95.391654, 0.5042615]]
nut_prec_ra = [0.419057]
nut_prec_dec = [0.0, 1.591274]
nut_prec_pm = [0.0, 0.0, 0.584542]
color = "#c1673e"
texture = "textures/mars.jpg"              # assets/textures/SOURCES.md
texture_left_lon_deg = -180.0
[bodies.atmosphere]                        # [ATM]
height_km = 100.0
haze_depth = 0.5
haze_scale_height_km = 11.9
haze_albedo = [0.97, 0.93, 0.75]
haze_g = 0.63

# Phobos and Deimos as in solar_system.toml (keep the two in step).

[[bodies]]
name = "Phobos"
parent = "Mars"
shape = "shapes/phobos.mesh"                # [THOM] 2-deg grid; assets/shapes/SOURCES.md
radii_km = [13.0, 11.4, 9.1]               # [PCK], long axis toward Mars (shadows, camera distances)
body_gm_km3_s2 = 0.0007087                 # [SPHY] (MAR097)
pole_ra_dec_deg = [317.67071657, 52.88627266]  # [PCK]
prime_meridian_deg = [35.18774440, 1128.84475928, 9.536137031212154e-09]  # W0, deg/day, deg/day^2
pole_rate_deg_per_century = [-0.10844326, -0.06134706]
# [PCK] BODY4_NUT_PREC_ANGLES M1-M5 (M5 with its quadratic term) and BODY401_NUT_PREC_*:
# the pole circles the Laplace pole with the node (2.26 years), W librates by 1.143 deg.
nut_prec_angles = [[190.72646643, 15917.10818695], [21.46892470, 31834.27934054],
                   [332.86082793, 19139.89694742], [394.93256437, 38280.79631835],
                   [189.63271560, 41215158.18420050, 12.711923222]]
nut_prec_ra = [-1.78428399, 0.02212824, -0.01028251, -0.00475595]
nut_prec_dec = [-1.07516537, 0.00668626, -0.00648740, 0.00281576]
nut_prec_pm = [1.42421769, -0.02273783, 0.00410711, 0.00631964, -1.143]
color = "#7d746b"
orbit_color = "#a0968c"
texture = "textures/phobos.jpg"            # [THOM] Viking mosaic, assets/textures/SOURCES.md
texture_left_lon_deg = -180.0
[bodies.orbit]                             # [HZN] 401, near Mars Express
type = "ephemeris"
file = "ephem/phobos_mex.eph"
fallback_blend_days = 1.0
[bodies.orbit.fallback]                    # [ELEM]
type = "mean_elements"
a_km = 9375.0
e = 0.015
arg_peri_deg = 216.3
mean_anomaly_deg = 189.7
i_deg = 1.1
node_deg = 169.2
period_days = 0.319033108                  # M5 of the [PCK]; [ELEM] P = 0.3187
mean_anomaly_accel_deg_per_day2 = 9.536137031212154e-09   # [PCK] quadratic PM term
apsis_period_years = 1.13159               # from the [PCK] (solar_system.toml); [ELEM] 1.1
node_period_years = -2.26172               # M1 of the [PCK]; [ELEM] 2.3
laplace_pole_ra_dec_deg = [317.7, 52.9]

[[bodies]]
name = "Deimos"
parent = "Mars"
shape = "shapes/deimos.mesh"                # [THOM] 5-deg grid; assets/shapes/SOURCES.md
