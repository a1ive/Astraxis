# --- Events --------------------------------------------------------------------------
# Times and distances (TDB) computed from the baked data.
# Arrivals: first periapses (the osculating orbit around Mars becomes bound during the
# burn) Mars Express 2003-12-25 03:08 TDB, 434 km above the mean radius; MRO 2006-03-10
# 21:32, 444 km; MAVEN 2014-09-22 02:05, 414 km. Each shows the path without its orbit
# insertion burn (a ghost, as for Tianwen-1 below), at a warp that runs the burn in about
# 15 s; the tour's flyby shot holds until after the periapsis, in the middle of the burn.

# Odyssey's first periapsis 2001-10-24 02:31 TDB, 318 km above the mean radius; 331
# periapses below 150 km from 2001-10-27 to 2002-01-11, then a 2-hour orbit, ~380 x 440 km
# [HZN].
[[events]]
name = "Odyssey arrives (2001-10-24)"
time_tdb = "2001-10-24 01:50"
focus = "Mars"
flyby = "Odyssey"
distance_km = 6.0e4
warp = 80.0                                # the 20-minute burn over 15 s
# [ODY], [HZN]
caption = """\
    NASA's Mars Odyssey brakes into orbit, then spends eleven weeks dipping into the \
    upper atmosphere to shrink its orbit to a two-hour circle. From there it mapped \
    water ice buried just beneath the surface, relayed most of the rovers' data home, \
    and became the longest-working spacecraft ever sent to Mars."""
# The burn [ODYK]: 2:26 to 2:46 UT Earth-received, 8.46 minutes after it happened; the
# table reads 1,435 m/s (the press kit: 1,427).
[events.ghost]
body = "Odyssey"
name = "Odyssey without the burn"
time_tdb = "2001-10-24 02:18:36"
burn_s = 1200.0
days = 1.0

[[events]]
name = "Mars Express arrives (2003-12-25)"
