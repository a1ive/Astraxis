warp = 300.0
# [AMSAT], [TW1]
caption = """\
    Five days after arriving, out at the far end of its orbit, Tianwen-1 fires its \
    engine for 128 m/s and turns the orbit from 11 degrees to the equator to 87, \
    over the poles. The spacecraft moves slowly this far out, so changing its \
    orbital plane takes little fuel. The polar orbit will carry it over the whole \
    planet, including the landing site."""
[[events.trails]]
body = "Tianwen-1"
trail_history_days = 0.5

[[events]]
name = "Tianwen-1 lines up with the landing site (2021-02-20)"
time_tdb = "2021-02-20 11:00"
focus = "Mars"
distance_km = 3.0e4
warp = 120.0
# [AMSAT], [TW1]
caption = """\
    At its closest pass Tianwen-1 brings the far end of its orbit in from 189,000 to \
    84,600 km. The new orbit is timed so that three days from now its low pass will come \
    over the planned landing site."""

[[events]]
name = "Tianwen-1 waits over the landing site (2021-02-24)"
time_tdb = "2021-02-23 21:50"
focus = "Mars"
from_orbit_normal = "Tianwen-1"           # its polar orbit face-on
distance_km = 6.0e4
warp = 120.0
# [AMSAT], [TW1]
caption = """\
    Over the landing site, Tianwen-1 trims its orbit to exactly two Mars days, 49 \
    hours and 15 minutes, so that every low pass comes back over the same spot as \
    Mars turns beneath it. It will stay here for almost three months before \
    releasing the lander, with at least four small burns to maintain the timing."""
[[events.trails]]
body = "Tianwen-1"
trail_history_days = 2.1

[[events]]
name = "Zhurong is released (2021-05-14)"
time_tdb = "2021-05-14 16:30"
focus = "Tianwen-1"
from_body = "Mars"                         # side-on to its fall toward Mars
phase_deg = 90.0
distance_km = 3.0e4
warp = 240.0
# [AMSAT], [TW1]
caption = """\
    A small burn puts the whole spacecraft on a path that would hit Mars, and the lander \
    with the rover Zhurong is let go. Then the orbiter fires again, 61 m/s, to climb \
    back to its two-day orbit, while the lander falls on toward the surface."""

[[events]]
name = "Tianwen-1 becomes a relay (2021-05-17)"
time_tdb = "2021-05-16 23:50"
focus = "Mars"
from_orbit_normal = "Tianwen-1"           # its polar orbit face-on
distance_km = 6.0e4
warp = 120.0
# [AMSAT], [TW1]
caption = """\
    Three days after letting the lander go, the orbiter slows by some 350 m/s at \
    its closest pass and shrinks its orbit to a third of a Mars day, 8 hours 12 \
    minutes. The orbit repeats over the rover every day, to pick up its radio \
    signals and relay them to the Earth."""
[[events.trails]]
body = "Tianwen-1"
trail_history_days = 2.1

# Remote sensing orbit: burn 2021-11-08 11:31 TDB, 8.28 h -> 7.08 h; from 2021-11-16 the
# MOMAG positions: 270 x 10,730 km on 2021-11-20 [TW1].
[[events]]
name = "Tianwen-1 maps the whole planet (2021-11-08)"
time_tdb = "2021-11-08 10:45"
focus = "Mars"
distance_km = 3.0e4
warp = 120.0
# [TW1], [AMSAT]
caption = """\
    Tianwen-1 trims its orbit to seven hours around, about 270 by 10,700 km, to map the \
    planet's surface and its geology. From here on its path comes from the published \
    data of its magnetometer team, which record the orbiter's position with every \
    measurement."""

# Closest approach 2023-03-10 02:17:31 TDB, 107 km from Deimos' center (100 km above its
# mean radius, 6.2 km [SPHY]) [HZN].
[[events]]
name = "Hope passes Deimos (2023-03-10, 100 km)"
time_tdb = "2023-03-10 02:12"
focus = "Deimos"
flyby = "Hope"
distance_km = 150.0
warp = 10.0
# [HOPE]
caption = """\
    With its orbit adjusted, Hope makes a series of passes of Deimos, here 100 km \
    away. It observed the side of Deimos facing away from Mars, beyond the view of \
    the lower orbiters. Its composition resembled Martian rock more than a \
    captured asteroid, suggesting that both moons may be debris from an impact on \
    Mars."""

# Europa Clipper's closest approach 2025-03-01 17:58:03 TDB, 4,274 km from the center (885 km
# above the mean radius, 3389.5 km [SPHY]) [HZN].
[[events]]
name = "Europa Clipper swings by Mars (2025-03-01, 884 km)"
time_tdb = "2025-03-01 17:20"
focus = "Mars"
flyby = "Europa Clipper"
from_orbit_normal = "Europa Clipper"
distance_km = 3.5e4
warp = 60.0
# [ECM]
caption = """\
    Bound for Jupiter's moon Europa, the largest spacecraft NASA has built for \
    another planet swings 884 km over Mars. Mars bends its path and slows it, from \
    24.5 to 22.5 km/s around the Sun; the Earth will give it a boost in December \
    2026, and Jupiter comes in 2030. The flyby also provides a test of the \
    complete radar system."""

# Hera's closest approaches 2025-03-12: Deimos 12:11:30 TDB, 297 km from its center; Mars
# 12:51:56 TDB, 9,060 km from the center (5,670 km above the mean radius) [HZN].
[[events]]
name = "Hera passes Deimos (2025-03-12, 300 km)"
time_tdb = "2025-03-12 12:05"
focus = "Deimos"
flyby = "Hera"
from_body = "Hera"                         # Mars behind Deimos, as Hera saw it
distance_km = 3000.0
warp = 10.0
# [HERA], [HZN] (Horizons notes)
caption = """\
    ESA's Hera, on its way to the asteroid that NASA's DART struck in 2022, swings by Mars \
    and passes 300 km from Deimos. Its camera catches the little moon crossing the face of \
    Mars; two more instruments, one Japanese, look at its minerals and temperature, to \
    help plan Japan's MMX, which will bring back a sample of Phobos."""

[[events]]
name = "Seven orbiters (2025)"
time_tdb = "2025-06-01 00:00"
focus = "Mars"
distance_km = 1.3e5
warp = 600.0
# [MEX], [MRO], [MAV], [ODY], [TGOA], [HZN], [TW1]
caption = """\
    Seven orbiters share the Martian sky. MRO, Odyssey and TGO circle 250 to 440 \
    km above the surface every two hours. MAVEN reaches out to 4,500 km. Mars \
    Express, here since 2003, reaches 10,500 km, and Tianwen-1 reaches 12,000 km, \
    both crossing Phobos' orbit. Hope takes 55 hours on an orbit extending outward \
    from Deimos'."""

# Periods from the [PCK] rotation rates (Phobos and Deimos rotate synchronously): Mars
# 24 h 37 min, Phobos 7 h 39 min, Deimos 30 h 18 min. Phobos comes round again every
# 11.1 h in the Mars-fixed frame, Deimos every 5.48 days; seen from the equator they are
# up for 4.2 h and 2.5 days (the arc above the horizon, 2 acos(R / a), with the [PCK]
# radius and the [ELEM] a). Phobos laps the frame in 67 s at this warp.
[[events]]
name = "Phobos rises in the west"
time_tdb = "2025-06-03 00:00"
focus = "Mars"
frame = "Mars-fixed"
distance_km = 6.0e4
warp = 600.0
# [PCK], [ELEM]
caption = """\
    This view turns with Mars, as though seen from its surface. Phobos goes round \
    in 7 h 39 min, faster than Mars turns in 24 h 37 min, so it rises in the west \
    and sets in the east, crossing the sky in about four hours, twice a day. \
    Deimos, at 30 h 18 min, lags just behind the turning planet: it creeps from \
    east to west and stays up for two and a half days."""

# [REN] Table 1, second epoch: 2025-10-01 16:00 UTC, 0.208 au from Tianwen-1.
[[events]]
name = "Tianwen-1 photographs 3I/ATLAS (2025-10-01)"
time_tdb = "2025-10-01 15:50"
focus = "3I/ATLAS"
from_body = "Mars"                         # as Tianwen-1 saw it
distance_km = 5.0e5                         # outside the coma (closer in it is drawn dimmed)
warp = 60.0
# [REN]
caption = """\
    From Mars, 31 million km away, Tianwen-1 turns the small camera of its \
    high-resolution imager, built for a surface ten thousand times brighter, on \
    the comet. It sees 3I from 40 degrees out of the plane of its orbit, a view \
    unavailable to telescopes near the Earth: a fan of dust grains a few tenths of \
    a millimeter across, puffed toward the Sun at a few meters per second and only \
    slowly blown back."""

# 3I/ATLAS closest to Mars 2025-10-03 04:38 TDB, 28.97 million km [HZN]. Seen from the side of
# the Sun line (from_body = "Sun": the scene has no Sun body, the sun's direction is used),
# with its path across the view and the tail pointing away from the Sun.
[[events]]
name = "Interstellar comet 3I/ATLAS passes Mars (2025-10-03)"
time_tdb = "2025-10-02 06:00"
focus = "Mars"
from_body = "Sun"
phase_deg = 90.0
distance_km = 7.0e7
warp = 3600.0
# [REN], [HZN]
caption = """\
    The third object known to come from another star, 3I/ATLAS was found in July \
    2025. Its path is a broad hyperbola with little curvature; it runs backward \
    around the Sun, close to the plane of the planets, and passes 29 million km \
    from Mars at 86 km/s. Seen from the Earth it is heading into the Sun's glare; \
    from Mars it is in the night sky, far from the Sun."""
[[events.trails]]
body = "3I/ATLAS"
trail_history_days = 30.0

[[events]]
name = "MAVEN falls silent (2025-12)"
time_tdb = "2025-12-03 12:00"
focus = "Mars"
distance_km = 2.5e4
warp = 1200.0
# [MAV], [HZN]
caption = """\
    MAVEN's last orbits as tracked from the Earth. On 6 December 2025 it passed \
    behind Mars and never re-established contact; NASA ended the mission in June \
    2026, after more than eleven years at Mars, ten beyond its planned one."""
