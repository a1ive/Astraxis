    spacecraft. Near its closest pass the 3 kN engine fires for nearly 15 minutes, and \
    Mars captures it into a long orbit reaching out to 182,000 km, tilted only 11 degrees \
    to the equator. Radio amateurs follow it in the spacecraft's own telemetry, which \
    carries its position."""
# A ghost: the path without the burn, coasting under Mars' gravity alone from the
# spacecraft's state at the burn's start (time_tdb), drawn whole until `days` after it and
# shown only during this event. With burn_s, the spacecraft's label shows the delta-v
# so far: the velocity change two-body gravity does not explain, which over the burn is
# the thrust's (Estevez's burn model [TW1]: 888 s from 2021-02-10 11:52:55 UTC, 3 kN,
# Isp 321.6 s, 4,425 kg, so 668 m/s by the rocket equation).
[events.ghost]
body = "Tianwen-1"
name = "Tianwen-1 without the burn"
time_tdb = "2021-02-10 11:54:04"
burn_s = 888.0
days = 1.0

