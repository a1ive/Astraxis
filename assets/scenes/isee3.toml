type = "lagrange"
point = 2
primary = "Sun"
secondary = "Earth-Moon barycenter"
mass_ratio = 3.04042340e-6                 # [L]

# --- Events -------------------------------------------------------------------------------
# Times UTC unless marked TDB.

# Launch 1978-08-12 15:12 UTC; the reconstruction starts at the perigee an hour later.
[[events]]
name = "Launch and transfer to L1 (1978-08-12)"
time = "1978-08-12 16:20"
focus = "Earth"
frame = "Sun-Earth rotating"
distance_km = 4.0e6
warp = 86400.0

[[events]]
name = "Halo orbit around L1 (1978-1982)"
time = "1978-11-20 00:00"
focus = "Earth"
frame = "Sun-Earth rotating"
distance_km = 5.0e6
warp = 604800.0

[[events]]
name = "Leaving L1 for the geomagnetic tail (1982-06)"
time = "1982-05-20 00:00"
focus = "Earth"
frame = "Sun-Earth rotating"
distance_km = 6.0e6
warp = 172800.0

[[events]]
name = "Geotail passes and lunar flybys (1982-1983)"
time = "1982-09-01 00:00"
focus = "Earth"
frame = "Sun-Earth rotating"
distance_km = 5.0e6
warp = 172800.0

[[events]]
name = "Lunar flyby 4 (1983-10-21)"
time = "1983-10-21 12:00"
focus = "Moon"
frame = "Moon-centered"
distance_km = 1.2e5
warp = 300.0

# Closest approach 1983-12-22 18:44 UTC, 119 km above the far side; more than 30 minutes in
# the Moon's shadow (TDA PR 42-84).
[[events]]
name = "Last lunar flyby: 119 km (1983-12-22)"
time = "1983-12-22 18:10"
focus = "Moon"
frame = "Moon-centered"
from_body = "Sun"
phase_deg = 90.0           # side-on: the pass behind the Moon, through its shadow
distance_km = 1.5e4
warp = 30.0

[[events]]
name = "Escape from the Earth-Moon system (1983-12)"
time = "1983-12-20 00:00"
focus = "Earth"
frame = "Earth-centered"
distance_km = 3.0e6
warp = 21600.0

[[events]]
name = "Cruise to Giacobini-Zinner (1984-1985)"
time = "1984-01-01 00:00"
focus = "Sun"
frame = "Heliocentric"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 4.0e8
warp = 604800.0

# Launches: Vega 1 1984-12-15 [VEGA], Sakigake 1985-01-08 and Suisei 1985-08-19 JST [JAXA];
# Giotto (1985-07-02) appears with its table on 1986-03-05.
[[events]]
name = "The Halley Armada sets out (1984-1986)"
time = "1984-12-15 00:00"
focus = "Sun"
frame = "Heliocentric"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 4.0e8
warp = 432000.0            # 5 days per second: launch to Halley in 90 seconds

# The Vega 1 lander arrived on 1985-06-11; the bus flew past (published 39,000 km; the
# bridged path [ARM] passes 45,800 km from the center at 02:55 UTC).
[[events]]
name = "Vega 1 at Venus (1985-06-11)"
time = "1985-06-10 18:00"
focus = "Venus"
frame = "Venus-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 3.0e5
warp = 1800.0

# Vega 2's balloon entered on 1985-06-15 02:06 UT [WIKI]; its bus's flyby is reconstructed
# [ARM] (26,600 km from the center, 21:16 UTC on 06-14). The Pioneer Venus Orbiter goes round
# once a day.
[[events]]
name = "Vega 2 at Venus (1985-06-15)"
time = "1985-06-14 12:00"
focus = "Venus"
frame = "Venus-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 3.0e5
warp = 1800.0

# Closest approach 1985-09-11 11:02:43 UTC, 7,800 km on the tail side, at 20.7 km/s.
[[events]]
name = "Through the tail of Giacobini-Zinner (1985-09-11)"
time = "1985-09-11 10:55"
focus = "Giacobini-Zinner"
frame = "Giacobini-Zinner-centered"
distance_km = 4.0e4
warp = 10.0

[[events]]
name = "Between the Sun and Halley (1986-03)"
time = "1986-02-01 00:00"
focus = "Sun"
frame = "Heliocentric"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 4.0e8
warp = 172800.0

# Halley passed perihelion on 1986-02-09 behind the Sun as seen from the Earth; the Pioneer
# Venus Orbiter's ultraviolet spectrometer watched its hydrogen coma from 01-31 to 03-06
# [PVUV]. The camera on Venus' side of the comet, a little farther from it than Venus (5.0e7 km
# on 02-01): the comet's two tails as the orbiter saw them, Venus nearby.
[[events]]
name = "Halley seen from Venus (1986-02)"
time = "1986-02-01 00:00"
focus = "Halley"
frame = "Venus-centered"
from_body = "Venus"
distance_km = 5.6e7
warp = 3600.0

# Ten days in the comet's frame: Vega 1 (03-06), Suisei (03-08), Vega 2 (03-09), Sakigake
# (03-11), Giotto (03-14) pass; ICE is 3e7 km away on the sunward side.
[[events]]
name = "The Armada around Halley (1986-03)"
time = "1986-03-05 00:00"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 2.0e7
warp = 7200.0              # 2 hours per second

# Closest approach 1986-03-06 07:20:06 UT, 8,890 km, at 79.2 km/s [VEGA].
[[events]]
name = "Vega 1: 8,890 km from the nucleus (1986-03-06)"
time = "1986-03-06 07:18:30"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 4.0e4
warp = 10.0

# 151,000 km on the sunward side [JAXA]; 13:05:48 UTC at 73 km/s in the ISAS ephemeris [ARM].
[[events]]
name = "Suisei: 151,000 km on the sunward side (1986-03-08)"
time = "1986-03-08 12:40"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 6.0e5
warp = 120.0

# Closest approach 1986-03-09 07:20:00 UT, 8,030 km, at 76.8 km/s [VEGA] (the reconstruction
# [ARM] is aimed at it).
[[events]]
name = "Vega 2: 8,030 km from the nucleus (1986-03-09)"
time = "1986-03-09 07:18:30"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 4.0e4
warp = 10.0

# "6.99 million km" on 03-11 (Wikipedia, Sakigake); HelioWeb's positions [ARM] give 6.7
# million km at 00:34 UTC.
[[events]]
name = "Sakigake: 7 million km upstream (1986-03-11)"
time = "1986-03-10 12:00"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 2.5e7
warp = 1800.0

# The nucleus in the week of the Vega and Giotto flybys [STKS]. It tumbles in a long-axis
# mode [BLT]; its phase on the day is illustrative.
[[events]]
name = "Halley's nucleus (1986-03-14)"
time = "1986-03-13 12:00"
focus = "Halley"
frame = "Heliocentric"
from_body = "Sun"
phase_deg = 60.0
distance_km = 60.0
warp = 3600.0              # an hour per second: the 3.69-day precession in a minute and a half

# Closest approach 1986-03-14 00:03:01.84 UTC, 596 km [GIO], at 68.4 km/s [ARM].
[[events]]
name = "Giotto: 596 km from the nucleus (1986-03-14)"
time = "1986-03-14 00:02:20"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 60.0
distance_km = 4000.0
warp = 2.0

# Closest at 23:36 UT on 03-20, 12.1 million km [P7] (the reconstruction [ARM] is timed to it
# and passes at 12.0 million km), on the far side from the Sun: Halley is 10 million km south
# of the ecliptic, Pioneer 7 in it, a little farther out from the Sun.
[[events]]
name = "Pioneer 7: 12 million km downstream (1986-03-20)"
time = "1986-03-20 06:00"
focus = "Halley"
frame = "Halley-centered"
from_body = "Sun"
phase_deg = 90.0
distance_km = 4.0e7
warp = 3600.0

# 1986-1987: two maneuvers (dates assumed, see the sources) aim ICE at the Moon in 2014.
[[events]]
name = "The long way back to the Earth (1986-2014)"
time = "1986-06-01 00:00"
focus = "Sun"
frame = "Sun-Earth rotating, whole mission"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 4.0e8
warp = 5184000.0           # 60 days per second: 28 years in under 3 minutes

# The ISEE-3 Reboot Project took control in late May 2014; the thrusters fired on 2014-07-02
# and failed on 2014-07-08 (no pressurant left).
[[events]]
name = "Back at the Earth (2014-07)"
time = "2014-07-01 00:00"
focus = "Earth"
frame = "Earth-centered"
distance_km = 3.0e6
warp = 21600.0

# Closest approach 2014-08-10 19:18 UTC, 18,400 km from the Moon's center (Horizons notes).
[[events]]
name = "Lunar flyby (2014-08-10)"
time = "2014-08-10 16:30"
focus = "Moon"
frame = "Moon-centered"
from_body = "Sun"
phase_deg = 30.0           # from the day side: it was a full Moon
distance_km = 8.0e4
warp = 120.0

[[events]]
name = "The whole journey, Earth fixed (1978-2014)"
time = "2014-12-31 00:00"
focus = "Sun"
frame = "Sun-Earth rotating, whole mission"
from_orbit_normal = "Earth-Moon barycenter"
distance_km = 4.0e8
warp = 86400.0
