# ISEE-3 / ICE, 1978-2014: the first spacecraft around a libration point, then the first
# one to a comet, then 28 years around the Sun and back to the Earth.
#
# Launched 1978-08-12 into a halo orbit around Sun-Earth L1 (from 1978-11-20), it watched
# the solar wind for four years. In June 1982 it left L1 for passes through the Earth's
# magnetic tail out towards L2, and five lunar flybys in 1983 (the last on 1983-12-22,
# 119 km above the Moon) threw it out of the Earth-Moon system. Renamed the International
# Cometary Explorer, it flew through the tail of comet Giacobini-Zinner on 1985-09-11 and
# passed between the Sun and comet Halley in March 1986. Maneuvers in 1986-1987 aimed it at a
# lunar flyby in August 2014; on a 355-day orbit it fell behind the Earth, went once around
# the Sun relative to it, and caught up in 2014, when the ISEE-3 Reboot Project brought it
# back to life (the thrusters fired on 2014-07-02, then the pressurant was gone) and it flew
# past the Moon on 2014-08-10. The Sun-Earth rotating frame (the default) shows the halo loops
# around L1, the petals of the geotail passes, and the yearly loops of the long way round.
#
# ICE was the far scout of the Halley Armada. The others are here for 1985-1986: Vega 1 and
# Vega 2 (by way of Venus; 8,890 and 8,030 km from the nucleus on 1986-03-06 and 03-09),
# Suisei (151,000 km on the sunward side, 03-08), Sakigake (7 million km upstream, 03-11) and
# Giotto (596 km, 03-14), and the Pioneer Venus Orbiter, which watched the comet from Venus
# while it was too close to the Sun to be seen from the Earth. Each is shown only while its
# sources cover it; Vega 2 has none (NSSDC: "no source"), so its path is built from its dates.
# Pioneer 7, launched in 1966 and never maneuvered since, crossed the comet's wake 12 million
# km downstream on 03-20; its 1986 position is integrated from its launch and published orbit.
#
# Sources
# [REC]  tools/isee3/isee3_reconstruct.py (assets/ephem/SOURCES.md). Horizons only has ISEE-3
#        in 2014, so 1978-1983 are ballistic arcs fitted to NASA GSFC SSCWeb positions and
#        joined at the maneuvers; 1984-1985 are ballistic from the last lunar flyby with the
#        two documented maneuvers (TDA Progress Report 42-84) solved to meet the JPL navigation
#        trajectory of the comet encounter (PDS SBN, TRAJ_ICE.TBL); 1986-2013 joins it with two
#        impulses (1986-10-08, 1987-05-01: dates assumed) to a ballistic arc through Horizons'
#        2014 states, with the radiation pressure fitted to SSCWeb's 2008-2013 track.
#        Comet Giacobini-Zinner: Horizons (SAO/1985), moved onto the navigation file's comet
#        (~270 km) near the encounter.
# [HZN]  JPL Horizons state vectors (tools/bake/ephem.toml): the Earth-Moon barycenter, the
#        geocentric Moon (moon_isee3 for 1982-06 .. 1984-01, 0.5 km), Venus (1984-12 .. 1986, for
#        Vega 1's flyby; [APX] outside it), comet Halley (JPL#75),
#        ISEE-3 in 2014 (-111, JPL solution s45, fitted after the lunar flyby).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a: Venus, Mars.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (the Moon, outside its tables).
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [PCK]  NAIF pck00011.tpc (IAU 2015).
# [STKS] P. Stooke, Stooke Small Body Shape Models V2.0 (PDS SBN, small_bodies.stooke.shape-models;
#        EAR-A-5-DDR-STOOKE-SHAPE-MODELS-V2.0), 1P/Halley (1682q1halley.tab): limb and terminator
#        fits to the Giotto HMC and Vega 1/2 images, pointing by A. Abergel. Body z = the long axis,
#        toward the "big end"; uncertain by 0.5-1 km (assets/shapes/SOURCES.md).
# [SZG]  K. Szego 1991, "P/Halley, the model comet, in view of the imaging experiment aboard the
#        Vega spacecraft", Comets in the Post-Halley Era 2, 723 (sec. 2): the Vega/Giotto model
#        fits in a 15.3 x 7.2 x 7.22 km box, volume 365 km^3.
# [BLT]  M. J. S. Belton, W. H. Julian, A. J. Anderson, B. E. A. Mueller 1991, Icarus 93, 183
#        (abstract): Halley's nucleus is an excited symmetric rotator (long-axis mode). The long
#        axis is inclined by 66.0 deg to the angular momentum M and turns around it in 3.69 d;
#        the spin about the long axis is 7.1 d (total spin 2.84 d, 21.4 deg from M). M points to
#        RA, Dec (B1950) = 6.2, -60.7 deg = 6.785, -60.423 deg (J2000; SPICE FK4 -> J2000 rotation).
#        The shape model's frame assumes this rotation state [STKS]. The phases of the two angles
#        are not in the abstract, so the orientation at any moment is illustrative.
# [SBDB] JPL Small-Body Database, comet magnitude parameters M1, K1 (total magnitude
#        M1 + 5 log delta + K1 log r): 1P 5.5, 8.0 (ICQ 2005 Handbook); 21P 13.2, 8.25 (fit to
#        638 observations). The coma's color and the ion tail's share of the light are
#        illustrative (app.cpp); the coma is C2 in the Haser model (src/scene/comet.hpp).
# [SLV]  J. A. Slavin et al. 1986, GRL 13, 1085 (abstract): on 1985-09-11 the H2O+ ion tail of
#        Giacobini-Zinner was 1.2e4 km across (Lick slit spectrum, 0.5 h after ICE's pass), the
#        magnetotail ICE crossed 9.6e3 km; CFHT saw a central ion tail ~2e4 km long.
# [ESO]  ESO press release eso8607 (1986-03-06): Halley's ion tail at least 22 million km long
#        on 1986-02-22, at least 50 million km on 02-27. Its width is illustrative.
# [L]    Sun / Earth-Moon barycenter mass ratio 403503.235625 / (1.32712440041279419e11 +
#        403503.235625) = 3.04042340e-6 [GM], as in jwst.toml.
# [ARM]  tools/armada/armada_reconstruct.py (assets/ephem/SOURCES.md): ballistic arcs fitted to
#        Giotto: ESOC's encounter file (PDS SBN, GIO-C-DID-3-RDR-HALLEY-V1.0), 1986-03-05 .. 17
#        only; Vega 1: positions in its MISCHA magnetometer tables (PDS SBN), launch ..
#        1986-06-28, Venus flyby bridged with two assumed impulses; Suisei: ISAS ephemeris (PDS
#        SBN, SUISEI-C-ESP-3-RDR-HALLEY-V1.0), first arc propagated back to the launch day ..
#        1986-12-31; Sakigake: NASA SPDF HelioWeb, 1985-01-21 .. 1986-12-31. Near the comet
#        each is placed on Halley [HZN] plus its offset from its own source's comet, moved to
#        the published closest approach (Giotto, Vega 1).
#        Vega 2 (no positions published): patched conics from the launch to the lander's entry
#        at Venus and on to the published encounter point, then ballistic legs with an impulse
#        2 days before the entry (the lander's release) and one 2 weeks after the flyby. The
#        same method on Vega 1 stays within 0.6 million km of its data. The miss vector at
#        Halley is turned from the Sun direction like Vega 1's.
#        PVO: positions relative to Venus (PDS PPI, PVO-V-POS-5--VSOCOORDS-12SEC-V1.0, from the
#        project's SEDR), arcs around Venus fitted to them (residuals ~1 km).
#        Pioneer 7 (no positions after 1968): the escape hyperbola from a 200 km perigee 30 min
#        after the launch, its excess velocity solved so that the heliocentric orbit 150 days
#        on has the published eccentricity and inclination [P7], then ballistic (the Sun, the
#        planets, the Moon; no radiation pressure: ~1e5 km by 1986) to 1987. With the published
#        periods (402.9, 402.95 d) the closest approach to Halley comes out 4-10 hours early at
#        12.0-12.1 million km; the period is fitted to NASA's time (402.98 d 150 days on). Which
#        osculating period is meant is not stated, and it still grows as the Earth recedes:
#        402.79 d 60 days after the launch, 402.92 at 100, 403.02 at 365 (past 402.9 at ~95
#        days, 402.95 at ~125). Northbound at the departure (the inclination's sign is not
#        published; southbound gives 12.5 million km).
# [P7]   Pioneer 7: launch 1966-08-17 15:20:17 UT; closest to Halley at 23:36 UT on 1986-03-20,
#        12.1 million km (NASA, science.nasa.gov/mission/pioneer-7); orbit 1.01 x 1.125 au,
#        402.95 d (ditto); 402.9 d, inclination 0.09767 deg (NSSDC, Data Catalog of Satellite and
#        Rocket Particles and Fields Data 1966-1973, NSSDC/WDC-A-R&S 75-05, NTRS 19750016140).
# [VEGA] PDS SBN, Vega 1 and Vega 2 mission catalogs ("Key data of the Vega mission"): launches
#        1984-12-15 and 12-21; closest approaches 1986-03-06 07:20:06 UT, 8,890 km, 79.2 km/s
#        and 1986-03-09 07:20:00 UT, 8,030 km, 76.8 km/s.
# [WIKI] Wikipedia, Vega 1 and Vega 2: launch times 09:16:24 and 09:13:52 UTC (Siddiqi 2018,
#        Beyond Earth); entries at Venus 1985-06-11 02:06:10 and 06-15 02:06:04 UT; Vega 1's
#        bus passed Venus at ~39,000 km.
# [PVUV] W. H. Smyth, M. L. Marconi, M. R. Combi 1995, Icarus 113 (abstract, NASA NTRS): the PVO
#        ultraviolet spectrometer observed Halley's hydrogen coma 1985-12-28 .. 1986-01-06 and
#        1986-01-31 .. 03-06.
# [GIO]  Giotto: closest approach 1986-03-14 00:03:01.84 UTC, 596 km (Curdt et al., A&A 191,
#        L1, from the HMC images; quoted in the PDS SBN ESOC file's notes).
# [JAXA] ISAS/JAXA mission pages: Sakigake launched 1985-01-08 04:26 JST, Suisei 1985-08-19
#        08:33 JST; Suisei passed 151,000 km from Halley "on the side facing the Sun".
# [SP1066] ESA SP-1066 (1986), Space Missions to Halley's Comet (PDS SBN, DOCUMENT/ESA_1066):
#        Vega's wingspan "of the order of 10 m"; Suisei's and Sakigake's body a cylinder 140 cm
#        across and 70 cm high.
# Flyby times and distances: computed from the tables (tools/isee3/isee3_reconstruct.py
# prints them; tests/sim_tests.cpp checks them against the published values).

