# --- Comets ------------------------------------------------------------------------------
# Comae, ion tails and dust glow by the comets' brightness laws. Dust tails follow
# Finson & Probstein (src/scene/comet.hpp); their grain speeds, sizes, ages and light shares
# are illustrative defaults.
# Giacobini-Zinner's nucleus was never imaged (ICE carried no camera), so it stays a sphere.
# The tails point along the solar wind as each comet sees it (aberration); the wind speed
# is a typical slow-wind value, not measured.

[[bodies]]
name = "Giacobini-Zinner"
parent = "Sun"
radii_km = [1.0]                           # Horizons 21P: RAD = 1 km
color = "#cfe8ff"
orbit_color = "#9cc8ff"
trail = "history"
trail_history_days = 200.0
[bodies.comet]
magnitude_m1_k1 = [13.2, 8.25]             # [SBDB]
ion_tail_diameter_km = 1.2e4               # [SLV]
ion_tail_length_km = 2.0e4                 # [SLV] CFHT length, used as the e-folding length
solar_wind_km_s = 400.0
[bodies.orbit]                             # [REC] 21P, 1985-01 .. 1986-07
type = "ephemeris"
file = "ephem/gz.eph"

[[bodies]]
name = "Halley"
parent = "Sun"
shape = "shapes/halley.mesh"               # [STKS]
radii_km = [3.61, 3.6, 7.65]               # [SZG] half the box, long axis along body z
pole_ra_dec_deg = [6.785, -60.423]         # [BLT] angular momentum M (J2000)
color = "#76726e"                          # dark (illustrative tone; no albedo map exists)
orbit_color = "#b8c8e8"
trail = "history"
trail_history_days = 300.0
[bodies.free_precession]                   # [BLT] long-axis mode
nutation_deg = 66.0                        # long axis (body z) to M
precession_period_days = 3.69              # long axis around M
spin_period_days = 7.1                     # about the long axis
epoch = "1986-03-14 00:00"                 # Giotto's encounter; phases unknown, set to zero
phases_deg = [0.0, 0.0]
[bodies.comet]
magnitude_m1_k1 = [5.5, 8.0]               # [SBDB]
ion_tail_diameter_km = 1.0e5               # illustrative
ion_tail_length_km = 2.2e7                 # [ESO] 1986-02-22, used as the e-folding length
solar_wind_km_s = 400.0
[bodies.orbit]                             # [HZN] 1P, 1985 .. 1986
type = "ephemeris"
file = "ephem/halley.eph"

