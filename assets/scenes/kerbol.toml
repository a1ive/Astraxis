# The Kerbol system of Kerbal Space Program: a tribute. FICTIONAL - a game's
# solar system, not a real one - but KSP moves its planets and moons on exact
# Kepler orbits ("on rails": each around its parent alone, with the parent's GM),
# so the scene reproduces the game's own positions, and its clock and calendar.
# Not affiliated with or endorsed by the game's makers; Kerbal Space Program and
# the names of its worlds belong to their owners. No game files (textures,
# models, sky) are used: only the numbers below, read from a running game.
#
# Sources
# [KSP]  Kerbal Space Program 1.12.5 (build 03190), stock system, values read from the
#        running game with kOS 1.6.0.1 (tools/kerbol/kerbol_dump.ks; the dump is
#        tools/kerbol/kerbol_bodies.txt) and turned into the blocks below by
#        tools/kerbol/kerbol_scene.py. Elements, GMs, radii, rotation periods and
#        atmosphere curves as the game stores them (often float32: e = 0.200000002980232
#        is the game's 0.2, mean anomalies at epoch of 3.14, 1.7, 0.9 and 0.1 rad appear
#        as 179.9088, 97.4028, 51.5662 and 5.7296 deg). Rotation angles grow linearly
#        with UT from the prime meridian angles at UT 0 below. tools/kerbol/
#        kerbol_scene.py checks that Kepler positions from these elements, around the
#        parent's GM alone, reproduce the game's positions (to < 1 m).
# [PHY]  KSP 1.12.5 Physics.cfg: solarLuminosityAtHome = 1360 W/m^2, the flux at
#        Kerbin's orbit (13,599,840.256 km), so L = 3.161e24 W = 0.0082574 L_sun
#        (nominal L_sun 3.828e26 W, IAU 2015 Resolution B3).
# [ATM]  The Earth's air and aerosols of solar_system.toml [ATM] (Bruneton).
#
# Frame and time. KSP's reference direction (the solar prime vector, from which it
# counts longitudes of nodes and rotation angles) is the scene's x axis and the
# system's north its z axis: one plane for every orbit, moons included, and no axial
# tilts. KSP's universal time (seconds since a game starts) is TDB seconds since
# J2000, so the elements' epoch, UT 0, is J2000 and the calendar shows "Year 1, Day 1"
# there (calendar = "kerbin": 6-hour days, 426-day years, src/core/time.hpp).
#
# Model choices (see limitations.md):
# - Kerbol: radius and luminosity [KSP] [PHY] make a 2,840 K red dwarf by the
#   Stefan-Boltzmann law, but it shines yellow-white in the game; temperature_k is
#   the Sun's 5,772 K, to look like the game.
# - The worlds are about a tenth of the size of their real counterparts at the same
#   surface gravity, so densities run to ten times the real ones (Kerbin 58 g/cm^3).
# - Colors are artistic, chosen to recall the game. Surfaces are this program's own
#   (no textures from the game): every world has a procedural map from
#   tools/textures/make_kerbol_textures.py, invented terrain that keeps only each world's
#   look (Kerbin's seas and ice caps, grey craters, Duna's rust plains and polar caps,
#   Jool's green bands, Eve's purple land, Minmus' flats, Laythe's islands, cracked ice
#   on Vall and Eeloo...).
# - Atmospheres: tops, surface pressures, temperatures and molar masses [KSP]. The
#   Rayleigh depth scales the Earth's [ATM] by the column of molecules,
#   p0 / (g M), with air's cross-section per molecule (KSP gives no composition); the
#   scale height is the e-folding height of the number density p / T in the game's
#   curves. Kerbin's and Laythe's aerosols are the Earth's [ATM] (Laythe's scaled by
#   its column); Eve's, Duna's and Jool's hazes (depth, color, phase) are illustrative.
#   Jool's curve gives 50 atm at its "surface" (its sea-level value is 15 atm); with
#   hydrogen-like air (M = 2.2 g/mol) its column is 820 Earths, drawn as a haze only.

name = "Kerbol System"
calendar = "kerbin"

[view]
focus = "Kerbol"
distance_km = 2.2e8        # out to Eeloo's aphelion (113 million km)
start = "Year 1, Day 1"     # a new game's first moment, UT 0
warp = 432000.0            # 5 days per second: a Kerbin year in 21 s

