# Event times are in the Kerbin calendar. Captions: [KSP] (periods, sizes, orbits,
# pressures, oceans and oxygen as the game reports them). Eeloo and Jool: mutual
# inclination 4.85 deg, minimum distance between the orbits 2,904,800 km.
[[events]]
name = "Kerbin, the Mun and Minmus"
time = "Year 1, Day 1"
focus = "Kerbin"
frame = "Kerbin-centered"
from_orbit_normal = "Mun"
distance_km = 1.5e5
warp = 3600.0
caption = """\
    Kerbin turns once in 5 h 59 min 9 s. Over that time it moves along its orbit, \
    so the sun returns to the same place in its sky every six hours exactly. The Mun \
    keeps one face toward Kerbin; Minmus, four times farther out, circles on an orbit \
    tilted by 6 degrees."""

[[events]]
name = "Duna and Ike, face to face"
time = "Year 1, Day 3"
focus = "Duna"
frame = "Duna-centered"
from_orbit_normal = "Ike"
distance_km = 2.0e4
warp = 1800.0
caption = """\
    Ike circles Duna in 18 h 12 min, and Duna turns in the same time. The two keep \
    the same faces toward each other, so Ike hangs over one side of Duna. Duna's thin \
    air presses down with a fifteenth of the pressure at Kerbin's surface."""

[[events]]
name = "Eve and Gilly"
time = "Year 1, Day 5"
focus = "Eve"
frame = "Eve-centered"
from_orbit_normal = "Gilly"
distance_km = 1.2e5
warp = 7200.0
caption = """\
    Eve has seas, and air without oxygen that presses down at five times the \
    pressure on Kerbin's surface. Gilly, only 13 km in radius, swings around Eve on a \
    tilted orbit whose distance changes by a factor of 3.4."""

[[events]]
name = "Jool's inner moons: Laythe, Vall and Tylo"
time = "Year 1, Day 8"
focus = "Jool"
frame = "Jool-centered"
from_orbit_normal = "Laythe"
distance_km = 2.5e5
warp = 3600.0
caption = """\
    Laythe, Vall and Tylo circle Jool in 14.7, 29.4 and 58.9 hours, nearly in the \
    ratio 1:2:4, each keeping one face toward the planet. Laythe, the innermost, is \
    the only world besides Kerbin with both oceans and oxygen in its air."""

[[events]]
name = "Eeloo, the outermost world"
time = "Year 1, Day 12"
focus = "Kerbol"
elevation_deg = 30.0
distance_km = 2.5e8
warp = 2592000.0
caption = """\
    Eeloo needs 17 Kerbin years to go around Kerbol once. At its closest it comes \
    within 66.7 million km, nearer than Jool at its farthest (72.2 million km), but \
    its orbit is tilted five degrees from Jool's, so the two paths stay 2.9 million \
    km apart."""
