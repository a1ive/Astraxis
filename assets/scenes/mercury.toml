# Earth and Moon around their barycenter: Earth at -mu r, the Moon at (1 - mu) r, with
# r the geocentric Moon and mu = 4902.800118 / (398600.435507 + 4902.800118) [GM]. The
# Earth flybys need the Earth's own center: it is up to 4,700 km from the barycenter.

[[bodies]]
name = "Earth-Moon barycenter"
parent = "Sun"
kind = "barycenter"
gm_km3_s2 = 403503.235625                  # Earth + Moon [GM]
orbit_color = "#7fa6e0"
