# --- Spacecraft ---------------------------------------------------------------------
# Children of the Sun; the orbital phases are tables relative to Mercury, added to
# Mercury's position (relative_to). The cruise trail stays (the whole tour since
# launch); in the Mercury-centered frames trails are cut to the last day (or month).

[[bodies]]
name = "MESSENGER"
parent = "Sun"
kind = "spacecraft"
radii_km = [0.003]                         # a few meters across (drawn as a marker)
color = "#ffd27f"
orbit_color = "#ffb347"
trail = "history"
trail_linger_days = 365.0                  # after the impact, fading
[bodies.orbit]                             # [HZN] -236, heliocentric cruise
type = "ephemeris"
file = "ephem/messenger_helio.eph"
[bodies.orbit.fallback]                    # [HZN] -236, relative to Mercury (orbit phase)
type = "ephemeris"
file = "ephem/messenger_merc.eph"
relative_to = "Mercury"

[[bodies]]
name = "BepiColombo"
parent = "Sun"
kind = "spacecraft"
radii_km = [0.015]                         # tens of meters across its solar arrays (drawn as a marker)
color = "#9fe7ff"
orbit_color = "#6fc8ff"
trail = "history"
trail_linger_days = 365.0
[bodies.orbit]                             # [HZN] -121, heliocentric cruise
type = "ephemeris"
file = "ephem/bepi_helio.eph"
[bodies.orbit.fallback]                    # [HZN] -121, relative to Mercury (capture and orbit)
type = "ephemeris"
file = "ephem/bepi_merc.eph"
relative_to = "Mercury"

[[frames]]
name = "Mercury-centered"
type = "inertial"
origin = "Mercury"
trail_history_days = 1.0                   # a day of orbits, not years of them

[[frames]]
name = "Mercury-centered, 30-day trails"   # for the weeks-long capture loops
type = "inertial"
origin = "Mercury"
trail_history_days = 30.0

[[frames]]
name = "Sun-Mercury rotating"
type = "rotating"
primary = "Sun"
secondary = "Mercury"
origin = "Sun"

