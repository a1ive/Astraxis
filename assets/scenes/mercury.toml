# Two ways into Mercury orbit: MESSENGER (2004-2015) and BepiColombo (2018-), each
# shedding speed with gravity assists of the Earth, Venus and Mercury itself, so that
# Mercury can capture it.
#
# MESSENGER: Earth, 2 Venus and 3 Mercury flybys, orbit insertion on 2011-03-18, four
# years in a 12-hour (later 8-hour) polar orbit, impact on 2015-04-30. BepiColombo:
# Earth, 2 Venus and 6 Mercury flybys under solar-electric thrust, capture in late
# November 2026, then a 2.3-hour polar orbit (the MPO; the Japanese Mio, released on
# the way down, is not in Horizons). The default view starts now: BepiColombo is
# closing in on Mercury.
#
# Sources
# [HZN]  JPL Horizons state vectors, baked by tools/bake/horizons_bake.py (tools/bake/ephem.toml):
#        - MESSENGER (-236): JHU/APL trajectory delivered 2015-04-02; heliocentric from
#          launch to 2011-03-12, then relative to Mercury until the impact.
#        - BepiColombo (-121): ESA MPO trajectory, fit through 2026-09-28 and predicted
#          thereafter; heliocentric to 2026-10-20, then relative to Mercury to 2027-04-10.
#        - Mercury and Venus (body centers), heliocentric 2004-07-01 .. 2027-04-12 / 2030;
#          the Earth-Moon barycenter 1972..2100 and the geocentric Moon (Earth and Moon
#          around their barycenter, as in solar_system.toml).
# [APX]  E. M. Standish, Approximate Positions of the Planets, Table 2a: Mars, and the
#        others outside their baked spans.
# [GM]   JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [SPHY] JPL SSD, Planetary Satellite Physical Parameters, "Planet and Pluto GM Values":
#        the GM of Mars alone.
# [ELEM] JPL SSD, Planetary Satellite Mean Elements (the Moon, outside its table).
# [ATM]  Atmospheres (single scattering): sources and choices in solar_system.toml.
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, poles, prime meridians (T terms ignored
#        unless given).
# [CAP]  Event captions (retrieved 2026-10-07):
#        [MES] NASA, science.nasa.gov/mission/messenger/: launched 2004-08-03 on a Delta II;
#          flying straight toward the Sun accelerates a spacecraft, so it took one Earth, two
#          Venus and three Mercury flybys, ~6.5 years, to slow down; the first spacecraft to
#          orbit Mercury (2011-03-18); water ice in permanently shadowed polar craters,
#          "hollows", a "significant northward offset" of the magnetic field; a 12-hour orbit,
#          later 8 hours; ~275,000 images; out of propellant, it hit the surface at about
#          14,080 km/h on 2015-04-30.
#        [MESE] NASA/JHUAPL, "Earth Departure Movie" (PIA): 358 frames over 24 hours after the
#          2005-08-02 flyby follow the Earth through one rotation.
#        [MESV] ESA, "Venus Express and MESSENGER to look at Venus in tandem": Venus Express,
#          in orbit since 2006, observed the same regions around MESSENGER's 2007-06-05 flyby.
#        [MES1] JHUAPL news releases, January 2008: the first visit to Mercury in almost 33
#          years (since Mariner 10's last flyby on 1975-03-16), 200 km above the surface;
#          Mariner 10 had imaged about 45% of the planet, and this flyby added ~21% more.
#        [BC] ESA, BepiColombo factsheet: ESA and JAXA; Europe's first mission to Mercury;
#          placing a spacecraft in orbit there takes "even more energy ... than sending a
#          mission to Pluto"; one Earth, two Venus and six Mercury flybys (2021-10-01 ..
#          2025-01-08).
#        [BCE] ESA, "ESA to conduct BepiColombo flyby amid coronavirus crisis": 12,700 km from
#          the Earth on 2020-04-10, flown with a reduced team; "the last time we will see
#          BepiColombo from Earth".
#        [BCM] ESA, BepiColombo's first Mercury flyby (2021-10-01): within 200 km, 53 images
#          from the monitoring cameras.
#        [BCT] ESA, "Fourth Mercury flyby begins BepiColombo's new trajectory" and "Glitch on
#          BepiColombo": from April 2024 the transfer module's electric thrusters could not
#          reach full power; a new trajectory moved the arrival to November 2026.
#        [BCA] ESA, "Latest updates: BepiColombo's arrival at Mercury": the transfer module
#          separated on 2026-09-03; orbit insertion planned for 2026-11-21; MPO and Mio to
#          separate on 2026-12-09/10; science from April 2027.
#        Paths, orbits and the views: [HZN] (below).
# Flyby times (TDB at the spacecraft) and altitudes: computed from the baked data
# (tools/bake/ephem.toml encounters); altitudes above the mean (Mercury, Venus) or
# equatorial (Earth) radius.

name = "Mercury: MESSENGER & BepiColombo"

[view]
focus = "Sun"
distance_km = 3.2e8        # out to the Earth's orbit
pitch_deg = 55.0
start = "now"
warp = 86400.0             # 1 day per second
up = "ecliptic"

