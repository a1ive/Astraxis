# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of the planets alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table; the satellite ephemeris each value comes from is noted with it.
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, pole, prime meridian, the linear pole
#        drift and the periodic terms. The periodic terms use Saturn's angles (S1..S6,
#        2 S1, 2 S2, bodies/saturn.toml), which the moon takes from its parent.
#        The prime meridian term of 44.85 deg follows Mimas' 71-year libration; the
#        paired RA/W terms (13.5 deg) move the pole.
# Texture: see textures/SOURCES.md.

