# Sources
# [GM] JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK] NAIF pck00011.tpc (IAU 2015): radii, pole and prime meridian.
# Surface map: NASA Blue Marble NG; see textures/SOURCES.md for source and processing.
# [ATM]  Atmospheres, single scattering (Rayleigh gas + Henyey-Greenstein haze; optical
#        depths vertical, at 550 nm, from the base of the shell). Colors (haze albedo),
#        phase functions and depths marked "illustrative" are chosen by eye.
#        Earth: E. Bruneton, Precomputed Atmospheric Scattering (2017 implementation,
#          atmosphere/demo/demo.cc): Rayleigh 1.24062e-6 lambda^-4 m^-1 (lambda in um),
#          scale height 8 km; aerosols with vertical extinction 5.328e-3 (Angstrom beta,
#          alpha = 0), scale height 1.2 km, single-scattering albedo 0.9, g = 0.8; top at
#          60 km. No ozone (it deepens the blue of twilight).
# [NIGHT] The Earth at night (scene/aurora.hpp; simplifications in limitations.md).
#        City lights: NASA Earth Observatory, Black Marble 2016 grayscale (Suomi NPP VIIRS
#          day/night band, cloud-free composite), textures/earth_night.jpg (see
#          textures/SOURCES.md). The map's brightness is a display stretch, read as sRGB;
#          the gain (I/F of a white pixel) and the color (that of sodium street lights)
#          are chosen by eye. The lights come on between sunset and the sun 6 deg below
#          the horizon.
#        Aurora: the planetary Kp index every 3 hours since 1932 (GFZ; Matzka et al. 2021,
#          Space Weather 19, e2020SW002641; CC BY 4.0), geomag/kp.bin (see
#          geomag/SOURCES.md); the auroral boundaries of Starkov 1994 as given by Sigernes
#          et al. 2011 (Opt. Pura Apl. 44, 599, Table 1), around the centered dipole of
#          IGRF-14; the electron hemispheric power from Kp (Emery et al. 2008, JGR 113,
#          A06311, as quoted by Verkhoglyadova et al. 2016, J. Space Weather Space Clim. 6,
#          A20); 427.8 nm per unit energy flux for 3 keV electrons (Mathieu, Robert & Lamy
#          2025, J. Space Weather Space Clim. 15, 19, Table 2), the green and red lines
#          from it by the ratios observed by Dashkevich et al. 2006 (Geomagn. Aeron. 46,
#          366); emission peaks at 115 km (green, blue: Whiter et al. 2023, Ann. Geophys.
#          41, 1) and 221 km (red: Mathieu et al., Fig. 7). The arcs and rays in the oval
#          are illustrative; the brightness is boosted 2.5e6 times, as in a long exposure.
# [RELIEF] Slopes of the land from ETOPO5 and the open water from Natural Earth, baked
#        into textures/earth_relief.jpg (textures/SOURCES.md). The sea mirrors the sun
#        from the facets of its waves: Gaussian slopes of mean square 0.003 + 0.00512 U
#        (Cox & Munk 1954, J. Opt. Soc. Am. 44, 838) under one wind everywhere, 7 m/s, a
#        round figure for the open ocean (assumption); the refractive index is pure
#        water's at 589 nm (seawater's is about half a percent more). No clouds, no foam.
# [CLOUDS] NASA Earth Observatory, Blue Marble (2002) cloud layer, textures/earth_clouds.jpg
#        (textures/SOURCES.md): a composite of two days of visible-light images and a third
#        day of thermal infrared over the poles: one still picture that turns with the ground. Its gray value is taken as the
#        cover; the albedo is chosen by eye (thick clouds reflect 0.6-0.9 of sunlight).
#        The picture is set drifting for the look of it, west in the trades and east in
#        the westerlies; the two rates are illustrative (about 6 and 9 m/s) and no weather.

radii_km = [6378.1366, 6356.7519]          # [PCK]
body_gm_km3_s2 = 398600.435507             # [GM]
pole_ra_dec_deg = [0.0, 90.0]              # [PCK]
prime_meridian_deg = [190.147, 360.9856235] # [PCK]
color = "#5b86c9"
texture = "textures/earth.jpg"
texture_left_lon_deg = -180.0
[atmosphere]                               # [ATM]
height_km = 60.0
rayleigh_depth = 0.1085                    # 13.56e-6 m^-1 at 550 nm x 8 km
rayleigh_scale_height_km = 8.0
haze_depth = 0.005328
haze_scale_height_km = 1.2
haze_albedo = 0.9
haze_g = 0.8
# [REF] Ciddor standard dry air at 550 nm, 15 C, 101325 Pa, 450 ppm CO2.
#       n-1 = 1e-8 * (5792105/(238.0185-sigma^2) + 167917/(57.362-sigma^2)),
#       sigma = 1/0.55 um^-1. NIST Appendix A, Eq. A22/A32; corona/SOURCES.md.
refractivity = 0.0002778376354
[night_lights]                             # [NIGHT]
texture = "textures/earth_night.jpg"
color = "#ffb46b"
gain = 0.6
[relief]                                   # [RELIEF]
texture = "textures/earth_relief.jpg"
[sea]                                      # [RELIEF]
wind_m_s = 7.0
refractive_index = 1.333
[clouds]                                   # [CLOUDS]
texture = "textures/earth_clouds.jpg"
albedo = 0.8
tropical_drift_deg_per_day = -5.0
midlatitude_drift_deg_per_day = 10.0
[aurora]                                   # [NIGHT]
kp = "geomag/kp.bin"
# IGRF-14 at the year of the clock (1900 to 2030, held beyond); without the solar wind,
# which shapes the lines from about 5 radii out, so they end at 8. geomag/SOURCES.md.
[magnetic_field]
coefficients_by_year = "geomag/field_earth_igrf14.txt"
reference_radius_km = 6371.2
l_shells = [1.5, 2.5, 4.0]
max_radius = 8.0
[magnetic_map]                             # The strength of IGRF-14, redrawn for the year; geomag/SOURCES.md
surface = "geomag/earth_b.fieldmap"
crust = "geomag/earth_crust_br.fieldmap"   # Thebault 2021, degrees 16-1050
# The magnetopause of Shue et al. 1998 (JGR 103, 17691) under a typical 2 nPa wind with no
# north-south field; an event gives its own, or follows the hourly record of the wind (OMNI2,
# 1963 on, with gaps: the typical wind fills them). The tail stops widening at 120 radii (Slavin et
# al. 1985, JGR 90, 10875) and leans by the Earth's own motion. Bow shock: Fairfield's 1971
# average as a conic about the same axis. geomag/SOURCES.md.
[magnetosphere]
model = "shue1998"
radius_km = 6371.2
solar_wind = "geomag/solar_wind.bin"
pressure_npa = 2.0
bz_nt = 0.0
wind_speed_km_s = 430.0
aberration = true
tail_radii = 60.0
flare_end_radii = 120.0
shock_standoff_ratio = 1.33                # 14.33 / 10.78 radii
shock_eccentricity = 0.75
