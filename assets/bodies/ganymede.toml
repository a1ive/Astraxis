# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of the planets alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table; the satellite ephemeris each value comes from is noted with it.
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, pole, prime meridian (T terms ignored
#        unless given).
# Texture: see textures/SOURCES.md.

radii_km = [2631.20]
body_gm_km3_s2 = 9887.83275 # [SPHY] (JUP365)
pole_ra_dec_deg = [268.20, 64.57]
prime_meridian_deg = [44.064, 50.3176081]
color = "#9e9485"
texture = "textures/ganymede.jpg"
texture_left_lon_deg = 0.0

# [MARZOK] Marzok et al. 2022, Fig. 5, doi:10.1029/2022JE007256.
# HST mean OI 135.6 nm zenith brightness; CC BY 4.0 data and processing:
# geomag/SOURCES.md. Blue UV overlay, with illustrative exposure.
[aurora]
ganymede_map = "geomag/ganymede_aurora.txt"

# The dipole of Weber et al. 2022 in Jupiter's field at the moon (JRM33 + CON2020, from
# Jupiter's flux tube table: 72 to 117 nT, swinging toward and away from Jupiter as the
# current sheet passes), added as a uniform field. The lines near the equator close, out to
# where the two fields cancel near 2 radii; those from higher latitudes leave for Jupiter.
# No plasma: the real edge is pushed in upstream and dragged out downstream. geomag/SOURCES.md.
[magnetic_field]
coefficients = "geomag/field_ganymede_weber2022.txt"
reference_radius_km = 2631.2
parent_field = true
l_shells = [1.15, 1.3, 1.45]
open_latitudes_deg = [40.0, 55.0, 72.0]
max_radius = 4.0
