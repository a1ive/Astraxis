# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of the planets alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table; the satellite ephemeris each value comes from is noted with it.
# [PCK]  NAIF pck00011.tpc (IAU 2015): pole, prime meridian (System III), radii.
#        Linear T terms and nutation/precession terms are ignored.
# [IESS] Iess et al. 2018, "Measurement of Jupiter's asymmetric gravity field", Nature 555,
#        220, Table 1 (Juno PJ3 and PJ6): unnormalized J2 = 14,696.572e-6, J4 = -586.609e-6
#        at the reference radius 71,492 km. Only the orbit insertion's ghost uses them.
# [PDSR] PDS Ring-Moon Systems Node, "Vital Statistics for Jupiter's Rings and Inner
#        Satellites" (https://pds-rings.seti.org/jupiter/jupiter_tables.html), from Murray &
#        Dermott 1999 (Solar System Dynamics) and Burns et al. 1999 (Science 284, 1146).
# Texture: see textures/SOURCES.md.
# [IMP]  Where comet Shoemaker-Levy 9 hit, 1994-07-16..22: when and where its tables in scenes/jupiter.toml
#        end (tools/sl9/impact_views.py prints this), which is within 90 s, 0.3 deg and 1.5 deg of Chodas &
#        Yeomans 1996, Table 5; the times are at Jupiter. Classes: Hammel et al. 1995, Science 267, 1288, Table 2.
#        What they do: scene/impact.hpp.

radii_km = [71492.0, 66854.0]          # equatorial, polar [PCK]
body_gm_km3_s2 = 126686531.9           # [SPHY] (JUP365)
pole_ra_dec_deg = [268.056595, 64.495303] # [PCK]
zonal_harmonics = [[2, 14696.572e-6], [4, -586.609e-6]] # [IESS]
gravity_radius_km = 71492.0             # [IESS]
prime_meridian_deg = [284.95, 870.5360000] # W0, deg/day (System III) [PCK]
color = "#e0cdb0"
style = "gas_giant"
# Atmospheric features drift in longitude, so the map alignment is arbitrary.
texture = "textures/jupiter.jpg"
texture_left_lon_deg = -180.0

# [HEAD] Head et al. 2024, A&A 688 A205, Juno-UVS PJ1-54 reference ovals.
# CC BY 4.0, Linus Head; resampling and sources: geomag/SOURCES.md.
[aurora]
jovian_oval = "geomag/jupiter_oval.txt"
footprints = "geomag/jupiter_footprints.txt"
flux_tubes = "geomag/jupiter_flux_tubes.bin"

# JRM33 to degree 13, without the magnetodisc that stretches the lines beyond 10 or
# 20 radii, so they end at 10; the outer shell is Io's orbit. geomag/SOURCES.md.
[magnetic_field]
coefficients = "geomag/field_jupiter_jrm33.txt"
reference_radius_km = 71492.0
l_shells = [2.0, 3.5, 5.9]
max_radius = 10.0

# The radial field of JRM33 at the 1-bar surface and at 0.81 radii. geomag/SOURCES.md.
[magnetic_map]
surface = "geomag/jupiter_br.fieldmap"
deep = "geomag/jupiter_br_deep.fieldmap"

# Faint dusty rings, single scattering (see shaders/ring.frag.hlsl). Radii, normal
# optical depths and thicknesses [PDSR]. The real rings are about a millionth as
# bright as Jupiter's disk, so `gain` is artistic; their relative brightness, the
# brightening toward edge-on, the forward scattering and Jupiter's shadow are not.
# Tint and phase asymmetry are illustrative (reddish dust, forward scattering).
[rings]
color = "#c9a487"
gain = 5.0e4
phase_g = 0.5

[[rings.bands]]
name = "Halo"
inner_km = 89400.0
outer_km = 123000.0
optical_depth = 3.0e-6
thickness_km = 10000.0

[[rings.bands]]
name = "Main ring"
inner_km = 123000.0
outer_km = 128940.0
optical_depth = 5.0e-6
thickness_km = 100.0

[[rings.bands]]
name = "Amalthea gossamer ring"
inner_km = 128940.0
outer_km = 181350.0
optical_depth = 1.0e-7
thickness_km = 2600.0

[[rings.bands]]
name = "Thebe gossamer ring"
inner_km = 128940.0
outer_km = 221900.0
optical_depth = 1.0e-7
thickness_km = 8800.0

[[rings.bands]]
name = "Thebe extension"
inner_km = 221900.0
outer_km = 280000.0
optical_depth = 1.0e-8
thickness_km = 8800.0

