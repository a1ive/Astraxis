# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/).
#        Also the GM of the planets alone (body_gm_km3_s2), from its "Planet and Pluto GM
#        Values" table; the satellite ephemeris each value comes from is noted with it.
# [PCK]  NAIF pck00011.tpc (IAU 2015): pole, prime meridian. Linear T terms and
#        nutation/precession terms are ignored (< 0.01 deg over centuries).
# Texture: see textures/SOURCES.md.
# [PLM]  Plumes, always erupting (single scattering; optical depths, colors and phase
#        functions are illustrative, chosen to be visible; real plumes are faint).
#        Vent coordinates: IAU Gazetteer of Planetary Nomenclature (planetographic,
#        used as planetocentric; the longitudes there are west-positive).
#        Pele, eruptive center at 18.71 S 255.28 W; the plume was 300 km high and 1,200 km
#        across (Voyager 1, Strom et al. 1979, Nature 280, 733). Tvashtar at 62.76 N
#        123.53 W (the former Tvashtar Catena); 330 km high in New Horizons' 2007 images
#        (NASA PIA10101); canopy radius 2 H (the ballistic reach).

radii_km = [1821.49]                   # mean radius [SPHY]
body_gm_km3_s2 = 5959.91547            # [SPHY] (JUP365)
pole_ra_dec_deg = [268.05, 64.50]      # [PCK]
prime_meridian_deg = [200.39, 203.4889538]
color = "#edd173"
texture = "textures/io.jpg"
texture_left_lon_deg = -180.0

[[plumes]]                                 # [PLM]
name = "Pele"
type = "umbrella"
lat_lon_deg = [-18.71, 104.72]             # 255.28 W
height_km = 300.0
radius_km = 600.0
optical_depth = 0.02
albedo = [0.85, 0.9, 1.0]
g = 0.4
[[plumes]]                                 # [PLM]
name = "Tvashtar"
type = "umbrella"
lat_lon_deg = [62.76, 236.47]              # 123.53 W
height_km = 330.0
optical_depth = 0.02
albedo = [0.85, 0.9, 1.0]
g = 0.4
