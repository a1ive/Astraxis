# Shared solar radius, mass and radiative properties.
# [GM] JPL SSD astrodynamic parameters (DE440), https://ssd.jpl.nasa.gov/astro_par.html
# [PCK] NAIF pck00011.tpc (IAU 2015): solar radius, as in scenes/solar_system.toml.
# [B3] IAU 2015 Resolution B3 (Prsa et al. 2016, AJ 152, 41, Table 1): nominal solar
#      radius 6.957e8 m, effective temperature 5772 K, luminosity 3.828e26 W. Stellar
#      luminosities in the scenes are in units of this nominal luminosity.
# Solar rotation and display color are set by each scene.

kind = "star"
radii_km = [695700.0]                      # [PCK], equal to the [B3] nominal radius
body_gm_km3_s2 = 1.32712440041279419e11     # [GM]
temperature_k = 5772.0                     # [B3]
luminosity_solar = 1.0                     # [B3]
