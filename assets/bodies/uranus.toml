# [SPHY] JPL SSD, Planetary Satellite Physical Parameters (https://ssd.jpl.nasa.gov/sats/phys_par/):
#        the GM of the planet alone (URA111).
# [PCK]  NAIF pck00011.tpc (IAU 2015): radii, pole and the angles of the periodic terms
#        (U1..U16, 2 U11, 2 U12), which the moons' terms use.
# [LAM25]  Lamy et al. 2025, Nature Astronomy 9, doi:10.1038/s41550-025-02492-z: rotation
#        period 17.247864 +/- 0.000010 h (W rate from the kernels in Zenodo 16085710).
# [MEL25]  Melin et al. 2025, GRL 52, e2025GL118301: the H3+ map from JWST, January 2023.
# [HER09]  Herbert 2009, JGR 114, A11206: field model AH5, in the Uranian longitude
#        system (ULS, its north is the IAU's south); assets/geomag/SOURCES.md.
# [PDSU] PDS Ring-Moon Systems Node, "Vital Statistics for Uranus's Rings and Inner
#        Satellites" (https://pds-rings.seti.org/uranus/uranus_tables.html), from French
#        et al. 1991 (in Uranus, Univ. of Arizona Press, 327-409).
# [FR24] French, Hedman, Nicholson, Longaretti & McGhee-French 2024, "The Uranus System
#        from Occultation Observations (1977-2006)" (arXiv:2401.04634), Table 5: keplerian
#        elements of the ring edges (IER, OER) and centerlines (COR), epoch TDB 1986 Jan 19
#        12:00. Longitudes from the ascending node of Uranus' equator on the J2000 equator,
#        about the pole of positive angular momentum (opposite to the IAU north pole).

radii_km = [25559.0, 24973.0]
body_gm_km3_s2 = 5793951.3                 # [SPHY] (URA111)
pole_ra_dec_deg = [257.311, -15.175]
prime_meridian_deg = [203.81, -500.9315936164617]  # [LAM25], valid since 1986; IAU's rate is -501.1600928
nut_prec_angles = [[115.75, 54991.87], [141.69, 41887.66], [135.03, 29927.35], [61.77, 25733.59],
                   [249.32, 24471.46], [43.86, 22278.41], [77.66, 20289.42], [157.36, 16652.76],
                   [101.81, 12872.63], [138.64, 8061.81], [102.23, -2024.22], [316.41, 2863.96],
                   [304.01, -51.94], [308.71, -93.17], [340.82, -75.32], [259.14, -504.81],
                   [204.46, -4048.44], [632.82, 5727.92]]  # [PCK] BODY7 (U1..U16, 2 U11, 2 U12), for the moons
texture = "textures/uranus.jpg"            # Hubble OPAL zonal profile, assets/textures/SOURCES.md
texture_left_lon_deg = 0.0
color = "#a9d8e0"
[aurora]                            # [MEL25], assets/geomag/SOURCES.md
uranus_map = "geomag/uranus_h3p.txt"
[magnetic_field]                    # [HER09], assets/geomag/SOURCES.md
coefficients = "geomag/field_uranus_ah5.txt"
reference_radius_km = 25600.0
flip_pole = true                           # ULS north = IAU south
longitude_offset_deg = -50.6               # IAU new east = ULS west - 50.6 [MEL25]
[magnetic_map]                      # AH5 on the surface, in these axes; geomag/SOURCES.md
surface = "geomag/uranus_br.fieldmap"

# Rings: edges and their eccentricities, apses and nodes [FR24]; normal optical
# depths [PDSU] (where given as a range, its middle; bounds as given), taken as the
# mean over the ring (epsilon: the mean that gives [PDSU]'s range at its narrowest
# and widest). Each edge is an ellipse with Uranus at a focus (inner_km,
# outer_km: semi-major axes; *_ae_km: a e); both share the centerline's apse, node
# and precession rates, since the rings precess rigidly (the fitted edge rates
# agree within their errors). So the epsilon ring is 20 km wide at periapsis and
# 97 km at apoapsis, 800 km farther out; rings 6, 5, 4, alpha and beta are tilted
# by up to 45 km. [FR24] held e or i fixed at 0 where left out. The normal modes
# (gamma's radial oscillation of 5 km, delta's m = 2 mode of 3 km, ...) are not
# drawn. The two faint dusty rings found by Hubble (tau ~ 1e-5) are left out: next
# to the main rings they would be invisible, and they would spread the profile
# over 3 times the radius. The particles are very dark (albedo ~0.05); the gain is
# artistic, the backscattering phase function illustrative.
[rings]
color = "#3f3f3f"
gain = 30.0
phase_g = -0.2
epoch_jd_tdb = 2446450.0                   # TDB 1986 Jan 19 12:00 [FR24]

[[rings.bands]]
name = "6"
inner_km = 41835.920
outer_km = 41838.237
optical_depth = 0.3
inner_ae_km = 42.068
outer_ae_km = 42.930
peri_deg = 181.657
peri_rate_deg_per_day = 2.7619579
a_sin_i_km = 44.643
node_deg = 89.727
node_rate_deg_per_day = -2.7565287

