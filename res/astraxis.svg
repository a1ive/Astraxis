<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Astraxis</title>
  <defs>
    <!-- Deep-space tile -->
    <radialGradient id="bg" cx="0.5" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#1d2f5e"/>
      <stop offset="0.55" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#03050e"/>
    </radialGradient>
    <!-- Faint galactic band -->
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f86c9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8aa0dd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6f86c9" stop-opacity="0"/>
    </linearGradient>
    <!-- Letterform: moonlit silver -->
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfe7f7"/>
      <stop offset="1" stop-color="#9fb2d8"/>
    </linearGradient>
    <linearGradient id="letterShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eefa"/>
      <stop offset="1" stop-color="#7d91bd"/>
    </linearGradient>
    <!-- Trajectory: hot accretion-disc / Artemis-swoosh colours -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2412b"/>
      <stop offset="0.5" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#bfe0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bodyGlow">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ffc061" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="54"/>
    </clipPath>
    <!-- Halves of the orbit, in the orbit's own (unrotated) frame -->
    <clipPath id="orbitBack">
      <rect x="0" y="0" width="256" height="152"/>
    </clipPath>
    <clipPath id="orbitFront">
      <rect x="0" y="152" width="256" height="104"/>
    </clipPath>
    <!-- Crescent swoosh: thick at the near side, hair-thin at the far side -->
    <path id="swoosh" fill-rule="evenodd"
          d="M20,152 a108,36 0 1,0 216,0 a108,36 0 1,0 -216,0 Z
             M27,148 a101,26 0 1,0 202,0 a101,26 0 1,0 -202,0 Z"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="240" height="240" fill="url(#bg)"/>
    <rect x="-60" y="78" width="380" height="110" fill="url(#band)" transform="rotate(-38 128 128)"/>

    <!-- Background stars -->
    <g fill="#ffffff">
      <circle cx="44" cy="52" r="1.6" opacity="0.85"/>
      <circle cx="70" cy="92" r="1.1" opacity="0.6"/>
      <circle cx="198" cy="58" r="1.4" opacity="0.75"/>
      <circle cx="220" cy="104" r="1.0" opacity="0.55"/>
      <circle cx="34" cy="132" r="1.0" opacity="0.5"/>
      <circle cx="180" cy="30" r="1.0" opacity="0.6"/>
      <circle cx="226" cy="214" r="1.3" opacity="0.6"/>
      <circle cx="32" cy="222" r="1.1" opacity="0.5"/>
      <circle cx="96" cy="30" r="0.9" opacity="0.5"/>
    </g>

    <g transform="rotate(-16 128 152)">
      <!-- Far side of the trajectory passes behind the letter -->
      <use href="#swoosh" fill="url(#orbit)" clip-path="url(#orbitBack)" opacity="0.55"/>
    </g>

    <!-- The "A": a crossbar-less peak, the trajectory acts as its bar -->
    <path d="M128,34 L210,218 L174,218 L128,110 Z" fill="url(#letterShade)"/>
    <path d="M128,34 L128,110 L84,218 L52,218 Z" fill="url(#letter)"/>

    <g transform="rotate(-16 128 152)">
      <!-- Near side sweeps in front of the letter -->
      <use href="#swoosh" fill="url(#orbit)" clip-path="url(#orbitFront)"/>
      <!-- Probe riding the trajectory -->
      <circle cx="222" cy="168" r="16" fill="url(#bodyGlow)"/>
      <circle cx="222" cy="168" r="4.5" fill="#fff6dc"/>
    </g>

    <!-- Guiding star at the apex -->
    <circle cx="128" cy="34" r="30" fill="url(#glow)"/>
    <path d="M128,8 L131.2,30.8 L154,34 L131.2,37.2 L128,60 L124.8,37.2 L102,34 L124.8,30.8 Z" fill="#ffffff"/>
  </g>
</svg>
