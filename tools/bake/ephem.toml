# --- Solar System scene: Moon, Pluto system, dwarf planets and large asteroids ----
# 1972..2100 (Pioneer 10 launched 1972-03-03). Small bodies: Horizons integrates the
# current SBDB orbit solution. The Moon and Charon are relative to their planet's
# center; the scene places both bodies of the pair around the barycenter by mass
# ratio (orbit `scale`).

