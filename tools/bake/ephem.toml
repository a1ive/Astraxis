# The spacecraft come after the moons: refine_near needs the moon tables.

[[target]]
name = "galileo_jup"
command = "-77"
naif_id = -77
center = "500@599"
kepler_gm_km3_s2 = 126712764.1
center_naif_id = 599
start = "1995-11-01"
stop = "2003-09-21 18:58"   # entry into Jupiter (1 bar) at ~18:58:20 TDB
base_step_minutes = 360    # 6 h
tolerance_km = 5.0
periapsides = true
encounters = ["io_gll", "europa_gll", "ganymede_gll", "callisto_gll"]
encounter_km = 100000.0
encounter_step_minutes = 10
refine_near = ["io_gll", "europa_gll", "ganymede_gll", "callisto_gll"]
refine_near_km = 100000.0

[[target]]
name = "juno_jup"
command = "-61"
naif_id = -61
center = "500@599"
kepler_gm_km3_s2 = 126712764.1
center_naif_id = 599
start = "2016-06-01"
stop = "2028-09-01"   # Horizons coverage ends at 2028-09-02 01:39
base_step_minutes = 360
tolerance_km = 5.0
periapsides = true
encounters = ["io_juno", "europa_juno", "ganymede_juno", "callisto_juno"]
encounter_km = 100000.0
encounter_step_minutes = 10
refine_near = ["io_juno", "europa_juno", "ganymede_juno", "callisto_juno"]
refine_near_km = 100000.0

# --- Earth-Moon --------------------------------------------------------------
#
# Artemis I and II around the Earth (refined to 1 minute near the Moon), and
# CAPSTONE around the Moon: its near-rectilinear halo orbit is a perturbed orbit
# around the Moon, so Moon-centered Kepler-relative interpolation suits it.
# Reference GMs: Earth 398600.435507, Moon 4902.800118 km^3/s^2 (DE440).

[[target]]
name = "artemis1"
command = "-1023"
naif_id = -1023
center = "500@399"
center_naif_id = 399
kepler_gm_km3_s2 = 398600.435507
start = "2022-11-16 08:47"
stop = "2022-12-11 17:20"
base_step_minutes = 60
tolerance_km = 2.0
encounters = ["moon_geo"]
encounter_km = 100000.0
encounter_step_minutes = 10
refine_near = ["moon_geo"]
refine_near_km = 70000.0
refine_near_step_minutes = 10

[[target]]
name = "artemis2"
command = "-1024"
naif_id = -1024
center = "500@399"
center_naif_id = 399
kepler_gm_km3_s2 = 398600.435507
start = "2026-04-02 02:00"
stop = "2026-04-10 23:54"
base_step_minutes = 60
tolerance_km = 2.0
encounters = ["moon_geo"]
encounter_km = 100000.0
encounter_step_minutes = 10
refine_near = ["moon_geo"]
refine_near_km = 70000.0
refine_near_step_minutes = 10

[[target]]
name = "capstone_sel"
command = "-1176"
naif_id = -1176
center = "500@301"
center_naif_id = 301
kepler_gm_km3_s2 = 4902.800118
