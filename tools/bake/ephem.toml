# Ephemeris bake configuration for horizons_bake.py.
# Run from the repository root:
#     python tools/bake/horizons_bake.py tools/bake/ephem.toml [name ...]
#
# All targets: JPL Horizons geometric state vectors, ICRF, TDB, km and km/s.
# Data spans are limited by Horizons coverage (spacecraft notes printed by Horizons):
#   Voyager 1 (-31): 1977-Sep-05 .. 2100-Jan-01, launch 1977-Sep-06 12:56 UTC
#   Voyager 2 (-32): 1977-Aug-20 15:32:32 TDB .. 2100-Jan-01
#   JWST (-170):     2021-Dec-25 13:01:09 TDB .. 2031-Sep-27 23:59 TDB
#   Galileo (-77):   1989-Oct-19 .. 2003-Sep-30 (navigation team fits to 2002-Aug-12, then
#                    baseline predicts; impact into Jupiter 2003-Sep-21)
#   Juno (-61):      2011-Aug-05 .. 2028-Sep-02 (reconstructed to 2026-Aug-24, then the
#                    current prediction and the reference trajectory)
#   Artemis I (-1023):  2022-Nov-16 08:46 .. 2022-Dec-11 17:21 TDB (NASA/JSC as-flown, after TLI)
#   Artemis II (-1024): 2026-Apr-02 01:59 .. 2026-Apr-10 23:54 TDB (NASA/JSC navigation files,
#                    concatenated; starts after ICPS separation)
#   CAPSTONE (-1176): 2022-Jun-28 10:07 .. 2026-Aug-14 11:58 TDB (tracking to 2026-Jul-15)
#   Cassini (-82):   1997-Oct-15 09:28 .. 2017-Sep-15 11:58 TDB (navigation team, post-mission
#                    reconstruction released 2018-06-29)
#   Huygens (-150):  2004-Dec-25 02:01 .. 2005-Jan-14 12:06 TDB
#   Parker Solar Probe (-96): 2018-Aug-12 08:16:23 TDB .. 2030-Jan-01 (as flown to
#                    2026-Sep-01, then the reference planning trajectory)
# Tolerances are for display: heliocentric positions carry the Sun's reflex motion
# (hundreds of km on 88-365 day periods), which a tight tolerance would turn into
# dense knots everywhere; tens of km are invisible even at flyby distances.
# radius_km (equatorial, JPL SSD planetary physical parameters) is only used to
# print flyby altitudes.
#
# Planets use system barycenters (Earth-Moon barycenter 3, Jupiter 5, ...): the
# planet centers wobble around them by up to a few thousand km (Earth-Moon) or
# hundreds of km (giant planets and their moons) on periods of days, which would
# force dense knots. The offset is negligible at flyby distances.

[defaults]
tolerance_km = 20.0
output_dir = "../../assets/ephem"   # relative to this file; files are <name>.eph

# --- Heliocentric (center: Sun body center, 500@10) ------------------------

[[target]]
name = "emb"
command = "3"
naif_id = 3
center = "500@10"
center_naif_id = 10
start = "1977-08-01"
stop = "2100-01-01"
base_step_minutes = 7200   # 5 d
tolerance_km = 50.0
radius_km = 6378.1366

[[target]]
