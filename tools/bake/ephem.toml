# Arrokoth (486958; New Horizons' flyby target, 2019-01-01), heliocentric like the
# other small bodies further down. "486958;" is JPL's ground-based orbit, integrated
# over any span; "2486958" is the New Horizons team's trajectory (1993-12-25 ..
# 2034-01-08), the one the spacecraft's flyby (3537.7 km) is consistent with. They
# differ by ~21,700 km at the flyby, so the scene uses the mission table where it
# exists and the ground-based one elsewhere.
[[target]]
name = "arrokoth_nh"
command = "2486958"
naif_id = 2486958
center = "500@10"
center_naif_id = 10
start = "1994-01-01"
stop = "2034-01-07"
base_step_minutes = 14400
tolerance_km = 5.0
kepler_gm_km3_s2 = 1.32712440041279419e11

[[target]]
name = "arrokoth"
command = "486958;"
naif_id = 2486958
center = "500@10"
center_naif_id = 10
start = "1972-01-01"
stop = "2099-12-31"
base_step_minutes = 14400
tolerance_km = 50.0
kepler_gm_km3_s2 = 1.32712440041279419e11


# Parker Solar Probe and Venus (its seven gravity assists). Venus has no moon, so
# its body center (299) is used; both are kept tighter than the planets above
# because the Venus-centered flyby view puts them within a few thousand km.

