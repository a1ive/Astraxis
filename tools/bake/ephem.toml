# --- Earth-Moon --------------------------------------------------------------
#
# Artemis I and II around the Earth (refined to 1 minute near the Moon), and
# CAPSTONE around the Moon: its near-rectilinear halo orbit is a perturbed orbit
# around the Moon, so Moon-centered Kepler-relative interpolation suits it.
# Reference GMs: Earth 398600.435507, Moon 4902.800118 km^3/s^2 (DE440).

[[target]]
name = "artemis1"
command = "-1023"
naif_id = -1023
center = "500@399"
center_naif_id = 399
kepler_gm_km3_s2 = 398600.435507
start = "2022-11-16 08:47"
