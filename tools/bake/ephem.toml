# --- Venus (assets/scenes/venus.toml) ------------------------------------------
# Horizons notes (2026-10-09):
#   Venus Express (-248): 2005-Nov-09 05:05 .. 2014-Dec-31 23:40 TDB (ESA; "Reconstructed
#                    trajectory based on tracking data to 2014-Nov-28. Predicted trajectory
#                    thereafter."; full contact lost on 2014-11-28)
#   Akatsuki (-5):   2010-May-21 00:52 .. 2025-Aug-24 TDB (ISAS/JAXA/JPL navigation team; "Final
#                    reconstruction fit to tracking data up to 2024-Apr-26. Preliminary solution
#                    2024-Apr-26 to 2025-Jul-23, prediction thereafter."; contact lost in April
#                    2024)
#   Zoozve (524522): JPL#86 (SBDB, 2026-10-09)
# Venus is nearly a sphere (J2 ~ 4e-6): around its GM (DE440; it has no moons), a month of
# Venus Express' 24-hour orbit takes ~30 knots at 5 km.

[[target]]
name = "vex_venus"
command = "-248"
naif_id = -248
center = "500@299"
center_naif_id = 299
kepler_gm_km3_s2 = 324858.592
start = "2006-04-08"       # three days before orbit insertion (2006-04-11 07:10 UTC)
stop = "2014-11-28"        # end of the tracking data (contact lost on 2014-11-28)
base_step_minutes = 5
tolerance_km = 2.0
verify_step_minutes = 30
radius_km = 6051.8

