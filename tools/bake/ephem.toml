# ARTEMIS-P1/P2 and LADEE: around the Earth until shortly before lunar orbit
# insertion, then around the Moon (the scene chains the two tables). Short base
# steps: the leave-one-out test misses fast periapsis passes between samples
# (15 km off for ARTEMIS-P2's low perilunes with 20 min, 7 km at LADEE's phasing
# perigees with 60 min; checked against 1-minute samples). LCROSS and LADEE's
# phasing orbits are short enough to sample every minute (LADEE in lunar orbit
# too: its orbit-lowering burns were up to 15 km off with 10 min), which also puts the
# jumps at the seams of LCROSS's trajectory files (232 km on 2009-06-23 10:49,
# 656 km on 2009-08-25 06:59 TDB) between two knots a minute apart.
# ARTEMIS: too long to sample every minute; maneuvers and file seams between the
# 10-minute samples (up to 44 km within a minute, 2012-07-05) are found by the
# verification against 3-minute samples.

[[target]]
name = "artemis_p1_geo"
command = "-192"
naif_id = -192
center = "500@399"
center_naif_id = 399
kepler_gm_km3_s2 = 398600.435507
start = "2007-02-18 00:16"
stop = "2011-06-25 00:00"    # ~2 days before lunar orbit insertion, ~70,000 km from the Moon
base_step_minutes = 10
tolerance_km = 2.0
verify_step_minutes = 3
encounters = ["moon_geo"]
encounter_km = 50000.0
encounter_step_minutes = 30
refine_near = ["moon_geo"]
refine_near_km = 20000.0
refine_near_step_minutes = 10

[[target]]
name = "artemis_p1_sel"
command = "-192"
naif_id = -192
center = "500@301"
center_naif_id = 301
