# --- ISEE-3 / ICE (assets/scenes/isee3.toml) ----------------------------------
# The spacecraft itself is reconstructed by tools/isee3/isee3_reconstruct.py (Horizons
# only has its 2014 return). Here: the Moon for the 1983 lunar flybys (the last one
# 119 km above the surface) and comet Halley, which ICE watched from 0.2 au in 1986.
# Horizons picks the comet orbit solution by "CAP<year": 1P is JPL#75 (data arc
# 1835-1994).

[[target]]
name = "moon_isee3"
command = "301"
naif_id = 301
center = "500@399"
center_naif_id = 399
start = "1982-06-01"
stop = "1984-01-10"
base_step_minutes = 360
tolerance_km = 0.5
kepler_gm_km3_s2 = 403503.235625   # Earth + Moon (DE440)
radius_km = 1737.4

[[target]]
