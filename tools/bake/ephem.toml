[[target]]
name = "voyager1"
command = "-31"
naif_id = -31
center = "500@10"
center_naif_id = 10
start = "1977-09-06 13:00"
stop = "2099-12-31"   # Horizons coverage ends exactly at 2100-01-01
base_step_minutes = 1440   # 1 d
encounters = ["jupiter", "saturn"]

[[target]]
name = "voyager2"
command = "-32"
naif_id = -32
center = "500@10"
center_naif_id = 10
start = "1977-08-20 15:33"
stop = "2099-12-31"   # Horizons coverage ends exactly at 2100-01-01
base_step_minutes = 1440
encounters = ["jupiter", "saturn", "uranus", "neptune"]

# Parker Solar Probe and Venus (its seven gravity assists). Venus has no moon, so
# its body center (299) is used; both are kept tighter than the planets above
# because the Venus-centered flyby view puts them within a few thousand km.

[[target]]
name = "venus"
command = "299"
naif_id = 299
center = "500@10"
center_naif_id = 10
start = "2018-08-01"
stop = "2030-01-01"
base_step_minutes = 2880   # 2 d
tolerance_km = 5.0
radius_km = 6051.8

[[target]]
name = "parker"
command = "-96"
naif_id = -96
center = "500@10"
center_naif_id = 10
start = "2018-08-12 08:17"
stop = "2029-12-31"   # Horizons coverage ends exactly at 2030-01-01
base_step_minutes = 720    # 12 h
tolerance_km = 5.0
encounters = ["venus"]
periapsides = true         # print perihelia (scene event list)

# --- Geocentric (center: Earth body center, 500@399) -----------------------

[[target]]
name = "moon_geo"
command = "301"
naif_id = 301
center = "500@399"
center_naif_id = 399
start = "2021-12-25 13:02"
stop = "2031-09-27 23:00"
base_step_minutes = 360    # 6 h
tolerance_km = 2.0         # Artemis lunar flybys come within ~130 km of the surface
kepler_gm_km3_s2 = 403503.235625   # Earth + Moon (DE440, JPL SSD astrodynamic parameters)
radius_km = 1737.4

[[target]]
name = "jwst_geo"
command = "-170"
naif_id = -170
center = "500@399"
center_naif_id = 399
start = "2021-12-25 13:02"
stop = "2031-09-27 23:00"
base_step_minutes = 360

# --- Jupiter-centered (center: Jupiter body center, 500@599) ---------------
#
# Galileo's and Juno's orbits around Jupiter, and the Galilean moons over the
# same two spans so that the moon flybys line up (the mean-element moons of the
# Jupiter scene drift by degrees). Outside these spans the scene falls back to
# the mean elements.
# Kepler-relative interpolation (AXEPH2) around the Jupiter system GM (DE440,
# JPL SSD astrodynamic parameters): about 4-5x fewer knots for the moons. The GM
# only shapes the interpolation; the knots are exact Horizons samples.

[[target]]
name = "io_gll"
command = "501"
naif_id = 501
center = "500@599"
kepler_gm_km3_s2 = 126712764.1
center_naif_id = 599
start = "1995-11-01"
stop = "2003-09-22"
base_step_minutes = 120
tolerance_km = 10.0
radius_km = 1821.49

[[target]]
name = "europa_gll"
command = "502"
naif_id = 502
center = "500@599"
kepler_gm_km3_s2 = 126712764.1
center_naif_id = 599
start = "1995-11-01"
stop = "2003-09-22"
base_step_minutes = 180
tolerance_km = 10.0
radius_km = 1560.8

[[target]]
name = "ganymede_gll"
