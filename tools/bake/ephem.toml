naif_id = 503
center = "500@599"
kepler_gm_km3_s2 = 126712764.1
center_naif_id = 599
start = "1995-11-01"
stop = "2003-09-22"
base_step_minutes = 360
tolerance_km = 10.0
radius_km = 2631.2

[[target]]
